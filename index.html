<style>
:root{
  --cream:#F7F1E8;
  --paper:#FFFDF9;
  --ink:#2C2620;
  --ink-soft:#6B6055;
  --terracotta:#C1603D;
  --terracotta-dark:#9E4B2F;
  --sage:#7C8B6F;
  --sage-soft:#E4E9DE;
  --line:#E4DACB;
  --debit:#2F6B4F;
  --kredit:#B0432C;
  --warn:#C88A2A;
  --shadow: 0 1px 2px rgba(44,38,32,.06), 0 4px 14px rgba(44,38,32,.05);
  --input-bg:#fff;
  --surface2:#F1E9DC;
  --surface3:#F1EADC;
  --hover-bg:#FBF6EC;
  --border-soft:#EFE7D9;
  --border-soft2:#EEE3D2;
  --toast-bg:#2C2620;
  --toast-fg:#fff;
  --overlay:rgba(20,16,12,.45);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
}
:root[data-theme="dark"]{
  --cream:#1B1712;
  --paper:#231E18;
  --ink:#EFE7DA;
  --ink-soft:#A99C89;
  --terracotta:#D9764F;
  --terracotta-dark:#E8935F;
  --sage:#8FA07F;
  --sage-soft:#2C3327;
  --line:#3A3226;
  --debit:#5FBE8D;
  --kredit:#E17A5F;
  --warn:#E0A94C;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.3);
  --input-bg:#2A241C;
  --surface2:#2A2419;
  --surface3:#2A2419;
  --hover-bg:#2F281F;
  --border-soft:#332C22;
  --border-soft2:#332C22;
  --toast-bg:#EFE7DA;
  --toast-fg:#2C2620;
  --overlay:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--cream);color:var(--ink)}
body{font-size:14px;line-height:1.45;transition:background .15s ease,color .15s ease}
h1,h2,h3,h4{font-family:'Poppins',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:13.5px}
table{border-collapse:collapse;width:100%}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#D8CBB4;border-radius:8px}

/* ---- shell ---- */
#shell{display:flex;height:100vh}
#sidebar{
  width:236px;flex:none;background:linear-gradient(180deg,#2C2620,#241F1A);
  color:#EFE7DA;display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto;overflow-x:hidden;
}
#brand{padding:22px 20px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
#brand .mark{width:34px;height:34px;border-radius:9px;display:block;object-fit:cover;margin-bottom:10px}
#brand h1{font-size:16.5px;color:#fff}
#brand p{margin:2px 0 0;font-size:11px;color:#B7AB98;letter-spacing:.04em;text-transform:uppercase}
nav{padding:10px 10px 20px;flex:1}
.navgroup{margin-top:14px}
.navgroup .glabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#8B7F6E;padding:6px 10px 4px;font-weight:600}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;color:#D8CDBC;text-align:left;padding:9px 10px;border-radius:8px;font-size:13.3px;margin-bottom:1px;transition:.12s;text-decoration:none;cursor:pointer;box-sizing:border-box}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navbtn.active{background:var(--terracotta);color:#fff;font-weight:600}
.navbtn .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:none}

#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow-y:auto;overflow-x:hidden}
#topbar{
  position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);
  padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;
}
#topbar h2{font-size:19px}
#topbar .sub{color:var(--ink-soft);font-size:12.5px;margin-top:2px}
#topbar-actions{display:flex;gap:8px;align-items:center}
#content{padding:24px 28px 60px;max-width:1360px;width:100%;overflow-x:hidden}

/* ---- generic components ---- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){.grid.cols-4{grid-template-columns:repeat(2,1fr)}.grid.cols-3{grid-template-columns:repeat(2,1fr)}}

.kpi .label{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .value{font-family:'Poppins';font-size:22px;margin-top:6px;font-weight:600}
.kpi .value.pos{color:var(--debit)}
.kpi .value.neg{color:var(--kredit)}

.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--terracotta);color:var(--terracotta-dark)}
.btn.primary{background:var(--terracotta);color:#fff;border-color:var(--terracotta)}
.btn.primary:hover{background:var(--terracotta-dark);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--kredit)}
.btn.small{padding:5px 10px;font-size:12px;border-radius:7px}

.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.section-title h3{font-size:15.5px}
.section-title .hint{font-size:12px;color:var(--ink-soft)}

.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
table.sheet{min-width:100%}
table.sheet thead th{
  position:sticky;top:0;background:var(--surface2);color:var(--ink);font-size:11.3px;text-transform:uppercase;letter-spacing:.03em;
  padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700;
}
table.sheet tbody td{padding:7px 10px;border-bottom:1px solid var(--border-soft);font-size:13px;white-space:nowrap}
table.sheet td.wrap-cell{white-space:normal;min-width:160px;max-width:280px}
table.sheet td.akun-nama-cell{white-space:normal;min-width:230px;max-width:440px}
table.sheet td.akun-nama-cell input{min-width:220px}
table.sheet td select{min-width:118px}
table.sheet td input{min-width:90px}
table.sheet td.wrap-cell input{min-width:160px}
table.sheet tbody tr:hover{background:var(--hover-bg)}
table.sheet tbody tr:last-child td{border-bottom:none}
table.sheet td input,table.sheet td select{border:1px solid transparent;background:transparent;width:100%;padding:4px 5px;border-radius:6px;color:var(--ink)}
table.sheet td input:hover,table.sheet td select:hover{border-color:var(--line)}
table.sheet td input:focus,table.sheet td select:focus{outline:none;border-color:var(--terracotta);background:var(--input-bg)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.center{text-align:center}

.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.tag.pribadi{background:#E9E2F3;color:#5B4A8A}
.tag.a{background:#DDEBE0;color:#2F6B4F}
.tag.b{background:#FCE8D9;color:#B0602A}
.tag.c{background:#DCEAF3;color:#2D6B8A}
.tag.debit{background:#E4EFE8;color:var(--debit)}
.tag.kredit{background:#F5E1DA;color:var(--kredit)}

/* ---- tag picker (chip + search + dropdown) ---- */
.tagpicker{position:relative}
.tagpicker-box{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;min-height:38px;padding:5px 7px;border:1px solid var(--line);border-radius:9px;background:var(--input-bg);cursor:text}
.tagpicker-box:focus-within{border-color:var(--terracotta);box-shadow:0 0 0 3px rgba(193,96,61,.12)}
.tagpicker-chips{display:flex;flex-wrap:wrap;gap:5px}
.tagpicker-chip{display:inline-flex;align-items:center;gap:5px;background:var(--sage-soft);color:var(--sage);padding:3px 6px 3px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.tagpicker-chip-x{border:none;background:none;color:inherit;cursor:pointer;font-size:13px;line-height:1;padding:0 2px;opacity:.65}
.tagpicker-chip-x:hover{opacity:1}
.tagpicker-search{flex:1;min-width:90px;border:none!important;padding:4px 2px!important;background:transparent!important;outline:none;font-size:13px}
.tagpicker-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:220px;overflow:auto;padding:5px}
.tagpicker-dd-item{padding:7px 9px;border-radius:7px;font-size:13px;cursor:pointer}
.tagpicker-dd-item:hover{background:var(--hover-bg)}
.tagpicker-dd-new{color:var(--terracotta-dark);font-weight:600}
.tagpicker-dd-empty{padding:7px 9px;font-size:12.5px;color:var(--ink-soft)}

.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.field label{display:block;font-size:11.3px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.field input,.field select,.field textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--input-bg);font-size:13.5px;color:var(--ink);
}
.field textarea{resize:vertical;min-height:38px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--terracotta);box-shadow:0 0 0 3px rgba(193,96,61,.12)}

.tabs2{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tabs2 button{background:none;border:none;padding:9px 14px;font-size:13.3px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs2 button.active{color:var(--terracotta-dark);border-color:var(--terracotta)}

.empty{padding:34px 16px;text-align:center;color:var(--ink-soft)}
.empty .big{font-size:26px;margin-bottom:6px}

.recap{background:var(--surface3);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:12.8px;display:flex;gap:22px;flex-wrap:wrap}
.recap b{font-family:'Poppins';font-size:14.5px}

.badge-balance{padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
.badge-balance.ok{background:#DDEBE0;color:var(--debit)}
.badge-balance.bad{background:#F5DAD2;color:var(--kredit)}

.rowline{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two-col{grid-template-columns:1fr}}

.loc-block{margin-bottom:16px}
.loc-block h4{font-size:12.8px;color:var(--terracotta-dark);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--input-bg);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12.3px;margin:0 6px 6px 0}
.chip.low{border-color:var(--kredit);background:var(--surface3)}
.chip.warn{border-color:var(--warn);background:var(--surface3)}

.toast{position:fixed;bottom:20px;right:20px;background:var(--toast-bg);color:var(--toast-fg);padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);z-index:50;opacity:0;transform:translateY(8px);transition:.2s}
.toast.show{opacity:1;transform:translateY(0)}

.hidden{display:none !important}
.mini{font-size:11.5px;color:var(--ink-soft)}
a.resepLink:hover,a.subResepLink:hover,a.crumbLink:hover,a.asetNamaLink:hover{text-decoration:underline !important}
a.asetNamaLink{color:var(--terracotta-dark);font-weight:600;text-decoration:none}
a.crumbLink{color:var(--ink-soft);text-decoration:none}
a.crumbLink:last-child{color:var(--terracotta-dark);font-weight:600}

/* ---- Searchable account picker ---- */
.akunPickerInput{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--input-bg);font-size:13.5px;color:var(--ink)}
.akunPickerInput:focus{outline:none;border-color:var(--terracotta);box-shadow:0 0 0 3px rgba(193,96,61,.12)}
.akunPickerList{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:240px;overflow-y:auto;
  background:var(--input-bg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:40}
.akunPickerItem{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--surface3)}
.akunPickerItem:last-child{border-bottom:none}
.akunPickerItem:hover{background:var(--hover-bg)}

/* ---- Resep grid: vertical cards (image on top, details stacked below) ---- */
.resep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.resep-card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column}
.resep-card-img{width:100%;height:140px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:40px;flex:none}
.resep-card-img img{width:100%;height:100%;object-fit:cover}
.resep-card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.resep-card-body a.resepLink{color:var(--terracotta-dark);font-weight:700;font-size:14.5px;text-decoration:none;margin-bottom:2px}
.resep-card-row{display:flex;justify-content:space-between;align-items:center;font-size:12.8px;padding:2px 0;border-bottom:1px dashed var(--border-soft2)}
.resep-card-row:last-of-type{border-bottom:none}

/* ---- Mobile layout: off-canvas sidebar, compact tables (BCA Bisnis style) ---- */
#hamburgerBtn{display:none}
#sidebarBackdrop{display:none}
@media(max-width:820px){
  #shell{display:block}
  #sidebar{
    position:fixed;top:0;left:0;height:100vh;min-height:0;width:78vw;max-width:300px;z-index:60;overflow-y:auto;
    transform:translateX(-100%);transition:transform .22s ease;box-shadow:8px 0 24px rgba(0,0,0,.25);
  }
  #sidebar.open{transform:translateX(0)}
  #sidebarBackdrop{
    display:none;position:fixed;inset:0;background:rgba(20,16,12,.45);z-index:55;
  }
  #sidebarBackdrop.open{display:block}
  #main{width:100%}
  #hamburgerBtn{
    display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;
    border-radius:9px;border:1px solid var(--line);background:var(--paper);font-size:18px;margin-right:8px;flex:none;
  }
  #topbar{padding:10px 12px;flex-wrap:nowrap;gap:8px}
  #topbar h2{font-size:16px}
  #topbar .sub{display:none}
  #topbar-actions{gap:5px}
  #topbar-actions .btn{padding:6px 9px;font-size:11.5px}
  #userBadge{display:none}
  #content{padding:12px 10px 40px}
  .card{padding:12px 12px;border-radius:11px}
  .grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr 1fr;gap:8px}
  .kpi .value{font-size:16px}
  .kpi .label{font-size:10px}
  .formgrid{grid-template-columns:1fr 1fr;gap:8px}
  .two-col{grid-template-columns:1fr}
  table.sheet thead th{font-size:10px;padding:7px 6px}
  table.sheet tbody td{font-size:12px;padding:6px 6px}
  table.sheet td select,table.sheet td input{font-size:12px;min-width:76px}
  table.sheet td.wrap-cell{min-width:120px;max-width:180px}
  .tablewrap{-webkit-overflow-scrolling:touch;border-radius:9px}
  .section-title{gap:8px}
  .section-title h3{font-size:14px}
  .btn{padding:7px 11px;font-size:12.5px}
  #brand{padding:16px 16px 12px}
  .resep-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .resep-card-img{height:100px;font-size:28px}
  .resep-card-body{padding:8px 10px 10px}
}
</style>
</head>

<script>
/* ============================================================
   INSPIRA LEDGER — Aplikasi Akuntansi Terpadu (offline, localStorage)
   ============================================================ */
const STORAGE_KEY = 'inspira_ledger_db_v1';
const KEPEMILIKAN = ['Pribadi','Bisnis A','Bisnis B','Bisnis C'];
const KAT = {
  AL:'Aset Lancar', PS:'Aset Persediaan', ALL:'Aset Lancar Lainnya', AT:'Aset Tetap',
  KAT:'Kontra Aset Tetap', ALN:'Aset Lainnya', KW:'Kewajiban', MD:'Modal',
  PD:'Pendapatan', BPP:'Beban Pokok Penjualan', BO:'Beban Operasional', BL:'Beban Lain'
};
/* Fixed display order for account categories, used everywhere a list of accounts is shown
   (COA table, pickers, etc.) so related accounts always group together top-to-bottom. */
const KATEGORI_ORDER = ['AL','PS','ALL','ALN','AT','KAT','KW','MD','PD','BPP','BO','BL'];
function sortAkunList(list){
  return [...list].sort((a,b)=>{
    const oa = KATEGORI_ORDER.indexOf(a.kategori), ob = KATEGORI_ORDER.indexOf(b.kategori);
    if(oa!==ob) return oa-ob;
    if(a.kepemilikan!==b.kepemilikan) return KEPEMILIKAN.indexOf(a.kepemilikan)-KEPEMILIKAN.indexOf(b.kepemilikan);
    return a.nama.localeCompare(b.nama);
  });
}
/* Sama seperti sortAkunList, tapi setelah diurutkan per Kategori > Kepemilikan, akun Header
   diletakkan tepat sebelum sub-akunnya (nested, rekursif) supaya tabel/ekspor COA menampilkan
   kelompok header-lalu-sub-akun secara berurutan, bukan tercampur alfabetis. */
function sortAkunListWithHeaders(list){
  const base = sortAkunList(list);
  const byId = new Map(base.map(a=>[a.id,a]));
  const placed = new Set();
  const out = [];
  function place(a){
    if(placed.has(a.id)) return;
    placed.add(a.id); out.push(a);
    if(a.isHeader){
      base.filter(x=> x.parentHeaderId===a.id).forEach(place);
    }
  }
  base.forEach(a=>{ if(!a.parentHeaderId) place(a); });
  // fallback: akun yatim (parentHeaderId menunjuk ke header yang tak ada di `list` ini, mis. karena filter kategori) tetap tampil
  base.forEach(a=>{ if(!placed.has(a.id)) place(a); });
  return out;
}
const DEBIT_NORMAL = new Set(['AL','PS','ALL','AT','ALN','BPP','BO','BL']);
const KREDIT_NORMAL = new Set(['KAT','KW','MD','PD']);
const LOKASI_FREEZER = Array.from({length:13},(_,i)=>'Freezer CH-'+String(i+1).padStart(2,'0'));
const LOKASI_KULKAS  = Array.from({length:6},(_,i)=>'Kulkas SH-'+String(i+1).padStart(2,'0'));
const LOKASI_ALL = [...LOKASI_FREEZER, ...LOKASI_KULKAS];
// default (bawaan) locations minus any the user has renamed/deleted via "Kelola Lokasi Custom"
function getEffectiveLokasiDefault(){ return LOKASI_ALL.filter(l=>!DB.lokasiHapus.includes(l)); }

function uid(){ return 'x'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function fmtRp(n){ n = Number(n)||0; return 'Rp' + n.toLocaleString('id-ID',{maximumFractionDigits:0}); }
function fmtNum(n,d=2){ n=Number(n)||0; return n.toLocaleString('id-ID',{maximumFractionDigits:d}); }
function fmtRpShort(n){
  n = Number(n)||0;
  const abs = Math.abs(n);
  if(abs>=1000000000) return (n/1000000000).toFixed(1).replace(/\.0$/,'')+'M';
  if(abs>=1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'')+'jt';
  if(abs>=1000) return (n/1000).toFixed(0)+'rb';
  return String(n);
}
/* Laba Rugi totals (Pendapatan/HPP/Beban Operasional/Beban Lain/Laba) for an arbitrary date range,
   independent of the lrFilter UI state — used by charts and period comparisons. */
function hitungLabaRugiPeriode(dari, sampai){
  const jlist = DB.jurnal.filter(j=> (!dari||j.tanggal>=dari) && (!sampai||j.tanggal<=sampai));
  const pd = sumByKategoriKepemilikanFiltered('PD', null, jlist);
  const bpp = sumByKategoriKepemilikanFiltered('BPP', null, jlist);
  const bo = sumByKategoriKepemilikanFiltered('BO', null, jlist);
  const bl = sumByKategoriKepemilikanFiltered('BL', null, jlist);
  return { pd, bpp, bo, bl, beban: bpp+bo+bl, laba: pd-bpp-bo-bl };
}
/* Generates `jumlah` consecutive periods (bulanan/tahunan) ending at the current month/year. */
function generatePeriods(tipe, jumlah){
  const now = new Date();
  const periods = [];
  const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agt','Sep','Okt','Nov','Des'];
  for(let i=jumlah-1;i>=0;i--){
    if(tipe==='tahunan'){
      const y = now.getFullYear()-i;
      periods.push({ label:String(y), dari:y+'-01-01', sampai:y+'-12-31' });
    } else {
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const endD = new Date(d.getFullYear(), d.getMonth()+1, 0);
      const pad=n=>String(n).padStart(2,'0');
      periods.push({
        label: BULAN[d.getMonth()]+' '+d.getFullYear(),
        dari: d.getFullYear()+'-'+pad(d.getMonth()+1)+'-01',
        sampai: endD.getFullYear()+'-'+pad(endD.getMonth()+1)+'-'+pad(endD.getDate())
      });
    }
  }
  return periods;
}
/* Simple dependency-free grouped bar chart rendered as inline SVG. series: [{name,color,values}]. */
function svgBarChart(labels, series, opts={}){
  const w = opts.width||640, h = opts.height||220, pad = {l:46,r:10,t:14,b:32};
  const innerW = w-pad.l-pad.r, innerH = h-pad.t-pad.b;
  const maxVal = Math.max(1, ...series.flatMap(s=>s.values));
  const groupW = innerW/Math.max(1,labels.length);
  const barW = Math.min(26, groupW/(series.length+1.2));
  let svg = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" preserveAspectRatio="xMidYMid meet">`;
  for(let i=0;i<=4;i++){
    const y = pad.t + innerH - (innerH*i/4);
    svg += `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w-pad.r}" y2="${y.toFixed(1)}" stroke="#EFE7D9" stroke-width="1"/>`;
    svg += `<text x="${pad.l-6}" y="${(y+3).toFixed(1)}" font-size="9" fill="#9A8E7C" text-anchor="end">${fmtRpShort(maxVal*i/4)}</text>`;
  }
  labels.forEach((lab, i)=>{
    const gx = pad.l + groupW*i + groupW/2;
    series.forEach((s, si)=>{
      const val = s.values[i]||0;
      const bh = innerH * (val/maxVal);
      const bx = gx - (series.length*barW)/2 + si*barW;
      svg += `<rect x="${bx.toFixed(1)}" y="${(pad.t+innerH-bh).toFixed(1)}" width="${(barW-3).toFixed(1)}" height="${bh.toFixed(1)}" style="fill:${s.color}" rx="2"><title>${s.name}: ${fmtRp(val)}</title></rect>`;
    });
    svg += `<text x="${gx.toFixed(1)}" y="${h-9}" font-size="9.5" fill="#6B6153" text-anchor="middle">${lab}</text>`;
  });
  svg += `</svg>`;
  return svg;
}
/* Simple dependency-free donut chart. segments: [{label,value,color}]. */
function svgDonutChart(segments, opts={}){
  const size = opts.size||160, stroke = opts.stroke||22, r = (size-stroke)/2, cx=size/2, cy=size/2;
  const total = segments.reduce((s,x)=>s+Math.max(0,x.value),0) || 1;
  const circumference = 2*Math.PI*r;
  let offset = 0;
  let svg = `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">`;
  segments.forEach(seg=>{
    const val = Math.max(0,seg.value);
    const frac = val/total;
    const dash = circumference*frac;
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:${seg.color}" stroke-width="${stroke}"
      stroke-dasharray="${dash.toFixed(1)} ${(circumference-dash).toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})">
      <title>${seg.label}: ${Math.round(frac*100)}%</title></circle>`;
    offset += dash;
  });
  svg += `<text x="${cx}" y="${cy+4}" font-size="13" font-weight="700" text-anchor="middle" fill="var(--ink)">${Math.round((segments[0]?.value||0)/total*100)}%</text>`;
  svg += `</svg>`;
  return svg;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
/* Selisih hari dari hari ini ke tanggal ISO tertentu (positif = di masa depan, negatif = sudah lewat).
   Dipakai untuk reminder "Tanggal Kadaluwarsa" pada Pembelian Bahan. */
function daysUntil(iso){
  if(!iso) return null;
  const today = new Date(todayStr()+'T00:00:00');
  const target = new Date(String(iso).slice(0,10)+'T00:00:00');
  if(isNaN(target.getTime())) return null;
  return Math.round((target - today) / 86400000);
}
/* ---- format tanggal tampilan: DD/MM/YY. Penyimpanan internal tetap YYYY-MM-DD (ISO) ---- */
function fmtTgl(iso){
  if(!iso) return '';
  const s = String(iso);
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return s;
  const [,y,mo,d] = m;
  return d+'/'+mo+'/'+y.slice(-2);
}
function fmtBulan(iso){ // untuk string "YYYY-MM" -> "MM/YYYY"
  if(!iso) return '';
  const s = String(iso);
  const m = s.match(/^(\d{4})-(\d{2})/);
  if(!m) return s;
  const [,y,mo] = m;
  return mo+'/'+y;
}
function parseTglInput(str){
  // Terima DD/MM/YY, DD/MM/YYYY, atau YYYY-MM-DD (untuk kompatibilitas lama); hasil selalu YYYY-MM-DD
  if(!str) return '';
  const s = String(str).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){
    let [,d,mo,y] = m;
    d = d.padStart(2,'0'); mo = mo.padStart(2,'0');
    if(y.length===2) y = '20'+y;
    return y+'-'+mo+'-'+d;
  }
  return s;
}

// Ambil file gambar (mis. logo usaha) lalu perkecil & konversi jadi PNG dataURL, supaya ukuran
// tersimpan di localStorage tetap kecil & siap dipakai langsung oleh jsPDF (doc.addImage).
function resizeImageToDataUrl(file, maxSize, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w>=h){ if(w>maxSize){ h = Math.round(h*maxSize/w); w = maxSize; } }
      else { if(h>maxSize){ w = Math.round(w*maxSize/h); h = maxSize; } }
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/png'));
    };
    img.onerror = ()=> cb(null);
    img.src = e.target.result;
  };
  reader.onerror = ()=> cb(null);
  reader.readAsDataURL(file);
}
// Gambar donut chart ke <canvas> lalu kembalikan sebagai PNG dataURL — dipakai supaya chart
// lingkaran (mis. Komposisi Pendapatan Operasional di Laba Rugi) bisa ditempel ke PDF via addImage,
// karena jsPDF sendiri tidak bisa merender SVG. Segmen pertama ditampilkan sebagai % di tengah,
// mengikuti perilaku svgDonutChart() yang dipakai di tampilan web.
function canvasDonutChartDataUrl(segments, opts){
  opts = opts||{};
  const size = opts.size||260, stroke = opts.stroke||36;
  const canvas = document.createElement('canvas'); canvas.width=size; canvas.height=size;
  const ctx = canvas.getContext('2d');
  const total = segments.reduce((s,x)=>s+Math.max(0,x.value),0) || 1;
  const cx=size/2, cy=size/2, r=(size-stroke)/2;
  let start = -Math.PI/2;
  segments.forEach(seg=>{
    const val = Math.max(0, seg.value);
    const frac = val/total;
    const end = start + frac*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx, cy, r, start, end);
    ctx.strokeStyle = seg.colorHex||'#999999';
    ctx.lineWidth = stroke;
    ctx.lineCap = 'butt';
    ctx.stroke();
    start = end;
  });
  const pct = Math.round((segments[0]?Math.max(0,segments[0].value):0)/total*100);
  ctx.fillStyle = opts.textColor||'#2C2620';
  ctx.font = 'bold '+Math.round(size*0.13)+'px Arial, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(pct+'%', cx, cy);
  return canvas.toDataURL('image/png');
}
// Gambar kop laporan PDF: logo usaha (jika ada) + nama usaha + judul laporan + keterangan periode.
// Mengembalikan koordinat Y tempat konten laporan (tabel/chart) boleh mulai digambar.
function pdfDrawHeader(doc, title, periodeText){
  const marginLeft = 32, pageWidth = doc.internal.pageSize.getWidth();
  const logo = DB.profil && DB.profil.logoDataUrl;
  let textX = marginLeft, logoBottom = 16;
  if(logo){
    try{ doc.addImage(logo, 'PNG', marginLeft, 16, 40, 40); textX = marginLeft+50; logoBottom = 16+40; }catch(e){}
  }
  const namaUsaha = (DB.profil && DB.profil.namaUsaha) || 'Inspira Ledger';
  doc.setFontSize(11); doc.setFont(undefined,'bold'); doc.setTextColor(60,50,40);
  doc.text(namaUsaha, textX, 26);
  doc.setFontSize(15); doc.setFont(undefined,'bold'); doc.setTextColor(20,20,20);
  doc.text(title, textX, 44);
  doc.setFontSize(9); doc.setFont(undefined,'normal'); doc.setTextColor(90,80,70);
  let ty = 58;
  if(periodeText){ doc.text(periodeText, textX, ty); ty += 12; }
  doc.text('Diunduh: '+new Date().toLocaleString('id-ID'), textX, ty);
  doc.setTextColor(0,0,0);
  const lineY = Math.max(logoBottom, ty+6);
  doc.setDrawColor(210,200,190);
  doc.line(marginLeft, lineY, pageWidth-32, lineY);
  return lineY+14;
}
// Ekspor tabel ke PDF (pakai jsPDF + autotable, sudah dimuat di head).
// opts: { landscape, periodeText, chartDataUrl, chartCaption, chartLegend:[{label,color:[r,g,b]}] }
function exportRowsToPdf(filename, title, headers, rows, opts){
  opts = opts||{};
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: (opts.landscape!==false && headers.length>5) ? 'landscape':'portrait', unit:'pt' });
    const pageWidth = doc.internal.pageSize.getWidth();
    let startY = pdfDrawHeader(doc, title, opts.periodeText);
    if(opts.chartDataUrl){
      const chartSize = 130;
      const chartX = pageWidth - 32 - chartSize;
      let chartY = startY;
      if(opts.chartCaption){
        doc.setFontSize(9); doc.setFont(undefined,'bold'); doc.setTextColor(60,50,40);
        doc.text(opts.chartCaption, chartX, chartY+8);
        chartY += 14;
      }
      try{ doc.addImage(opts.chartDataUrl, 'PNG', chartX, chartY, chartSize, chartSize); }catch(e){}
      let ly = chartY + chartSize + 14;
      if(opts.chartLegend && opts.chartLegend.length){
        doc.setFontSize(8); doc.setFont(undefined,'normal');
        opts.chartLegend.forEach(item=>{
          doc.setFillColor(item.color[0], item.color[1], item.color[2]);
          doc.rect(chartX, ly-7, 8, 8, 'F');
          doc.setTextColor(40,40,40);
          doc.text(item.label, chartX+12, ly);
          ly += 12;
        });
      }
      doc.setTextColor(0,0,0);
      startY = Math.max(startY, ly+6);
    }
    doc.autoTable({ head:[headers], body:rows, startY, styles:{fontSize:8,cellPadding:4}, headStyles:{fillColor:[193,96,61]}, margin:{left:32,right:32} });
    doc.save(filename);
    toast('File PDF diunduh');
  }catch(err){ toast('Gagal membuat PDF: '+err.message); }
}

// Baca file .xlsx/.xls yang dipilih user -> array of object (key = nama header di baris pertama).
function readExcelFile(file, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      cb(rows, null);
    }catch(err){ cb(null, err); }
  };
  reader.onerror = ()=> cb(null, new Error('Gagal membaca file'));
  reader.readAsArrayBuffer(file);
}
// Ambil nilai kolom dari 1 baris hasil readExcelFile, cocokkan nama kolom tanpa peduli besar/kecil huruf & spasi.
function xrow(row, ...names){
  const keys = Object.keys(row);
  for(const name of names){
    const found = keys.find(k=> k.trim().toLowerCase()===name.trim().toLowerCase());
    if(found!==undefined) return row[found];
  }
  return '';
}

  if(cfg.template) html += `<button class="btn small" id="${prefix}BtnTemplate" type="button">📄 Template</button>`;
  if(cfg.onImport){ html += `<button class="btn small" id="${prefix}BtnImport" type="button">⬆ Impor Excel</button><input type="file" id="${prefix}FileImport" accept=".xlsx,.xls" class="hidden">`; }

  if(cfg.exportPdf) html += `<button class="btn small" id="${prefix}BtnExpPdf" type="button">⬇ PDF</button>`;

function bindIoToolbar(prefix, cfg){
  if(cfg.template){
    const b = document.getElementById(prefix+'BtnTemplate');
    if(b) b.addEventListener('click', ()=> downloadExcelTemplate(cfg.template.filename, cfg.template.sheetName, cfg.template.headers, cfg.template.exampleRows));
  }
  if(cfg.onImport){
    const btn = document.getElementById(prefix+'BtnImport'), inp = document.getElementById(prefix+'FileImport');
    if(btn && inp){
      btn.addEventListener('click', ()=> inp.click());
      inp.addEventListener('change', e=>{
        const file = e.target.files[0]; if(!file) return;
        readExcelFile(file, (rows, err)=>{
          inp.value='';
          if(err) return toast('File tidak valid: '+err.message);
          if(!rows || rows.length===0) return toast('File Excel kosong / tidak ada data');
          cfg.onImport(rows);
        });
      });

  }
  if(cfg.exportExcel){
    const b = document.getElementById(prefix+'BtnExpXlsx');
    if(b) b.addEventListener('click', ()=>{ const d = cfg.exportExcel(); exportRowsToExcel(d.filename, d.sheetName, d.headers, d.rows); });

    const b = document.getElementById(prefix+'BtnExpPdf');
    if(b) b.addEventListener('click', ()=>{ const d = cfg.exportPdf(); exportRowsToPdf(d.filename, d.title, d.headers, d.rows, d.opts); });
  }
}

/* ================= BULK SELECT + DELETE (generic, reusable across tables) ================= */
const BULK_STATE = {}; // key -> Set of selected ids
function bulkSet(key){ if(!BULK_STATE[key]) BULK_STATE[key] = new Set(); return BULK_STATE[key]; }
function bulkBarHtml(key, visibleIds){
  const n = bulkSet(key).size;
  return `<div class="bulkbar" data-key="${key}" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
    <label class="mini" style="display:flex;align-items:center;gap:5px;cursor:pointer"><input type="checkbox" class="bulkSelectAll" data-key="${key}">Pilih semua (${visibleIds.length} ditampilkan)</label>
    <button type="button" class="btn small danger bulkDeleteSelected" data-key="${key}" ${n===0?'disabled':''}>🗑 Hapus Terpilih (${n})</button>
    <button type="button" class="btn small danger bulkDeleteAll" data-key="${key}">🗑 Hapus Semua (${visibleIds.length})</button>
  </div>`;
}
function bulkCheckboxTh(key){ return `<th style="width:26px"><input type="checkbox" class="bulkSelectAllTh" data-key="${key}"></th>`; }
function bulkCheckboxTd(key,id){ return `<td><input type="checkbox" class="bulkRowChk" data-key="${key}" data-id="${id}" ${bulkSet(key).has(id)?'checked':''}></td>`; }
/* Wires the select-all/row checkboxes + Hapus Terpilih/Hapus Semua buttons for one rendered table.
   visibleIds: ids of rows currently shown (respects active search filter).
   deleteManyFn(ids): performs the actual deletion (with any side-effect reversal) for a list of ids — does NOT call save()/re-render.
   rerenderFn(): re-renders this table (or the whole tab) after the mutation. */
function bindBulkUI(container, key, visibleIds, deleteManyFn, rerenderFn){
  const sel = bulkSet(key);
  // drop selected ids that are no longer visible/exist to keep counts sane across re-filtering
  Array.from(sel).forEach(id=>{ if(!visibleIds.includes(id)) sel.delete(id); });
  function syncSelectAll(){
    const allChecked = visibleIds.length>0 && visibleIds.every(id=>sel.has(id));
    container.querySelectorAll(`.bulkSelectAll[data-key="${key}"], .bulkSelectAllTh[data-key="${key}"]`).forEach(cb=> cb.checked = allChecked);
  }
  function syncDeleteBtn(){
    const btn = container.querySelector(`.bulkDeleteSelected[data-key="${key}"]`);
    if(btn){ btn.textContent = '🗑 Hapus Terpilih ('+sel.size+')'; btn.disabled = sel.size===0; }
  }
  syncSelectAll();
  container.querySelectorAll(`.bulkSelectAll[data-key="${key}"], .bulkSelectAllTh[data-key="${key}"]`).forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(cb.checked) visibleIds.forEach(id=>sel.add(id)); else visibleIds.forEach(id=>sel.delete(id));
      rerenderFn();
    });
  });
  container.querySelectorAll(`.bulkRowChk[data-key="${key}"]`).forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(cb.checked) sel.add(cb.dataset.id); else sel.delete(cb.dataset.id);
      syncSelectAll(); syncDeleteBtn();
    });
  });
  const delSelBtn = container.querySelector(`.bulkDeleteSelected[data-key="${key}"]`);
  if(delSelBtn) delSelBtn.addEventListener('click', ()=>{
    if(sel.size===0) return;
    if(!confirm('Hapus '+sel.size+' data terpilih? Tindakan ini tidak bisa dibatalkan.')) return;
    deleteManyFn(Array.from(sel));
    sel.clear(); save(); rerenderFn(); toast('Data terpilih berhasil dihapus');
  });
  const delAllBtn = container.querySelector(`.bulkDeleteAll[data-key="${key}"]`);
  if(delAllBtn) delAllBtn.addEventListener('click', ()=>{
    if(visibleIds.length===0) return toast('Tidak ada data untuk dihapus');
    if(!confirm('Hapus SEMUA '+visibleIds.length+' data yang ditampilkan (sesuai filter saat ini)? Tindakan ini tidak bisa dibatalkan.')) return;
    deleteManyFn(visibleIds.slice());
    sel.clear(); save(); rerenderFn(); toast('Semua data yang ditampilkan berhasil dihapus');
  });
}

function load(){

/* One-time migrations for people upgrading from an older saved version — each runs exactly once
   per browser (guarded by a flag on DB) so re-opening the app doesn't repeat them. */
function runOneTimeMigrations(){
  if(!DB._migrated_clearTrialKalender){
    DB.budgetKalender = []; // old manual trial entries — calendar is now auto-recommended, safe to clear
    DB._migrated_clearTrialKalender = true;
  }
  if(!DB._migrated_seedBudgetKategori){
    MENU_KATEGORI_PRIORITAS.forEach(kat=> ensureInList('jenisResepCustom', kat));
    DB._migrated_seedBudgetKategori = true;
  }
  if(!DB._migrated_asetAkumOtomatis){
    (DB.aset||[]).forEach(a=>{
      if(a.masaManfaatBulan>0 && !a.akunAkumulasiId && a.akunAsetId){
        const akunAset = akunById(a.akunAsetId);
        if(akunAset){
          let akumAkun = DB.coa.find(x=>x.kategori==='KAT' && x.kepemilikan===akunAset.kepemilikan && x.nama.toLowerCase().includes((a.jenis||'').toLowerCase()));
          if(!akumAkun) akumAkun = addAkun('KAT', 'Akumulasi Penyusutan - '+(a.jenis||a.nama), akunAset.kepemilikan, 'Kontra akun aset tetap (otomatis)');
          a.akunAkumulasiId = akumAkun.id;
        }
      }
    });
    DB._migrated_asetAkumOtomatis = true;
  }
  if(!DB._migrated_asetBebanOtomatis){
    (DB.aset||[]).forEach(a=>{
      if(a.masaManfaatBulan>0 && !a.akunBebanId && a.akunAsetId){
        const akunAset = akunById(a.akunAsetId);
        if(akunAset){
          let bebanAkun = DB.coa.find(x=>x.kategori==='BO' && x.kepemilikan===akunAset.kepemilikan && x.nama==='Beban Penyusutan Aset');
          if(!bebanAkun) bebanAkun = addAkun('BO', 'Beban Penyusutan Aset', akunAset.kepemilikan, 'Otomatis dari fitur Aset Tetap');
          a.akunBebanId = bebanAkun.id;
        }
      }
    });
    DB._migrated_asetBebanOtomatis = true;
  }
  if(!DB._migrated_renamePersediaanPeralatan){
    (DB.coa||[]).forEach(a=>{
      if(a.kategori==='PS' && a.nama==='Persediaan Barang/Perlengkapan'){
        a.nama = 'Persediaan Peralatan';
      }
    });
    DB._migrated_renamePersediaanPeralatan = true;
  }
}

function ensureAutoAccounts(){
  getAllKepemilikan().forEach(kep=>{
    if(!DB.coa.find(a=>a.kategori==='BO' && a.kepemilikan===kep && a.nama==='Beban Penyusutan Aset')){
      addAkun('BO','Beban Penyusutan Aset', kep, 'Otomatis dari fitur Aset Tetap');
    }
    if(!DB.coa.find(a=>a.kategori==='PS' && a.kepemilikan===kep && a.nama==='Persediaan Peralatan')){
      addAkun('PS','Persediaan Peralatan', kep, 'Otomatis dari fitur Pembelian & Persediaan Barang');
    }
    if(!DB.coa.find(a=>a.kategori==='PD' && a.kepemilikan===kep && a.nama==='Pendapatan Lain-lain (Penyesuaian Stok)')){
      addAkun('PD','Pendapatan Lain-lain (Penyesuaian Stok)', kep, 'Otomatis dari fitur penyesuaian stok manual (+)');
    }
    if(!DB.coa.find(a=>a.kategori==='BO' && a.kepemilikan===kep && a.nama==='Beban Perlengkapan Rumah')){
      addAkun('BO','Beban Perlengkapan Rumah', kep, 'Otomatis dari fitur Persediaan Perlengkapan (saat Stok Habis dicentang)');
    }
  });
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));

}

/* ================= CLOUD SYNC (Firebase) ================= */
let cloudDocRef = null;
let cloudUnsub = null;
let applyingRemoteSnapshot = false;
let pendingCloudWrite = null;
function scheduleCloudPush(){
  if(!cloudDocRef || applyingRemoteSnapshot) return;
  clearTimeout(pendingCloudWrite);
  pendingCloudWrite = setTimeout(()=>{
    cloudDocRef.set({ db: JSON.stringify(DB), updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
      .catch(err=> console.warn('Gagal menyimpan ke cloud:', err));
  }, 600);
}
/* ---- Undang user baru (Nama+Email) tanpa mengganggu sesi login Admin ----
   Trik: buat instance Firebase app kedua ("sementara") khusus untuk membuat
   akun baru, supaya firebaseAuth utama (punya Admin) tidak ikut ter-sign-out.
   Setelah akun dibuat, langsung kirim email "reset password" Firebase —
   email itu berfungsi sebagai aktivasi akun sekaligus tempat orang tsb
   membuat password sendiri. Judul/isi email bisa disesuaikan di
   Firebase Console > Authentication > Templates > Password reset. */
async function inviteUser(nama, email, role, permissions){
  if(!FIREBASE_CONFIGURED){
    toast('Sinkronisasi cloud belum diatur — tidak bisa mengirim email aktivasi. User tetap ditambahkan tanpa akses login.');
    DB.users.push({ id:uid(), nama, email, role, permissions, status:'pending' });
    save(); return;
  }
  const tempPass = 'Tmp-'+Math.random().toString(36).slice(2,10)+'-Aa1!';
  const tmpAppName = 'invite-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
  let tmpApp;
  try{
    tmpApp = firebase.initializeApp(FIREBASE_CONFIG, tmpAppName);
    await tmpApp.auth().createUserWithEmailAndPassword(email, tempPass);
    await tmpApp.auth().sendPasswordResetEmail(email);
    await tmpApp.auth().signOut();
  }catch(err){
    if(err.code==='auth/email-already-in-use'){
      // akun Firebase untuk email ini sudah pernah dibuat sebelumnya (mis. pernah diundang lalu dihapus) —
      // tetap kirim ulang email set-password supaya orang tsb bisa aktivasi.
      try{ await tmpApp.auth().sendPasswordResetEmail(email); }catch(e2){}
    } else {
      toast('Gagal mengirim undangan: '+err.message);
      if(tmpApp) tmpApp.delete().catch(()=>{});
      return;
    }
  }
  if(tmpApp) tmpApp.delete().catch(()=>{});
  DB.users.push({ id:uid(), nama, email, role, permissions, status:'pending' });
  save();
  toast('Undangan terkirim ke '+email+' — cek email untuk aktivasi & buat password.');
}

async function resendInvite(email){
  if(!FIREBASE_CONFIGURED) return toast('Sinkronisasi cloud belum diatur — tidak bisa mengirim email aktivasi.');
  try{
    // Akun Firebase-nya sudah ada dari undangan pertama, jadi kirim ulang saja email
    // set-password-nya — tidak perlu bikin akun baru/app sementara lagi.
    await firebaseAuth.sendPasswordResetEmail(email);
    toast('Email aktivasi dikirim ulang ke '+email+' — minta orangnya cek folder Spam/Promosi juga.');
  }catch(err){
    toast('Gagal mengirim ulang: '+err.message);
  }
}

function applyRemoteDb(rawJson){
  applyingRemoteSnapshot = true;
  try{ DB = JSON.parse(rawJson); }catch(e){ applyingRemoteSnapshot=false; return; }
  if(!DB.coa || DB.coa.length===0) seedCOA();
  const fresh = freshDB();
  Object.keys(fresh).forEach(k=>{ if(DB[k]===undefined) DB[k] = fresh[k]; });
  ensureAutoAccounts();
  runOneTimeMigrations();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
  applyingRemoteSnapshot = false;
}

function nextKode(prefix){
  DB.counters[prefix] = (DB.counters[prefix]||0)+1;
  return prefix + '-' + String(DB.counters[prefix]).padStart(3,'0');
}

/* ---------------- COA SEED ---------------- */

  DB.coa.push(akun);

}

/* ---------------- RIWAYAT TRANSAKSI (audit log: input, hapus, restore) ---------------- */
function catatRiwayat(aksi, jurnalSnapshot){
  DB.riwayatTransaksi = DB.riwayatTransaksi || [];
  const u = (typeof getCurrentUser==='function') ? getCurrentUser() : null;
  DB.riwayatTransaksi.push({
    id: uid(),
    waktu: new Date().toISOString(),
    aksi, // 'tambah' | 'hapus'
    jurnalId: jurnalSnapshot.id,
    snapshot: JSON.parse(JSON.stringify(jurnalSnapshot)),
    userEmail: u ? u.email : null,
    restored: false
  });
}
function restoreRiwayat(logId){
  DB.riwayatTransaksi = DB.riwayatTransaksi || [];
  const log = DB.riwayatTransaksi.find(r=>r.id===logId);
  if(!log || log.aksi!=='hapus') return;
  if(log.restored) return toast('Transaksi ini sudah pernah di-restore');
  if(DB.jurnal.some(j=>j.id===log.snapshot.id)){ log.restored = true; save(); renderContent(); return toast('Transaksi sudah ada di jurnal'); }
  DB.jurnal.push(JSON.parse(JSON.stringify(log.snapshot)));
  log.restored = true;
  catatRiwayat('tambah', log.snapshot);
  save(); renderContent(); toast('Transaksi berhasil di-restore');
}

/* ---------------- JOURNAL ENGINE ---------------- */
// posts a balanced pair (debit account, credit account) for a given nominal
function postJurnal({tanggal, keterangan, debitId, kreditId, nominal, sumber, ref, tags, bukti}){
  if(!debitId || !kreditId || !nominal || Number(nominal)<=0) return null;
  const entry = { id:uid(), no: (DB.jurnal.length+1), tanggal: tanggal||todayStr(), keterangan: keterangan||'', debitId, kreditId, nominal:Number(nominal), sumber: sumber||'Jurnal Umum', ref: ref||'', tags: tags||[], bukti: bukti||null };
  DB.jurnal.push(entry);
  catatRiwayat('tambah', entry);
  return entry;
}
function deleteJurnalByRef(ref){
  DB.jurnal.filter(j=>j.ref===ref).forEach(j=> catatRiwayat('hapus', j));
  DB.jurnal = DB.jurnal.filter(j=>j.ref!==ref);
}
function deleteJurnalEntry(id){
  const j = DB.jurnal.find(x=>x.id===id);
  if(j) catatRiwayat('hapus', j);
  DB.jurnal = DB.jurnal.filter(j=>j.id!==id);
}

/* ---- Penyesuaian Stok Manual (+/-) — dipakai di Persediaan Bahan (produk) & Persediaan Barang (barang) ----
   Menambah/mengurangi stok secara manual (mis. stok fisik vs catatan beda) dan otomatis
   memposting jurnal yang mengubah nilai Persediaan di Neraca serta Pendapatan/Beban Lain-lain di Laba Rugi.
   Untuk Persediaan Barang, tiap item bisa punya akun Beban Operasional sendiri (item.akunBebanId, diisi
   lewat kolom "Beban Operasional" yang bisa diketik & dicari) — kalau diisi, semua jurnal yang mengeluarkan
   nilai dari persediaan (Auto Nol / stok habis maupun pengurangan stok manual) langsung didebit ke akun itu,
   bukan ke akun default (Beban Perlengkapan Rumah / Beban Lain-lain). */
function akunBebanUntukItem(item){
  return item && item.akunBebanId ? akunById(item.akunBebanId) : null;
}
function akunPersediaanUntuk(kepemilikan, tipeInventaris){
  if(tipeInventaris==='barang'){
    return DB.coa.find(a=>a.kategori==='PS' && a.kepemilikan===kepemilikan && a.nama==='Persediaan Peralatan') || DB.coa.find(a=>a.kategori==='PS' && a.kepemilikan===kepemilikan);
  }
  return DB.coa.find(a=>a.kategori==='PS' && a.kepemilikan===kepemilikan && a.nama!=='Persediaan Peralatan') || DB.coa.find(a=>a.kategori==='PS' && a.kepemilikan===kepemilikan);
}
/* Status stok rendah: kalau Stok Minimum diisi (>0), status dihitung otomatis dari stok saat ini
   dibanding minimum tsb. Kalau Stok Minimum belum diisi (0/kosong), pakai tanda "Akan Habis" manual. */
function isLowStock(item){
  const min = Number(item.stokMinimum||0);
  if(min>0) return (item.stok||0) <= min;
  return !!item.hampirHabis;
}
function prosesPenyesuaianStok(item, tipeInventaris, arah){
  const namaLabel = item.nama;
  const qtyStr = prompt('Jumlah stok yang '+(arah==='plus'?'ditambahkan':'dikurangi')+' untuk "'+namaLabel+'":', '');
  if(qtyStr===null) return;
  const qty = Number(qtyStr);
  if(!qty || qty<=0) return toast('Jumlah tidak valid');
  if(arah==='minus' && qty>(item.stok||0) && !confirm('Jumlah pengurangan lebih besar dari stok saat ini ('+fmtNum(item.stok||0)+'). Lanjutkan? Stok akan menjadi negatif.')) return;
  const hargaDefault = item.hargaBeliPerSatuan||0;
  const hargaStr = prompt('Nilai per satuan (Rp) untuk jurnal penyesuaian (kosongkan = pakai harga rata-rata saat ini):', hargaDefault||0);
  if(hargaStr===null) return;
  const harga = hargaStr===''? hargaDefault : (Number(hargaStr)||0);
  const ket = prompt('Keterangan penyesuaian (opsional, mis. "stok opname"):','') || '';
  const nominal = Math.round(qty*harga);

  if(arah==='plus'){ item.stok = (item.stok||0) + qty; } else { item.stok = (item.stok||0) - qty; }

  const adjObj = { id:uid(), tanggal:todayStr(), tipeInventaris, refId:item.id, arah, qty, harga, nominal, keterangan:ket };
  DB.penyesuaianStok.push(adjObj);

  if(nominal>0){
    const kep = item.kepemilikan||'Pribadi';
    const psAkun = akunPersediaanUntuk(kep, tipeInventaris);
    if(psAkun){
      if(arah==='plus'){
        const pdAkun = DB.coa.find(a=>a.kategori==='PD' && a.kepemilikan===kep && a.nama==='Pendapatan Lain-lain (Penyesuaian Stok)') || DB.coa.find(a=>a.kategori==='PD' && a.kepemilikan===kep);
        if(pdAkun) postJurnal({ tanggal:todayStr(), keterangan:'Penyesuaian stok (+) '+namaLabel+(ket?' — '+ket:''), debitId:psAkun.id, kreditId:pdAkun.id, nominal, sumber:'Penyesuaian Stok', ref:'stokadj-'+adjObj.id });
      } else {
        const blAkunDefault = DB.coa.find(a=>a.kategori==='BL' && a.kepemilikan===kep && a.nama==='Beban Lain-lain') || DB.coa.find(a=>a.kategori==='BL' && a.kepemilikan===kep);
        const blAkun = akunBebanUntukItem(item) || blAkunDefault;
        if(blAkun) postJurnal({ tanggal:todayStr(), keterangan:'Penyesuaian stok (-) '+namaLabel+(ket?' — '+ket:''), debitId:blAkun.id, kreditId:psAkun.id, nominal, sumber:'Penyesuaian Stok', ref:'stokadj-'+adjObj.id });
      }
    }
  }
  save(); renderContent();
  toast(nominal>0 ? 'Stok & jurnal penyesuaian tersimpan' : 'Stok diperbarui (tanpa jurnal — nilai per satuan Rp0)');
}

/* ---- Auto Nol Stok — dipakai lewat checkbox "Stok Habis" di Persediaan Bahan & Persediaan Barang ----
   Untuk item yang sudah benar-benar habis: satu klik langsung menolkan stok (qty penyesuaian = stok saat ini,
   harga = harga rata-rata berjalan) dan otomatis memposting jurnal penyesuaian, tanpa perlu isi qty manual
   seperti tombol +/- biasa. Return true kalau berhasil diterapkan, false kalau dibatalkan/tidak berlaku. */
function prosesAutoNolStok(item, tipeInventaris){
  const stokSaatIni = Number(item.stok||0);
  if(stokSaatIni<=0){ toast('Stok sudah 0'); return false; }
  if(!confirm('Nolkan stok "'+item.nama+'" dari '+fmtNum(stokSaatIni)+' '+(item.satuan||'')+' menjadi 0? Jurnal penyesuaian otomatis akan dibuat.')) return false;
  const harga = item.hargaBeliPerSatuan||0;
  const nominal = Math.round(stokSaatIni*harga);

  item.stok = 0;
  item.hampirHabis = true; // stok 0 sudah pasti habis

  const adjObj = { id:uid(), tanggal:todayStr(), tipeInventaris, refId:item.id, arah:'minus', qty:stokSaatIni, harga, nominal, keterangan:'Auto nol stok (habis)' };
  DB.penyesuaianStok.push(adjObj);

  if(nominal>0){
    const kep = item.kepemilikan||'Pribadi';
    const psAkun = akunPersediaanUntuk(kep, tipeInventaris);
    if(psAkun){
      const isPerlengkapan = tipeInventaris==='barang' && item.kategori==='Perlengkapan';
      const bebanAkunDefault = isPerlengkapan
        ? (DB.coa.find(a=>a.kategori==='BO' && a.kepemilikan===kep && a.nama==='Beban Perlengkapan Rumah') || DB.coa.find(a=>a.kategori==='BL' && a.kepemilikan===kep && a.nama==='Beban Lain-lain') || DB.coa.find(a=>a.kategori==='BL' && a.kepemilikan===kep))
        : (DB.coa.find(a=>a.kategori==='BL' && a.kepemilikan===kep && a.nama==='Beban Lain-lain') || DB.coa.find(a=>a.kategori==='BL' && a.kepemilikan===kep));
      const bebanAkun = akunBebanUntukItem(item) || bebanAkunDefault;
      if(bebanAkun) postJurnal({ tanggal:todayStr(), keterangan:'Auto nol stok (habis) '+item.nama, debitId:bebanAkun.id, kreditId:psAkun.id, nominal, sumber:'Penyesuaian Stok', ref:'stokadj-'+adjObj.id });
    }
  }
  save();
  toast('Stok "'+item.nama+'" otomatis dinolkan'+(nominal>0?' & jurnal penyesuaian tersimpan':''));
  return true;
}

/* Splits a compound journal entry (multiple debit lines + multiple credit lines, total debit === total kredit)
   into a series of simple balanced debit/kredit pairs, so it can still be posted through postJurnal() above
   without changing how the rest of the app (buku besar, neraca, laba rugi, dll) reads DB.jurnal.
   debitLines/kreditLines: array of {akunId, nominal}. Returns array of {debitId, kreditId, nominal}. */
function splitCompoundEntry(debitLines, kreditLines){
  const d = debitLines.map(x=>({akunId:x.akunId, nominal:Number(x.nominal)||0}));
  const k = kreditLines.map(x=>({akunId:x.akunId, nominal:Number(x.nominal)||0}));
  const pairs = [];
  let di=0, ki=0;
  while(di<d.length && ki<k.length){
    const amt = Math.min(d[di].nominal, k[ki].nominal);
    if(amt>0.0001) pairs.push({debitId:d[di].akunId, kreditId:k[ki].akunId, nominal:Math.round(amt)});
    d[di].nominal -= amt; k[ki].nominal -= amt;
    if(d[di].nominal<=0.0001) di++;
    if(k[ki].nominal<=0.0001) ki++;
  }
  return pairs;
}

function escHtml(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ensureTag(name){

/* usage / rename / delete tag across seluruh data */
function tagUsageCount(name){
  let n = 0;
  [DB.jurnal, DB.biaya, DB.pembelian, DB.penjualan, DB.pemakaian, DB.barang].forEach(arr=>{
    (arr||[]).forEach(item=>{ if(Array.isArray(item.tags) && item.tags.includes(name)) n++; });
  });
  return n;
}
function renameTagEverywhere(oldName, newName){
  newName = (newName||'').trim();
  if(!newName || newName===oldName) return;
  [DB.jurnal, DB.biaya, DB.pembelian, DB.penjualan, DB.pemakaian, DB.barang].forEach(arr=>{
    (arr||[]).forEach(item=>{
      if(Array.isArray(item.tags) && item.tags.includes(oldName)){
        item.tags = Array.from(new Set(item.tags.map(t=> t===oldName ? newName : t)));
      }
    });
  });
  DB.tags = DB.tags.filter(t=>t!==oldName);
  if(!DB.tags.some(t=>t.toLowerCase()===newName.toLowerCase())) DB.tags.push(newName);
}
function deleteTagEverywhere(name){
  [DB.jurnal, DB.biaya, DB.pembelian, DB.penjualan, DB.pemakaian, DB.barang].forEach(arr=>{
    (arr||[]).forEach(item=>{ if(Array.isArray(item.tags)) item.tags = item.tags.filter(t=>t!==name); });

}

function initTagPicker(fieldEl){
  const hidden = fieldEl.querySelector('.tagpicker-hidden'); if(!hidden) return;
  const box = fieldEl.querySelector('.tagpicker-box');
  const chipsWrap = fieldEl.querySelector('.tagpicker-chips');
  const search = fieldEl.querySelector('.tagpicker-search');
  const dd = fieldEl.querySelector('.tagpicker-dropdown');
  let tags = parseTagInput(hidden.getAttribute('value') || hidden.value || '');
  let store = tags.join(', ');

  Object.defineProperty(hidden, 'value', {
    get(){ return store; },
    set(v){ store = v || ''; tags = parseTagInput(store); renderChips(); },
    configurable:true
  });

  function commit(){
    store = tags.join(', ');
    hidden.dispatchEvent(new Event('change', {bubbles:true}));
  }
  function renderChips(){
    chipsWrap.innerHTML = tags.map((t,i)=>`<span class="tagpicker-chip">${escHtml(t)}<button type="button" class="tagpicker-chip-x" data-i="${i}" title="Hapus tag">&times;</button></span>`).join('');
    chipsWrap.querySelectorAll('.tagpicker-chip-x').forEach(btn=> btn.addEventListener('click', e=>{
      e.stopPropagation();
      tags.splice(Number(btn.dataset.i), 1);
      commit(); renderChips();
    }));
  }
  function addTag(name){
    name = (name||'').trim(); if(!name) return;
    if(!tags.some(t=>t.toLowerCase()===name.toLowerCase())){ tags.push(name); ensureTag(name); }
    commit(); search.value=''; renderChips(); renderDropdown();
  }
  function renderDropdown(){
    const q = search.value.trim().toLowerCase();
    const available = DB.tags.filter(t=> !tags.some(x=>x.toLowerCase()===t.toLowerCase()));
    const filtered = q ? available.filter(t=>t.toLowerCase().includes(q)) : available;
    let itemsHtml = filtered.slice(0,50).map(t=>`<div class="tagpicker-dd-item" data-name="${escHtml(t)}">${escHtml(t)}</div>`).join('');
    const qTrim = search.value.trim();
    if(qTrim && !DB.tags.some(t=>t.toLowerCase()===qTrim.toLowerCase())){
      itemsHtml += `<div class="tagpicker-dd-item tagpicker-dd-new" data-name="${escHtml(qTrim)}">+ Buat tag baru "${escHtml(qTrim)}"</div>`;
    }
    dd.innerHTML = itemsHtml || '<div class="tagpicker-dd-empty">Tidak ada tag lain</div>';
    dd.hidden = false;
    dd.querySelectorAll('.tagpicker-dd-item').forEach(item=> item.addEventListener('mousedown', e=>{
      e.preventDefault(); addTag(item.dataset.name); search.focus();
    }));
  }
  box.addEventListener('click', ()=>{ search.focus(); renderDropdown(); });
  search.addEventListener('focus', renderDropdown);
  search.addEventListener('input', renderDropdown);
  search.addEventListener('keydown', e=>{
    if(e.key==='Enter' || e.key===','){
      e.preventDefault();
      if(search.value.trim()) addTag(search.value.trim());
    } else if(e.key==='Backspace' && !search.value && tags.length){
      tags.pop(); commit(); renderChips();
    } else if(e.key==='Escape'){ dd.hidden = true; search.blur(); }
  });
  document.addEventListener('click', e=>{ if(!fieldEl.contains(e.target)) dd.hidden = true; });
  renderChips();
}
function initAllTagPickers(root){
  (root||document).querySelectorAll('.tagpicker[data-tagfield]:not([data-tp-init])').forEach(el=>{
    el.setAttribute('data-tp-init','1');
    initTagPicker(el);
  });
}
(function setupTagPickerObserver(){
  document.addEventListener('DOMContentLoaded', ()=>{
    initAllTagPickers(document);
    const content = document.getElementById('content');
    if(content){
      new MutationObserver(()=> initAllTagPickers(content)).observe(content, {childList:true, subtree:true});
    }
  });
})();

/* Generic search input binder: re-rendering the table on every keystroke normally steals focus.
   This restores focus + cursor position right after the re-render so typing feels uninterrupted. */
function bindSearchInput(id, onInput){

}

function getOrCreateAkunForKepemilikan(kategori, kepemilikan, namaFallback){

function akunById(id){ return DB.coa.find(a=>a.id===id); }
function normalIsDebit(kategori){ return DEBIT_NORMAL.has(kategori); }

// running balance for one account, purely from jurnal
function saldoAkun(akunId){
  const akun = akunById(akunId);
  if(!akun) return 0;
  let debit=0, kredit=0;
  DB.jurnal.forEach(j=>{
    if(j.debitId===akunId) debit+=j.nominal;
    if(j.kreditId===akunId) kredit+=j.nominal;
  });
  return normalIsDebit(akun.kategori) ? (debit-kredit) : (kredit-debit);
}

function sumByKategoriKepemilikan(kategori, kepemilikan){
  return DB.coa.filter(a=>a.kategori===kategori && (!kepemilikan||a.kepemilikan===kepemilikan))
    .reduce((s,a)=> s+saldoAkun(a.id), 0);
}

/* ---------------- HEADER / SUB-HEADER AKUN (COA) ----------------
   Akun "Header" adalah akun rangkuman (mis. "Biaya Dibayar Di Muka") yang TIDAK PERNAH
   punya transaksi sendiri — ia hanya mengelompokkan beberapa akun biasa ("sub-header",
   mis. "Biaya Dibayar Di Muka - Cek BCA") di bawahnya lewat field parentHeaderId.
   Header sendiri juga bisa dijadikan sub dari Header lain (nested), asal kategori &
   kepemilikannya sama, supaya urutan Kategori > Kepemilikan > Header > Sub-akun tetap konsisten
   di Neraca maupun Laba Rugi. Karena header tidak pernah punya transaksi, saldoAkun(header)
   selalu 0 — jadi Total Aset/Kewajiban/Modal/Laba-Rugi TIDAK berubah oleh fitur ini; header
   hanya memengaruhi bagaimana daftar akun ditampilkan/dikelompokkan. */
function akunPunyaTransaksi(akunId){
  return DB.jurnal.some(j=> j.debitId===akunId || j.kreditId===akunId);
}
function isHeaderAncestor(headerId, akunId){
  let cur = akunById(akunId);
  let guard = 0;
  while(cur && cur.parentHeaderId && guard++ < 50){
    if(cur.parentHeaderId === headerId) return true;
    cur = akunById(cur.parentHeaderId);
  }
  return false;
}
function headerOptionsFor(kategori, kepemilikan, excludeId){
  return DB.coa.filter(a=> a.isHeader && a.kategori===kategori && a.kepemilikan===kepemilikan
    && a.id!==excludeId && !(excludeId && isHeaderAncestor(excludeId, a.id)));
}
function saldoHeaderRekursif(headerId){
  return DB.coa.filter(a=> a.parentHeaderId===headerId)
    .reduce((s,a)=> s + (a.isHeader ? saldoHeaderRekursif(a.id) : saldoAkun(a.id)), 0);
}
function saldoAkunTampil(a){ return a.isHeader ? saldoHeaderRekursif(a.id) : saldoAkun(a.id); }

/* Laba/rugi bersih per kepemilikan (Pendapatan - BPP - BO - BL), akumulasi sepanjang waktu */
function labaRugiPerKepemilikan(kep){
  const pd = sumByKategoriKepemilikan('PD', kep);
  const bpp = sumByKategoriKepemilikan('BPP', kep);
  const bo = sumByKategoriKepemilikan('BO', kep);
  const bl = sumByKategoriKepemilikan('BL', kep);
  return pd - bpp - bo - bl;
}

/* ---- Pemisahan Laba Ditahan (akumulasi tahun-tahun sebelumnya) vs Laba Berjalan (tahun ini) ----
   Batasnya adalah tanggal 1 Januari tahun berjalan: semua transaksi PD/BPP/BO/BL sebelum
   tanggal itu dianggap "Laba Ditahan", dan mulai tanggal itu sampai hari ini dianggap
   "Laba Berjalan (periode tahun ini)". Jumlah keduanya selalu sama dengan labaRugiPerKepemilikan(). */
function awalTahunIniStr(){
  const now = new Date();
  return now.getFullYear()+'-01-01';
}
function labaRugiPerKepemilikanDalamRentang(kep, dari, sampai){
  const jlist = DB.jurnal.filter(j=> (!dari || j.tanggal>=dari) && (!sampai || j.tanggal<=sampai));
  const pd = sumByKategoriKepemilikanFiltered('PD', kep, jlist);
  const bpp = sumByKategoriKepemilikanFiltered('BPP', kep, jlist);
  const bo = sumByKategoriKepemilikanFiltered('BO', kep, jlist);
  const bl = sumByKategoriKepemilikanFiltered('BL', kep, jlist);
  return pd - bpp - bo - bl;
}
function labaDitahanAkumulasi(kep){
  // seluruh transaksi sebelum 1 Januari tahun berjalan
  return labaRugiPerKepemilikanDalamRentang(kep, null, dateMinus1Day(awalTahunIniStr()));
}
function labaBerjalanTahunIni(kep){
  // transaksi mulai 1 Januari tahun berjalan sampai hari ini
  return labaRugiPerKepemilikanDalamRentang(kep, awalTahunIniStr(), null);
}
function dateMinus1Day(dstr){
  const d = new Date(dstr+'T00:00:00'); d.setDate(d.getDate()-1);
  const pad=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}

function switchTab(id, opts){
  opts = opts || {};
  currentTab = id;
  document.getElementById('pagetitle').textContent = TITLES[id][0];
  document.getElementById('pagesub').textContent = TITLES[id][1];
  renderNav();
  renderContent();
  // Simpan tab aktif di URL (#tab) pakai History API (bukan set location.hash langsung, supaya
  // tidak memicu event 'hashchange' sendiri / dobel render). Ini yang membuat menu bisa dibuka
  // di tab browser baru langsung ke halaman itu (lihat renderNav & resolveInitialTab).
  if(!opts.skipHistory && location.hash.slice(1)!==id){
    history.pushState({tab:id}, '', '#'+id);
  }
}
/* Tab/halaman mana yang harus tampil saat aplikasi pertama kali dibuka di tab ini — dibaca dari
   hash URL (mis. dibuka lewat "Buka di tab baru" dari menu). Kalau hash kosong/tidak dikenal/
   tidak diizinkan untuk role user ini, fallback ke Dashboard seperti biasa. */
function resolveInitialTab(){
  const id = (location.hash||'').replace('#','').trim();
  if(!id || !TITLES[id]) return 'dashboard';
  const admin = isAdmin();
  if(!admin && (STAFF_RESTRICTED_TABS.has(id) || id==='settings')) return 'dashboard';
  return id;
}
window.addEventListener('popstate', ()=>{
  const id = (location.hash||'').replace('#','').trim();
  if(id && TITLES[id] && id!==currentTab) switchTab(id, {skipHistory:true});
});

function renderContent(){
  const c = document.getElementById('content');
  c.innerHTML = '';
  const fn = RENDERERS[currentTab];
  if(fn) fn(c); else c.innerHTML = '<div class="empty">Belum tersedia</div>';
}

  const totalKas = DB.coa.filter(a=>a.kategori==='AL').reduce((s,a)=>s+saldoAkun(a.id),0);

    <div class="card kpi"><div class="label">Total Kewajiban</div><div class="value">${fmtRp(totalKewajiban)}</div></div>
    <div class="card kpi"><div class="label">Total Modal</div><div class="value">${fmtRp(totalModal)}</div></div>
    <div class="card kpi"><div class="label">Posisi Kas & Bank</div><div class="value ${totalKas>=0?'pos':'neg'}">${fmtRp(totalKas)}</div></div>
  </div>`;

  html += `<div class="grid cols-4" style="margin-top:14px">`;

    html += `<div class="card kpi"><div class="label">Laba/Rugi — ${kep}</div><div class="value ${lr>=0?'pos':'neg'}">${fmtRp(lr)}</div></div>`;
  });
  html += `</div>`;

  const lowBahan = DB.produk.filter(isLowStock).map(p=>({...p, _tipe:'Bahan'}));
  const lowBarang = DB.barang.filter(isLowStock).map(b=>({...b, _tipe:'Barang'}));
  const lowStock = [...lowBahan, ...lowBarang];
  html += `<div class="card" style="margin-top:14px">
    <div class="section-title"><h3>Stok akan habis</h3><span class="hint">${lowStock.length} item (Bahan & Barang)</span></div>
    ${lowStock.length? lowStock.map(it=>`<span class="chip low">⚠ [${it._tipe}] ${it.nama} — sisa ${fmtNum(it.stok)} ${it.satuan}${Number(it.stokMinimum||0)>0?' (min '+fmtNum(it.stokMinimum)+' '+it.satuan+')':''}</span>`).join('') : '<div class="mini">Belum ada item yang akan habis. Isi Stok Minimum di sheet Persediaan Bahan/Barang supaya otomatis tercentang, atau tandai manual.</div>'}
  </div>`;

  // Rekomendasi bahan yang mendekati/sudah kadaluwarsa (dari Tanggal Kadaluwarsa di Pembelian Bahan), diurutkan dari yang paling mendesak.
  const kadaluwarsaList = DB.pembelian
    .filter(p=> (p.tipe||'bahan')==='bahan' && p.kadaluwarsa)
    .map(p=>({ p, item: DB.produk.find(x=>x.id===(p.refId||p.produkId)), sisa: daysUntil(p.kadaluwarsa) }))
    .filter(x=> x.item && x.sisa!==null && x.sisa<=30)
    .sort((a,b)=> a.sisa-b.sisa);
  html += `<div class="card" style="margin-top:14px">
    <div class="section-title"><h3>🍽 Rekomendasi: Bahan Mendekati Kadaluwarsa</h3><span class="hint">${kadaluwarsaList.length} batch (≤30 hari, dari Pembelian Bahan)</span></div>
    ${kadaluwarsaList.length? kadaluwarsaList.map(x=>{
      const lewat = x.sisa<0;
      return `<span class="chip ${lewat?'low':'warn'}">${lewat?'⛔':'⏰'} ${x.item.nama} — ${fmtNum(x.p.qty)} ${x.item.satuan} · kadaluwarsa ${fmtTgl(x.p.kadaluwarsa)} (${lewat?'lewat '+Math.abs(x.sisa)+' hr':x.sisa+' hr lagi'})</span>`;
    }).join('') : '<div class="mini">Belum ada bahan yang mendekati kadaluwarsa. Isi Tanggal Kadaluwarsa saat mencatat Pembelian Bahan supaya muncul otomatis di sini 1 bulan sebelum jatuh tempo.</div>'}
  </div>`;

  const recentJ = [...DB.jurnal].slice(-8).reverse();
  html += `<div class="card" style="margin-top:14px">
    <div class="section-title"><h3>Transaksi terbaru</h3><span class="hint">8 entri terakhir</span></div>
    <div class="tablewrap"><table class="sheet"><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Debit</th><th>Kredit</th><th>Nominal</th><th>Sumber</th></tr></thead><tbody>
    ${recentJ.length? recentJ.map(j=>`<tr><td>${fmtTgl(j.tanggal)}</td><td>${j.keterangan||'-'}</td><td>${akunById(j.debitId)?.nama||'?'}</td><td>${akunById(j.kreditId)?.nama||'?'}</td><td class="num">${fmtRp(j.nominal)}</td><td>${j.sumber}</td></tr>`).join('') : '<tr><td colspan="6" class="empty">Belum ada transaksi</td></tr>'}
    </tbody></table></div>
  </div>`;

  const periodsDash = generatePeriods('bulanan', 6);
  const dataDash = periodsDash.map(p=> hitungLabaRugiPeriode(p.dari, p.sampai));
  const iniLabaRugi = hitungLabaRugiPeriode(...dateRangeForMode('bulan_ini'));
  const labaKotorIni = iniLabaRugi.pd - iniLabaRugi.bpp;

  html += `<div class="grid cols-2" style="margin-top:14px;align-items:stretch">
    <div class="card">
      <div class="section-title"><h3>Tren Pendapatan vs Beban</h3><span class="hint">6 bulan terakhir</span></div>
      ${svgBarChart(periodsDash.map(p=>p.label), [
        {name:'Pendapatan', color:'var(--debit)', values:dataDash.map(d=>d.pd)},
        {name:'Beban', color:'var(--kredit)', values:dataDash.map(d=>d.beban)}
      ])}
      <div style="display:flex;gap:16px;margin-top:6px;font-size:11.5px">
        <span><span style="display:inline-block;width:9px;height:9px;background:var(--debit);border-radius:2px;margin-right:4px"></span>Pendapatan</span>
        <span><span style="display:inline-block;width:9px;height:9px;background:var(--kredit);border-radius:2px;margin-right:4px"></span>Beban</span>
      </div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="section-title" style="width:100%"><h3>Komposisi Pendapatan Bulan Ini</h3></div>
      ${iniLabaRugi.pd>0 ? svgDonutChart([
        {label:'Beban HPP', value:iniLabaRugi.bpp, color:'var(--kredit)'},
        {label:'Laba Kotor', value:Math.max(0,labaKotorIni), color:'var(--debit)'}
      ]) : '<div class="mini" style="padding:30px 0">Belum ada Pendapatan Operasional bulan ini</div>'}
      ${iniLabaRugi.pd>0? `<div style="display:flex;gap:16px;margin-top:10px;font-size:11.5px">
        <span><span style="display:inline-block;width:9px;height:9px;background:var(--kredit);border-radius:2px;margin-right:4px"></span>HPP ${Math.round(iniLabaRugi.bpp/iniLabaRugi.pd*100)}%</span>
        <span><span style="display:inline-block;width:9px;height:9px;background:var(--debit);border-radius:2px;margin-right:4px"></span>Laba Kotor ${Math.round(labaKotorIni/iniLabaRugi.pd*100)}%</span>
      </div>` : ''}
    </div>
  </div>`;

  c.innerHTML = html;
};

/* ================= COA ================= */
let coaFilterKategori = '';
let coaSearch = '';
const COA_HEADERS = ['Kode','Nama Akun','Kategori','Kepemilikan','Keterangan'];
function importCoaRows(rows){
  let ditambah=0, diupdate=0, dilewati=0;
  rows.forEach(r=>{
    const nama = String(xrow(r,'Nama Akun','Nama')||'').trim();
    if(!nama) { dilewati++; return; }
    let kategoriRaw = String(xrow(r,'Kategori')||'').trim().toUpperCase();
    if(!KAT[kategoriRaw]){
      const found = Object.keys(KAT).find(k=> KAT[k].toLowerCase()===kategoriRaw.toLowerCase());
      kategoriRaw = found || '';
    }
    if(!KAT[kategoriRaw]){ dilewati++; return; }
    const kepRaw = String(xrow(r,'Kepemilikan')||'Pribadi').trim();
    const kepemilikan = KEPEMILIKAN.includes(kepRaw) ? kepRaw : 'Pribadi';
    const keterangan = String(xrow(r,'Keterangan')||'');
    const kodeRaw = String(xrow(r,'Kode')||'').trim();
    const isHeaderRaw = String(xrow(r,'Header?')||'').trim().toLowerCase();
    const isHeader = isHeaderRaw==='ya' || isHeaderRaw==='yes' || isHeaderRaw==='true';
    const existing = (kodeRaw && DB.coa.find(a=>a.kode===kodeRaw)) || DB.coa.find(a=> a.nama.trim().toLowerCase()===nama.toLowerCase());
    if(existing){
      if(DB.coa.some(a=> a.id!==existing.id && a.nama.trim().toLowerCase()===nama.toLowerCase())){ dilewati++; return; }
      // Akun yang sudah punya transaksi tidak boleh diubah jadi Header lewat impor.
      existing.nama = nama; existing.kategori = kategoriRaw; existing.kepemilikan = kepemilikan; existing.keterangan = keterangan;
      if(isHeader && !akunPunyaTransaksi(existing.id)) existing.isHeader = true;
      diupdate++;
    } else {
      if(DB.coa.some(a=> a.nama.trim().toLowerCase()===nama.toLowerCase())){ dilewati++; return; }
      addAkun(kategoriRaw, nama, kepemilikan, keterangan, isHeader?{isHeader:true}:undefined);
      ditambah++;
    }
  });
  // Kedua: hubungkan Sub dari Header (butuh semua header sudah ada dari pass pertama di atas)
  rows.forEach(r=>{
    const nama = String(xrow(r,'Nama Akun','Nama')||'').trim(); if(!nama) return;
    const subDariNama = String(xrow(r,'Sub dari Header')||'').trim(); if(!subDariNama) return;
    const akun = DB.coa.find(a=> a.nama.trim().toLowerCase()===nama.toLowerCase());
    const header = DB.coa.find(a=> a.isHeader && a.nama.trim().toLowerCase()===subDariNama.toLowerCase() && a.kategori===akun?.kategori && a.kepemilikan===akun?.kepemilikan);
    if(akun && header && akun.id!==header.id) akun.parentHeaderId = header.id;
  });
  save(); renderCoaTable();
  toast(`Impor selesai — ${ditambah} akun baru, ${diupdate} diperbarui${dilewati?`, ${dilewati} dilewati (nama kosong/duplikat/kategori tak valid)`:''}`);
}
function coaIoCfg(){
  return {
    template:{ filename:'template-coa.xlsx', sheetName:'Chart of Accounts', headers:COA_HEADERS,
      exampleRows:[['','Contoh: Kas Kecil Toko','AL','Bisnis A','Opsional, boleh dikosongkan']] },
    onImport: importCoaRows,
    exportExcel: ()=>({ filename:'chart-of-accounts-'+todayStr()+'.xlsx', sheetName:'Chart of Accounts',
      headers:['Kode','Nama Akun','Kategori','Kategori Label','Kepemilikan','Keterangan','Header?','Sub dari Header','Saldo'],
      rows: sortAkunListWithHeaders(DB.coa).map(a=>[a.kode,a.nama,a.kategori,KAT[a.kategori]||'',a.kepemilikan,a.keterangan||'',a.isHeader?'Ya':'','',a.isHeader?saldoHeaderRekursif(a.id):saldoAkun(a.id)].map((v,i)=> i===7? (a.parentHeaderId? (akunById(a.parentHeaderId)?.nama||'') : '') : v)) }),
    exportPdf: ()=>({ filename:'chart-of-accounts-'+todayStr()+'.pdf', title:'Chart of Accounts',
      headers:['Kode','Nama Akun','Kategori','Kepemilikan','Saldo'],
      rows: sortAkunListWithHeaders(DB.coa).map(a=>[a.kode,(a.isHeader?'▸ ':(a.parentHeaderId?'    ':''))+a.nama,KAT[a.kategori]||'',a.kepemilikan,fmtRp(saldoAkunTampil(a))]) })
  };
}

  const viewOnly = isViewOnly('coa');
  let html = `${viewOnly?viewOnlyNoticeHtml('Chart of Accounts (Akun)'):''}
  <div class="section-title" style="margin-top:${viewOnly?'14px':'0'}">
    <h3 id="coaCountTitle">Daftar Akun (${DB.coa.length})</h3>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      ${searchBoxHtml('coaSearchInput','Cari nama/kode akun')}
      <select id="coaFilter" class="field" style="padding:7px 10px;border:1px solid var(--line);border-radius:8px">
        <option value="">Semua kategori</option>
        ${Object.entries(KAT).map(([k,v])=>`<option value="${k}" ${coaFilterKategori===k?'selected':''}>${v}</option>`).join('')}
      </select>
      ${viewOnly?'':'<button class="btn primary" id="btnAddAkun">+ Tambah Akun</button>'}
      ${viewOnly?'':ioToolbarHtml('coa', coaIoCfg())}

  const btnAddAkun = document.getElementById('btnAddAkun');
