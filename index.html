          <option value="hapus" ${riwayatFilterAksi==='hapus'?'selected':''}>Dihapus</option>
        </select>
      </div>
    </div>
    <div class="mini" style="margin-bottom:8px">Log jam & tanggal setiap transaksi yang diinput atau dihapus. Klik nama transaksi yang "Ditambahkan" untuk lihat detailnya; transaksi yang "Dihapus" bisa di-restore.</div>
    <div id="riwayatTableWrap">${riwayatTableHtml()}</div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="section-title"><h3>Export Data (CSV)</h3></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="expProduk">Export Produk (CSV)</button>
      <button class="btn" id="expJurnal">Export Jurnal (CSV)</button>
      <button class="btn" id="expPembelian">Export Pembelian (CSV)</button>
    </div>
  </div>`;
  c.innerHTML = html;
  const btnSimpanProfilUsaha = document.getElementById('btnSimpanProfilUsaha');
  if(btnSimpanProfilUsaha) btnSimpanProfilUsaha.addEventListener('click', ()=>{
    DB.profil = DB.profil || {namaUsaha:'', logoDataUrl:''};
    DB.profil.namaUsaha = document.getElementById('profilNamaUsaha').value.trim();
    const fileInp = document.getElementById('profilLogoInput');
    const file = fileInp && fileInp.files[0];
    if(file){
      resizeImageToDataUrl(file, 160, dataUrl=>{
        if(!dataUrl){ toast('Gagal membaca gambar logo'); return; }
        DB.profil.logoDataUrl = dataUrl; save(); toast('Profil usaha disimpan'); renderContent();
      });
    } else { save(); toast('Profil usaha disimpan'); renderContent(); }
  });
  const btnHapusLogoUsaha = document.getElementById('btnHapusLogoUsaha');
  if(btnHapusLogoUsaha) btnHapusLogoUsaha.addEventListener('click', ()=>{
    DB.profil = DB.profil || {namaUsaha:'', logoDataUrl:''};
    DB.profil.logoDataUrl = ''; save(); toast('Logo dihapus'); renderContent();
  });
  bindRiwayatTableActions(c);
  bindSearchInput('riwayatSearchInput', v=>{ riwayatSearch=v; });
  document.getElementById('riwayatFilterSelect').addEventListener('change', e=>{ riwayatFilterAksi=e.target.value; renderContent(); });

  function bindViewOnlyToggle(wrap, viewClass, editClass, delClass){
    wrap.querySelectorAll('.'+viewClass).forEach(cb=>{
      const row = cb.closest('tr');
      const editCb = row.querySelector('.'+editClass), delCb = row.querySelector('.'+delClass);
      const sync = ()=>{
        editCb.disabled = cb.checked; delCb.disabled = cb.checked;
        if(cb.checked){ editCb.checked=false; delCb.checked=false; }
      };
      sync();
      cb.addEventListener('change', sync);
    });
  }
  function drawPermsCheckboxes(perms){
    const wrap = document.getElementById('uPermsWrap');
    if(uRole.value==='Admin'){ wrap.innerHTML = '<div class="mini">Admin punya akses penuh ke semua fitur, tidak perlu diatur.</div>'; return; }
    wrap.innerHTML = `<div class="mini" style="margin-bottom:6px">Centang "Lihat Saja" supaya Staff ini hanya bisa melihat data fitur tsb (tidak bisa tambah/ubah/hapus). Kalau tidak, atur akses ubah/hapus per fitur (input transaksi baru tetap boleh):</div>
    <div class="tablewrap"><table class="sheet"><thead><tr><th>Fitur</th><th>Lihat Saja</th><th>Ubah</th><th>Hapus</th></tr></thead><tbody>
    ${MODUL_PERMISSION_LIST.map(m=>`<tr><td>${m.label}</td>
      <td><input type="checkbox" class="permView" data-modul="${m.key}" ${perms[m.key]?.view?'checked':''}></td>
      <td><input type="checkbox" class="permEdit" data-modul="${m.key}" ${perms[m.key]?.edit?'checked':''}></td>
      <td><input type="checkbox" class="permDelete" data-modul="${m.key}" ${perms[m.key]?.delete?'checked':''}></td>
    </tr>`).join('')}
    </tbody></table></div>`;
    bindViewOnlyToggle(wrap, 'permView', 'permEdit', 'permDelete');
  }
  drawPermsCheckboxes(defaultPermissions());
  document.getElementById('uRole').addEventListener('change', ()=> drawPermsCheckboxes(defaultPermissions()));

  function readPermsFromForm(){
    const p = defaultPermissions();
    c.querySelectorAll('.permView').forEach(cb=>{ p[cb.dataset.modul].view = cb.checked; });
    c.querySelectorAll('.permEdit').forEach(cb=>{ p[cb.dataset.modul].edit = cb.checked; });
    c.querySelectorAll('.permDelete').forEach(cb=>{ p[cb.dataset.modul].delete = cb.checked; });
    return p;
  }

  document.getElementById('btnAddUser').addEventListener('click', async ()=>{
    const nama = uNama.value.trim(), email = uEmail.value.trim().toLowerCase(), role = uRole.value;
    if(!nama||!email) return toast('Lengkapi nama & email');
    if(DB.users.some(u=>u.email===email)) return toast('Email sudah terdaftar');
    const permissions = role==='Admin' ? defaultPermissions() : readPermsFromForm();
    await inviteUser(nama, email, role, permissions);
    renderContent();
  });
  c.querySelectorAll('.btnResendInvite').forEach(btn=> btn.addEventListener('click', ()=>{ resendInvite(btn.dataset.email); }));
  c.querySelectorAll('.btnDelUser').forEach(btn=> btn.addEventListener('click', ()=>{
    if(!confirm('Hapus user ini? Orang ini tidak akan bisa masuk lagi ke aplikasi.')) return;
    DB.users = DB.users.filter(u=>u.id!==btn.dataset.id); save(); renderContent();
  }));
  c.querySelectorAll('.btnEditPermUser').forEach(btn=> btn.addEventListener('click', ()=>{
    const u = DB.users.find(x=>x.id===btn.dataset.id); if(!u) return;
    u.permissions = u.permissions || defaultPermissions();
    const html = `<div class="mini" style="margin-bottom:6px">Akses <b>${u.nama||u.email}</b> — centang "Lihat Saja" supaya fitur itu jadi hanya-baca (tidak bisa tambah/ubah/hapus):</div>
    <div class="tablewrap"><table class="sheet"><thead><tr><th>Fitur</th><th>Lihat Saja</th><th>Ubah</th><th>Hapus</th></tr></thead><tbody>
    ${MODUL_PERMISSION_LIST.map(m=>`<tr><td>${m.label}</td>
      <td><input type="checkbox" class="dPermView" data-modul="${m.key}" ${u.permissions[m.key]?.view?'checked':''}></td>
      <td><input type="checkbox" class="dPermEdit" data-modul="${m.key}" ${u.permissions[m.key]?.edit?'checked':''}></td>
      <td><input type="checkbox" class="dPermDelete" data-modul="${m.key}" ${u.permissions[m.key]?.delete?'checked':''}></td>
    </tr>`).join('')}
    </tbody></table></div>
    <button class="btn primary" id="btnSavePermUser" style="margin-top:12px">Simpan Akses</button>`;
    const d = openDetailDrawer('Atur Akses — '+(u.nama||u.email), html);
    bindViewOnlyToggle(d, 'dPermView', 'dPermEdit', 'dPermDelete');
    d.querySelector('#btnSavePermUser').addEventListener('click', ()=>{
      d.querySelectorAll('.dPermView').forEach(cb=>{ u.permissions[cb.dataset.modul].view = cb.checked; });
      d.querySelectorAll('.dPermEdit').forEach(cb=>{ u.permissions[cb.dataset.modul].edit = cb.checked; });
      d.querySelectorAll('.dPermDelete').forEach(cb=>{ u.permissions[cb.dataset.modul].delete = cb.checked; });
      save(); toast('Akses diperbarui'); renderContent();
    });
  }));
  document.getElementById('btnAddTagSetting').addEventListener('click', ()=>{
    const v = document.getElementById('newTagInput').value.trim();
    if(!v) return toast('Isi nama tag');
    if(DB.tags.some(t=>t.toLowerCase()===v.toLowerCase())) return toast('Tag sudah ada');
    ensureTag(v); save(); renderContent(); toast('Tag ditambahkan');
  });
  c.querySelectorAll('.btnRenameTag').forEach(btn=> btn.addEventListener('click', ()=>{
    const oldName = btn.dataset.tag;
    const nn = prompt('Nama baru untuk tag "'+oldName+'":', oldName);
    if(nn===null) return;
    const trimmed = nn.trim();
    if(!trimmed || trimmed===oldName) return;
    renameTagEverywhere(oldName, trimmed); save(); renderContent(); toast('Tag di-rename');
  }));
  c.querySelectorAll('.btnDelTag').forEach(btn=> btn.addEventListener('click', ()=>{
    const name = btn.dataset.tag;
    if(!confirm('Hapus tag "'+name+'" dari semua transaksi?')) return;
    deleteTagEverywhere(name); save(); renderContent(); toast('Tag dihapus');
  }));
  function downloadCsv(filename, rows){
    const csv = rows.map(r=> r.map(v=> `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
  }
  document.getElementById('expProduk').addEventListener('click', ()=>{
    const rows = [['Kode','Nama','Jenis Bahan','Kategori','Satuan','Kepemilikan','Harga per satuan','Stok']];
    DB.produk.forEach(p=> rows.push([p.kode,p.nama,p.jenisBahan,p.kategori,p.satuan,p.kepemilikan,p.hargaBeliPerSatuan,p.stok]));
    downloadCsv('produk.csv', rows);
  });
  document.getElementById('expJurnal').addEventListener('click', ()=>{
    const rows = [['Tanggal','Keterangan','Akun Debit','Akun Kredit','Nominal','Sumber','Tag']];
    DB.jurnal.forEach(j=> rows.push([fmtTgl(j.tanggal),j.keterangan,akunById(j.debitId)?.nama,akunById(j.kreditId)?.nama,j.nominal,j.sumber,(j.tags||[]).join('|')]));
    downloadCsv('jurnal.csv', rows);
  });
  document.getElementById('expPembelian').addEventListener('click', ()=>{
    const rows = [['Tanggal','Dibayar Melalui','Jenis Persediaan','Barang','Qty','Total','Keterangan']];
    DB.pembelian.forEach(p=> rows.push([fmtTgl(p.tanggal), akunById(p.bayarId)?.nama, (p.tipe||'bahan')==='barang'?'Barang':'Bahan', pembelianRefItem(p)?.nama, p.qty, p.total, p.keterangan]));
    downloadCsv('pembelian.csv', rows);
  });
};

function initApp(){
  if(!FIREBASE_CONFIGURED){
    renderCloudConfigMissingScreen();
    return;
  }
  firebaseAuth.onAuthStateChanged(user=>{
    if(!user){
      if(cloudUnsub){ cloudUnsub(); cloudUnsub=null; }
      cloudDocRef = null;
      renderCloudLoginScreen();
      return;
    }
    setupCloudSync(user);
  });
}

function renderCloudConfigMissingScreen(){
  const shell = document.getElementById('shell'); shell.style.display='none';
  let scr = document.getElementById('cloudLoginScreen');
  if(!scr){ scr = document.createElement('div'); scr.id='cloudLoginScreen'; document.body.appendChild(scr); }
  scr.style.cssText = 'min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--cream);padding:20px';
  scr.innerHTML = `<div class="card" style="max-width:460px;width:100%">
    <h2>Sinkronisasi Cloud Belum Diatur</h2>
    <div class="mini" style="margin-top:8px;line-height:1.6">Isi <code>FIREBASE_CONFIG</code> di bagian atas file HTML ini dengan konfigurasi project Firebase Anda supaya data bisa sinkron di semua device. Petunjuk lengkap ada di komentar tepat di atas <code>FIREBASE_CONFIG</code> dalam kode.</div>
  </div>`;
}

// Semua user (Admin & Staff yang diundang) memakai SATU dokumen ledger yang sama supaya
// datanya benar-benar sinkron/dibagi bersama, bukan terpisah per akun Firebase.
// Sesuaikan Firestore Security Rules (lihat komentar di atas FIREBASE_CONFIG) supaya
// setiap akun yang berhasil login (yaitu akun yang memang dibuat lewat undangan Admin)
// boleh baca/tulis dokumen ini.
const SHARED_LEDGER_ID = 'utama';

// true kalau email ini sudah diundang & terdaftar di DB.users (atau ini setup Admin pertama)
function ensureLocalUserForCloud(cloudUser){
  let lu = DB.users.find(u=>u.email===cloudUser.email);
  if(!lu){
    if(DB.users.length===0){
      // belum ada siapa pun terdaftar di ledger ini — orang pertama yang login jadi Admin
      lu = { id:uid(), nama:'Admin', email:cloudUser.email, role:'Admin', permissions:defaultPermissions(), status:'aktif' };
      DB.users.push(lu);
    } else {
      // email ini tidak ada di daftar user yang diundang Admin — tolak akses
      toast('Akun ini belum diundang oleh Admin. Hubungi Admin untuk mendapatkan akses.');
      firebaseAuth.signOut();
      return null;
    }
  } else {
    lu.status = 'aktif';
  }
  DB.currentUserId = lu.id;
  return lu;
}

function setupCloudSync(cloudUser){
  const scr = document.getElementById('cloudLoginScreen'); if(scr) scr.remove();
  cloudDocRef = firebaseDb.collection('ledgers').doc(SHARED_LEDGER_ID);
  cloudDocRef.get().then(snap=>{
    if(snap.exists && snap.data().db){
      applyRemoteDb(snap.data().db);
    } else {
      load(); // no cloud data yet — bootstrap from local/fresh, then push it up below
    }
    const lu = ensureLocalUserForCloud(cloudUser);
    if(!lu) return; // ditolak — bukan user yang diundang
    save();
    bootUiOnce();
    listenCloudChanges();
  }).catch(err=>{
    toast('Gagal memuat data cloud, memakai data lokal untuk sementara: '+err.message);
    load();
    const lu = ensureLocalUserForCloud(cloudUser);
    if(!lu) return;
    bootUiOnce();
  });
}

function listenCloudChanges(){
  if(cloudUnsub || !cloudDocRef) return;
  cloudUnsub = cloudDocRef.onSnapshot(snap=>{
    if(!snap.exists) return;
    const data = snap.data();
    if(!data || !data.db) return;
    applyRemoteDb(data.db);
    if(appBooted){ renderNav(); renderContent(); toast('Data diperbarui dari device lain'); }
  }, err=> console.warn('Sinkron cloud terputus:', err));
}

function bootUiOnce(){
  if(appBooted){ renderNav(); switchTab(currentTab); return; }
  appBooted = true;
  finishInit();
}
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarBackdrop').classList.add('open'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarBackdrop').classList.remove('open'); }
function toggleSidebar(){ document.getElementById('sidebar').classList.contains('open') ? closeSidebar() : openSidebar(); }

function finishInit(){
  renderNav();
  switchTab(resolveInitialTab(), {skipHistory:true});
  document.getElementById('hamburgerBtn').addEventListener('click', toggleSidebar);
  document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebar);
  const u = getCurrentUser();
  const actions = document.getElementById('topbar-actions');
  if(u && actions && !document.getElementById('userBadge')){
    const span = document.createElement('span');
    span.id = 'userBadge'; span.className='mini';
    span.style.marginRight='8px';
    span.textContent = (u.nama||u.email)+' ('+u.role+')';
    actions.prepend(span);
    const logoutBtn = document.createElement('button');
    logoutBtn.className='btn small'; logoutBtn.textContent='Keluar';
    logoutBtn.addEventListener('click', logout);
    actions.appendChild(logoutBtn);
  }

  updateThemeBtnLabel();
  document.getElementById('btnThemeToggle').addEventListener('click', toggleTheme);
  document.getElementById('btnNewTab').addEventListener('click', ()=>{
    window.open(window.location.href, '_blank');
    toast('Tab baru dibuka — data akan sinkron otomatis lewat cloud');
  });
  // Backup JSON berisi dump seluruh data, dan Restore bisa menimpa semua data —
  // sama seperti menu "User & Export", ini hanya untuk Admin.
  if(!isAdmin()){
    document.getElementById('btnExport')?.remove();
    document.getElementById('btnImport')?.remove();
    document.getElementById('fileImport')?.remove();
  }
  document.getElementById('btnExport')?.addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'inspira-ledger-backup-'+todayStr()+'.json';
    a.click(); URL.revokeObjectURL(url);
    toast('Backup diunduh');
  });
  document.getElementById('btnImport')?.addEventListener('click', ()=> document.getElementById('fileImport')?.click());
  document.getElementById('fileImport')?.addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(!data.coa) throw new Error('format tidak dikenali');
        if(!confirm('Restore akan menimpa semua data saat ini. Lanjutkan?')) return;
        DB = data; save(); switchTab('dashboard'); toast('Data berhasil di-restore');
      }catch(err){ toast('File tidak valid: '+err.message); }
    };
    reader.readAsText(file);
  });
}

document.addEventListener('DOMContentLoaded', initApp);

</script>
<script>
  // Register service worker for offline support (PWA)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(err => console.warn('SW registration failed:', err));
    });
  }
  // Optional: show a lightweight "Install app" button when the browser allows it
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const btn = document.createElement('button');
    btn.textContent = '⬇ Install Aplikasi';
    btn.className = 'btn primary';
    btn.style.marginRight = '8px';
    btn.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      btn.remove();
    });
    const actions = document.getElementById('topbar-actions');
    if (actions) actions.prepend(btn);
  });
</script>
