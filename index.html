/* Form modal untuk menambah akun baru — mendukung akun biasa maupun akun Header (rangkuman
   tanpa transaksi), serta memilih akun tsb jadi sub dari Header yang sudah ada (kategori &
   kepemilikan harus sama dengan header pilihan). */
function openAddAkunModal(){
  const m = openFormModal('Tambah Akun', `
    <div class="formgrid">
      <div class="field" style="grid-column:span 2"><label>Nama Akun</label><input id="naNama" placeholder="Nama akun baru"></div>
      <div class="field"><label>Kategori</label><select id="naKategori">${KATEGORI_ORDER.map(k=>`<option value="${k}">${KAT[k]}</option>`).join('')}</select></div>
      <div class="field"><label>Kepemilikan</label><select id="naKep">${KEPEMILIKAN.map(k=>`<option>${k}</option>`).join('')}</select></div>
      <div class="field" style="grid-column:span 2"><label>Keterangan (opsional)</label><input id="naKet"></div>
      <div class="field" style="grid-column:span 2"><label style="display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer"><input type="checkbox" id="naIsHeader" style="width:auto"> Jadikan akun Header (rangkuman, tanpa transaksi sendiri)</label>
        <div class="mini" style="margin-top:2px">Header hanya untuk mengelompokkan beberapa akun di laporan (Neraca/Laba Rugi) — tidak dipakai untuk transaksi.</div>
      </div>
      <div class="field" style="grid-column:span 2"><label>Sub dari Header (opsional)</label><select id="naSubDari"><option value="">— Tidak ada —</option></select>
        <div class="mini" style="margin-top:2px">Kalau dipilih, akun ini akan dirangkum di bawah Header tsb pada laporan.</div>
      </div>
    </div>
    <button class="btn primary" id="naSave" style="margin-top:10px;width:100%">Simpan Akun</button>
  `, 'addAkunModal');
  function refreshSubDariOptions(){
    const kategori = document.getElementById('naKategori').value;
    const kep = document.getElementById('naKep').value;
    const sel = document.getElementById('naSubDari');
    const prev = sel.value;
    const opts = headerOptionsFor(kategori, kep, null);
    sel.innerHTML = '<option value="">— Tidak ada —</option>' + opts.map(h=>`<option value="${h.id}">${h.nama}</option>`).join('');
    if(opts.some(h=>h.id===prev)) sel.value = prev;
  }
  refreshSubDariOptions();
  document.getElementById('naKategori').addEventListener('change', refreshSubDariOptions);
  document.getElementById('naKep').addEventListener('change', refreshSubDariOptions);
  document.getElementById('naSave').addEventListener('click', ()=>{
    const nama = document.getElementById('naNama').value.trim();
    if(!nama) return toast('Nama akun wajib diisi');
    if(DB.coa.some(a=> a.nama.trim().toLowerCase()===nama.toLowerCase())) return toast('Nama akun ini sudah ada — pakai nama lain supaya tidak salah akun');
    const kategori = document.getElementById('naKategori').value;
    const kep = document.getElementById('naKep').value;
    const ket = document.getElementById('naKet').value.trim();
    const isHeader = document.getElementById('naIsHeader').checked;
    const parentHeaderId = document.getElementById('naSubDari').value || null;
    const extra = {};
    if(isHeader) extra.isHeader = true;
    if(parentHeaderId) extra.parentHeaderId = parentHeaderId;
    addAkun(kategori, nama, kep, ket, Object.keys(extra).length?extra:undefined);
    save(); renderCoaTable(); m.remove(); toast('Akun ditambahkan'+(isHeader?' (Header)':''));
  });
}

/* Renders only the accounts table (not the search box/filter/header), so typing in the
   search box never remounts the input — this was causing the search field to feel
   "unable to type" (focus/mobile keyboard dropped on every keystroke). */
function akunDepth(a){
  let d=0, cur=a, guard=0;
  while(cur && cur.parentHeaderId && guard++<50){ d++; cur = akunById(cur.parentHeaderId); }
  return d;
}
function renderCoaTable(){
  const wrap = document.getElementById('coaTableWrap'); if(!wrap) return;
  const titleEl = document.getElementById('coaCountTitle'); if(titleEl) titleEl.textContent = 'Daftar Akun ('+DB.coa.length+')';
  const baseFiltered = DB.coa.filter(a=> (!coaFilterKategori || a.kategori===coaFilterKategori) && matchSearch(a.nama+' '+a.kode+' '+(a.keterangan||''), coaSearch));
  const filtered = sortAkunListWithHeaders(baseFiltered);
  let html = `<div class="tablewrap"><table class="sheet"><thead><tr>
    <th>Kode</th><th class="akun-nama-cell">Nama Akun</th><th>Kategori</th><th>Kepemilikan</th><th class="wrap-cell">Keterangan</th><th>Header?</th><th>Sub dari Header</th><th>Saldo</th><th></th>
  </tr></thead><tbody>`;
  filtered.forEach(a=>{
    const depth = akunDepth(a);
    const indent = depth>0 ? (10+depth*18) : 10;
    const namaPrefix = depth>0 ? '<span class="mini" style="color:var(--ink-soft)">↳ </span>' : '';
    const rowStyle = a.isHeader ? 'background:var(--surface2)' : '';
    const headerOpts = headerOptionsFor(a.kategori, a.kepemilikan, a.id);
    html += `<tr data-id="${a.id}" style="${rowStyle}">
      <td class="mini">${a.kode}</td>
      <td class="akun-nama-cell" style="padding-left:${indent}px">${namaPrefix}<input class="edit-nama" ${canDo('coa','edit')?'':'disabled'} title="${a.nama.replace(/"/g,'&quot;')}" value="${a.nama.replace(/"/g,'&quot;')}" style="${a.isHeader?'font-weight:700':''}"></td>
      <td><span class="mini">${KAT[a.kategori]}</span></td>
      <td><select class="edit-kep" ${canDo('coa','edit')?'':'disabled'}>${KEPEMILIKAN.map(k=>`<option ${a.kepemilikan===k?'selected':''}>${k}</option>`).join('')}</select></td>
      <td class="wrap-cell"><input class="edit-ket" ${canDo('coa','edit')?'':'disabled'} value="${(a.keterangan||'').replace(/"/g,'&quot;')}"></td>
      <td style="text-align:center"><input type="checkbox" class="edit-isheader" ${canDo('coa','edit')?'':'disabled'} ${a.isHeader?'checked':''} title="Jadikan akun rangkuman (header), tanpa transaksi"></td>
      <td><select class="edit-subdari" ${canDo('coa','edit')?'':'disabled'}><option value="">— Tidak ada —</option>${headerOpts.map(h=>`<option value="${h.id}" ${a.parentHeaderId===h.id?'selected':''}>${h.nama}</option>`).join('')}</select></td>
      <td class="num">${fmtRp(saldoAkunTampil(a))}</td>
      <td>${canDo('coa','delete')?`<button class="btn small danger btnDelAkun">Hapus</button>`:''}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  if(filtered.length===0) html = `<div class="tablewrap"><div class="empty">Tidak ada akun yang cocok dengan pencarian</div></div>`;
  html += `<div class="mini" style="margin-top:8px">Baris abu-abu = akun <b>Header</b> (rangkuman, saldonya otomatis dijumlah dari sub-akun di bawahnya dan tidak dipakai untuk transaksi). Akun yang sudah punya transaksi tidak bisa dijadikan Header — kelompokkan lewat kolom <b>Sub dari Header</b> saja.</div>`;
  wrap.innerHTML = html;

  wrap.querySelectorAll('tr[data-id]').forEach(row=>{
    const id = row.dataset.id;
    row.querySelector('.edit-nama').addEventListener('change', e=>{
      const nama = e.target.value.trim();
      if(DB.coa.some(a=> a.id!==id && a.nama.trim().toLowerCase()===nama.toLowerCase())){
        toast('Nama akun ini sudah dipakai akun lain');
        e.target.value = akunById(id).nama;
        return;
      }
      akunById(id).nama = nama; save();
    });
    row.querySelector('.edit-kep').addEventListener('change', e=>{
      const a = akunById(id);
      a.kepemilikan=e.target.value;
      // Kepemilikan ada di atas Header/Sub-header dalam klasifikasi laporan — kalau kepemilikan
      // berubah, hubungan header lama (kepemilikan berbeda) sudah tidak relevan lagi.
      if(a.parentHeaderId){ const h=akunById(a.parentHeaderId); if(h && h.kepemilikan!==a.kepemilikan) a.parentHeaderId=null; }
      save(); renderCoaTable();
    });
    row.querySelector('.edit-ket').addEventListener('change', e=>{ akunById(id).keterangan=e.target.value; save(); });
    row.querySelector('.edit-isheader').addEventListener('change', e=>{
      const a = akunById(id);
      if(e.target.checked){
        if(akunPunyaTransaksi(id)){
          toast('Tidak bisa — akun ini sudah punya transaksi, jadi tidak bisa dijadikan Header. Bisa dijadikan Sub dari Header saja.');
          e.target.checked = false; return;
        }
        a.isHeader = true;
      } else {
        if(DB.coa.some(x=>x.parentHeaderId===id)){
          toast('Tidak bisa — Header ini masih punya sub-akun di bawahnya. Pindahkan/lepaskan sub-akunnya dulu.');
          e.target.checked = true; return;
        }
        a.isHeader = false;
      }
      save(); renderCoaTable();
    });
    row.querySelector('.edit-subdari').addEventListener('change', e=>{
      const a = akunById(id);
      const val = e.target.value || null;
      if(val && isHeaderAncestor(id, val)){ toast('Tidak bisa — akan membuat rangkaian header melingkar'); e.target.value=a.parentHeaderId||''; return; }
      a.parentHeaderId = val; save(); renderCoaTable();
    });
    const btnDelAkun = row.querySelector('.btnDelAkun');
    if(btnDelAkun) btnDelAkun.addEventListener('click', ()=>{
      if(DB.jurnal.some(j=>j.debitId===id||j.kreditId===id)){
        const s = saldoAkun(id);
        return toast('Tidak bisa hapus — akun ini masih ada transaksinya (saldo '+fmtRp(s)+'). Hapus transaksinya dulu sampai saldo Rp0, baru akun bisa dihapus.');
      }
      if(DB.coa.some(x=>x.parentHeaderId===id)){
        return toast('Tidak bisa hapus — Header ini masih punya sub-akun di bawahnya. Pindahkan/lepaskan sub-akunnya dulu.');
      }
      if(!confirm('Hapus akun ini?')) return;
      DB.coa.forEach(x=>{ if(x.parentHeaderId===id) x.parentHeaderId=null; });
      DB.coa = DB.coa.filter(a=>a.id!==id); save(); renderCoaTable();
    });
  });
}

let produkSubtab = 'produk';
let produkSearch = '';
let produkSortState = {col:null, dir:1};
const PRODUK_SORT_KEYS = {
  kode: p=> (p.kode||'').toLowerCase(),
  nama: p=> (p.nama||'').toLowerCase(),
  jenisBahan: p=> (p.jenisBahan||'').toLowerCase(),
  kategori: p=> (p.kategori||'').toLowerCase(),
  satuan: p=> (p.satuan||'').toLowerCase(),
  kepemilikan: p=> (p.kepemilikan||'').toLowerCase(),
  harga: p=> Number(p.hargaBeliPerSatuan||0),
  hargaJual: p=> Number(p.hargaJual||0),
  stok: p=> Number(p.stok||0),
  nilai: p=> Number(p.stok||0)*Number(p.hargaBeliPerSatuan||0)
};
function applyProdukSort(arr){
  const st = produkSortState;
  if(!st.col || !PRODUK_SORT_KEYS[st.col]) return arr;
  const fn = PRODUK_SORT_KEYS[st.col]; const dir = st.dir;
  return [...arr].sort((a,b)=>{
    const va=fn(a), vb=fn(b);
    if(typeof va==='string') return va.localeCompare(vb)*dir;
    return (va-vb)*dir;
  });
}
function produkSortTh(col, label){
  const st = produkSortState;
  const active = st.col===col;
  const arrow = active ? (st.dir===1?' ▲':' ▼') : '';
  return `<th class="produk-sort-th" data-sortcol="${col}" style="cursor:pointer;user-select:none" title="Klik untuk sortir">${label}${arrow}</th>`;
}

function prefixKategoriProduk(k){
  const initials = (k||'X').split(/\s+/).map(w=>w[0]).join('').toUpperCase();
  return initials.slice(0,3) || 'PR';
}

function fileToBase64(file, cb){
  const reader = new FileReader();
  reader.onload = ()=> cb(reader.result);
  reader.readAsDataURL(file);
}
/* Resizes+compresses an uploaded photo before storing it (transactions can accumulate many photos,
   unlike the few product photos, so we keep each one small to avoid bloating local storage). */
function fileToCompressedBase64(file, cb, maxDim=900, quality=0.72){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height;
      if(w>maxDim||h>maxDim){ const r=Math.min(maxDim/w, maxDim/h); w=Math.round(w*r); h=Math.round(h*r); }
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=> cb(reader.result);
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* ---------------- RESEP: cost & time roll-up ---------------- */
function getResepPorsi(r){ return (r.jumlahPorsi && r.jumlahPorsi>0) ? r.jumlahPorsi : 1; }

function getTotalWaktuResep(resepId, visited){
  visited = visited || new Set();
  if(visited.has(resepId)) return 0;
  visited.add(resepId);
  const r = DB.resep.find(x=>x.id===resepId);
  if(!r) return 0;
  let total = (r.steps||[]).reduce((s,st)=> s+(Number(st.waktuMenit)||0), 0);
  (r.bahan||[]).forEach(b=>{ if(b.tipe==='resep') total += getTotalWaktuResep(b.refId, visited); });
  return total;
}

function computeResepTotalHarga(resepId, visited){
  visited = visited || new Set();
  if(visited.has(resepId)) return 0;
  visited.add(resepId);
  const r = DB.resep.find(x=>x.id===resepId);
  if(!r) return 0;
  let total = 0;
  (r.bahan||[]).forEach(b=>{
    if(b.tipe==='produk'){
      const prod = DB.produk.find(x=>x.id===b.refId); if(!prod) return;
      total += (Number(b.qty)||0) * (prod.hargaBeliPerSatuan||0);
    } else if(b.tipe==='resep'){
      const sub = DB.resep.find(x=>x.id===b.refId); if(!sub) return;
      const subTotal = computeResepTotalHarga(b.refId, visited);
      total += (Number(b.qty)||0) * (subTotal / getResepPorsi(sub));
    }
  });
  return total;
}

const RESEP_HEADERS = ['Nama Menu','Jenis Resep','Jumlah Porsi','Tipe Bahan (Produk/Sub-Resep)','Nama Bahan/Sub-Resep','Qty per Porsi','Satuan'];
function resepIoCfg(){

    exportExcel: ()=>({ filename:'resep.xlsx', sheetName:'Resep', headers:RESEP_HEADERS, rows: resepExportRows() })

function importResepRows(rows){
  let created=0, bahanAdded=0; const warnings=[];
  const namaMenuSet = new Set();
  rows.forEach(r=>{ const nm=String(xrow(r,'Nama Menu','Menu')||'').trim(); if(nm) namaMenuSet.add(nm); });
  namaMenuSet.forEach(nm=>{
    let existing = DB.resep.find(x=>x.namaMenu.trim().toLowerCase()===nm.toLowerCase());
    if(!existing){ DB.resep.push({ id:uid(), namaMenu:nm, jenisResep:'', gambar:null, jumlahPorsi:1, bahan:[], steps:[] }); created++; }
  });
  rows.forEach(r=>{
    const nm = String(xrow(r,'Nama Menu','Menu')||'').trim(); if(!nm) return;
    const resep = DB.resep.find(x=>x.namaMenu.trim().toLowerCase()===nm.toLowerCase()); if(!resep) return;
    const jenis = String(xrow(r,'Jenis Resep','Jenis')||'').trim();
    const porsi = Number(xrow(r,'Jumlah Porsi','Porsi'))||0;
    if(jenis){ resep.jenisResep=jenis; ensureJenisResep(jenis); }
    if(porsi>0) resep.jumlahPorsi=porsi;
    const tipeBahan = String(xrow(r,'Tipe Bahan (Produk/Sub-Resep)','Tipe Bahan','Tipe')||'Produk').trim().toLowerCase();
    const namaBahan = String(xrow(r,'Nama Bahan/Sub-Resep','Nama Bahan','Bahan')||'').trim();
    const qty = Number(xrow(r,'Qty per Porsi','Qty'))||0;
    const satuan = String(xrow(r,'Satuan')||'').trim();
    if(!namaBahan || qty<=0) return;
    if(tipeBahan.includes('sub') || tipeBahan.includes('resep')){
      const sub = DB.resep.find(x=>x.id!==resep.id && x.namaMenu.trim().toLowerCase()===namaBahan.toLowerCase());
      if(!sub){ warnings.push('Sub-resep "'+namaBahan+'" untuk menu "'+nm+'" tidak ditemukan'); return; }
      resep.bahan.push({id:uid(), tipe:'resep', refId:sub.id, qty}); bahanAdded++;
    } else {
      let prod = DB.produk.find(x=>x.nama.trim().toLowerCase()===namaBahan.toLowerCase());
      if(!prod){
        const kategori = DB.kategoriProdukCustom[0]||'Bahan Mentah';
        prod = { id:uid(), kode:nextKode(prefixKategoriProduk(kategori)), nama:namaBahan, kategori, satuan: satuan||DB.satuanCustom[0]||'pcs', kepemilikan:'Pribadi', jenisBahan:'', gambar:null, runQty:0, runTotal:0, hargaBeliPerSatuan:0, hargaJual:0, stok:0, hampirHabis:false, lokasi:'' };
        DB.produk.push(prod);
      }
      if(satuan) ensureInList('satuanCustom', satuan);
      resep.bahan.push({id:uid(), tipe:'produk', refId:prod.id, qty, satuan: satuan||prod.satuan}); bahanAdded++;
    }
  });
  save(); renderContent();
  toast('Impor resep: '+created+' resep baru, '+bahanAdded+' baris bahan'+(warnings.length?(', '+warnings.length+' dilewati'):''));
}
function resepExportRows(){
  const rows=[];
  DB.resep.forEach(r=>{
    const porsi=getResepPorsi(r);
    if((r.bahan||[]).length===0){ rows.push([r.namaMenu, r.jenisResep||'', porsi, '', '', '', '']); return; }
    (r.bahan||[]).forEach(b=>{
      if(b.tipe==='resep'){
        const sub=DB.resep.find(x=>x.id===b.refId);
        rows.push([r.namaMenu, r.jenisResep||'', porsi, 'Sub-Resep', sub?sub.namaMenu:'', b.qty, '']);
      } else {
        const prod=DB.produk.find(x=>x.id===b.refId);
        rows.push([r.namaMenu, r.jenisResep||'', porsi, 'Produk', prod?prod.nama:'', b.qty, b.satuan||(prod?prod.satuan:'')]);
      }
    });
  });
  return rows;
}

/* ================= HELPERS: account pickers ================= */
function akunOptions(filterFn){
  return DB.coa.filter(a=>!a.isHeader).filter(filterFn||(()=>true))
    .map(a=>`<option value="${a.id}">${a.nama} — ${a.kepemilikan} (${KAT[a.kategori]})</option>`).join('');
}
function isKasBank(a){ return a.kategori==='AL'; }

/* Searchable account "combo box": type to filter, click a result to select — replaces long <select>
   dropdowns so the user never has to scroll through hundreds of accounts.
   The hidden <input id="${id}"> keeps holding the selected account id, so all existing code that
   reads e.g. jDebit.value / document.getElementById('jDebit').value keeps working unchanged. */
const AKUN_PICKER_FILTERS = {};
const AKUN_PICKER_ONSELECT = {};
function akunPickerHtml(id, filterFn, placeholder, initialValue){
  AKUN_PICKER_FILTERS[id] = filterFn || null;
  const initialAkun = initialValue ? akunById(initialValue) : null;
  return `<div class="akunPicker" style="position:relative">
    <input type="text" id="${id}_q" class="akunPickerInput" placeholder="${placeholder||'Ketik nama akun...'}" autocomplete="off" value="${initialAkun?initialAkun.nama.replace(/"/g,'&quot;'):''}">
    <input type="hidden" id="${id}" value="${initialValue||''}">
    <div class="akunPickerList" id="${id}_list"></div>
  </div>`;
}
function bindAkunPicker(id, onSelect){
  if(onSelect) AKUN_PICKER_ONSELECT[id] = onSelect;
  const q = document.getElementById(id+'_q');
  const hidden = document.getElementById(id);
  const list = document.getElementById(id+'_list');
  if(!q || !hidden || !list) return;
  const filterFn = AKUN_PICKER_FILTERS[id];
  function renderList(term){
    const opts = sortAkunList(DB.coa.filter(a=> !a.isHeader).filter(a=> !filterFn || filterFn(a)).filter(a=> matchSearch(a.nama+' '+a.kode+' '+a.kepemilikan+' '+(a.keterangan||''), term)));
    let itemsHtml = opts.slice(0,50).map(a=>`<div class="akunPickerItem" data-id="${a.id}"><b>${a.nama}</b><span class="mini"> — ${a.kepemilikan} · ${KAT[a.kategori]}${a.keterangan?' · '+a.keterangan:''}</span></div>`).join('');
    if(!itemsHtml) itemsHtml = '<div class="akunPickerItem mini">Tidak ditemukan, coba kata kunci lain</div>';
    const exactMatch = term && DB.coa.some(a=> a.nama.toLowerCase()===term.trim().toLowerCase());
    if(term && term.trim() && !exactMatch){
      itemsHtml += `<div class="akunPickerItem akunPickerAddNew" data-newname="${term.trim().replace(/"/g,'&quot;')}" style="color:var(--terracotta-dark);font-weight:700">+ Tambah akun baru: "${term.trim()}"</div>`;
    }
    list.innerHTML = itemsHtml;
    list.style.display = 'block';
  }
  q.addEventListener('focus', ()=> renderList(q.value));
  q.addEventListener('input', ()=>{ hidden.value=''; renderList(q.value); });
  q.addEventListener('blur', ()=> setTimeout(()=>{ list.style.display='none'; }, 180));
  list.addEventListener('mousedown', e=>{
    const addItem = e.target.closest('.akunPickerAddNew');
    if(addItem){
      const namaBaru = addItem.dataset.newname;
      const katList = KATEGORI_ORDER.map((k,i)=>`${i+1}. ${KAT[k]}`).join('\n');
      const katIdx = prompt('Kategori neraca untuk akun "'+namaBaru+'":\n'+katList); if(!katIdx) return;
      const kategori = KATEGORI_ORDER[Number(katIdx)-1]; if(!kategori) return toast('Nomor tidak valid');
      const kepList = getAllKepemilikan().map((k,i)=>`${i+1}. ${k}`).join('\n');
      const kepIdx = prompt('Kepemilikan:\n'+kepList, '1'); if(!kepIdx) return;
      const kepemilikan = getAllKepemilikan()[Number(kepIdx)-1]; if(!kepemilikan) return toast('Nomor tidak valid');
      if(DB.coa.some(a=> a.nama.toLowerCase()===namaBaru.toLowerCase())) return toast('Nama akun ini sudah ada, pilih dari daftar');
      const akun = addAkun(kategori, namaBaru, kepemilikan, '');
      save();
      hidden.value = akun.id; q.value = akun.nama; list.style.display='none';
      if(AKUN_PICKER_ONSELECT[id]) AKUN_PICKER_ONSELECT[id](akun.id);
      toast('Akun baru dibuat: '+akun.nama);
      return;
    }
    const item = e.target.closest('.akunPickerItem'); if(!item || !item.dataset.id) return;
    const akun = akunById(item.dataset.id);
    hidden.value = akun.id;
    q.value = akun.nama;
    list.style.display = 'none';
    if(AKUN_PICKER_ONSELECT[id]) AKUN_PICKER_ONSELECT[id](akun.id);
  });
}
/* Call once after rendering a form containing one or more akunPickerHtml() fields. */
function bindAllAkunPickers(container){
  container.querySelectorAll('.akunPicker').forEach(wrap=>{
    const hidden = wrap.querySelector('input[type=hidden]');
    if(hidden) bindAkunPicker(hidden.id);
  });
}
/* Programmatically set an akunPickerHtml() field's value (used by the "Duplikat" transaction feature). */
function setAkunPickerValue(id, akunId){
  const hidden = document.getElementById(id);
  const q = document.getElementById(id+'_q');
  if(!hidden) return;
  hidden.value = akunId || '';
  if(q) q.value = akunId ? (akunById(akunId)?.nama || '') : '';
}

/* ================= GENERIC ITEM PICKER (typeable + searchable) =================
   Same look/feel as the akun picker above, but for picking a produk/barang item by name
   (used by Pembelian's "Nama Bahan/Barang" field, which previously was a plain <select>
   that couldn't be typed into or searched). listFn() must return an up-to-date array of
   {id, nama, satuan} — passed as a function (not a plain array) so it always reflects the
   latest DB.produk/DB.barang, including items added via "+ Bahan/Barang baru cepat". */
const ITEM_PICKER_LISTFN = {};
const ITEM_PICKER_ONSELECT = {};
function itemPickerHtml(id, listFn, placeholder, initialValue){
  ITEM_PICKER_LISTFN[id] = listFn;
  const list = listFn();
  const initialItem = initialValue ? list.find(x=>x.id===initialValue) : null;
  return `<div class="itemPicker" style="position:relative">
    <input type="text" id="${id}_q" class="akunPickerInput itemPickerInput" placeholder="${placeholder||'Ketik nama...'}" autocomplete="off" value="${initialItem?initialItem.nama.replace(/"/g,'&quot;'):''}">
    <input type="hidden" id="${id}" value="${initialValue||''}">
    <div class="akunPickerList itemPickerList" id="${id}_list"></div>
  </div>`;
}
function bindItemPicker(id, listFn, onSelect){
  if(listFn) ITEM_PICKER_LISTFN[id] = listFn;
  if(onSelect) ITEM_PICKER_ONSELECT[id] = onSelect;
  const q = document.getElementById(id+'_q');
  const hidden = document.getElementById(id);
  const list = document.getElementById(id+'_list');
  if(!q || !hidden || !list) return;
  function renderList(term){
    const items = (ITEM_PICKER_LISTFN[id]||(()=>[]))();
    const opts = items.filter(it=> matchSearch(it.nama+' '+(it.satuan||''), term));
    let itemsHtml = opts.slice(0,50).map(it=>`<div class="akunPickerItem itemPickerItem" data-id="${it.id}"><b>${it.nama}</b>${it.satuan?`<span class="mini"> — ${it.satuan}</span>`:''}</div>`).join('');
    if(!itemsHtml) itemsHtml = '<div class="akunPickerItem mini">Tidak ditemukan, coba kata kunci lain</div>';
    list.innerHTML = itemsHtml;
    list.style.display = 'block';
  }
  q.addEventListener('focus', ()=> renderList(q.value));
  q.addEventListener('input', ()=>{ hidden.value=''; renderList(q.value); });
  q.addEventListener('blur', ()=> setTimeout(()=>{ list.style.display='none'; }, 180));
  list.addEventListener('mousedown', e=>{
    const item = e.target.closest('.itemPickerItem'); if(!item || !item.dataset.id) return;
    const items = (ITEM_PICKER_LISTFN[id]||(()=>[]))();
    const it = items.find(x=>x.id===item.dataset.id); if(!it) return;
    hidden.value = it.id; q.value = it.nama; list.style.display = 'none';
    if(ITEM_PICKER_ONSELECT[id]) ITEM_PICKER_ONSELECT[id](it.id);
  });
}
/* Call once after rendering a form containing one or more itemPickerHtml() fields. listFnById maps id -> listFn. */
function bindAllItemPickers(container, listFnById){
  container.querySelectorAll('.itemPicker').forEach(wrap=>{
    const hidden = wrap.querySelector('input[type=hidden]');
    if(hidden) bindItemPicker(hidden.id, listFnById ? listFnById[hidden.id] : null);
  });
}
/* Programmatically set an itemPickerHtml() field's value (used by "Duplikat"/edit forms). */
function setItemPickerValue(id, itemId){
  const hidden = document.getElementById(id);
  const q = document.getElementById(id+'_q');
  if(!hidden) return;
  hidden.value = itemId || '';
  if(q){
    const items = (ITEM_PICKER_LISTFN[id]||(()=>[]))();
    const it = itemId ? items.find(x=>x.id===itemId) : null;
    q.value = it ? it.nama : '';
  }
}

/* ================= GENERIC LIST/VALUE PICKER (typeable + searchable, plain string values) =================
   Same look/feel as akunPickerHtml, but for picking a plain string value from a custom master list
   (e.g. Kategori Barang: Peralatan/Perlengkapan/dll) instead of an id-referenced record. Unlike the akun/item
   pickers there's no separate hidden id — the visible input itself holds the value, since the value IS the string.
   valuesFn() must return an up-to-date array of strings (pass as a function, not a plain array, so it reflects
   the latest DB list including values added via the picker's own "+ Tambah" option). */
const LIST_PICKER_VALUESFN = {};
const LIST_PICKER_ONSELECT = {};
const LIST_PICKER_ONADDNEW = {};
function listPickerHtml(id, valuesFn, placeholder, initialValue){
  LIST_PICKER_VALUESFN[id] = valuesFn;
  return `<div class="itemPicker" style="position:relative">
    <input type="text" id="${id}" class="akunPickerInput itemPickerInput" placeholder="${placeholder||'Ketik...'}" autocomplete="off" value="${(initialValue||'').replace(/"/g,'&quot;')}">
    <div class="akunPickerList itemPickerList" id="${id}_list"></div>
  </div>`;
}
/* onSelect(value) fires when a suggestion (existing or newly added) is clicked — not on every keystroke,
   mirroring the akun/item pickers so callers can react (e.g. auto-fill a related field) only on an actual pick.
   onAddNew(value) fires just before onSelect when the picked value doesn't exist yet in valuesFn(), so the
   caller can persist it into the backing DB list (e.g. ensureInList('kategoriBarangCustom', value)). */
function bindListPicker(id, valuesFn, onSelect, onAddNew){
  if(valuesFn) LIST_PICKER_VALUESFN[id] = valuesFn;
  if(onSelect) LIST_PICKER_ONSELECT[id] = onSelect;
  if(onAddNew) LIST_PICKER_ONADDNEW[id] = onAddNew;
  const q = document.getElementById(id);
  const list = document.getElementById(id+'_list');
  if(!q || !list) return;
  function renderList(term){
    const values = (LIST_PICKER_VALUESFN[id]||(()=>[]))();
    const opts = values.filter(v=> matchSearch(v, term));
    let itemsHtml = opts.slice(0,50).map(v=>`<div class="akunPickerItem itemPickerItem" data-val="${v.replace(/"/g,'&quot;')}">${v}</div>`).join('');
    if(!itemsHtml) itemsHtml = '<div class="akunPickerItem mini">Tidak ditemukan, coba kata kunci lain</div>';
    const exactMatch = term && values.some(v=> v.toLowerCase()===term.trim().toLowerCase());
    if(term && term.trim() && !exactMatch){
      itemsHtml += `<div class="akunPickerItem akunPickerAddNew" data-newval="${term.trim().replace(/"/g,'&quot;')}" style="color:var(--terracotta-dark);font-weight:700">+ Tambah "${term.trim()}"</div>`;
    }
    list.innerHTML = itemsHtml;
    list.style.display = 'block';
  }
  q.addEventListener('focus', ()=> renderList(q.value));
  q.addEventListener('input', ()=> renderList(q.value));
  q.addEventListener('blur', ()=> setTimeout(()=>{ list.style.display='none'; }, 180));
  list.addEventListener('mousedown', e=>{
    const addItem = e.target.closest('.akunPickerAddNew');
    if(addItem){
      const val = addItem.dataset.newval;
      q.value = val; list.style.display='none';
      if(LIST_PICKER_ONADDNEW[id]) LIST_PICKER_ONADDNEW[id](val);
      if(LIST_PICKER_ONSELECT[id]) LIST_PICKER_ONSELECT[id](val);
      return;
    }
    const item = e.target.closest('.itemPickerItem'); if(!item) return;
    q.value = item.dataset.val;
    list.style.display = 'none';
    if(LIST_PICKER_ONSELECT[id]) LIST_PICKER_ONSELECT[id](item.dataset.val);
  });
}
/* Programmatically set a listPickerHtml() field's value (used to auto-fill Kategori from an existing item). */
function setListPickerValue(id, value){
  const q = document.getElementById(id);
  if(q) q.value = value || '';
}

/* ================= JURNAL UMUM ================= */
let jurnalSearch = '';
/* Jurnal Umum now supports unlimited debit/kredit rows (compound entries), not just one pair.
   jurnalRows holds the working set of rows for the "Tambah Jurnal" form; state lives outside the
   renderer so it survives adding/removing rows (which only re-render the rows block, not the whole tab). */
let jurnalRows = [
  {rid:uid(), tipe:'debit', akunId:'', nominal:''},
  {rid:uid(), tipe:'kredit', akunId:'', nominal:''}
];
function jurnalRowsTotals(){
  let totalDebit=0, totalKredit=0;
  jurnalRows.forEach(r=>{ const n=Number(r.nominal)||0; if(r.tipe==='debit') totalDebit+=n; else totalKredit+=n; });
  return {totalDebit, totalKredit};
}
function syncJurnalRowsFromDom(){
  jurnalRows.forEach(r=>{
    const tipeSel = document.getElementById('jRowTipe_'+r.rid);
    const akunHidden = document.getElementById('jRowAkun_'+r.rid);
    const nomInput = document.getElementById('jRowNom_'+r.rid);
    if(tipeSel) r.tipe = tipeSel.value;
    if(akunHidden) r.akunId = akunHidden.value;
    if(nomInput) r.nominal = nomInput.value;
  });
}
function renderJurnalRowsHtml(){
  const {totalDebit, totalKredit} = jurnalRowsTotals();
  const selisih = totalDebit - totalKredit;
  const rowsHtml = jurnalRows.map(r=>`
    <div class="jrow" data-rid="${r.rid}" style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
      <select id="jRowTipe_${r.rid}" class="jRowTipe" style="width:66px;flex:none;padding:9px 4px;font-size:12.5px">
        <option value="debit" ${r.tipe==='debit'?'selected':''}>Debit</option>
        <option value="kredit" ${r.tipe==='kredit'?'selected':''}>Kredit</option>
      </select>
      <div style="flex:1;min-width:0">${akunPickerHtml('jRowAkun_'+r.rid, null, 'Ketik nama akun...', r.akunId)}</div>
      <input type="number" id="jRowNom_${r.rid}" class="jRowNom" placeholder="Nominal" value="${r.nominal||''}" style="width:92px;flex:none;text-align:right">
      <button type="button" class="btn small danger btnDelJRow" data-rid="${r.rid}" style="flex:none">−</button>
    </div>`).join('');
  return `<div id="jurnalRowsWrap">
    ${rowsHtml}
    <button type="button" class="btn small" id="btnAddJRow">+ Tambah Baris</button>
    <div class="mini" id="jurnalTotalsMini" style="margin-top:8px">Total Debit: <b>${fmtRp(totalDebit)}</b> · Total Kredit: <b>${fmtRp(totalKredit)}</b> · Selisih: <b style="color:${selisih===0?'var(--debit)':'var(--kredit)'}">${fmtRp(selisih)}</b></div>
  </div>`;
}
function bindJurnalRows(){
  const wrap = document.getElementById('jurnalRowsWrap'); if(!wrap) return;
  bindAllAkunPickers(wrap);
  wrap.querySelectorAll('.jRowTipe, .jRowNom').forEach(el=> el.addEventListener('input', ()=>{
    syncJurnalRowsFromDom();
    const {totalDebit, totalKredit} = jurnalRowsTotals();
    const selisih = totalDebit-totalKredit;
    const mini = document.getElementById('jurnalTotalsMini');
    if(mini) mini.innerHTML = `Total Debit: <b>${fmtRp(totalDebit)}</b> · Total Kredit: <b>${fmtRp(totalKredit)}</b> · Selisih: <b style="color:${selisih===0?'var(--debit)':'var(--kredit)'}">${fmtRp(selisih)}</b>`;
  }));
  wrap.querySelectorAll('.btnDelJRow').forEach(btn=> btn.addEventListener('click', ()=>{
    syncJurnalRowsFromDom();
    if(jurnalRows.length<=2) return toast('Minimal 2 baris (1 debit, 1 kredit)');
    jurnalRows = jurnalRows.filter(r=>r.rid!==btn.dataset.rid);
    rerenderJurnalRows();
  }));
  const addBtn = document.getElementById('btnAddJRow');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    syncJurnalRowsFromDom();
    jurnalRows.push({rid:uid(), tipe:'debit', akunId:'', nominal:''});
    rerenderJurnalRows();
  });
}
function rerenderJurnalRows(){
  const wrap = document.getElementById('jurnalRowsWrap'); if(!wrap) return;
  wrap.outerHTML = renderJurnalRowsHtml();
  bindJurnalRows();
}
const JURNAL_HEADERS = ['Tanggal (DD/MM/YY)','Keterangan','Akun Debit','Akun Kredit','Nominal','Sumber','Tag (pisahkan koma)'];
function jurnalIoCfg(){
  return {
    template:{ filename:'template-jurnal.xlsx', sheetName:'Jurnal', headers:JURNAL_HEADERS,
      exampleRows:[[fmtTgl(todayStr()),'Contoh: Bayar listrik','Beban Operasional','Kas',150000,'Jurnal Umum','operasional'] ]},
    onImport: importJurnalRows,
    exportExcel: ()=>({ filename:'jurnal.xlsx', sheetName:'Jurnal', headers:['Tanggal','Keterangan','Akun Debit','Akun Kredit','Nominal','Sumber','Tag'],
      rows: [...DB.jurnal].reverse().map(j=>[fmtTgl(j.tanggal),j.keterangan||'',akunById(j.debitId)?.nama||'',akunById(j.kreditId)?.nama||'',j.nominal,j.sumber||'',(j.tags||[]).join(', ')]) }),
    exportPdf: ()=>({ filename:'jurnal.pdf', title:'Riwayat Jurnal', headers:['Tanggal','Keterangan','Debit','Kredit','Nominal','Sumber'],
      rows: [...DB.jurnal].reverse().map(j=>[fmtTgl(j.tanggal),j.keterangan||'',akunById(j.debitId)?.nama||'',akunById(j.kreditId)?.nama||'',fmtRp(j.nominal),j.sumber||'']) })
  };
}
function importJurnalRows(rows){
  let ok=0; const warnings=[];
  rows.forEach((r,i)=>{
    const tanggal = parseTglInput(String(xrow(r,'Tanggal (DD/MM/YY)','Tanggal (YYYY-MM-DD)','Tanggal')||'').trim()) || todayStr();
    const keterangan = String(xrow(r,'Keterangan')||'').trim();
    const debitNama = String(xrow(r,'Akun Debit')||'').trim();
    const kreditNama = String(xrow(r,'Akun Kredit')||'').trim();
    const nominal = Number(xrow(r,'Nominal'))||0;
    const sumber = String(xrow(r,'Sumber')||'').trim()||'Jurnal Umum';
    const tagStr = String(xrow(r,'Tag (pisahkan koma)','Tag')||'').trim();
    if(!debitNama||!kreditNama||nominal<=0){ warnings.push('Baris '+(i+2)+': data tidak lengkap, dilewati'); return; }
    const debitAkun = DB.coa.find(a=>a.nama.trim().toLowerCase()===debitNama.toLowerCase());
    const kreditAkun = DB.coa.find(a=>a.nama.trim().toLowerCase()===kreditNama.toLowerCase());
    if(!debitAkun||!kreditAkun){ warnings.push('Baris '+(i+2)+': akun "'+(!debitAkun?debitNama:kreditNama)+'" tidak ditemukan'); return; }
    const tags = parseTagInput(tagStr); tags.forEach(ensureTag);
    postJurnal({ tanggal, keterangan, debitId:debitAkun.id, kreditId:kreditAkun.id, nominal, sumber, ref:'import-'+uid(), tags });
    ok++;
  });
  save(); renderContent();
  toast('Impor jurnal: '+ok+' baris berhasil'+(warnings.length?(', '+warnings.length+' dilewati'):''));
  if(warnings.length) console.warn(warnings.join('\n'));
}

/* ================= BIAYA (dengan amortisasi) =================
   Amortisasi kini mendukung 2 jenis periode: 'bulan' (bulanan, seperti sebelumnya) atau
   'hari' (harian). Untuk data lama (sebelum fitur ini), periodeAmor dianggap 'bulan' dan
   jumlahPeriode/periodeTerposting diambil dari jumlahBulan/bulanTerposting.
   Postingan amortisasi kini OTOMATIS setiap hari lewat jalankanAutoAmortisasi() — dipanggil
   saat aplikasi dibuka & saat tab Biaya dibuka, jadi tidak perlu lagi klik manual tiap hari/bulan. */
let biayaSearch = '';
function biayaJumlahPeriode(b){ return b.jumlahPeriode!=null ? b.jumlahPeriode : (b.jumlahBulan||1); }
function biayaPeriodeTerposting(b){ return b.periodeTerposting!=null ? b.periodeTerposting : (b.bulanTerposting||0); }
function biayaPeriodeAmor(b){ return b.periodeAmor || 'bulan'; }
function tambahPeriodeKeTanggal(tanggalStr, periodeAmor, n){
  const d = new Date(tanggalStr+'T00:00:00');
  if(periodeAmor==='hari') d.setDate(d.getDate()+n); else d.setMonth(d.getMonth()+n);
  return d;
}
function tanggalDariDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* Jalankan sekali saat app load & saat tab Biaya dibuka: cek semua biaya beramortisasi,
   dan otomatis posting setiap periode (harian/bulanan) yang jatuh tempo sampai hari ini,
   tanpa perlu tombol manual. Mengembalikan true jika ada yang diposting (perlu save()). */
function jalankanAutoAmortisasi(){
  const today = new Date(todayStr()+'T00:00:00');
  let adaPosting = false;
  (DB.biaya||[]).forEach(b=>{
    if(!b.amortisasi || !b.prepaidId) return;
    const periodeAmor = biayaPeriodeAmor(b);
    const jumlahPeriode = biayaJumlahPeriode(b);
    let terposting = biayaPeriodeTerposting(b);
    const perPeriode = Math.round(b.nominal/jumlahPeriode);
    while(terposting < jumlahPeriode){
      const jatuhTempo = tambahPeriodeKeTanggal(b.tanggal, periodeAmor, terposting+1);
      if(jatuhTempo > today) break;
      const isTerakhir = (terposting+1)===jumlahPeriode;
      const nominalPosting = isTerakhir ? (b.nominal - perPeriode*(jumlahPeriode-1)) : perPeriode;
      postJurnal({ tanggal:tanggalDariDate(jatuhTempo), keterangan:'Amortisasi '+(periodeAmor==='hari'?'harian':'bulanan')+' ke-'+(terposting+1)+': '+(b.keterangan||akunById(b.bebanId).nama), debitId:b.bebanId, kreditId:b.prepaidId, nominal:nominalPosting, sumber:'Biaya', ref:'biaya-amor-'+b.id+'-'+(terposting+1) });
      terposting++;
      b.periodeTerposting = terposting; b.bulanTerposting = terposting; // simpan keduanya untuk kompatibilitas
      adaPosting = true;
    }
  });
  return adaPosting;
}
const BIAYA_HEADERS = ['Tanggal (DD/MM/YY)','Dibayar Melalui (Nama Akun)','Nama Beban (Nama Akun)','Nominal','Keterangan','Amortisasi (Ya/Tidak)','Tipe Periode (Bulanan/Harian)','Jumlah Periode','Tag (pisahkan koma)'];

      exampleRows:[[fmtTgl(todayStr()),'Kas','Beban Sewa','12000000','Sewa ruko setahun','Ya','Bulanan',12,'sewa'],[fmtTgl(todayStr()),'Kas','Beban Listrik','450000','Listrik bulan ini','Tidak','','','operasional']] },
    onImport: importBiayaRows,

      rows: [...DB.biaya].reverse().map(b=>[fmtTgl(b.tanggal), akunById(b.bayarId)?.nama||'', akunById(b.bebanId)?.nama||'', b.nominal, b.keterangan||'', b.amortisasi?'Ya':'Tidak', b.amortisasi?(biayaPeriodeAmor(b)==='hari'?'Harian':'Bulanan'):'', b.amortisasi?biayaJumlahPeriode(b):'', b.amortisasi?biayaPeriodeTerposting(b):'', (b.tags||[]).join(', ')]) })
  };
}
function importBiayaRows(rows){
  let ok=0; const warnings=[];
  rows.forEach((r,i)=>{
    const tanggal = parseTglInput(String(xrow(r,'Tanggal (DD/MM/YY)','Tanggal (YYYY-MM-DD)','Tanggal')||'').trim()) || todayStr();
    const bayarNama = String(xrow(r,'Dibayar Melalui (Nama Akun)','Dibayar Melalui','Dikreditkan Melalui')||'').trim();
    const bebanNama = String(xrow(r,'Nama Beban (Nama Akun)','Nama Beban','Beban')||'').trim();
    const nominal = Number(xrow(r,'Nominal'))||0;
    const keterangan = String(xrow(r,'Keterangan')||'').trim();
    const amorStr = String(xrow(r,'Amortisasi (Ya/Tidak)','Amortisasi')||'').trim().toLowerCase();
    const amortisasi = amorStr==='ya'||amorStr==='yes'||amorStr==='true';
    const tipePeriodeStr = String(xrow(r,'Tipe Periode (Bulanan/Harian)','Tipe Periode')||'').trim().toLowerCase();
    const periodeAmor = tipePeriodeStr.startsWith('hari') ? 'hari' : 'bulan';
    const jumlahPeriode = Number(xrow(r,'Jumlah Periode'))||12;
    const tagStr = String(xrow(r,'Tag (pisahkan koma)','Tag')||'').trim();
    if(!bayarNama||!bebanNama||nominal<=0){ warnings.push('Baris '+(i+2)+': data tidak lengkap, dilewati'); return; }
    const bayarAkun = DB.coa.find(a=>a.nama.trim().toLowerCase()===bayarNama.toLowerCase());
    const bebanAkun = DB.coa.find(a=>a.nama.trim().toLowerCase()===bebanNama.toLowerCase());
    if(!bayarAkun||!bebanAkun){ warnings.push('Baris '+(i+2)+': akun "'+(!bayarAkun?bayarNama:bebanNama)+'" tidak ditemukan'); return; }
    const tags = parseTagInput(tagStr); tags.forEach(ensureTag);
    const biayaObj = { id:uid(), tanggal, bayarId:bayarAkun.id, bebanId:bebanAkun.id, keterangan, nominal, amortisasi, periodeAmor: amortisasi?periodeAmor:'bulan', jumlahPeriode: amortisasi?jumlahPeriode:1, periodeTerposting:0, bulanTerposting:0, tags, bukti:null };
    DB.biaya.push(biayaObj);
    if(amortisasi){
      const prepaid = DB.coa.find(a=>a.kategori==='ALL' && a.kepemilikan===bayarAkun.kepemilikan) || DB.coa.find(a=>a.kategori==='ALL');
      postJurnal({ tanggal, keterangan:'Bayar dimuka: '+(keterangan||bebanAkun.nama), debitId:prepaid.id, kreditId:bayarAkun.id, nominal, sumber:'Biaya', ref:'biaya-bayar-'+biayaObj.id, tags });
      biayaObj.prepaidId = prepaid.id;
    } else {
      postJurnal({ tanggal, keterangan:keterangan||bebanAkun.nama, debitId:bebanAkun.id, kreditId:bayarAkun.id, nominal, sumber:'Biaya', ref:'biaya-'+biayaObj.id, tags });
    }
    ok++;
  });
  jalankanAutoAmortisasi();
  save(); renderContent();
  toast('Impor biaya: '+ok+' baris berhasil'+(warnings.length?(', '+warnings.length+' dilewati'):''));
  if(warnings.length) console.warn(warnings.join('\n'));
}

/* Removes a Biaya entry along with every jurnal posting it generated: the plain 'biaya-<id>' entry
   for non-amortized costs, the initial 'biaya-bayar-<id>' prepaid entry, and every daily/monthly
   'biaya-amor-<id>-N' amortization posting. */
function deleteBiayaEntry(id){
  DB.biaya = DB.biaya.filter(b=>b.id!==id);
  DB.jurnal.filter(j=> !!(j.ref==='biaya-'+id || j.ref==='biaya-bayar-'+id || (j.ref||'').startsWith('biaya-amor-'+id+'-'))).forEach(j=> catatRiwayat('hapus', j));
  DB.jurnal = DB.jurnal.filter(j=> !(j.ref==='biaya-'+id || j.ref==='biaya-bayar-'+id || (j.ref||'').startsWith('biaya-amor-'+id+'-')));
}

  const wrap = document.getElementById('biayaTableWrap'); if(!wrap) return;
  const titleEl = document.getElementById('biayaCountTitle'); if(titleEl) titleEl.textContent = 'Riwayat Biaya ('+DB.biaya.length+')';
  const rows = [...DB.biaya].filter(b=> matchSearch((akunById(b.bebanId)?.nama||'')+' '+(b.keterangan||''), biayaSearch)).reverse();

  wrap.innerHTML = `${bulkBarHtml('biaya', visibleIds)}<div class="tablewrap"><table class="sheet"><thead><tr>${bulkCheckboxTh('biaya')}<th>Tanggal</th><th>Dibayar melalui</th><th>Beban</th><th>Keterangan</th><th>Nominal</th><th>Tag</th><th>Amortisasi</th><th>Bukti</th><th></th></tr></thead><tbody>

    setAkunPickerValue('bBayar', b.bayarId); setAkunPickerValue('bBeban', b.bebanId);
    bAmor.checked = !!b.amortisasi;
    document.getElementById('bPeriodeWrap').style.display = b.amortisasi?'grid':'none';
    if(b.amortisasi){ document.getElementById('bPeriodeTipe').value = biayaPeriodeAmor(b); bBulan.value = biayaJumlahPeriode(b); }

    window.scrollTo({top:0, behavior:'smooth'});

  }));

let pembelianSearch = '';
let pembelianTipe = 'bahan'; // 'bahan' (Persediaan Bahan / DB.produk) | 'barang' (Persediaan Barang / DB.barang)

/* Returns the referenced item (produk or barang) for a pembelian row, regardless of tipe.
   Older records (saved before this feature) don't have `tipe` — treat them as 'bahan'. */
function pembelianRefItem(p){
  const tipe = p.tipe || 'bahan';
  return tipe==='barang' ? DB.barang.find(x=>x.id===p.refId) : DB.produk.find(x=>x.id===(p.refId||p.produkId));
}
function pembelianSatuanLabel(p){ const it = pembelianRefItem(p); return it? it.satuan : ''; }

const PEMBELIAN_HEADERS = ['Tanggal (DD/MM/YY)','Jenis (Bahan/Barang)','Nama Bahan/Barang','Satuan (jika item baru)','Dikreditkan Melalui (Nama Akun)','Qty','Total Harga (Rp)','Tanggal Kadaluwarsa (khusus Bahan, opsional)','Keterangan','Tag (pisahkan koma)','Kategori Persediaan (khusus Barang: Peralatan/Perlengkapan, opsional)','Beban Operasional (Nama Akun, khusus Barang, opsional)'];
function pembelianIoCfg(){
  return {
    template:{ filename:'template-pembelian.xlsx', sheetName:'Pembelian', headers:PEMBELIAN_HEADERS,
      exampleRows:[[fmtTgl(todayStr()),'Bahan','Beras','kg','Kas',10,150000,'','Beli di Pasar Sentral','dapur','',''],[fmtTgl(todayStr()),'Barang','Tisu','pak','Kas',5,50000,'','Beli di Toko Sentosa','kebersihan','Perlengkapan','Beban Perlengkapan Rumah']] },
    onImport: importPembelianRows,
    exportExcel: ()=>({ filename:'pembelian.xlsx', sheetName:'Pembelian', headers:['Tanggal','Dibayar Melalui','Jenis','Barang/Bahan','Qty','Total Harga','Harga/satuan','Tanggal Kadaluwarsa','Keterangan','Tag','Kategori Persediaan','Beban Operasional'],
      rows: [...DB.pembelian].reverse().map(p=>{ const item=pembelianRefItem(p); const tipe=p.tipe||'bahan'; const isB=tipe==='barang'; return [fmtTgl(p.tanggal), akunById(p.bayarId)?.nama||'', isB?'Barang':'Bahan', item?item.nama:'', p.qty, p.total, p.qty?Math.round(p.total/p.qty):0, p.kadaluwarsa?fmtTgl(p.kadaluwarsa):'', p.keterangan||'', (p.tags||[]).join(', '), isB?(item?.kategori||'Peralatan'):'', isB?(akunById(item?.akunBebanId)?.nama||''):'']; }) }),
    exportPdf: ()=>({ filename:'pembelian.pdf', title:'Riwayat Pembelian', headers:['Tanggal','Akun','Jenis','Item','Qty','Total'],
      rows: [...DB.pembelian].reverse().map(p=>{ const item=pembelianRefItem(p); const tipe=p.tipe||'bahan'; return [fmtTgl(p.tanggal), akunById(p.bayarId)?.nama||'', tipe==='barang'?'Barang':'Bahan', item?item.nama:'', fmtNum(p.qty), fmtRp(p.total)]; }) })
  };
}
function importPembelianRows(rows){
  let ok=0; const warnings=[];
  rows.forEach((r,i)=>{
    const tanggal = parseTglInput(String(xrow(r,'Tanggal (DD/MM/YY)','Tanggal (YYYY-MM-DD)','Tanggal')||'').trim())||todayStr();
    const jenisRaw = String(xrow(r,'Jenis (Bahan/Barang)','Jenis')||'Bahan').trim().toLowerCase();
    const isBarang = jenisRaw.includes('barang');
    const namaItem = String(xrow(r,'Nama Bahan/Barang','Nama')||'').trim();
    const satuanBaru = String(xrow(r,'Satuan (jika item baru)','Satuan')||'').trim();
    const akunNama = String(xrow(r,'Dikreditkan Melalui (Nama Akun)','Dikreditkan Melalui','Akun')||'').trim();
    const qty = Number(xrow(r,'Qty'))||0;
    const total = Number(xrow(r,'Total Harga (Rp)','Total Harga','Total'))||0;
    const kadaluwarsaRaw = String(xrow(r,'Tanggal Kadaluwarsa (khusus Bahan, opsional)','Tanggal Kadaluwarsa','Kadaluwarsa')||'').trim();
    const kadaluwarsa = (!isBarang && kadaluwarsaRaw) ? (parseTglInput(kadaluwarsaRaw)||null) : null;
    const keterangan = String(xrow(r,'Keterangan')||'').trim();
    const tagStr = String(xrow(r,'Tag (pisahkan koma)','Tag')||'').trim();
    const kategoriBarangRaw = String(xrow(r,'Kategori Persediaan (khusus Barang: Peralatan/Perlengkapan, opsional)','Kategori Persediaan','Kategori')||'').trim();
    const bebanOpNama = String(xrow(r,'Beban Operasional (Nama Akun, khusus Barang, opsional)','Beban Operasional','Akun Beban')||'').trim();
    if(!namaItem||!akunNama||qty<=0||total<=0){ warnings.push('Baris '+(i+2)+': data tidak lengkap, dilewati'); return; }
    const bayarAkun = DB.coa.find(a=>a.nama.trim().toLowerCase()===akunNama.toLowerCase());
    if(!bayarAkun){ warnings.push('Baris '+(i+2)+': akun "'+akunNama+'" tidak ditemukan'); return; }
    let bebanAkun = null;
    if(isBarang && bebanOpNama){
      bebanAkun = DB.coa.find(a=>a.nama.trim().toLowerCase()===bebanOpNama.toLowerCase());
      if(!bebanAkun) warnings.push('Baris '+(i+2)+': akun beban operasional "'+bebanOpNama+'" tidak ditemukan, dilewati untuk baris ini');
    }
    let item, itemNama, kepemilikan, refId;
    if(isBarang){
      item = DB.barang.find(x=>x.nama.trim().toLowerCase()===namaItem.toLowerCase());
      if(!item){ item = { id:uid(), nama:namaItem, satuan: satuanBaru||DB.satuanCustom[0]||'pcs', stok:0, lokasi:'', kategori:kategoriBarangRaw, kepemilikan:'Pribadi', hampirHabis:false, tags:[], runQty:0, runTotal:0, hargaBeliPerSatuan:0, akunBebanId:bebanAkun?bebanAkun.id:'' }; DB.barang.push(item); }
      item.runQty=(item.runQty||0)+qty; item.runTotal=(item.runTotal||0)+total; item.hargaBeliPerSatuan=item.runQty>0?(item.runTotal/item.runQty):0; item.stok=(item.stok||0)+qty;
      if(kategoriBarangRaw){ item.kategori = kategoriBarangRaw; ensureInList('kategoriBarangCustom', kategoriBarangRaw); }
      if(bebanAkun) item.akunBebanId = bebanAkun.id;
      itemNama=item.nama; kepemilikan=item.kepemilikan||'Pribadi'; refId=item.id;
    } else {
      item = DB.produk.find(x=>x.nama.trim().toLowerCase()===namaItem.toLowerCase());
      if(!item){ const kategori=DB.kategoriProdukCustom[0]||'Bahan Mentah'; item = { id:uid(), kode:nextKode(prefixKategoriProduk(kategori)), nama:namaItem, kategori, satuan: satuanBaru||DB.satuanCustom[0]||'pcs', kepemilikan:'Pribadi', jenisBahan:'', gambar:null, runQty:0, runTotal:0, hargaBeliPerSatuan:0, hargaJual:0, stok:0, hampirHabis:false, lokasi:'' }; DB.produk.push(item); }
      item.runQty=(item.runQty||0)+qty; item.runTotal=(item.runTotal||0)+total; item.hargaBeliPerSatuan=item.runQty>0?(item.runTotal/item.runQty):0; item.stok=(item.stok||0)+qty;
      itemNama=item.nama; kepemilikan=item.kepemilikan; refId=item.id;
    }
    const tags = parseTagInput(tagStr); tags.forEach(ensureTag);
    const pObj = { id:uid(), tanggal, bayarId:bayarAkun.id, tipe: isBarang?'barang':'bahan', refId, produkId: isBarang?null:refId, qty, total, keterangan, tags, bukti:null, kadaluwarsa };
    DB.pembelian.push(pObj);
    const persediaanAkun = akunPersediaanUntuk(kepemilikan, isBarang?'barang':'bahan');
    postJurnal({ tanggal, keterangan:'Pembelian '+itemNama+' x'+qty+(keterangan?' ('+keterangan+')':''), debitId:persediaanAkun.id, kreditId:bayarAkun.id, nominal:total, sumber:'Pembelian', ref:'pembelian-'+pObj.id, tags });
    if(!isBarang){
      const bulan = tanggal.slice(0,7);
      const bud = DB.budgeting.find(x=> x.produkId===refId && x.tanggal.slice(0,7)===bulan);
      if(bud){ bud.realisasi=(bud.realisasi||0)+total; }
    }
    ok++;
  });
  save(); renderContent();
  toast('Impor pembelian: '+ok+' baris berhasil'+(warnings.length?(', '+warnings.length+' dilewati'):''));
  if(warnings.length) console.warn(warnings.join('\n'));
}
function pembelianItemList(){
  return pembelianTipe==='barang' ? DB.barang : DB.produk;
}

/* Small badge for a purchase's "Tanggal Kadaluwarsa" — merah kalau sudah lewat, oranye kalau ≤30 hari lagi. */
function kadaluwarsaCellHtml(iso){
  if(!iso) return '<span class="mini">—</span>';
  const sisa = daysUntil(iso);
  if(sisa===null) return '<span class="mini">—</span>';
  let cls = '', label = fmtTgl(iso);
  if(sisa<0){ cls='chip low'; label += ' (lewat '+Math.abs(sisa)+' hr)'; }
  else if(sisa<=30){ cls='chip warn'; label += ' ('+sisa+' hr lagi)'; }
  if(!cls) return `<span class="mini">${fmtTgl(iso)}</span>`;
  return `<span class="${cls}" style="margin:0;padding:3px 8px;font-size:11.5px">${label}</span>`;
}
/* Reverses a purchase's effect on an item's running-average cost, stock, and (for bahan) monthly budget realization.
   Used by both edit (reverse-old + apply-new) and delete (reverse-only). Works for both tipe 'bahan' and 'barang'. */
function reversePembelianEffect(p){
  const tipe = p.tipe || 'bahan';
  const refId = p.refId || p.produkId;
  const item = tipe==='barang' ? DB.barang.find(x=>x.id===refId) : DB.produk.find(x=>x.id===refId);
  if(item){
    item.runQty = Math.max(0, (item.runQty||0) - p.qty);
    item.runTotal = Math.max(0, (item.runTotal||0) - p.total);
    item.hargaBeliPerSatuan = item.runQty>0 ? (item.runTotal/item.runQty) : 0;
    item.stok = (item.stok||0) - p.qty;
  }
  if(tipe!=='barang'){
    const bulan = p.tanggal.slice(0,7);
    const bud = DB.budgeting.find(x=> x.produkId===refId && x.tanggal.slice(0,7)===bulan);
    if(bud) bud.realisasi = Math.max(0, (bud.realisasi||0) - p.total);
  }
}
function applyPembelianEffect(p){
  const tipe = p.tipe || 'bahan';
  const refId = p.refId || p.produkId;
  const item = tipe==='barang' ? DB.barang.find(x=>x.id===refId) : DB.produk.find(x=>x.id===refId);
  if(item){
    item.runQty = (item.runQty||0) + p.qty;
    item.runTotal = (item.runTotal||0) + p.total;
    item.hargaBeliPerSatuan = item.runQty>0 ? (item.runTotal/item.runQty) : 0;
    item.stok = (item.stok||0) + p.qty;
  }
  if(tipe!=='barang'){
    const bulan = p.tanggal.slice(0,7);
    const bud = DB.budgeting.find(x=> x.produkId===refId && x.tanggal.slice(0,7)===bulan);
    if(bud) bud.realisasi = (bud.realisasi||0) + p.total;
  }
}

    const item = pembelianRefItem(p);
    return matchSearch((item?item.nama:'')+' '+(p.keterangan||''), pembelianSearch);
  }).reverse();
  const visibleIds = rows.map(p=>p.id);
  wrap.innerHTML = `${bulkBarHtml('pembelian', visibleIds)}<div class="tablewrap"><table class="sheet"><thead><tr>${bulkCheckboxTh('pembelian')}<th>Tanggal</th><th>Dibayar melalui</th><th>Jenis</th><th>Barang</th><th>Qty</th><th>Total Harga</th><th>Harga/satuan</th><th>Kadaluwarsa</th><th>Keterangan</th><th>Tag</th><th>Bukti</th><th></th></tr></thead><tbody>
  ${rows.map(p=>{
    const item = pembelianRefItem(p);
    const tipe = p.tipe || 'bahan';

        <div class="field" style="grid-column:span 2"><label>Tanggal</label><input type="date" id="epTgl" value="${p.tanggal}"></div>
        <div class="field" style="grid-column:span 2"><label>${tipe==='barang'?'Nama Barang':'Nama Bahan'}</label>${itemPickerHtml('epItem', listFn, 'Ketik nama...', p.refId||p.produkId)}</div>
        <div class="field" style="grid-column:span 2"><label>Dikreditkan melalui</label>${akunPickerHtml('epBayar', null, 'Ketik nama akun...', p.bayarId)}</div>
        <div class="field"><label>Qty</label><input type="number" id="epQty" value="${p.qty}"></div>
        <div class="field"><label>Total Harga (Rp)</label><input type="number" id="epTotal" value="${p.total}"></div>
        ${tipe==='barang' ? '' : `<div class="field" style="grid-column:span 2"><label>Tanggal Kadaluwarsa (opsional)</label><input type="date" id="epKadaluwarsa" value="${p.kadaluwarsa||''}"></div>`}
        ${tipe==='barang' ? `<div class="field"><label>Kategori Persediaan</label>${listPickerHtml('epKategoriBarang', ()=>DB.kategoriBarangCustom, 'Ketik/pilih Peralatan atau Perlengkapan...', curItem?.kategori||'Peralatan')}</div>
        <div class="field"><label>Beban Operasional (saat stok habis)</label>${akunPickerHtml('epBebanOp', a=>['BO','BL','BPP'].includes(a.kategori), 'Ketik nama akun beban...', curItem?.akunBebanId||'')}</div>` : ''}

      if(!qty||qty<=0) return toast('Qty tidak valid');
      if(!total||total<=0) return toast('Total tidak valid');

  wrap.querySelectorAll('.dupPembelian').forEach(btn=> btn.addEventListener('click', ()=>{

      const b = DB.barang.find(x=>x.id===(p.refId||p.produkId));
      if(b){
        if(document.getElementById('pKategoriBarang')) setListPickerValue('pKategoriBarang', b.kategori||'Peralatan');

    toast('Data disalin ke form — tinggal sesuaikan lalu simpan');
  }));
}

/* ================= PENJUALAN (dengan harga) ================= */
let penjualanSearch = '';
const PENJUALAN_HEADERS = ['Tanggal (DD/MM/YY)','Menu (Nama Resep)','Qty Porsi Terjual','Total Harga Jual (Rp)','Diterima ke Akun (Nama)','Tag (pisahkan koma)'];
function penjualanIoCfg(){
  return {
    template:{ filename:'template-penjualan.xlsx', sheetName:'Penjualan', headers:PENJUALAN_HEADERS,
      exampleRows:[[fmtTgl(todayStr()),'Nasi Goreng Spesial',10,150000,'Kas','promo']] },
    onImport: importPenjualanRows,
    exportExcel: ()=>({ filename:'penjualan.xlsx', sheetName:'Penjualan', headers:['Tanggal','Menu','Qty','Harga Jual','HPP','Tag'],
      rows: [...DB.penjualan].reverse().map(p=>{ const r=DB.resep.find(x=>x.id===p.resepId); return [fmtTgl(p.tanggal), r?r.namaMenu:'', p.qty, p.harga, p.nilaiBahan, (p.tags||[]).join(', ')]; }) }),
    exportPdf: ()=>({ filename:'penjualan.pdf', title:'Riwayat Penjualan', headers:['Tanggal','Menu','Qty','Harga Jual','HPP'],
      rows: [...DB.penjualan].reverse().map(p=>{ const r=DB.resep.find(x=>x.id===p.resepId); return [fmtTgl(p.tanggal), r?r.namaMenu:'', fmtNum(p.qty), fmtRp(p.harga), fmtRp(p.nilaiBahan)]; }) })
  };
}
function importPenjualanRows(rows){
  let ok=0; const warnings=[];
  rows.forEach((r,i)=>{
    const tanggal = parseTglInput(String(xrow(r,'Tanggal (DD/MM/YY)','Tanggal (YYYY-MM-DD)','Tanggal')||'').trim())||todayStr();
    const menuNama = String(xrow(r,'Menu (Nama Resep)','Menu')||'').trim();
    const qty = Number(xrow(r,'Qty Porsi Terjual','Qty'))||0;
    const harga = Number(xrow(r,'Total Harga Jual (Rp)','Total Harga Jual','Harga'))||0;
    const akunNama = String(xrow(r,'Diterima ke Akun (Nama)','Diterima ke Akun','Akun')||'').trim();
    const tagStr = String(xrow(r,'Tag (pisahkan koma)','Tag')||'').trim();
    if(!menuNama||!akunNama||qty<=0){ warnings.push('Baris '+(i+2)+': data tidak lengkap, dilewati'); return; }
    const resep = DB.resep.find(x=>x.namaMenu.trim().toLowerCase()===menuNama.toLowerCase());
    if(!resep){ warnings.push('Baris '+(i+2)+': menu "'+menuNama+'" tidak ditemukan'); return; }
    const akun = DB.coa.find(a=>a.nama.trim().toLowerCase()===akunNama.toLowerCase());
    if(!akun){ warnings.push('Baris '+(i+2)+': akun "'+akunNama+'" tidak ditemukan'); return; }
    if((resep.bahan||[]).length===0){ warnings.push('Baris '+(i+2)+': resep "'+menuNama+'" belum punya bahan'); return; }
    const consumed = []; let nilaiBahan=0, kep='Pribadi';
    (function consumeBahan(list, mult){
      list.forEach(b=>{
        if(b.tipe==='produk'){ const prod=DB.produk.find(x=>x.id===b.refId); if(!prod) return; consumed.push({prod, pakai:b.qty*qty*mult}); }
        else if(b.tipe==='resep'){ const sub=DB.resep.find(x=>x.id===b.refId); if(!sub) return; consumeBahan(sub.bahan||[], b.qty*mult); }
      });
    })(resep.bahan, 1);
    consumed.forEach(({prod,pakai})=>{ prod.stok=(prod.stok||0)-pakai; nilaiBahan+=pakai*(prod.hargaBeliPerSatuan||0); kep=prod.kepemilikan; });
    const tags = parseTagInput(tagStr); tags.forEach(ensureTag);
    const pObj = { id:uid(), tanggal, resepId:resep.id, qty, harga, nilaiBahan:Math.round(nilaiBahan), akunId:akun.id, tags, bukti:null };
    DB.penjualan.push(pObj);
    const pdAkun = DB.coa.find(a=>a.kategori==='PD' && a.kepemilikan===kep) || DB.coa.find(a=>a.kategori==='PD');
    postJurnal({ tanggal, keterangan:'Penjualan '+resep.namaMenu+' x'+qty, debitId:akun.id, kreditId:pdAkun.id, nominal:harga||1, sumber:'Penjualan', ref:'penjualan-pd-'+pObj.id, tags });
    if(nilaiBahan>0){
      const bppAkun = DB.coa.find(a=>a.kategori==='BPP' && a.kepemilikan===kep) || DB.coa.find(a=>a.kategori==='BPP');
      const psAkun = DB.coa.find(a=>a.kategori==='PS' && a.kepemilikan===kep) || DB.coa.find(a=>a.kategori==='PS');
      postJurnal({ tanggal, keterangan:'HPP '+resep.namaMenu+' x'+qty, debitId:bppAkun.id, kreditId:psAkun.id, nominal:Math.round(nilaiBahan), sumber:'Penjualan', ref:'penjualan-hpp-'+pObj.id, tags });
    }
    ok++;
  });
  save(); renderContent();
  toast('Impor penjualan: '+ok+' baris berhasil'+(warnings.length?(', '+warnings.length+' dilewati'):''));
  if(warnings.length) console.warn(warnings.join('\n'));
}

  document.getElementById('btnPostPenjualan').addEventListener('click', ()=>{

    if(!resepId||!akunId) return toast('Lengkapi menu & akun penerima');

    (function consumeBahan(list, mult){
      list.forEach(b=>{
        if(b.tipe==='produk'){
          const prod = DB.produk.find(x=>x.id===b.refId); if(!prod) return;

        } else if(b.tipe==='resep'){
          const sub = DB.resep.find(x=>x.id===b.refId); if(!sub) return;

    DB.penjualan = DB.penjualan.filter(x=>x.id!==id);
    deleteJurnalByRef('penjualan-pd-'+id); deleteJurnalByRef('penjualan-hpp-'+id);

    save(); renderPenjualanTable();

  wrap.querySelectorAll('.dupPenjualan').forEach(btn=> btn.addEventListener('click', ()=>{

    window.scrollTo({top:0, behavior:'smooth'});
    toast('Data disalin ke form — tinggal sesuaikan lalu simpan');
  }));
}

    formFieldsHtml = `<div class="field" style="grid-column:span 2"><label>Menu (dari Resep)</label><select id="pmResep"><option value="">— pilih menu —</option>${DB.resep.map(r=>`<option value="${r.id}">${r.namaMenu}</option>`).join('')}</select></div>
      <div class="field"><label>Qty porsi dipakai</label><input type="number" id="pmQty" placeholder="0"></div>`;
  } else if(pemakaianMode==='produk'){
    formFieldsHtml = `<div class="field" style="grid-column:span 2"><label>Bahan (dari Persediaan Bahan)</label><select id="pmProduk"><option value="">— pilih bahan —</option>${DB.produk.map(p=>`<option value="${p.id}">${p.nama} (stok ${fmtNum(p.stok)} ${p.satuan})</option>`).join('')}</select></div>
      <div class="field"><label>Qty dipakai</label><input type="number" id="pmQty" placeholder="0"></div>`;
  } else {
    formFieldsHtml = `<div class="field" style="grid-column:span 2"><label>Barang/Perlengkapan</label><select id="pmBarang"><option value="">— pilih barang —</option>${DB.barang.map(b=>`<option value="${b.id}">${b.nama} (stok ${fmtNum(b.stok)} ${b.satuan})</option>`).join('')}</select></div>
      <div class="field"><label>Qty dipakai</label><input type="number" id="pmQty" placeholder="0"></div>`;
  }
  let html = `<div class="card">
    <div class="mini" style="margin-bottom:10px">Untuk konsumsi sendiri, nilai Rp0 — hanya memindahkan bahan dari persediaan ke beban pokok, tanpa mencatat pendapatan. Barang/perlengkapan tidak punya nilai beli tercatat, jadi hanya mengurangi stok tanpa jurnal.</div>
    <div class="tabs2">
      <button data-m="resep" class="${pemakaianMode==='resep'?'active':''}">Dari Resep (Menu)</button>
      <button data-m="produk" class="${pemakaianMode==='produk'?'active':''}">Dari Bahan Langsung</button>
      <button data-m="barang" class="${pemakaianMode==='barang'?'active':''}">Dari Barang/Perlengkapan</button>
    </div>
    <div class="formgrid">
      <div class="field"><label>Tanggal</label><input type="date" id="pmTgl" value="${todayStr()}"></div>
      ${formFieldsHtml}
    </div>
    <div class="formgrid">${tagInputHtml('pmTag')}${buktiUploadHtml('pmBukti')}</div>
    <button class="btn primary" id="btnPostPemakaian">Proses Pemakaian</button>
  </div>

  <div class="card" style="margin-top:14px">
  <div class="section-title"><h3 id="pemakaianCountTitle">Riwayat Pemakaian (${DB.pemakaian.length})</h3>${searchBoxHtml('pemakaianSearchInput','Cari menu/bahan/barang')}</div>
  <div id="pemakaianTableWrap"></div></div>`;
  c.innerHTML = html;
  bindBuktiUpload('pmBukti');
  renderPemakaianTable();

  c.querySelectorAll('.tabs2 button').forEach(b=> b.addEventListener('click', ()=>{ pemakaianMode=b.dataset.m; renderContent(); }));
  document.getElementById('pemakaianSearchInput').addEventListener('input', e=>{ pemakaianSearch=e.target.value; renderPemakaianTable(); });

  document.getElementById('btnPostPemakaian').addEventListener('click', ()=>{
    const qty=Number(pmQty.value);
    if(!qty||qty<=0) return toast('Isi qty');
    const tags = parseTagInput(pmTag.value); tags.forEach(ensureTag);
    const bukti = BUKTI_PENDING['pmBukti'];

    if(pemakaianMode==='resep'){
      const resepId=pmResep.value;
      if(!resepId) return toast('Pilih menu');
      const hasil = prosesPemakaianResep(resepId, pmTgl.value, qty, tags, bukti);
      if(hasil.error) return toast(hasil.error);
      save(); pmQty.value=''; pmTag.value=''; resetBuktiUpload('pmBukti'); renderPemakaianTable(); toast('Persediaan & beban pokok terupdate');

    } else if(pemakaianMode==='produk'){
      const produkId=pmProduk.value;
      if(!produkId) return toast('Pilih bahan');
      const prod = DB.produk.find(x=>x.id===produkId); if(!prod) return;
      prod.stok = (prod.stok||0) - qty;
      const nilaiBahan = Math.round(qty*(prod.hargaBeliPerSatuan||0));
      const pObj = { id:uid(), sumberTipe:'produk', refId:produkId, tanggal:pmTgl.value, qty, nilaiBahan, tags, bukti };
      DB.pemakaian.push(pObj);
      if(nilaiBahan>0){
        const bppAkun = DB.coa.find(a=>a.kategori==='BPP' && a.kepemilikan===prod.kepemilikan) || DB.coa.find(a=>a.kategori==='BPP');
        const psAkun = DB.coa.find(a=>a.kategori==='PS' && a.kepemilikan===prod.kepemilikan) || DB.coa.find(a=>a.kategori==='PS');
        postJurnal({ tanggal:pmTgl.value, keterangan:'Pemakaian bahan langsung: '+prod.nama+' x'+qty, debitId:bppAkun.id, kreditId:psAkun.id, nominal:nilaiBahan, sumber:'Pemakaian', ref:'pemakaian-'+pObj.id, tags, bukti });
      }
      save(); pmQty.value=''; pmTag.value=''; resetBuktiUpload('pmBukti'); renderPemakaianTable(); toast('Stok bahan terupdate');

    } else {
      const barangId=pmBarang.value;
      if(!barangId) return toast('Pilih barang');
      const b = DB.barang.find(x=>x.id===barangId); if(!b) return;
      b.stok = (b.stok||0) - qty;
      const pObj = { id:uid(), sumberTipe:'barang', refId:barangId, tanggal:pmTgl.value, qty, nilaiBahan:0, tags, bukti };
      DB.pemakaian.push(pObj);
      save(); pmQty.value=''; pmTag.value=''; resetBuktiUpload('pmBukti'); renderPemakaianTable(); toast('Stok barang/perlengkapan berkurang (tanpa jurnal — tidak ada harga beli tercatat)');
    }
  });
};

function pemakaianLabel(p){
  const tipe = p.sumberTipe || 'resep';
  if(tipe==='produk'){ const pr=DB.produk.find(x=>x.id===p.refId); return pr? 'Bahan: '+pr.nama : '(bahan dihapus)'; }
  if(tipe==='barang'){ const b=DB.barang.find(x=>x.id===p.refId); return b? 'Barang: '+b.nama : '(barang dihapus)'; }
  const r = DB.resep.find(x=>x.id===p.resepId); return r? 'Menu: '+r.namaMenu : '(resep dihapus)';
}

function renderPemakaianTable(){
  const wrap = document.getElementById('pemakaianTableWrap'); if(!wrap) return;
  const titleEl = document.getElementById('pemakaianCountTitle'); if(titleEl) titleEl.textContent = 'Riwayat Pemakaian ('+DB.pemakaian.length+')';
  const rows = [...DB.pemakaian].filter(p=> matchSearch(pemakaianLabel(p), pemakaianSearch)).reverse();
  const visibleIds = rows.map(p=>p.id);
  wrap.innerHTML = `${bulkBarHtml('pemakaian', visibleIds)}<div class="tablewrap"><table class="sheet"><thead><tr>${bulkCheckboxTh('pemakaian')}<th>Tanggal</th><th>Sumber</th><th>Qty</th><th>Nilai bahan terpakai</th><th>Tag</th><th>Bukti</th><th></th></tr></thead><tbody>
  ${rows.map(p=>`<tr>${bulkCheckboxTd('pemakaian',p.id)}<td>${fmtTgl(p.tanggal)}</td><td>${pemakaianLabel(p)}</td><td class="num">${fmtNum(p.qty)}</td><td class="num">${fmtRp(p.nilaiBahan)}</td><td>${tagChipsHtml(p.tags)}</td><td>${buktiCellHtml(p.bukti, pemakaianLabel(p))}</td><td>${aksiBtnsHtml('pemakaian','id',p.id,{dupClass:'dupPemakaian',editClass:null,delClass:'btnDelPemakaian'})}</td></tr>`).join('') || '<tr><td colspan="8" class="empty">Belum ada transaksi</td></tr>'}
  </tbody></table></div>`;
  bindBuktiCellClicks(wrap);
  bindBulkUI(wrap, 'pemakaian', visibleIds, ids=> ids.forEach(id=> batalkanPemakaian(id)), ()=> renderPemakaianTable());

  wrap.querySelectorAll('.btnDelPemakaian').forEach(btn=> btn.addEventListener('click', ()=>{
    if(!confirm('Hapus transaksi pemakaian ini? Stok akan dikembalikan.')) return;
    batalkanPemakaian(btn.dataset.id);
    save(); renderPemakaianTable(); toast('Pemakaian dihapus, stok dikembalikan');
  }));
  wrap.querySelectorAll('.dupPemakaian').forEach(btn=> btn.addEventListener('click', ()=>{
    const p = DB.pemakaian.find(x=>x.id===btn.dataset.id); if(!p) return;
    pemakaianMode = p.sumberTipe || 'resep';
    renderContent();
    setTimeout(()=>{
      pmTgl.value = todayStr(); pmQty.value = p.qty;
      if(pemakaianMode==='resep' && document.getElementById('pmResep')) pmResep.value = p.resepId||'';
      if(pemakaianMode==='produk' && document.getElementById('pmProduk')) pmProduk.value = p.refId||'';
      if(pemakaianMode==='barang' && document.getElementById('pmBarang')) pmBarang.value = p.refId||'';
      if(document.getElementById('pmTag')) pmTag.value = (p.tags||[]).join(', ');
      window.scrollTo({top:0, behavior:'smooth'});
      toast('Data disalin ke form — tinggal sesuaikan lalu simpan');
    }, 0);
  }));
}
