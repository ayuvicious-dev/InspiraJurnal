/* ================= PENJUALAN (dengan harga) ================= */
let penjualanSearch = '';
const PENJUALAN_HEADERS = ['Tanggal (YYYY-MM-DD)','Menu (Nama Resep)','Qty Porsi Terjual','Total Harga Jual (Rp)','Diterima ke Akun (Nama)','Tag (pisahkan koma)'];
function penjualanIoCfg(){
  return {
    template:{ filename:'template-penjualan.xlsx', sheetName:'Penjualan', headers:PENJUALAN_HEADERS,
      exampleRows:[[todayStr(),'Nasi Goreng Spesial',10,150000,'Kas','promo']] },
    onImport: importPenjualanRows,
    exportExcel: ()=>({ filename:'penjualan.xlsx', sheetName:'Penjualan', headers:['Tanggal','Menu','Qty','Harga Jual','HPP','Tag'],
      rows: [...DB.penjualan].reverse().map(p=>{ const r=DB.resep.find(x=>x.id===p.resepId); return [p.tanggal, r?r.namaMenu:'', p.qty, p.harga, p.nilaiBahan, (p.tags||[]).join(', ')]; }) }),
    exportPdf: ()=>({ filename:'penjualan.pdf', title:'Riwayat Penjualan', headers:['Tanggal','Menu','Qty','Harga Jual','HPP'],
      rows: [...DB.penjualan].reverse().map(p=>{ const r=DB.resep.find(x=>x.id===p.resepId); return [p.tanggal, r?r.namaMenu:'', fmtNum(p.qty), fmtRp(p.harga), fmtRp(p.nilaiBahan)]; }) })
  };
}
function importPenjualanRows(rows){
  let ok=0; const warnings=[];
  rows.forEach((r,i)=>{
    const tanggal = String(xrow(r,'Tanggal (YYYY-MM-DD)','Tanggal')||'').trim()||todayStr();
    const menuNama = String(xrow(r,'Menu (Nama Resep)','Menu')||'').trim();
    const qty = Number(xrow(r,'Qty Porsi Terjual','Qty'))||0;
    const harga = Number(xrow(r,'Total Harga Jual (Rp)','Total Harga Jual','Harga'))||0;
    const akunNama = String(xrow(r,'Diterima ke Akun (Nama)','Diterima ke Akun','Akun')||'').trim();
    const tagStr = String(xrow(r,'Tag (pisahkan koma)','Tag')||'').trim();
    if(!menuNama||!akunNama||qty<=0){ warnings.push('Baris '+(i+2)+': data tidak lengkap, dilewati'); return; }
    const resep = DB.resep.find(x=>x.namaMenu.trim().toLowerCase()===menuNama.toLowerCase());
    if(!resep){ warnings.push('Baris '+(i+2)+': menu "'+menuNama+'" tidak ditemukan'); return; }
    const akun = DB.coa.find(a=>a.nama.trim().toLowerCase()===akunNama.toLowerCase());
    if(!akun){ warnings.push('Baris '+(i+2)+': akun "'+akunNama+'" tidak ditemukan'); return; }
    if((resep.bahan||[]).length===0){ warnings.push('Baris '+(i+2)+': resep "'+menuNama+'" belum punya bahan'); return; }
    const consumed = []; let nilaiBahan=0, kep='Pribadi';
    (function consumeBahan(list, mult){
      list.forEach(b=>{
        if(b.tipe==='produk'){ const prod=DB.produk.find(x=>x.id===b.refId); if(!prod) return; consumed.push({prod, pakai:b.qty*qty*mult}); }
        else if(b.tipe==='resep'){ const sub=DB.resep.find(x=>x.id===b.refId); if(!sub) return; consumeBahan(sub.bahan||[], b.qty*mult); }
      });
    })(resep.bahan, 1);
    consumed.forEach(({prod,pakai})=>{ prod.stok=(prod.stok||0)-pakai; nilaiBahan+=pakai*(prod.hargaBeliPerSatuan||0); kep=prod.kepemilikan; });
    const tags = parseTagInput(tagStr); tags.forEach(ensureTag);
    const pObj = { id:uid(), tanggal, resepId:resep.id, qty, harga, nilaiBahan:Math.round(nilaiBahan), akunId:akun.id, tags, bukti:null };
    DB.penjualan.push(pObj);
    const pdAkun = DB.coa.find(a=>a.kategori==='PD' && a.kepemilikan===kep) || DB.coa.find(a=>a.kategori==='PD');
    postJurnal({ tanggal, keterangan:'Penjualan '+resep.namaMenu+' x'+qty, debitId:akun.id, kreditId:pdAkun.id, nominal:harga||1, sumber:'Penjualan', ref:'penjualan-pd-'+pObj.id, tags });
    if(nilaiBahan>0){
      const bppAkun = DB.coa.find(a=>a.kategori==='BPP' && a.kepemilikan===kep) || DB.coa.find(a=>a.kategori==='BPP');
      const psAkun = DB.coa.find(a=>a.kategori==='PS' && a.kepemilikan===kep) || DB.coa.find(a=>a.kategori==='PS');
      postJurnal({ tanggal, keterangan:'HPP '+resep.namaMenu+' x'+qty, debitId:bppAkun.id, kreditId:psAkun.id, nominal:Math.round(nilaiBahan), sumber:'Penjualan', ref:'penjualan-hpp-'+pObj.id, tags });
    }
    ok++;
  });
  save(); renderContent();
  toast('Impor penjualan: '+ok+' baris berhasil'+(warnings.length?(', '+warnings.length+' dilewati'):''));
  if(warnings.length) console.warn(warnings.join('\n'));
}
RENDERERS.penjualan = function(c){
  let html = `<div class="card">
    <div class="mini" style="margin-bottom:10px">Untuk penjualan sungguhan dengan nilai Rp — otomatis mencatat pendapatan sekaligus memindahkan bahan dari persediaan ke beban pokok.</div>
    <div class="formgrid">
      <div class="field"><label>Tanggal</label><input type="date" id="jlTgl" value="${todayStr()}"></div>
      <div class="field"><label>Menu (dari Resep)</label><select id="jlResep"><option value="">— pilih menu —</option>${DB.resep.map(r=>`<option value="${r.id}">${r.namaMenu}</option>`).join('')}</select></div>
      <div class="field"><label>Qty porsi terjual</label><input type="number" id="jlQty" placeholder="0"></div>
      <div class="field"><label>Total Harga Jual (Rp)</label><input type="number" id="jlHarga" placeholder="0"></div>
    </div>
    <div class="formgrid">
      <div class="field" style="grid-column:span 2"><label>Diterima ke akun</label>${akunPickerHtml('jlAkun', a=>['AL','ALL'].includes(a.kategori), 'Ketik nama akun...')}</div>
      ${tagInputHtml('jlTag')}
    </div>
    <div class="formgrid">${buktiUploadHtml('jlBukti')}</div>
    <button class="btn primary" id="btnPostPenjualan">Simpan Penjualan</button>
  </div>

  <div class="card" style="margin-top:14px">
  <div class="section-title"><h3 id="penjualanCountTitle">Riwayat Penjualan (${DB.penjualan.length})</h3><div style="display:flex;gap:8px;flex-wrap:wrap">${searchBoxHtml('penjualanSearchInput','Cari menu')}${ioToolbarHtml('penjualan', penjualanIoCfg())}</div></div>
  <div class="mini" style="margin-bottom:8px">Impor Excel untuk mencatat banyak penjualan sekaligus tanpa input manual satu-satu.</div>
  <div id="penjualanTableWrap"></div></div>`;
  c.innerHTML = html;
  bindAllAkunPickers(c);
  bindBuktiUpload('jlBukti');
  bindIoToolbar('penjualan', penjualanIoCfg());
  renderPenjualanTable();

  document.getElementById('penjualanSearchInput').addEventListener('input', e=>{ penjualanSearch=e.target.value; renderPenjualanTable(); });
  document.getElementById('btnPostPenjualan').addEventListener('click', ()=>{
    const resepId=jlResep.value, qty=Number(jlQty.value), harga=Number(jlHarga.value), akunId=jlAkun.value;
    if(!resepId||!akunId) return toast('Lengkapi menu & akun penerima');
    if(!qty||qty<=0) return toast('Isi qty');
    const resep = DB.resep.find(x=>x.id===resepId);
    if(!resep || (resep.bahan||[]).length===0) return toast('Resep ini belum punya bahan');

    const consumed = [];
    let nilaiBahan=0, kep='Pribadi';
    (function consumeBahan(list, mult){
      list.forEach(b=>{
        if(b.tipe==='produk'){
          const prod = DB.produk.find(x=>x.id===b.refId); if(!prod) return;
          const pakai = b.qty*qty*mult;
          consumed.push({prod, pakai});
        } else if(b.tipe==='resep'){
          const sub = DB.resep.find(x=>x.id===b.refId); if(!sub) return;
          consumeBahan(sub.bahan||[], b.qty*mult);
        }
      });
    })(resep.bahan, 1);

    consumed.forEach(({prod,pakai})=>{
      prod.stok = (prod.stok||0) - pakai;
      nilaiBahan += pakai*(prod.hargaBeliPerSatuan||0);
      kep = prod.kepemilikan;
    });

    const tags = parseTagInput(jlTag.value); tags.forEach(ensureTag);
    const bukti = BUKTI_PENDING['jlBukti'];
    const pObj = { id:uid(), tanggal:jlTgl.value, resepId, qty, harga, nilaiBahan:Math.round(nilaiBahan), akunId, tags, bukti };
    DB.penjualan.push(pObj);

    const pdAkun = DB.coa.find(a=>a.kategori==='PD' && a.kepemilikan===kep) || DB.coa.find(a=>a.kategori==='PD');
    postJurnal({ tanggal:jlTgl.value, keterangan:'Penjualan '+resep.namaMenu+' x'+qty, debitId:akunId, kreditId:pdAkun.id, nominal:harga||1, sumber:'Penjualan', ref:'penjualan-pd-'+pObj.id, tags, bukti });
    if(nilaiBahan>0){
      const bppAkun = DB.coa.find(a=>a.kategori==='BPP' && a.kepemilikan===kep) || DB.coa.find(a=>a.kategori==='BPP');
      const psAkun = DB.coa.find(a=>a.kategori==='PS' && a.kepemilikan===kep) || DB.coa.find(a=>a.kategori==='PS');
      postJurnal({ tanggal:jlTgl.value, keterangan:'HPP '+resep.namaMenu+' x'+qty, debitId:bppAkun.id, kreditId:psAkun.id, nominal:Math.round(nilaiBahan), sumber:'Penjualan', ref:'penjualan-hpp-'+pObj.id, tags });
    }
    save();
    jlQty.value=''; jlHarga.value=''; jlTag.value=''; jlResep.value='';
    setAkunPickerValue('jlAkun', null);
    resetBuktiUpload('jlBukti');
    renderPenjualanTable(); toast('Penjualan tersimpan');
  });
};

function renderPenjualanTable(){
  const wrap = document.getElementById('penjualanTableWrap'); if(!wrap) return;
  const titleEl = document.getElementById('penjualanCountTitle'); if(titleEl) titleEl.textContent = 'Riwayat Penjualan ('+DB.penjualan.length+')';
  const rows = [...DB.penjualan].filter(p=>{ const r=DB.resep.find(x=>x.id===p.resepId); return matchSearch(r?r.namaMenu:'', penjualanSearch); });
  wrap.innerHTML = `<div class="tablewrap"><table class="sheet"><thead><tr><th>Tanggal</th><th>Menu</th><th>Qty</th><th>Harga Jual</th><th>HPP</th><th>Tag</th><th>Bukti</th><th></th></tr></thead><tbody>
  ${rows.reverse().map(p=>{
    const r = DB.resep.find(x=>x.id===p.resepId);
    return `<tr><td>${p.tanggal}</td><td>${r?r.namaMenu:'(resep dihapus)'}</td><td class="num">${fmtNum(p.qty)}</td><td class="num">${fmtRp(p.harga)}</td><td class="num">${fmtRp(p.nilaiBahan)}</td><td>${tagChipsHtml(p.tags)}</td><td>${buktiCellHtml(p.bukti, r?r.namaMenu:'')}</td><td><button class="btn small dupPenjualan" data-id="${p.id}">Duplikat</button> <button class="btn small danger btnDelPenjualan" data-id="${p.id}">Hapus</button></td></tr>`;
  }).join('') || '<tr><td colspan="8" class="empty">Belum ada penjualan</td></tr>'}
  </tbody></table></div>`;
  bindBuktiCellClicks(wrap);

  wrap.querySelectorAll('.btnDelPenjualan').forEach(btn=> btn.addEventListener('click', ()=>{
    if(!confirm('Hapus penjualan ini?')) return;
    DB.penjualan = DB.penjualan.filter(x=>x.id!==btn.dataset.id);
    deleteJurnalByRef('penjualan-pd-'+btn.dataset.id); deleteJurnalByRef('penjualan-hpp-'+btn.dataset.id);
    save(); renderPenjualanTable();
  }));
  wrap.querySelectorAll('.dupPenjualan').forEach(btn=> btn.addEventListener('click', ()=>{
    const p = DB.penjualan.find(x=>x.id===btn.dataset.id); if(!p) return;
    jlTgl.value = todayStr(); jlQty.value = p.qty; jlHarga.value = p.harga;
    if(document.getElementById('jlResep')) jlResep.value = p.resepId||'';
    setAkunPickerValue('jlAkun', p.akunId);
    if(document.getElementById('jlTag')) jlTag.value = (p.tags||[]).join(', ');
    window.scrollTo({top:0, behavior:'smooth'});
    toast('Data disalin ke form — tinggal sesuaikan lalu simpan');
  }));
}

/* ================= PEMAKAIAN (Rp0, konsumsi sendiri) ================= */
let pemakaianSearch = '';
let pemakaianMode = 'resep'; // 'resep' | 'produk' | 'barang'
RENDERERS.pemakaian = function(c){
  let formFieldsHtml = '';
  if(pemakaianMode==='resep'){
    formFieldsHtml = `<div class="field" style="grid-column:span 2"><label>Menu (dari Resep)</label><select id="pmResep"><option value="">— pilih menu —</option>${DB.resep.map(r=>`<option value="${r.id}">${r.namaMenu}</option>`).join('')}</select></div>
      <div class="field"><label>Qty porsi dipakai</label><input type="number" id="pmQty" placeholder="0"></div>`;
  } else if(pemakaianMode==='produk'){
    formFieldsHtml = `<div class="field" style="grid-column:span 2"><label>Bahan (dari Persediaan Bahan)</label><select id="pmProduk"><option value="">— pilih bahan —</option>${DB.produk.map(p=>`<option value="${p.id}">${p.nama} (stok ${fmtNum(p.stok)} ${p.satuan})</option>`).join('')}</select></div>
      <div class="field"><label>Qty dipakai</label><input type="number" id="pmQty" placeholder="0"></div>`;
  } else {
    formFieldsHtml = `<div class="field" style="grid-column:span 2"><label>Barang/Perlengkapan</label><select id="pmBarang"><option value="">— pilih barang —</option>${DB.barang.map(b=>`<option value="${b.id}">${b.nama} (stok ${fmtNum(b.stok)} ${b.satuan})</option>`).join('')}</select></div>
      <div class="field"><label>Qty dipakai</label><input type="number" id="pmQty" placeholder="0"></div>`;
  }
  let html = `<div class="card">
    <div class="mini" style="margin-bottom:10px">Untuk konsumsi sendiri, nilai Rp0 — hanya memindahkan bahan dari persediaan ke beban pokok, tanpa mencatat pendapatan. Barang/perlengkapan tidak punya nilai beli tercatat, jadi hanya mengurangi stok tanpa jurnal.</div>
    <div class="tabs2">
      <button data-m="resep" class="${pemakaianMode==='resep'?'active':''}">Dari Resep (Menu)</button>
      <button data-m="produk" class="${pemakaianMode==='produk'?'active':''}">Dari Bahan Langsung</button>
      <button data-m="barang" class="${pemakaianMode==='barang'?'active':''}">Dari Barang/Perlengkapan</button>
    </div>
    <div class="formgrid">
      <div class="field"><label>Tanggal</label><input type="date" id="pmTgl" value="${todayStr()}"></div>
      ${formFieldsHtml}
    </div>
    <div class="formgrid">${tagInputHtml('pmTag')}${buktiUploadHtml('pmBukti')}</div>
    <button class="btn primary" id="btnPostPemakaian">Proses Pemakaian</button>
  </div>

  <div class="card" style="margin-top:14px">
  <div class="section-title"><h3 id="pemakaianCountTitle">Riwayat Pemakaian (${DB.pemakaian.length})</h3>${searchBoxHtml('pemakaianSearchInput','Cari menu/bahan/barang')}</div>
  <div id="pemakaianTableWrap"></div></div>`;
  c.innerHTML = html;
  bindBuktiUpload('pmBukti');
  renderPemakaianTable();

  c.querySelectorAll('.tabs2 button').forEach(b=> b.addEventListener('click', ()=>{ pemakaianMode=b.dataset.m; renderContent(); }));
  document.getElementById('pemakaianSearchInput').addEventListener('input', e=>{ pemakaianSearch=e.target.value; renderPemakaianTable(); });

  document.getElementById('btnPostPemakaian').addEventListener('click', ()=>{
    const qty=Number(pmQty.value);
    if(!qty||qty<=0) return toast('Isi qty');
    const tags = parseTagInput(pmTag.value); tags.forEach(ensureTag);
    const bukti = BUKTI_PENDING['pmBukti'];

    if(pemakaianMode==='resep'){
      const resepId=pmResep.value;
      if(!resepId) return toast('Pilih menu');
      const hasil = prosesPemakaianResep(resepId, pmTgl.value, qty, tags, bukti);
      if(hasil.error) return toast(hasil.error);
      save(); pmQty.value=''; pmTag.value=''; resetBuktiUpload('pmBukti'); renderPemakaianTable(); toast('Persediaan & beban pokok terupdate');

    } else if(pemakaianMode==='produk'){
      const produkId=pmProduk.value;
      if(!produkId) return toast('Pilih bahan');
      const prod = DB.produk.find(x=>x.id===produkId); if(!prod) return;
      prod.stok = (prod.stok||0) - qty;
      const nilaiBahan = Math.round(qty*(prod.hargaBeliPerSatuan||0));
      const pObj = { id:uid(), sumberTipe:'produk', refId:produkId, tanggal:pmTgl.value, qty, nilaiBahan, tags, bukti };
      DB.pemakaian.push(pObj);
      if(nilaiBahan>0){
        const bppAkun = DB.coa.find(a=>a.kategori==='BPP' && a.kepemilikan===prod.kepemilikan) || DB.coa.find(a=>a.kategori==='BPP');
        const psAkun = DB.coa.find(a=>a.kategori==='PS' && a.kepemilikan===prod.kepemilikan) || DB.coa.find(a=>a.kategori==='PS');
        postJurnal({ tanggal:pmTgl.value, keterangan:'Pemakaian bahan langsung: '+prod.nama+' x'+qty, debitId:bppAkun.id, kreditId:psAkun.id, nominal:nilaiBahan, sumber:'Pemakaian', ref:'pemakaian-'+pObj.id, tags, bukti });
      }
      save(); pmQty.value=''; pmTag.value=''; resetBuktiUpload('pmBukti'); renderPemakaianTable(); toast('Stok bahan terupdate');

    } else {
      const barangId=pmBarang.value;
      if(!barangId) return toast('Pilih barang');
      const b = DB.barang.find(x=>x.id===barangId); if(!b) return;
      b.stok = (b.stok||0) - qty;
      const pObj = { id:uid(), sumberTipe:'barang', refId:barangId, tanggal:pmTgl.value, qty, nilaiBahan:0, tags, bukti };
      DB.pemakaian.push(pObj);
      save(); pmQty.value=''; pmTag.value=''; resetBuktiUpload('pmBukti'); renderPemakaianTable(); toast('Stok barang/perlengkapan berkurang (tanpa jurnal — tidak ada harga beli tercatat)');
    }
  });
};

function pemakaianLabel(p){
  const tipe = p.sumberTipe || 'resep';
  if(tipe==='produk'){ const pr=DB.produk.find(x=>x.id===p.refId); return pr? 'Bahan: '+pr.nama : '(bahan dihapus)'; }
  if(tipe==='barang'){ const b=DB.barang.find(x=>x.id===p.refId); return b? 'Barang: '+b.nama : '(barang dihapus)'; }
  const r = DB.resep.find(x=>x.id===p.resepId); return r? 'Menu: '+r.namaMenu : '(resep dihapus)';
}

function renderPemakaianTable(){
  const wrap = document.getElementById('pemakaianTableWrap'); if(!wrap) return;
  const titleEl = document.getElementById('pemakaianCountTitle'); if(titleEl) titleEl.textContent = 'Riwayat Pemakaian ('+DB.pemakaian.length+')';
  const rows = [...DB.pemakaian].filter(p=> matchSearch(pemakaianLabel(p), pemakaianSearch));
  wrap.innerHTML = `<div class="tablewrap"><table class="sheet"><thead><tr><th>Tanggal</th><th>Sumber</th><th>Qty</th><th>Nilai bahan terpakai</th><th>Tag</th><th>Bukti</th><th></th></tr></thead><tbody>
  ${rows.reverse().map(p=>`<tr><td>${p.tanggal}</td><td>${pemakaianLabel(p)}</td><td class="num">${fmtNum(p.qty)}</td><td class="num">${fmtRp(p.nilaiBahan)}</td><td>${tagChipsHtml(p.tags)}</td><td>${buktiCellHtml(p.bukti, pemakaianLabel(p))}</td><td><button class="btn small dupPemakaian" data-id="${p.id}">Duplikat</button> <button class="btn small danger btnDelPemakaian" data-id="${p.id}">Hapus</button></td></tr>`).join('') || '<tr><td colspan="7" class="empty">Belum ada transaksi</td></tr>'}
  </tbody></table></div>`;
  bindBuktiCellClicks(wrap);

  wrap.querySelectorAll('.btnDelPemakaian').forEach(btn=> btn.addEventListener('click', ()=>{
    if(!confirm('Hapus transaksi pemakaian ini? Stok akan dikembalikan.')) return;
    batalkanPemakaian(btn.dataset.id);
    save(); renderPemakaianTable(); toast('Pemakaian dihapus, stok dikembalikan');
  }));
  wrap.querySelectorAll('.dupPemakaian').forEach(btn=> btn.addEventListener('click', ()=>{
    const p = DB.pemakaian.find(x=>x.id===btn.dataset.id); if(!p) return;
    pemakaianMode = p.sumberTipe || 'resep';
    renderContent();
    setTimeout(()=>{
      pmTgl.value = todayStr(); pmQty.value = p.qty;
      if(pemakaianMode==='resep' && document.getElementById('pmResep')) pmResep.value = p.resepId||'';
      if(pemakaianMode==='produk' && document.getElementById('pmProduk')) pmProduk.value = p.refId||'';
      if(pemakaianMode==='barang' && document.getElementById('pmBarang')) pmBarang.value = p.refId||'';
      if(document.getElementById('pmTag')) pmTag.value = (p.tags||[]).join(', ');
      window.scrollTo({top:0, behavior:'smooth'});
      toast('Data disalin ke form — tinggal sesuaikan lalu simpan');
    }, 0);
  }));
}

/* ================= PERSEDIAAN ================= */
let persediaanSearch = '';
RENDERERS.persediaan = function(c){
  let html = `<div class="section-title"><h3 id="persediaanCountTitle">Kartu Stok Bahan (${DB.produk.length} item)</h3><div style="display:flex;gap:8px">${searchBoxHtml('persediaanSearchInput','Cari nama/lokasi')}<button class="btn small" id="btnAddLokasi">+ Tambah Lokasi</button></div></div>
  <div id="persediaanTableWrap"></div>`;
  c.innerHTML = html;
  renderPersediaanTable();

  document.getElementById('persediaanSearchInput').addEventListener('input', e=>{ persediaanSearch=e.target.value; renderPersediaanTable(); });
  document.getElementById('btnAddLokasi').addEventListener('click', ()=>{
    const nama = prompt('Nama lokasi baru (mis. Gudang A, Rak Bumbu):'); if(!nama) return;
    DB.lokasiCustom.push(nama); save(); renderPersediaanTable(); toast('Lokasi ditambahkan');
  });
};

function renderPersediaanTable(){
  const wrap = document.getElementById('persediaanTableWrap'); if(!wrap) return;
  const titleEl = document.getElementById('persediaanCountTitle'); if(titleEl) titleEl.textContent = 'Kartu Stok Bahan ('+DB.produk.length+' item)';
  const allLokasi = [...getEffectiveLokasiDefault(), ...DB.lokasiCustom];
  const filtered = DB.produk.filter(p=> matchSearch(p.nama+' '+p.kode+' '+(p.lokasi||''), persediaanSearch));
  let html = `<div class="tablewrap"><table class="sheet"><thead><tr>

    DB.produk.forEach(p=>{ if(p.lokasi===nama) p.lokasi=''; });
    save(); renderPersediaanTable(); toast('Lokasi dihapus');
  }));
}

/* ---- Smart daily menu recommendation, based on current stock (recalculated live every render) ---- */
const MENU_KATEGORI_PRIORITAS = ['Nasi Karbohidrat','Lauk Protein','Sayur Serat','Buah Vitamin','Air Putih Mineral','Snack'];
const MEAL_SLOTS = [
  {nama:'Pagi', kategori:['Nasi Karbohidrat','Lauk Protein','Air Putih Mineral']},
  {nama:'Siang', kategori:['Nasi Karbohidrat','Lauk Protein','Sayur Serat','Air Putih Mineral']},
  {nama:'Sore', kategori:['Snack','Buah Vitamin']},
  {nama:'Malam', kategori:['Nasi Karbohidrat','Lauk Protein','Sayur Serat','Air Putih Mineral']},
];
function matchResepKategoriBudget(r){
  const j = (r.jenisResep||'').toLowerCase();
  if(j.includes('protein')||j.includes('lauk')) return 'Lauk Protein';
  if(j.includes('karbohidrat')||j.includes('nasi')) return 'Nasi Karbohidrat';
  if(j.includes('sayur')) return 'Sayur Serat';
  if(j.includes('buah')) return 'Buah Vitamin';
  if(j.includes('air')||j.includes('minuman')||j.includes('minum')) return 'Air Putih Mineral';
  if(j.includes('snack')||j.includes('camilan')) return 'Snack';
  return null;
}
function resepStockScore(r){
  return (r.bahan||[]).filter(b=>b.tipe==='produk').reduce((s,b)=>{
    const p = DB.produk.find(x=>x.id===b.refId);
    return s + (p ? (p.stok||0) : 0);
  }, 0);
}
/* Deterministic-but-varied pick: ranks candidates by remaining stock (use up abundant stock first),
   then rotates among the top few based on the date so consecutive days don't repeat the same thing. */
/* Shared consumption logic (recipe -> ingredients -> stock/jurnal), reused by the manual Pemakaian form
   and by the Kalender Menu "tandai dikonsumsi" checkboxes below. */
function prosesPemakaianResep(resepId, tanggal, qty, tags, bukti){
  const resep = DB.resep.find(x=>x.id===resepId);
  if(!resep || (resep.bahan||[]).length===0) return { error:'Resep ini belum punya bahan' };
  const consumed = []; let nilaiBahan=0, kep='Pribadi';
  (function consumeBahan(list, mult){
    list.forEach(b=>{
      if(b.tipe==='produk'){ const prod=DB.produk.find(x=>x.id===b.refId); if(!prod) return; consumed.push({prod, pakai:b.qty*qty*mult}); }
      else if(b.tipe==='resep'){ const sub=DB.resep.find(x=>x.id===b.refId); if(!sub) return; consumeBahan(sub.bahan||[], b.qty*mult); }
    });
  })(resep.bahan, 1);
  consumed.forEach(({prod,pakai})=>{ prod.stok=(prod.stok||0)-pakai; nilaiBahan += pakai*(prod.hargaBeliPerSatuan||0); kep=prod.kepemilikan; });
  const pObj = { id:uid(), sumberTipe:'resep', tanggal, resepId, qty, nilaiBahan:Math.round(nilaiBahan), tags:tags||[], bukti:bukti||null };
  DB.pemakaian.push(pObj);
  if(nilaiBahan>0){
    const bppAkun = DB.coa.find(a=>a.kategori==='BPP' && a.kepemilikan===kep) || DB.coa.find(a=>a.kategori==='BPP');
    const psAkun = DB.coa.find(a=>a.kategori==='PS' && a.kepemilikan===kep) || DB.coa.find(a=>a.kategori==='PS');
    postJurnal({ tanggal, keterangan:'Pemakaian bahan: '+resep.namaMenu+' x'+fmtNum(qty), debitId:bppAkun.id, kreditId:psAkun.id, nominal:Math.round(nilaiBahan), sumber:'Pemakaian', ref:'pemakaian-'+pObj.id, tags:tags||[], bukti });
  }
  return { ok:true, pObj };
}
/* Reverses any Pemakaian entry (resep/produk/barang) — restores stock and removes its jurnal, used when
   un-checking a "sudah dikonsumsi" box or deleting a Pemakaian row. */
function batalkanPemakaian(pemakaianId){
  const p = DB.pemakaian.find(x=>x.id===pemakaianId); if(!p) return;
  const tipe = p.sumberTipe || 'resep';
  if(tipe==='resep'){
    const resep = DB.resep.find(x=>x.id===p.resepId);
    if(resep){
      (function restoreBahan(list, mult){
        list.forEach(b=>{
          if(b.tipe==='produk'){ const prod=DB.produk.find(x=>x.id===b.refId); if(prod) prod.stok=(prod.stok||0)+b.qty*p.qty*mult; }
          else if(b.tipe==='resep'){ const sub=DB.resep.find(x=>x.id===b.refId); if(sub) restoreBahan(sub.bahan||[], b.qty*mult); }
        });
      })(resep.bahan||[], 1);
    }
  } else if(tipe==='produk'){
    const prod = DB.produk.find(x=>x.id===p.refId); if(prod) prod.stok=(prod.stok||0)+p.qty;
  } else if(tipe==='barang'){
    const b = DB.barang.find(x=>x.id===p.refId); if(b) b.stok=(b.stok||0)+p.qty;
  }
  DB.pemakaian = DB.pemakaian.filter(x=>x.id!==pemakaianId);
  deleteJurnalByRef('pemakaian-'+pemakaianId);
}
/* Ingredient qty needed per day, at full (unscaled) portions, for a given date's recommendation. */
function hitungKebutuhanHarianBahan(dateStr){
  const rekom = getRekomendasiHarian(dateStr);
  const kebutuhan = {};
  (function tambah(list, qtyMenu){
    list.forEach(b=>{
      if(b.tipe==='produk') kebutuhan[b.refId] = (kebutuhan[b.refId]||0) + b.qty*qtyMenu;
      else if(b.tipe==='resep'){ const sub=DB.resep.find(x=>x.id===b.refId); if(sub) tambah(sub.bahan||[], b.qty*qtyMenu); }
    });
  });
  rekom.forEach(slot=> slot.menus.forEach(mn=> tambah(mn.resep.bahan||[], 1)));
  return kebutuhan;
}
/* Suggested portion-scale (0-1) so today's stock can be stretched to last `targetHari` days.
   1 = no reduction needed; e.g. 0.6 = shrink daily portions to 60% to make stock last that long. */
function hitungPorsiSkala(targetHari){
  if(!targetHari || targetHari<=0) return 1;
  const kebutuhan = hitungKebutuhanHarianBahan(todayStr());
  let minRasio = 1;
  Object.keys(kebutuhan).forEach(pid=>{
    const prod = DB.produk.find(p=>p.id===pid); if(!prod) return;
    const perHari = kebutuhan[pid]; if(perHari<=0) return;
    const tahanHari = (prod.stok||0)/perHari;
    const rasio = tahanHari/targetHari;
    if(rasio < minRasio) minRasio = rasio;
  });
  return Math.max(0, Math.min(1, minRasio));
}

function getRekomendasiHarian(dateStr){
  const dayNum = Number(dateStr.slice(8,10)) || 1;
  return MEAL_SLOTS.map((slot, slotIdx)=>{
    const menus = slot.kategori.map((kat, katIdx)=>{
      const kandidat = DB.resep.filter(r=> matchResepKategoriBudget(r)===kat);
      if(kandidat.length===0) return { kategori:kat, resep:null };
      const scored = kandidat.map(r=>({r, score:resepStockScore(r)})).sort((a,b)=> b.score-a.score);
      const top = scored.slice(0, Math.min(3, scored.length));
      const pick = top[(dayNum + slotIdx + katIdx) % top.length].r;
      return { kategori:kat, resep:pick };
    }).filter(m=>m.resep);
    return { slot: slot.nama, menus };
  });
}

function estimasiNilaiResep(resep, qty){
  let nilai = 0;
  (function hitung(list, mult){
    (list||[]).forEach(b=>{
      if(b.tipe==='produk'){ const prod=DB.produk.find(x=>x.id===b.refId); if(prod) nilai += b.qty*qty*mult*(prod.hargaBeliPerSatuan||0); }
      else if(b.tipe==='resep'){ const sub=DB.resep.find(x=>x.id===b.refId); if(sub) hitung(sub.bahan||[], b.qty*mult); }
    });
  })(resep.bahan, 1);
  return Math.round(nilai);
}

function openRekomendasiDrawer(dateStr){
  if(DB.resep.length===0) return toast('Tambah resep dulu di menu Produk & Resep');
  const targetHari = DB.budgetSetting?.targetHariStok || null;
  const skala = hitungPorsiSkala(targetHari);
  const qtyScaled = Math.round(skala*100)/100;
  const rekom = getRekomendasiHarian(dateStr);
  let totalBiaya = 0;
  let rowsHtml = rekom.map(slot=>{
    if(slot.menus.length===0) return '';
    return `<div style="margin-bottom:12px">
      <div style="font-weight:700;font-size:12.8px;color:var(--terracotta-dark);margin-bottom:6px">${slot.slot}</div>
      <div class="tablewrap"><table class="sheet"><thead><tr><th>Kategori</th><th>Menu</th><th>Porsi</th><th>Estimasi Biaya</th><th>Konsumsi?</th></tr></thead><tbody>
      ${slot.menus.map(mn=>{
        const penjualanMatch = DB.penjualan.some(x=>x.resepId===mn.resep.id && x.tanggal===dateStr);
        const pemakaianMatch = DB.pemakaian.find(x=>(x.sumberTipe||'resep')==='resep' && x.resepId===mn.resep.id && x.tanggal===dateStr);
        const done = penjualanMatch || !!pemakaianMatch;
        const biaya = estimasiNilaiResep(mn.resep, qtyScaled);
        totalBiaya += biaya;
        return `<tr><td class="mini">${mn.kategori}</td><td>${mn.resep.namaMenu}</td><td class="num">${qtyScaled} porsi</td><td class="num">${fmtRp(biaya)}</td>
          <td class="center"><input type="checkbox" class="ceklis-konsumsi" data-resep="${mn.resep.id}" data-date="${dateStr}" data-qty="${qtyScaled}" ${done?'checked':''} ${penjualanMatch?'disabled title="Sudah tercatat lewat Penjualan"':''}></td></tr>`;
      }).join('')}
      </tbody></table></div>
    </div>`;
  }).join('');
  rowsHtml += `<div class="recap">Estimasi total biaya konsumsi hari ini: <b>${fmtRp(totalBiaya)}</b>${skala<1?` (porsi sudah diperkecil jadi ${Math.round(skala*100)}% supaya stok tahan ${targetHari} hari)`:''}</div>`;
  const d = openDetailDrawer('Rekomendasi Menu — '+dateStr+' (2 orang)', rowsHtml || '<div class="empty">Belum ada resep yang cocok kategori prioritas.</div>');
  d.querySelectorAll('.ceklis-konsumsi').forEach(chk=> chk.addEventListener('change', ()=>{
    const resepId = chk.dataset.resep, tgl = chk.dataset.date, qty = Number(chk.dataset.qty)||1;
    if(chk.checked){
      const hasil = prosesPemakaianResep(resepId, tgl, qty, ['Kalender Menu'], null);
      if(hasil.error){ toast(hasil.error); chk.checked=false; return; }
      save(); toast('Dicatat ke Pemakaian — stok & Laba Rugi terupdate');
    } else {
      const p = DB.pemakaian.find(x=>(x.sumberTipe||'resep')==='resep' && x.resepId===resepId && x.tanggal===tgl);
      if(p){ batalkanPemakaian(p.id); save(); toast('Dibatalkan, stok dikembalikan'); }
    }
    const body = document.getElementById('budgetBody');
    if(body) renderKalenderMenu(body);
    openRekomendasiDrawer(dateStr);
  }));
}

  const rows=[]; let totalAset=0, totalKW=0, totalMD=0;
  asetKat.forEach(kat=>{

  });
  rows.push(['','','','Total Aset', totalAset]);

  });
  rows.push(['','','','Total Kewajiban', totalKW]);
  KEPEMILIKAN.forEach(kep=>{
    const akunsMD = DB.coa.filter(a=>a.kategori==='MD' && a.kepemilikan===kep);

  });
  rows.push(['','','','Total Kewajiban + Modal', totalKW+totalMD]);
  return rows;
}

/* ================= LABA RUGI (dengan filter tanggal & tag) ================= */
let lrFilter = { mode:'bulan_ini', dari:'', sampai:'', tag:'' };
function dateRangeForMode(mode){
  const now = new Date();
  const pad = n=>String(n).padStart(2,'0');
  const fmt = d=> d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  if(mode==='hari_ini'){ return [fmt(now), fmt(now)]; }
  if(mode==='minggu_ini'){ const start=new Date(now); start.setDate(now.getDate()-now.getDay()); return [fmt(start), fmt(now)]; }
  if(mode==='bulan_ini'){ return [fmt(new Date(now.getFullYear(),now.getMonth(),1)), fmt(now)]; }
  if(mode==='bulan_lalu'){ const s=new Date(now.getFullYear(),now.getMonth()-1,1), e=new Date(now.getFullYear(),now.getMonth(),0); return [fmt(s), fmt(e)]; }
  if(mode==='tahun_ini'){ return [fmt(new Date(now.getFullYear(),0,1)), fmt(now)]; }
  if(mode==='tahun_lalu'){ return [fmt(new Date(now.getFullYear()-1,0,1)), fmt(new Date(now.getFullYear()-1,11,31))]; }
  return [lrFilter.dari, lrFilter.sampai];
}
function filteredJurnal(){
  let [dari, sampai] = lrFilter.mode==='custom' ? [lrFilter.dari, lrFilter.sampai] : dateRangeForMode(lrFilter.mode);
  return DB.jurnal.filter(j=>{
    if(dari && j.tanggal<dari) return false;
    if(sampai && j.tanggal>sampai) return false;
    if(lrFilter.tag && !(j.tags||[]).includes(lrFilter.tag)) return false;
    return true;
  });
}
function sumByKategoriKepemilikanFiltered(kategori, kepemilikan, jlist){
  const akunIds = new Set(DB.coa.filter(a=>a.kategori===kategori && (!kepemilikan||a.kepemilikan===kepemilikan)).map(a=>a.id));
  let debit=0, kredit=0;
  jlist.forEach(j=>{ if(akunIds.has(j.debitId)) debit+=j.nominal; if(akunIds.has(j.kreditId)) kredit+=j.nominal; });
  const isDebitNormal = DEBIT_NORMAL.has(kategori);
  return isDebitNormal ? debit-kredit : kredit-debit;
}

function labaRugiExportRows(jlist){
  const rows=[];
  KEPEMILIKAN.forEach(kep=>{
    const pd = sumByKategoriKepemilikanFiltered('PD', kep, jlist);
    const bpp = sumByKategoriKepemilikanFiltered('BPP', kep, jlist);
    const bo = sumByKategoriKepemilikanFiltered('BO', kep, jlist);
    const bl = sumByKategoriKepemilikanFiltered('BL', kep, jlist);
    rows.push([kep, pd, bpp, bo, bl, pd-bpp-bo-bl]);
  });
  const totalPD=sumByKategoriKepemilikanFiltered('PD',null,jlist), totalBPP=sumByKategoriKepemilikanFiltered('BPP',null,jlist), totalBO=sumByKategoriKepemilikanFiltered('BO',null,jlist), totalBL=sumByKategoriKepemilikanFiltered('BL',null,jlist);
  rows.push(['Total', totalPD, totalBPP, totalBO, totalBL, totalPD-totalBPP-totalBO-totalBL]);
  return rows;
}
function labaRugiIoCfg(jlist){
  const headers=['Kepemilikan','Pendapatan','Beban Pokok Penjualan','Beban Operasional','Beban Lain','Laba/Rugi'];
  return {
    exportExcel: ()=>({ filename:'laba-rugi.xlsx', sheetName:'Laba Rugi', headers, rows: labaRugiExportRows(jlist) }),
    exportPdf: ()=>({ filename:'laba-rugi.pdf', title:'Laporan Laba Rugi', headers, rows: labaRugiExportRows(jlist).map(r=> r.map((v,i)=> i>0? fmtRp(v): v)) })

}

/* ================= ARUS KAS ================= */
RENDERERS.aruskas = function(c){
  const kasIds = new Set(DB.coa.filter(a=>a.kategori==='AL').map(a=>a.id));
  const groups = { Operasional:0, Investasi:0, Pendanaan:0 };
  const rows = [];
  DB.jurnal.forEach(j=>{
    const debitKas = kasIds.has(j.debitId), kreditKas = kasIds.has(j.kreditId);
    if(!debitKas && !kreditKas) return;
    if(debitKas && kreditKas) return;
    const lawanId = debitKas? j.kreditId : j.debitId;
    const lawan = akunById(lawanId);
    const arah = debitKas? 1 : -1;
    let kelompok = 'Operasional';
    if(lawan){
      if(['AT','ALN'].includes(lawan.kategori)) kelompok='Investasi';
      else if(['KW','MD'].includes(lawan.kategori)) kelompok='Pendanaan';
    }
    groups[kelompok] += arah*j.nominal;
    rows.push({...j, arah, kelompok, lawanNama: lawan?lawan.nama:'?'});
  });
  const totalKas = groups.Operasional+groups.Investasi+groups.Pendanaan;
  let html = `<div class="grid cols-3">
    <div class="card kpi"><div class="label">Aktivitas Operasional</div><div class="value ${groups.Operasional>=0?'pos':'neg'}">${fmtRp(groups.Operasional)}</div></div>
    <div class="card kpi"><div class="label">Aktivitas Investasi</div><div class="value ${groups.Investasi>=0?'pos':'neg'}">${fmtRp(groups.Investasi)}</div></div>
    <div class="card kpi"><div class="label">Aktivitas Pendanaan</div><div class="value ${groups.Pendanaan>=0?'pos':'neg'}">${fmtRp(groups.Pendanaan)}</div></div>
  </div>
  <div class="card kpi" style="margin-top:14px;max-width:320px"><div class="label">Kenaikan (Penurunan) Kas Bersih</div><div class="value ${totalKas>=0?'pos':'neg'}">${fmtRp(totalKas)}</div></div>
  <div class="card" style="margin-top:14px">
  <div class="section-title"><h3>Rincian Pergerakan Kas</h3></div>
  <div class="tablewrap"><table class="sheet"><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kelompok</th><th>Akun Lawan</th><th>Arah</th><th>Nominal</th></tr></thead><tbody>
  ${rows.length? [...rows].reverse().map(r=>`<tr><td>${r.tanggal}</td><td>${r.keterangan||'-'}</td><td>${r.kelompok}</td><td>${r.lawanNama}</td><td>${r.arah>0?'Masuk':'Keluar'}</td><td class="num" style="color:${r.arah>0?'var(--debit)':'var(--kredit)'}">${fmtRp(r.arah*r.nominal)}</td></tr>`).join('') : '<tr><td colspan="6" class="empty">Belum ada pergerakan kas</td></tr>'}
  </tbody></table></div></div>
  <div class="mini" style="margin-top:8px">Pengelompokan otomatis: Investasi = lawan akun Aset Tetap/Aset Lainnya, Pendanaan = lawan akun Kewajiban/Modal, sisanya Operasional.</div>`;
  c.innerHTML = html;
};

let bukuBesarAkun = '';
let bukuBesarSearch = '';
RENDERERS.bukubesar = function(c){
  let html = `<div class="card">
    <div class="formgrid">

    </div>

  c.innerHTML = html;
  bindAkunPicker('bbAkun', akunId=>{ bukuBesarAkun=akunId; renderBukuBesarResult(); });
  bindSearchInput('bbSearch', v=>{ bukuBesarSearch=v; renderBukuBesarResult(); });

function importBukuBesarRows(rows){
  const akun = akunById(bukuBesarAkun); if(!akun) return toast('Pilih akun dulu');
  let ok=0; const warnings=[];
  rows.forEach((r,i)=>{
    const tanggal = String(xrow(r,'Tanggal (YYYY-MM-DD)','Tanggal')||'').trim() || todayStr();
    const keterangan = String(xrow(r,'Keterangan')||'').trim();
    const debit = Number(xrow(r,'Debit'))||0;
    const kredit = Number(xrow(r,'Kredit'))||0;
    const lawanNama = String(xrow(r,'Akun Lawan')||'').trim();
    const tagStr = String(xrow(r,'Tag (pisahkan koma)','Tag')||'').trim();
    const nominal = debit>0?debit:kredit;
    if(!lawanNama||nominal<=0){ warnings.push('Baris '+(i+2)+': data tidak lengkap, dilewati'); return; }
    const lawanAkun = DB.coa.find(a=>a.nama.trim().toLowerCase()===lawanNama.toLowerCase());
    if(!lawanAkun){ warnings.push('Baris '+(i+2)+': akun lawan "'+lawanNama+'" tidak ditemukan'); return; }
    const tags = parseTagInput(tagStr); tags.forEach(ensureTag);
    const debitId = debit>0 ? akun.id : lawanAkun.id;
    const kreditId = debit>0 ? lawanAkun.id : akun.id;
    postJurnal({ tanggal, keterangan, debitId, kreditId, nominal, sumber:'Buku Besar', ref:'import-'+uid(), tags });
    ok++;
  });
  save(); renderContent();
  toast('Impor buku besar: '+ok+' baris berhasil'+(warnings.length?(', '+warnings.length+' dilewati'):''));
  if(warnings.length) console.warn(warnings.join('\n'));
}
function renderBukuBesarResult(){
  const wrap = document.getElementById('bbResult'); if(!wrap) return;
  if(!bukuBesarAkun){ wrap.innerHTML = '<div class="empty">Pilih akun untuk melihat buku besarnya</div>'; return; }
  const akun = akunById(bukuBesarAkun);
  const isDebitNormal = normalIsDebit(akun.kategori);
  let running = 0;
  const rows = DB.jurnal.filter(j=> (j.debitId===akun.id||j.kreditId===akun.id) && matchSearch(j.keterangan, bukuBesarSearch));
  const exportRows = [];
  const headers = ['Tanggal','Keterangan','Debit','Kredit','Saldo Berjalan','Tag'];
  const ioCfg = {
    template:{ filename:'template-buku-besar.xlsx', sheetName:'Buku Besar', headers:['Tanggal (YYYY-MM-DD)','Keterangan','Debit','Kredit','Akun Lawan','Tag (pisahkan koma)'],
      exampleRows:[[todayStr(),'Contoh: Bayar listrik','',150000,'Kas','operasional']] },
    onImport: importBukuBesarRows,
    exportExcel: ()=>({ filename:'buku-besar-'+akun.nama.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.xlsx', sheetName:'Buku Besar', headers, rows: exportRows }),
    exportPdf: ()=>({ filename:'buku-besar-'+akun.nama.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.pdf', title:'Buku Besar — '+akun.nama, headers, rows: exportRows })
  };
  let html = `<div class="card">
    <div class="section-title"><h3>${akun.nama} <span class="mini">(${KAT[akun.kategori]} — ${akun.kepemilikan})</span></h3><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="hint">Saldo saat ini: <b>${fmtRp(saldoAkun(akun.id))}</b></span>${ioToolbarHtml('bukubesar', ioCfg)}</div></div>
    <div class="tablewrap"><table class="sheet"><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Debit</th><th>Kredit</th><th>Saldo Berjalan</th><th>Tag</th><th></th></tr></thead><tbody>`;
  rows.forEach(j=>{
    const isDebit = j.debitId===akun.id;
    const delta = isDebit? (isDebitNormal?j.nominal:-j.nominal) : (isDebitNormal?-j.nominal:j.nominal);
    running += delta;
    exportRows.push([j.tanggal, j.keterangan||'', isDebit?j.nominal:'', !isDebit?j.nominal:'', running, (j.tags||[]).join(', ')]);
    html += `<tr><td>${j.tanggal}</td><td>${j.keterangan||'-'}</td><td class="num">${isDebit?fmtRp(j.nominal):''}</td><td class="num">${!isDebit?fmtRp(j.nominal):''}</td><td class="num">${fmtRp(running)}</td><td>${tagChipsHtml(j.tags)}</td><td><button class="btn small editJ" data-jid="${j.id}">Edit</button> <button class="btn small danger delJ" data-jid="${j.id}">Hapus</button></td></tr>`;
  });
  if(rows.length===0) html += `<tr><td colspan="7" class="empty">Belum ada transaksi</td></tr>`;
  html += `</tbody></table></div></div>`;
  wrap.innerHTML = html;
  bindIoToolbar('bukubesar', ioCfg);
  bindJurnalRowActions(wrap);
}

function renderKasBankResult(){
  const wrap = document.getElementById('kbResult'); if(!wrap || !kasBankAkun) return;
  const akun = akunById(kasBankAkun); if(!akun) return;
  let running = 0;
  const rows = DB.jurnal.filter(j=> j.debitId===akun.id||j.kreditId===akun.id);
  let html = `<div class="card"><div class="section-title"><h3>Rincian ${akun.nama}</h3></div>

  rows.forEach(j=>{
    const masuk = j.debitId===akun.id;
    running += masuk? j.nominal : -j.nominal;
    html += `<tr><td>${j.tanggal}</td><td>${j.keterangan||'-'}</td><td class="num" style="color:var(--debit)">${masuk?fmtRp(j.nominal):''}</td><td class="num" style="color:var(--kredit)">${!masuk?fmtRp(j.nominal):''}</td><td class="num">${fmtRp(running)}</td><td><button class="btn small danger delJ" data-jid="${j.id}">Hapus</button></td></tr>`;
  });
  if(rows.length===0) html += `<tr><td colspan="6" class="empty">Belum ada transaksi</td></tr>`;
  html += `</tbody></table></div></div>`;
  wrap.innerHTML = html;
  bindJurnalRowActions(wrap);
}

/* ================= ASET TETAP ================= */
let asetSearch = '';
function hitungDepresiasiBulanan(a){
  if(!a.masaManfaatBulan || a.masaManfaatBulan<=0) return 0;
  const dasar = (a.biayaAkuisisi||0) - (a.nilaiResidu||0);
  return Math.round(dasar / a.masaManfaatBulan);
}
function akumulasiPenyusutanAset(a){
  return DB.jurnal.filter(j=>j.ref==='aset-dep-'+a.id).reduce((s,j)=>s+j.nominal,0);
}
function sudahPostingPenyusutanBulanIni(a){
  const ym = todayStr().slice(0,7);
  return DB.jurnal.some(j=>j.ref==='aset-dep-'+a.id && j.tanggal && j.tanggal.slice(0,7)===ym);
}
const ASET_HEADERS = ['Nama Aset','Jenis Aset','Tanggal Perolehan (YYYY-MM-DD)','Biaya Akuisisi','Nilai Residu','Masa Manfaat (bulan)','Akun Kredit (Kas/Utang/Modal)','Akun Aset Tetap (COA)','Akun Akumulasi Penyusutan (opsional)','Akun Beban Penyusutan (opsional)'];
function importAsetRows(rows){
  let ok=0; const warnings=[];
  rows.forEach((r,i)=>{
    const nama = String(xrow(r,'Nama Aset','Nama')||'').trim();
    const jenis = String(xrow(r,'Jenis Aset','Jenis')||'').trim();
    const tgl = String(xrow(r,'Tanggal Perolehan (YYYY-MM-DD)','Tanggal Perolehan','Tanggal')||'').trim() || todayStr();
    const biaya = Number(xrow(r,'Biaya Akuisisi'))||0;
    const residu = Number(xrow(r,'Nilai Residu'))||0;
    const masa = Number(xrow(r,'Masa Manfaat (bulan)','Masa Manfaat'))||0;
    const akunKreditNama = String(xrow(r,'Akun Kredit (Kas/Utang/Modal)','Akun Kredit')||'').trim();
    const akunAsetNama = String(xrow(r,'Akun Aset Tetap (COA)','Akun Aset Tetap','Akun Aset')||'').trim();
    const akunAkumNama = String(xrow(r,'Akun Akumulasi Penyusutan (opsional)','Akun Akumulasi Penyusutan')||'').trim();
    const akunBebanNama = String(xrow(r,'Akun Beban Penyusutan (opsional)','Akun Beban Penyusutan')||'').trim();
    if(!nama||!jenis||!biaya||!akunKreditNama||!akunAsetNama){ warnings.push('Baris '+(i+2)+': data wajib tidak lengkap, dilewati'); return; }
    const akunKredit = DB.coa.find(a=>a.nama.trim().toLowerCase()===akunKreditNama.toLowerCase());
    const akunAset = DB.coa.find(a=>a.nama.trim().toLowerCase()===akunAsetNama.toLowerCase());
    if(!akunKredit||!akunAset){ warnings.push('Baris '+(i+2)+': akun "'+(!akunKredit?akunKreditNama:akunAsetNama)+'" tidak ditemukan di COA'); return; }
    if(jenis && !DB.jenisAsetCustom.includes(jenis)) DB.jenisAsetCustom.push(jenis);
    const kepemilikan = akunAset.kepemilikan;
    let akunAkumId = null, akunBebanId = null;
    if(akunAkumNama){ const f = DB.coa.find(a=>a.nama.trim().toLowerCase()===akunAkumNama.toLowerCase()); if(f) akunAkumId=f.id; }
    if(akunBebanNama){ const f = DB.coa.find(a=>a.nama.trim().toLowerCase()===akunBebanNama.toLowerCase()); if(f) akunBebanId=f.id; }
    if(masa>0 && !akunAkumId){
      let akumAkun = DB.coa.find(x=>x.kategori==='KAT' && x.kepemilikan===kepemilikan && x.nama.toLowerCase().includes(jenis.toLowerCase()));
      if(!akumAkun) akumAkun = addAkun('KAT', 'Akumulasi Penyusutan - '+jenis, kepemilikan, 'Kontra akun aset tetap (otomatis, impor)');
      akunAkumId = akumAkun.id;
    }
    if(masa>0 && !akunBebanId){
      let bebanAkun = DB.coa.find(x=>x.kategori==='BO' && x.kepemilikan===kepemilikan && x.nama==='Beban Penyusutan Aset');
      if(!bebanAkun) bebanAkun = addAkun('BO', 'Beban Penyusutan Aset', kepemilikan, 'Otomatis dari fitur Aset Tetap (impor)');
      akunBebanId = bebanAkun.id;
    }
    const noAset = nextKode('AST');
    const asetObj = { id:uid(), noAset, nama, jenis, tanggalPerolehan:tgl, biayaAkuisisi:biaya, nilaiResidu:residu, masaManfaatBulan:masa, akunKreditId:akunKredit.id, akunAsetId:akunAset.id, akunAkumulasiId:akunAkumId||null, akunBebanId:akunBebanId||null, statusAktif:true };
    DB.aset.push(asetObj);
    postJurnal({ tanggal:tgl, keterangan:'Perolehan aset: '+nama+' ('+noAset+')', debitId:akunAset.id, kreditId:akunKredit.id, nominal:biaya, sumber:'Aset', ref:'aset-perolehan-'+asetObj.id });
    ok++;
  });
  save(); renderContent();
  toast('Impor aset: '+ok+' berhasil'+(warnings.length?(', '+warnings.length+' dilewati'):''));
  if(warnings.length) console.warn(warnings.join('\n'));
}
function asetIoCfg(){
  return {
    template:{ filename:'template-aset.xlsx', sheetName:'Aset Tetap', headers:ASET_HEADERS,
      exampleRows:[[ 'Contoh: Motor Beat 2023','Kendaraan',todayStr(),25000000,2000000,48,'Kas Bisnis A','Aset Tetap - Kendaraan Motor','','' ]] },
    onImport: importAsetRows,
    exportExcel: ()=>({ filename:'aset-tetap-'+todayStr()+'.xlsx', sheetName:'Aset Tetap',
      headers:['No Aset','Nama','Jenis','Tanggal Perolehan','Biaya Akuisisi','Penyusutan/bln','Akum Penyusutan','Nilai Buku','Status'],
      rows: DB.aset.map(a=>{ const dep=hitungDepresiasiBulanan(a); const akum=akumulasiPenyusutanAset(a); const nilaiBuku=(a.biayaAkuisisi||0)-akum;
        return [a.noAset,a.nama,a.jenis,a.tanggalPerolehan,a.biayaAkuisisi,dep,akum,nilaiBuku, a.statusAktif===false?'Dilepas':'Aktif']; }) }),
    exportPdf: ()=>({ filename:'aset-tetap-'+todayStr()+'.pdf', title:'Daftar Aset Tetap',
      headers:['No Aset','Nama','Jenis','Biaya Akuisisi','Akum Penyusutan','Nilai Buku','Status'],
      rows: DB.aset.map(a=>{ const akum=akumulasiPenyusutanAset(a); const nilaiBuku=(a.biayaAkuisisi||0)-akum;
        return [a.noAset,a.nama,a.jenis,fmtRp(a.biayaAkuisisi),fmtRp(akum),fmtRp(nilaiBuku), a.statusAktif===false?'Dilepas':'Aktif']; }) })
  };
}

          const namaBeban = bebanInput.trim();
          let bebanAkun = DB.coa.find(x=>x.kategori==='BO' && x.kepemilikan===kep && x.nama===namaBeban);
          if(!bebanAkun) bebanAkun = addAkun('BO', namaBeban, kep, 'Akun beban penyusutan (dari fitur Aset Tetap)');
          a.akunBebanId = bebanAkun.id;
        }
      }
      const jPerolehan = DB.jurnal.find(x=>x.ref==='aset-perolehan-'+a.id);
      if(jPerolehan){ jPerolehan.tanggal=a.tanggalPerolehan; jPerolehan.nominal=biaya; jPerolehan.keterangan='Perolehan aset: '+a.nama+' ('+a.noAset+')'; }
      save(); renderContent(); toast('Aset diperbarui');
    });
  });
};

function initApp(){
  if(!FIREBASE_CONFIGURED){
    renderCloudConfigMissingScreen();
    return;
  }
  firebaseAuth.onAuthStateChanged(user=>{
    if(!user){
      if(cloudUnsub){ cloudUnsub(); cloudUnsub=null; }
      cloudDocRef = null;
      renderCloudLoginScreen();
      return;
    }
    setupCloudSync(user);
  });
}

let appBooted = false;
function renderCloudLoginScreen(){
  const shell = document.getElementById('shell'); shell.style.display='none';
  let scr = document.getElementById('cloudLoginScreen');
  if(!scr){ scr = document.createElement('div'); scr.id='cloudLoginScreen'; document.body.appendChild(scr); }
  scr.style.cssText = 'min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--cream);padding:20px';

      <div style="text-align:center;margin-bottom:16px">

      <div class="field" style="margin-bottom:10px"><label>Email</label><input id="cloudEmail" type="email" placeholder="nama@email.com"></div>
      <div class="field" style="margin-bottom:14px"><label>Password</label><input id="cloudPass" type="password" placeholder="minimal 6 karakter"></div>

      <div class="mini" style="margin-top:12px;text-align:center">
        ${mode==='register'? 'Sudah punya akun? <a href="#" id="toLogin">Masuk di sini</a>' : 'Belum punya akun? <a href="#" id="toRegister">Daftar di sini</a>'}
      </div>
    </div>`;
    document.getElementById('btnCloudAuth').addEventListener('click', ()=>{
      const email = document.getElementById('cloudEmail').value.trim();
      const pass = document.getElementById('cloudPass').value;
      if(!email||!pass) return toast('Isi email & password');
      const action = mode==='register'
        ? firebaseAuth.createUserWithEmailAndPassword(email, pass)
        : firebaseAuth.signInWithEmailAndPassword(email, pass);
      action.catch(err=> toast('Gagal: '+err.message));
    });
    const toReg = document.getElementById('toRegister'); if(toReg) toReg.addEventListener('click', e=>{ e.preventDefault(); mode='register'; draw(); });
    const toLog = document.getElementById('toLogin'); if(toLog) toLog.addEventListener('click', e=>{ e.preventDefault(); mode='login'; draw(); });

function ensureLocalUserForCloud(cloudUser){
  let lu = DB.users.find(u=>u.email===cloudUser.email);
  if(!lu){ lu = { id:uid(), email:cloudUser.email, password:'', role:'Admin' }; DB.users.push(lu); }
  DB.currentUserId = lu.id;
}

function setupCloudSync(cloudUser){
  const scr = document.getElementById('cloudLoginScreen'); if(scr) scr.remove();
  cloudDocRef = firebaseDb.collection('ledgers').doc(cloudUser.uid);
  cloudDocRef.get().then(snap=>{
    if(snap.exists && snap.data().db){
      applyRemoteDb(snap.data().db);
    } else {
      load(); // no cloud data yet — bootstrap from local/fresh, then push it up below
    }
    ensureLocalUserForCloud(cloudUser);
    save();
    bootUiOnce();
    listenCloudChanges();
  }).catch(err=>{
    toast('Gagal memuat data cloud, memakai data lokal untuk sementara: '+err.message);
    load(); ensureLocalUserForCloud(cloudUser); bootUiOnce();
  });
}

function listenCloudChanges(){
  if(cloudUnsub || !cloudDocRef) return;
  cloudUnsub = cloudDocRef.onSnapshot(snap=>{
    if(!snap.exists) return;
    const data = snap.data();
    if(!data || !data.db) return;
    applyRemoteDb(data.db);
    if(appBooted){ renderNav(); renderContent(); toast('Data diperbarui dari device lain'); }
  }, err=> console.warn('Sinkron cloud terputus:', err));
}

function bootUiOnce(){
  if(appBooted){ renderNav(); switchTab(currentTab); return; }
  appBooted = true;
  finishInit();
}
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarBackdrop').classList.add('open'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarBackdrop').classList.remove('open'); }
function toggleSidebar(){ document.getElementById('sidebar').classList.contains('open') ? closeSidebar() : openSidebar(); }

function finishInit(){
  renderNav();
  switchTab('dashboard');
  document.getElementById('hamburgerBtn').addEventListener('click', toggleSidebar);
  document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebar);
  const u = getCurrentUser();
  const actions = document.getElementById('topbar-actions');
  if(u && actions && !document.getElementById('userBadge')){
    const span = document.createElement('span');
    span.id = 'userBadge'; span.className='mini';
    span.style.marginRight='8px';
    span.textContent = u.email+' ('+u.role+')';
    actions.prepend(span);
    const logoutBtn = document.createElement('button');
    logoutBtn.className='btn small'; logoutBtn.textContent='Keluar';
    logoutBtn.addEventListener('click', logout);
    actions.appendChild(logoutBtn);
  }

  document.getElementById('btnExport').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'inspira-ledger-backup-'+todayStr()+'.json';
    a.click(); URL.revokeObjectURL(url);
    toast('Backup diunduh');
  });
  document.getElementById('btnImport').addEventListener('click', ()=> document.getElementById('fileImport').click());
  document.getElementById('fileImport').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(!data.coa) throw new Error('format tidak dikenali');
        if(!confirm('Restore akan menimpa semua data saat ini. Lanjutkan?')) return;
        DB = data; save(); switchTab('dashboard'); toast('Data berhasil di-restore');
      }catch(err){ toast('File tidak valid: '+err.message); }
    };
    reader.readAsText(file);
  });
}

document.addEventListener('DOMContentLoaded', initApp);
