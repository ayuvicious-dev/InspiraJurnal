<!DOCTYPE html>
<html lang="id">
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf-autotable.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspira Ledger — Akuntansi Terintegrasi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C2620">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inspira Ledger">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7F1E8;
  --paper:#FFFDF9;
  --ink:#2C2620;
  --ink-soft:#6B6055;
  --terracotta:#C1603D;
  --terracotta-dark:#9E4B2F;
  --sage:#7C8B6F;
  --sage-soft:#E4E9DE;
  --line:#E4DACB;
  --debit:#2F6B4F;
  --kredit:#B0432C;
  --warn:#C88A2A;
  --shadow: 0 1px 2px rgba(44,38,32,.06), 0 4px 14px rgba(44,38,32,.05);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--cream);color:var(--ink)}
body{font-size:14px;line-height:1.45}
h1,h2,h3,h4{font-family:'Poppins',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:13.5px}
table{border-collapse:collapse;width:100%}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#D8CBB4;border-radius:8px}

/* ---- shell ---- */
#shell{display:flex;min-height:100vh}
#sidebar{
  width:236px;flex:none;background:linear-gradient(180deg,#2C2620,#241F1A);
  color:#EFE7DA;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden;
}
#brand{padding:22px 20px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
#brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--terracotta),var(--terracotta-dark));display:flex;align-items:center;justify-content:center;font-family:'Poppins';font-weight:700;color:#fff;font-size:16px;margin-bottom:10px}
#brand h1{font-size:16.5px;color:#fff}
#brand p{margin:2px 0 0;font-size:11px;color:#B7AB98;letter-spacing:.04em;text-transform:uppercase}
nav{padding:10px 10px 20px;flex:1}
.navgroup{margin-top:14px}
.navgroup .glabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#8B7F6E;padding:6px 10px 4px;font-weight:600}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;color:#D8CDBC;text-align:left;padding:9px 10px;border-radius:8px;font-size:13.3px;margin-bottom:1px;transition:.12s}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navbtn.active{background:var(--terracotta);color:#fff;font-weight:600}
.navbtn .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:none}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{
  position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);
  padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;
}
#topbar h2{font-size:19px}
#topbar .sub{color:var(--ink-soft);font-size:12.5px;margin-top:2px}
#topbar-actions{display:flex;gap:8px;align-items:center}
#content{padding:24px 28px 60px;max-width:1360px;width:100%;overflow-x:hidden}

/* ---- generic components ---- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){.grid.cols-4{grid-template-columns:repeat(2,1fr)}.grid.cols-3{grid-template-columns:repeat(2,1fr)}}

.kpi .label{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .value{font-family:'Poppins';font-size:22px;margin-top:6px;font-weight:600}
.kpi .value.pos{color:var(--debit)}
.kpi .value.neg{color:var(--kredit)}

.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--terracotta);color:var(--terracotta-dark)}
.btn.primary{background:var(--terracotta);color:#fff;border-color:var(--terracotta)}
.btn.primary:hover{background:var(--terracotta-dark);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--kredit)}
.btn.small{padding:5px 10px;font-size:12px;border-radius:7px}

.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.section-title h3{font-size:15.5px}
.section-title .hint{font-size:12px;color:var(--ink-soft)}

.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
table.sheet{min-width:100%}
table.sheet thead th{
  position:sticky;top:0;background:#F1E9DC;color:var(--ink);font-size:11.3px;text-transform:uppercase;letter-spacing:.03em;
  padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700;
}
table.sheet tbody td{padding:7px 10px;border-bottom:1px solid #EFE7D9;font-size:13px;white-space:nowrap}
table.sheet td.wrap-cell{white-space:normal;min-width:160px;max-width:280px}
table.sheet td.akun-nama-cell{white-space:normal;min-width:230px;max-width:440px}
table.sheet td.akun-nama-cell input{min-width:220px}
table.sheet td select{min-width:118px}
table.sheet td input{min-width:90px}
table.sheet td.wrap-cell input{min-width:160px}
table.sheet tbody tr:hover{background:#FBF6EC}
table.sheet tbody tr:last-child td{border-bottom:none}
table.sheet td input,table.sheet td select{border:1px solid transparent;background:transparent;width:100%;padding:4px 5px;border-radius:6px}
table.sheet td input:hover,table.sheet td select:hover{border-color:var(--line)}
table.sheet td input:focus,table.sheet td select:focus{outline:none;border-color:var(--terracotta);background:#fff}
.num{font-variant-numeric:tabular-nums;text-align:right}
.center{text-align:center}

.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.tag.pribadi{background:#E9E2F3;color:#5B4A8A}
.tag.a{background:#DDEBE0;color:#2F6B4F}
.tag.b{background:#FCE8D9;color:#B0602A}
.tag.c{background:#DCEAF3;color:#2D6B8A}
.tag.debit{background:#E4EFE8;color:var(--debit)}
.tag.kredit{background:#F5E1DA;color:var(--kredit)}

.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.field label{display:block;font-size:11.3px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.field input,.field select,.field textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13.5px;color:var(--ink);
}
.field textarea{resize:vertical;min-height:38px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--terracotta);box-shadow:0 0 0 3px rgba(193,96,61,.12)}

.tabs2{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tabs2 button{background:none;border:none;padding:9px 14px;font-size:13.3px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs2 button.active{color:var(--terracotta-dark);border-color:var(--terracotta)}

.empty{padding:34px 16px;text-align:center;color:var(--ink-soft)}
.empty .big{font-size:26px;margin-bottom:6px}

.recap{background:#F1EADC;border-radius:10px;padding:10px 14px;margin-top:10px;font-size:12.8px;display:flex;gap:22px;flex-wrap:wrap}
.recap b{font-family:'Poppins';font-size:14.5px}

.badge-balance{padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
.badge-balance.ok{background:#DDEBE0;color:var(--debit)}
.badge-balance.bad{background:#F5DAD2;color:var(--kredit)}

.rowline{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two-col{grid-template-columns:1fr}}

.loc-block{margin-bottom:16px}
.loc-block h4{font-size:12.8px;color:var(--terracotta-dark);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12.3px;margin:0 6px 6px 0}
.chip.low{border-color:var(--kredit);background:#FBEDE8}

.toast{position:fixed;bottom:20px;right:20px;background:#2C2620;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);z-index:50;opacity:0;transform:translateY(8px);transition:.2s}
.toast.show{opacity:1;transform:translateY(0)}

.hidden{display:none !important}
.mini{font-size:11.5px;color:var(--ink-soft)}
a.resepLink:hover,a.subResepLink:hover,a.crumbLink:hover{text-decoration:underline !important}
a.crumbLink{color:var(--ink-soft);text-decoration:none}
a.crumbLink:last-child{color:var(--terracotta-dark);font-weight:600}

/* ---- Searchable account picker ---- */
.akunPickerInput{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13.5px;color:var(--ink)}
.akunPickerInput:focus{outline:none;border-color:var(--terracotta);box-shadow:0 0 0 3px rgba(193,96,61,.12)}
.akunPickerList{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:240px;overflow-y:auto;
  background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:40}
.akunPickerItem{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #F1EADC}
.akunPickerItem:last-child{border-bottom:none}
.akunPickerItem:hover{background:#FBF6EC}

/* ---- Resep grid: vertical cards (image on top, details stacked below) ---- */
.resep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.resep-card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column}
.resep-card-img{width:100%;height:140px;background:#F1EADC;display:flex;align-items:center;justify-content:center;font-size:40px;flex:none}
.resep-card-img img{width:100%;height:100%;object-fit:cover}
.resep-card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.resep-card-body a.resepLink{color:var(--terracotta-dark);font-weight:700;font-size:14.5px;text-decoration:none;margin-bottom:2px}
.resep-card-row{display:flex;justify-content:space-between;align-items:center;font-size:12.8px;padding:2px 0;border-bottom:1px dashed #EEE3D2}
.resep-card-row:last-of-type{border-bottom:none}

/* ---- Mobile layout: off-canvas sidebar, compact tables (BCA Bisnis style) ---- */
#hamburgerBtn{display:none}
#sidebarBackdrop{display:none}
@media(max-width:820px){
  #shell{display:block}
  #sidebar{
    position:fixed;top:0;left:0;height:100vh;min-height:0;width:78vw;max-width:300px;z-index:60;overflow-y:auto;
    transform:translateX(-100%);transition:transform .22s ease;box-shadow:8px 0 24px rgba(0,0,0,.25);
  }
  #sidebar.open{transform:translateX(0)}
  #sidebarBackdrop{
    display:none;position:fixed;inset:0;background:rgba(20,16,12,.45);z-index:55;
  }
  #sidebarBackdrop.open{display:block}
  #main{width:100%}
  #hamburgerBtn{
    display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;
    border-radius:9px;border:1px solid var(--line);background:var(--paper);font-size:18px;margin-right:8px;flex:none;
  }
  #topbar{padding:10px 12px;flex-wrap:nowrap;gap:8px}
  #topbar h2{font-size:16px}
  #topbar .sub{display:none}
  #topbar-actions{gap:5px}
  #topbar-actions .btn{padding:6px 9px;font-size:11.5px}
  #userBadge{display:none}
  #content{padding:12px 10px 40px}
  .card{padding:12px 12px;border-radius:11px}
  .grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr 1fr;gap:8px}
  .kpi .value{font-size:16px}
  .kpi .label{font-size:10px}
  .formgrid{grid-template-columns:1fr 1fr;gap:8px}
  .two-col{grid-template-columns:1fr}
  table.sheet thead th{font-size:10px;padding:7px 6px}
  table.sheet tbody td{font-size:12px;padding:6px 6px}
  table.sheet td select,table.sheet td input{font-size:12px;min-width:76px}
  table.sheet td.wrap-cell{min-width:120px;max-width:180px}
  .tablewrap{-webkit-overflow-scrolling:touch;border-radius:9px}
  .section-title{gap:8px}
  .section-title h3{font-size:14px}
  .btn{padding:7px 11px;font-size:12.5px}
  #brand{padding:16px 16px 12px}
  .resep-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .resep-card-img{height:100px;font-size:28px}
  .resep-card-body{padding:8px 10px 10px}
}
</style>
</head>
<body>
<div id="shell">
  <div id="sidebarBackdrop"></div>
  <aside id="sidebar">
    <div id="brand">
      <div class="mark">IE</div>
      <h1>Inspira Ledger</h1>
      <p>Akuntansi Terpadu</p>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center">
        <button id="hamburgerBtn">☰</button>
        <div>
          <h2 id="pagetitle">Dashboard</h2>
          <div class="sub" id="pagesub">Ringkasan posisi keuangan</div>
        </div>
      </div>
      <div id="topbar-actions">
        <button class="btn" id="btnExport">⬇ Backup JSON</button>
        <button class="btn" id="btnImport">⬆ Restore</button>
        <input type="file" id="fileImport" accept="application/json" class="hidden">
      </div>
    </div>
    <div id="content"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   INSPIRA LEDGER — Aplikasi Akuntansi Terpadu (offline, localStorage)
   ============================================================ */
const STORAGE_KEY = 'inspira_ledger_db_v1';
const KEPEMILIKAN = ['Pribadi','Bisnis A','Bisnis B','Bisnis C'];
const KAT = {
  AL:'Aset Lancar', PS:'Aset Persediaan', ALL:'Aset Lancar Lainnya', AT:'Aset Tetap',
  KAT:'Kontra Aset Tetap', ALN:'Aset Lainnya', KW:'Kewajiban', MD:'Modal',
  PD:'Pendapatan', BPP:'Beban Pokok Penjualan', BO:'Beban Operasional', BL:'Beban Lain'
};
/* Fixed display order for account categories, used everywhere a list of accounts is shown
   (COA table, pickers, etc.) so related accounts always group together top-to-bottom. */
const KATEGORI_ORDER = ['AL','PS','ALL','ALN','AT','KAT','KW','MD','PD','BPP','BO','BL'];
function sortAkunList(list){
  return [...list].sort((a,b)=>{
    const oa = KATEGORI_ORDER.indexOf(a.kategori), ob = KATEGORI_ORDER.indexOf(b.kategori);
    if(oa!==ob) return oa-ob;
    if(a.kepemilikan!==b.kepemilikan) return KEPEMILIKAN.indexOf(a.kepemilikan)-KEPEMILIKAN.indexOf(b.kepemilikan);
    return a.nama.localeCompare(b.nama);
  });
}
const DEBIT_NORMAL = new Set(['AL','PS','ALL','AT','ALN','BPP','BO','BL']);
const KREDIT_NORMAL = new Set(['KAT','KW','MD','PD']);
const LOKASI_FREEZER = Array.from({length:13},(_,i)=>'Freezer CH-'+String(i+1).padStart(2,'0'));
const LOKASI_KULKAS  = Array.from({length:6},(_,i)=>'Kulkas SH-'+String(i+1).padStart(2,'0'));
const LOKASI_ALL = [...LOKASI_FREEZER, ...LOKASI_KULKAS];
// default (bawaan) locations minus any the user has renamed/deleted via "Kelola Lokasi Custom"
function getEffectiveLokasiDefault(){ return LOKASI_ALL.filter(l=>!DB.lokasiHapus.includes(l)); }

function uid(){ return 'x'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function fmtRp(n){ n = Number(n)||0; return 'Rp' + n.toLocaleString('id-ID',{maximumFractionDigits:0}); }
function fmtNum(n,d=2){ n=Number(n)||0; return n.toLocaleString('id-ID',{maximumFractionDigits:d}); }
function fmtRpShort(n){
  n = Number(n)||0;
  const abs = Math.abs(n);
  if(abs>=1000000000) return (n/1000000000).toFixed(1).replace(/\.0$/,'')+'M';
  if(abs>=1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'')+'jt';
  if(abs>=1000) return (n/1000).toFixed(0)+'rb';
  return String(n);
}
/* Laba Rugi totals (Pendapatan/HPP/Beban Operasional/Beban Lain/Laba) for an arbitrary date range,
   independent of the lrFilter UI state — used by charts and period comparisons. */
function hitungLabaRugiPeriode(dari, sampai){
  const jlist = DB.jurnal.filter(j=> (!dari||j.tanggal>=dari) && (!sampai||j.tanggal<=sampai));
  const pd = sumByKategoriKepemilikanFiltered('PD', null, jlist);
  const bpp = sumByKategoriKepemilikanFiltered('BPP', null, jlist);
  const bo = sumByKategoriKepemilikanFiltered('BO', null, jlist);
  const bl = sumByKategoriKepemilikanFiltered('BL', null, jlist);
  return { pd, bpp, bo, bl, beban: bpp+bo+bl, laba: pd-bpp-bo-bl };
}
/* Generates `jumlah` consecutive periods (bulanan/tahunan) ending at the current month/year. */
function generatePeriods(tipe, jumlah){
  const now = new Date();
  const periods = [];
  const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agt','Sep','Okt','Nov','Des'];
  for(let i=jumlah-1;i>=0;i--){
    if(tipe==='tahunan'){
      const y = now.getFullYear()-i;
      periods.push({ label:String(y), dari:y+'-01-01', sampai:y+'-12-31' });
    } else {
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const endD = new Date(d.getFullYear(), d.getMonth()+1, 0);
      const pad=n=>String(n).padStart(2,'0');
      periods.push({
        label: BULAN[d.getMonth()]+' '+d.getFullYear(),
        dari: d.getFullYear()+'-'+pad(d.getMonth()+1)+'-01',
        sampai: endD.getFullYear()+'-'+pad(endD.getMonth()+1)+'-'+pad(endD.getDate())
      });
    }
  }
  return periods;
}
/* Simple dependency-free grouped bar chart rendered as inline SVG. series: [{name,color,values}]. */
function svgBarChart(labels, series, opts={}){
  const w = opts.width||640, h = opts.height||220, pad = {l:46,r:10,t:14,b:32};
  const innerW = w-pad.l-pad.r, innerH = h-pad.t-pad.b;
  const maxVal = Math.max(1, ...series.flatMap(s=>s.values));
  const groupW = innerW/Math.max(1,labels.length);
  const barW = Math.min(26, groupW/(series.length+1.2));
  let svg = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" preserveAspectRatio="xMidYMid meet">`;
  for(let i=0;i<=4;i++){
    const y = pad.t + innerH - (innerH*i/4);
    svg += `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w-pad.r}" y2="${y.toFixed(1)}" stroke="#EFE7D9" stroke-width="1"/>`;
    svg += `<text x="${pad.l-6}" y="${(y+3).toFixed(1)}" font-size="9" fill="#9A8E7C" text-anchor="end">${fmtRpShort(maxVal*i/4)}</text>`;
  }
  labels.forEach((lab, i)=>{
    const gx = pad.l + groupW*i + groupW/2;
    series.forEach((s, si)=>{
      const val = s.values[i]||0;
      const bh = innerH * (val/maxVal);
      const bx = gx - (series.length*barW)/2 + si*barW;
      svg += `<rect x="${bx.toFixed(1)}" y="${(pad.t+innerH-bh).toFixed(1)}" width="${(barW-3).toFixed(1)}" height="${bh.toFixed(1)}" style="fill:${s.color}" rx="2"><title>${s.name}: ${fmtRp(val)}</title></rect>`;
    });
    svg += `<text x="${gx.toFixed(1)}" y="${h-9}" font-size="9.5" fill="#6B6153" text-anchor="middle">${lab}</text>`;
  });
  svg += `</svg>`;
  return svg;
}
/* Simple dependency-free donut chart. segments: [{label,value,color}]. */
function svgDonutChart(segments, opts={}){
  const size = opts.size||160, stroke = opts.stroke||22, r = (size-stroke)/2, cx=size/2, cy=size/2;
  const total = segments.reduce((s,x)=>s+Math.max(0,x.value),0) || 1;
  const circumference = 2*Math.PI*r;
  let offset = 0;
  let svg = `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">`;
  segments.forEach(seg=>{
    const val = Math.max(0,seg.value);
    const frac = val/total;
    const dash = circumference*frac;
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:${seg.color}" stroke-width="${stroke}"
      stroke-dasharray="${dash.toFixed(1)} ${(circumference-dash).toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})">
      <title>${seg.label}: ${Math.round(frac*100)}%</title></circle>`;
    offset += dash;
  });
  svg += `<text x="${cx}" y="${cy+4}" font-size="13" font-weight="700" text-anchor="middle" fill="var(--ink)">${Math.round((segments[0]?.value||0)/total*100)}%</text>`;
  svg += `</svg>`;
  return svg;
}

// Ekspor array-of-array (baris pertama = header) jadi file .xlsx dan diunduh.
function exportAoaToExcel(filename, sheetName, aoa){
  try{
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, (sheetName||'Sheet1').slice(0,31));
    XLSX.writeFile(wb, filename);
    toast('File Excel diunduh');
  }catch(err){ toast('Gagal membuat Excel: '+err.message); }
}
// headers: array kolom. rows: array of array (nilai per kolom, urutan sama dengan headers).
function exportRowsToExcel(filename, sheetName, headers, rows){ exportAoaToExcel(filename, sheetName, [headers, ...rows]); }
// Template kosong: header saja + (opsional) satu baris contoh berwarna sebagai panduan.
function downloadExcelTemplate(filename, sheetName, headers, exampleRows){ exportAoaToExcel(filename, sheetName, [headers, ...(exampleRows||[])]); }

// Ekspor tabel ke PDF (pakai jsPDF + autotable, sudah dimuat di head).
function exportRowsToPdf(filename, title, headers, rows, opts){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: (opts&&opts.landscape!==false && headers.length>5) ? 'landscape':'portrait', unit:'pt' });
    doc.setFontSize(13); doc.setFont(undefined,'bold'); doc.text(title, 32, 28);
    doc.setFontSize(9); doc.setFont(undefined,'normal'); doc.text('Diunduh: '+new Date().toLocaleString('id-ID'), 32, 42);
    doc.autoTable({ head:[headers], body:rows, startY:52, styles:{fontSize:8,cellPadding:4}, headStyles:{fillColor:[193,96,61]}, margin:{left:32,right:32} });
    doc.save(filename);
    toast('File PDF diunduh');
  }catch(err){ toast('Gagal membuat PDF: '+err.message); }
}

// Baca file .xlsx/.xls yang dipilih user -> array of object (key = nama header di baris pertama).
function readExcelFile(file, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      cb(rows, null);
    }catch(err){ cb(null, err); }
  };
  reader.onerror = ()=> cb(null, new Error('Gagal membaca file'));
  reader.readAsArrayBuffer(file);
}
// Ambil nilai kolom dari 1 baris hasil readExcelFile, cocokkan nama kolom tanpa peduli besar/kecil huruf & spasi.
function xrow(row, ...names){
  const keys = Object.keys(row);
  for(const name of names){
    const found = keys.find(k=> k.trim().toLowerCase()===name.trim().toLowerCase());
    if(found!==undefined) return row[found];
  }
  return '';
}
// Pasang tombol "Template", "Impor Excel", "Ekspor Excel", (opsional) "Ekspor PDF" ke satu container.
// cfg: { template:{filename,sheetName,headers,exampleRows}, onImport:file=>{}, exportExcel:()=>({filename,sheetName,headers,rows}), exportPdf:()=>({filename,title,headers,rows}) }
function ioToolbarHtml(prefix, cfg){
  let html = '<div style="display:flex;gap:6px;flex-wrap:wrap">';
  if(cfg.template) html += `<button class="btn small" id="${prefix}BtnTemplate" type="button">📄 Template</button>`;
  if(cfg.onImport){ html += `<button class="btn small" id="${prefix}BtnImport" type="button">⬆ Impor Excel</button><input type="file" id="${prefix}FileImport" accept=".xlsx,.xls" class="hidden">`; }
  if(cfg.exportExcel) html += `<button class="btn small" id="${prefix}BtnExpXlsx" type="button">⬇ Excel</button>`;
  if(cfg.exportPdf) html += `<button class="btn small" id="${prefix}BtnExpPdf" type="button">⬇ PDF</button>`;

function bindIoToolbar(prefix, cfg){
  if(cfg.template){
    const b = document.getElementById(prefix+'BtnTemplate');
    if(b) b.addEventListener('click', ()=> downloadExcelTemplate(cfg.template.filename, cfg.template.sheetName, cfg.template.headers, cfg.template.exampleRows));
  }
  if(cfg.onImport){
    const btn = document.getElementById(prefix+'BtnImport'), inp = document.getElementById(prefix+'FileImport');
    if(btn && inp){
      btn.addEventListener('click', ()=> inp.click());
      inp.addEventListener('change', e=>{
        const file = e.target.files[0]; if(!file) return;
        readExcelFile(file, (rows, err)=>{
          inp.value='';
          if(err) return toast('File tidak valid: '+err.message);
          if(!rows || rows.length===0) return toast('File Excel kosong / tidak ada data');
          cfg.onImport(rows);
        });
      });
    }
  }
  if(cfg.exportExcel){
    const b = document.getElementById(prefix+'BtnExpXlsx');
    if(b) b.addEventListener('click', ()=>{ const d = cfg.exportExcel(); exportRowsToExcel(d.filename, d.sheetName, d.headers, d.rows); });
  }
  if(cfg.exportPdf){
    const b = document.getElementById(prefix+'BtnExpPdf');
    if(b) b.addEventListener('click', ()=>{ const d = cfg.exportPdf(); exportRowsToPdf(d.filename, d.title, d.headers, d.rows); });
  }
}

/* One-time migrations for people upgrading from an older saved version — each runs exactly once
   per browser (guarded by a flag on DB) so re-opening the app doesn't repeat them. */
function runOneTimeMigrations(){
  if(!DB._migrated_clearTrialKalender){
    DB.budgetKalender = []; // old manual trial entries — calendar is now auto-recommended, safe to clear
    DB._migrated_clearTrialKalender = true;
  }
  if(!DB._migrated_seedBudgetKategori){
    MENU_KATEGORI_PRIORITAS.forEach(kat=> ensureInList('jenisResepCustom', kat));
    DB._migrated_seedBudgetKategori = true;
  }
  if(!DB._migrated_asetAkumOtomatis){
    (DB.aset||[]).forEach(a=>{
      if(a.masaManfaatBulan>0 && !a.akunAkumulasiId && a.akunAsetId){
        const akunAset = akunById(a.akunAsetId);
        if(akunAset){
          let akumAkun = DB.coa.find(x=>x.kategori==='KAT' && x.kepemilikan===akunAset.kepemilikan && x.nama.toLowerCase().includes((a.jenis||'').toLowerCase()));
          if(!akumAkun) akumAkun = addAkun('KAT', 'Akumulasi Penyusutan - '+(a.jenis||a.nama), akunAset.kepemilikan, 'Kontra akun aset tetap (otomatis)');
          a.akunAkumulasiId = akumAkun.id;
        }
      }
    });
    DB._migrated_asetAkumOtomatis = true;
  }
  if(!DB._migrated_asetBebanOtomatis){
    (DB.aset||[]).forEach(a=>{
      if(a.masaManfaatBulan>0 && !a.akunBebanId && a.akunAsetId){
        const akunAset = akunById(a.akunAsetId);
        if(akunAset){
          let bebanAkun = DB.coa.find(x=>x.kategori==='BO' && x.kepemilikan===akunAset.kepemilikan && x.nama==='Beban Penyusutan Aset');
          if(!bebanAkun) bebanAkun = addAkun('BO', 'Beban Penyusutan Aset', akunAset.kepemilikan, 'Otomatis dari fitur Aset Tetap');
          a.akunBebanId = bebanAkun.id;
        }
      }
    });
    DB._migrated_asetBebanOtomatis = true;
  }
}

function ensureAutoAccounts(){
  getAllKepemilikan().forEach(kep=>{
    if(!DB.coa.find(a=>a.kategori==='BO' && a.kepemilikan===kep && a.nama==='Beban Penyusutan Aset')){
      addAkun('BO','Beban Penyusutan Aset', kep, 'Otomatis dari fitur Aset Tetap');

let cloudDocRef = null;

let applyingRemoteSnapshot = false;
let pendingCloudWrite = null;
function scheduleCloudPush(){
  if(!cloudDocRef || applyingRemoteSnapshot) return;
  clearTimeout(pendingCloudWrite);
  pendingCloudWrite = setTimeout(()=>{
    cloudDocRef.set({ db: JSON.stringify(DB), updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
      .catch(err=> console.warn('Gagal menyimpan ke cloud:', err));
  }, 600);
}
function applyRemoteDb(rawJson){
  applyingRemoteSnapshot = true;
  try{ DB = JSON.parse(rawJson); }catch(e){ applyingRemoteSnapshot=false; return; }
  if(!DB.coa || DB.coa.length===0) seedCOA();
  const fresh = freshDB();
  Object.keys(fresh).forEach(k=>{ if(DB[k]===undefined) DB[k] = fresh[k]; });
  ensureAutoAccounts();
  runOneTimeMigrations();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
  applyingRemoteSnapshot = false;
}

/* ---- Penyesuaian Stok Manual (+/-) — dipakai di Persediaan Bahan (produk) & Persediaan Barang (barang) ----
   Menambah/mengurangi stok secara manual (mis. stok fisik vs catatan beda) dan otomatis
   memposting jurnal yang mengubah nilai Persediaan di Neraca serta Pendapatan/Beban Lain-lain di Laba Rugi. */
function akunPersediaanUntuk(kepemilikan, tipeInventaris){
  if(tipeInventaris==='barang'){
    return DB.coa.find(a=>a.kategori==='PS' && a.kepemilikan===kepemilikan && a.nama==='Persediaan Barang/Perlengkapan') || DB.coa.find(a=>a.kategori==='PS' && a.kepemilikan===kepemilikan);
  }
  return DB.coa.find(a=>a.kategori==='PS' && a.kepemilikan===kepemilikan && a.nama!=='Persediaan Barang/Perlengkapan') || DB.coa.find(a=>a.kategori==='PS' && a.kepemilikan===kepemilikan);
}
function prosesPenyesuaianStok(item, tipeInventaris, arah){
  const namaLabel = item.nama;
  const qtyStr = prompt('Jumlah stok yang '+(arah==='plus'?'ditambahkan':'dikurangi')+' untuk "'+namaLabel+'":', '');
  if(qtyStr===null) return;
  const qty = Number(qtyStr);
  if(!qty || qty<=0) return toast('Jumlah tidak valid');
  if(arah==='minus' && qty>(item.stok||0) && !confirm('Jumlah pengurangan lebih besar dari stok saat ini ('+fmtNum(item.stok||0)+'). Lanjutkan? Stok akan menjadi negatif.')) return;
  const hargaDefault = item.hargaBeliPerSatuan||0;
  const hargaStr = prompt('Nilai per satuan (Rp) untuk jurnal penyesuaian (kosongkan = pakai harga rata-rata saat ini):', hargaDefault||0);
  if(hargaStr===null) return;
  const harga = hargaStr===''? hargaDefault : (Number(hargaStr)||0);
  const ket = prompt('Keterangan penyesuaian (opsional, mis. "stok opname"):','') || '';
  const nominal = Math.round(qty*harga);

  if(arah==='plus'){ item.stok = (item.stok||0) + qty; } else { item.stok = (item.stok||0) - qty; }

  const adjObj = { id:uid(), tanggal:todayStr(), tipeInventaris, refId:item.id, arah, qty, harga, nominal, keterangan:ket };
  DB.penyesuaianStok.push(adjObj);

  if(nominal>0){
    const kep = item.kepemilikan||'Pribadi';
    const psAkun = akunPersediaanUntuk(kep, tipeInventaris);
    if(psAkun){
      if(arah==='plus'){
        const pdAkun = DB.coa.find(a=>a.kategori==='PD' && a.kepemilikan===kep && a.nama==='Pendapatan Lain-lain (Penyesuaian Stok)') || DB.coa.find(a=>a.kategori==='PD' && a.kepemilikan===kep);
        if(pdAkun) postJurnal({ tanggal:todayStr(), keterangan:'Penyesuaian stok (+) '+namaLabel+(ket?' — '+ket:''), debitId:psAkun.id, kreditId:pdAkun.id, nominal, sumber:'Penyesuaian Stok', ref:'stokadj-'+adjObj.id });
      } else {
        const blAkun = DB.coa.find(a=>a.kategori==='BL' && a.kepemilikan===kep && a.nama==='Beban Lain-lain') || DB.coa.find(a=>a.kategori==='BL' && a.kepemilikan===kep);
        if(blAkun) postJurnal({ tanggal:todayStr(), keterangan:'Penyesuaian stok (-) '+namaLabel+(ket?' — '+ket:''), debitId:blAkun.id, kreditId:psAkun.id, nominal, sumber:'Penyesuaian Stok', ref:'stokadj-'+adjObj.id });
      }
    }
  }
  save(); renderContent();
  toast(nominal>0 ? 'Stok & jurnal penyesuaian tersimpan' : 'Stok diperbarui (tanpa jurnal — nilai per satuan Rp0)');
}

/* Splits a compound journal entry (multiple debit lines + multiple credit lines, total debit === total kredit)
   into a series of simple balanced debit/kredit pairs, so it can still be posted through postJurnal() above
   without changing how the rest of the app (buku besar, neraca, laba rugi, dll) reads DB.jurnal.
   debitLines/kreditLines: array of {akunId, nominal}. Returns array of {debitId, kreditId, nominal}. */
function splitCompoundEntry(debitLines, kreditLines){
  const d = debitLines.map(x=>({akunId:x.akunId, nominal:Number(x.nominal)||0}));
  const k = kreditLines.map(x=>({akunId:x.akunId, nominal:Number(x.nominal)||0}));
  const pairs = [];
  let di=0, ki=0;
  while(di<d.length && ki<k.length){
    const amt = Math.min(d[di].nominal, k[ki].nominal);
    if(amt>0.0001) pairs.push({debitId:d[di].akunId, kreditId:k[ki].akunId, nominal:Math.round(amt)});
    d[di].nominal -= amt; k[ki].nominal -= amt;
    if(d[di].nominal<=0.0001) di++;
    if(k[ki].nominal<=0.0001) ki++;
  }
  return pairs;
}

/* Generic search input binder: re-rendering the table on every keystroke normally steals focus.
   This restores focus + cursor position right after the re-render so typing feels uninterrupted. */
function bindSearchInput(id, onInput){
  const el = document.getElementById(id);

  el.addEventListener('input', e=>{

    const val = e.target.value;

  });

      removeFromList(btn.dataset.list, val);
      save(); renderContent();
    });
  });
}

   (for custom kepemilikan values added by the user beyond the default 4). */

function akunById(id){ return DB.coa.find(a=>a.id===id); }
function normalIsDebit(kategori){ return DEBIT_NORMAL.has(kategori); }

// running balance for one account, purely from jurnal
function saldoAkun(akunId){
  const akun = akunById(akunId);
  if(!akun) return 0;
  let debit=0, kredit=0;
  DB.jurnal.forEach(j=>{
    if(j.debitId===akunId) debit+=j.nominal;
    if(j.kreditId===akunId) kredit+=j.nominal;
  });
  return normalIsDebit(akun.kategori) ? (debit-kredit) : (kredit-debit);
}

function sumByKategoriKepemilikan(kategori, kepemilikan){
  return DB.coa.filter(a=>a.kategori===kategori && (!kepemilikan||a.kepemilikan===kepemilikan))
    .reduce((s,a)=> s+saldoAkun(a.id), 0);
}

/* Laba/rugi bersih per kepemilikan (Pendapatan - BPP - BO - BL) */
function labaRugiPerKepemilikan(kep){
  const pd = sumByKategoriKepemilikan('PD', kep);
  const bpp = sumByKategoriKepemilikan('BPP', kep);
  const bo = sumByKategoriKepemilikan('BO', kep);
  const bl = sumByKategoriKepemilikan('BL', kep);
  return pd - bpp - bo - bl;
}

let coaFilterKategori = '';

const COA_HEADERS = ['Kode','Nama Akun','Kategori','Kepemilikan','Keterangan'];
function importCoaRows(rows){
  let ditambah=0, diupdate=0, dilewati=0;
  rows.forEach(r=>{
    const nama = String(xrow(r,'Nama Akun','Nama')||'').trim();
    if(!nama) { dilewati++; return; }
    let kategoriRaw = String(xrow(r,'Kategori')||'').trim().toUpperCase();
    if(!KAT[kategoriRaw]){
      const found = Object.keys(KAT).find(k=> KAT[k].toLowerCase()===kategoriRaw.toLowerCase());
      kategoriRaw = found || '';
    }
    if(!KAT[kategoriRaw]){ dilewati++; return; }
    const kepRaw = String(xrow(r,'Kepemilikan')||'Pribadi').trim();
    const kepemilikan = KEPEMILIKAN.includes(kepRaw) ? kepRaw : 'Pribadi';
    const keterangan = String(xrow(r,'Keterangan')||'');
    const kodeRaw = String(xrow(r,'Kode')||'').trim();
    const existing = (kodeRaw && DB.coa.find(a=>a.kode===kodeRaw)) || DB.coa.find(a=> a.nama.trim().toLowerCase()===nama.toLowerCase());
    if(existing){
      if(DB.coa.some(a=> a.id!==existing.id && a.nama.trim().toLowerCase()===nama.toLowerCase())){ dilewati++; return; }
      existing.nama = nama; existing.kategori = kategoriRaw; existing.kepemilikan = kepemilikan; existing.keterangan = keterangan;
      diupdate++;
    } else {
      if(DB.coa.some(a=> a.nama.trim().toLowerCase()===nama.toLowerCase())){ dilewati++; return; }
      addAkun(kategoriRaw, nama, kepemilikan, keterangan);
      ditambah++;
    }
  });
  save(); renderCoaTable();
  toast(`Impor selesai — ${ditambah} akun baru, ${diupdate} diperbarui${dilewati?`, ${dilewati} dilewati (nama kosong/duplikat/kategori tak valid)`:''}`);
}

function renderCoaTable(){

  const titleEl = document.getElementById('coaCountTitle'); if(titleEl) titleEl.textContent = 'Daftar Akun ('+DB.coa.length+')';

    </tr>`;
  });
  html += `</tbody></table></div>`;
  if(filtered.length===0) html = `<div class="tablewrap"><div class="empty">Tidak ada akun yang cocok dengan pencarian</div></div>`;
  wrap.innerHTML = html;

    row.querySelector('.edit-ket').addEventListener('change', e=>{ akunById(id).keterangan=e.target.value; save(); });

      if(DB.jurnal.some(j=>j.debitId===id||j.kreditId===id)){
        const s = saldoAkun(id);

    });
  });
}

function fileToBase64(file, cb){
  const reader = new FileReader();
  reader.onload = ()=> cb(reader.result);
  reader.readAsDataURL(file);
}
/* Resizes+compresses an uploaded photo before storing it (transactions can accumulate many photos,
   unlike the few product photos, so we keep each one small to avoid bloating local storage). */
function fileToCompressedBase64(file, cb, maxDim=900, quality=0.72){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height;
      if(w>maxDim||h>maxDim){ const r=Math.min(maxDim/w, maxDim/h); w=Math.round(w*r); h=Math.round(h*r); }
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=> cb(reader.result);
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
/* ---- Reusable "Bukti Foto" upload widget for transaction forms (Jurnal, Kas, Biaya, Pembelian, Penjualan, Pemakaian) ----
   Holds the picked-but-not-yet-saved photo in BUKTI_PENDING[id] until the form is submitted. */
const BUKTI_PENDING = {};

  return `<div class="field"><label>Bukti Foto (opsional)</label><div id="${id}_holder">${buktiHolderInner(id, null)}</div></div>`;

function buktiHolderInner(id, src){
  if(src){
    return `<div style="display:flex;align-items:center;gap:6px">
      <img src="${src}" class="thumb" id="${id}_thumb" style="width:44px;height:44px;object-fit:cover;border-radius:8px;cursor:pointer">

}
function bindBuktiUpload(id){
  BUKTI_PENDING[id] = null;
  const holder = document.getElementById(id+'_holder'); if(!holder) return;
  function refresh(){
    holder.innerHTML = buktiHolderInner(id, BUKTI_PENDING[id]);
    const input = document.getElementById(id+'_input');
    if(input) input.addEventListener('change', e=>{
      const f = e.target.files[0]; if(!f) return;

    });
    const thumb = document.getElementById(id+'_thumb');
    if(thumb) thumb.addEventListener('click', ()=> openImageModal(BUKTI_PENDING[id], 'Bukti Foto'));
    const rm = document.getElementById(id+'_remove');
    if(rm) rm.addEventListener('click', ()=>{ BUKTI_PENDING[id]=null; refresh(); });
  }
  refresh();
}

/* ---------------- RESEP: cost & time roll-up ---------------- */
function getResepPorsi(r){ return (r.jumlahPorsi && r.jumlahPorsi>0) ? r.jumlahPorsi : 1; }

function getTotalWaktuResep(resepId, visited){
  visited = visited || new Set();
  if(visited.has(resepId)) return 0;
  visited.add(resepId);
  const r = DB.resep.find(x=>x.id===resepId);
  if(!r) return 0;
  let total = (r.steps||[]).reduce((s,st)=> s+(Number(st.waktuMenit)||0), 0);
  (r.bahan||[]).forEach(b=>{ if(b.tipe==='resep') total += getTotalWaktuResep(b.refId, visited); });
  return total;
}

function computeResepTotalHarga(resepId, visited){
  visited = visited || new Set();
  if(visited.has(resepId)) return 0;
  visited.add(resepId);
  const r = DB.resep.find(x=>x.id===resepId);
  if(!r) return 0;
  let total = 0;
  (r.bahan||[]).forEach(b=>{
    if(b.tipe==='produk'){
      const prod = DB.produk.find(x=>x.id===b.refId); if(!prod) return;
      total += (Number(b.qty)||0) * (prod.hargaBeliPerSatuan||0);
    } else if(b.tipe==='resep'){
      const sub = DB.resep.find(x=>x.id===b.refId); if(!sub) return;
      const subTotal = computeResepTotalHarga(b.refId, visited);
      total += (Number(b.qty)||0) * (subTotal / getResepPorsi(sub));
    }
  });
  return total;
}

    exportExcel: ()=>({ filename:'resep.xlsx', sheetName:'Resep', headers:RESEP_HEADERS, rows: resepExportRows() })

function importResepRows(rows){
  let created=0, bahanAdded=0; const warnings=[];
  const namaMenuSet = new Set();
  rows.forEach(r=>{ const nm=String(xrow(r,'Nama Menu','Menu')||'').trim(); if(nm) namaMenuSet.add(nm); });
  namaMenuSet.forEach(nm=>{
    let existing = DB.resep.find(x=>x.namaMenu.trim().toLowerCase()===nm.toLowerCase());
    if(!existing){ DB.resep.push({ id:uid(), namaMenu:nm, jenisResep:'', gambar:null, jumlahPorsi:1, bahan:[], steps:[] }); created++; }
  });
  rows.forEach(r=>{
    const nm = String(xrow(r,'Nama Menu','Menu')||'').trim(); if(!nm) return;
    const resep = DB.resep.find(x=>x.namaMenu.trim().toLowerCase()===nm.toLowerCase()); if(!resep) return;
    const jenis = String(xrow(r,'Jenis Resep','Jenis')||'').trim();
    const porsi = Number(xrow(r,'Jumlah Porsi','Porsi'))||0;
    if(jenis){ resep.jenisResep=jenis; ensureJenisResep(jenis); }
    if(porsi>0) resep.jumlahPorsi=porsi;
    const tipeBahan = String(xrow(r,'Tipe Bahan (Produk/Sub-Resep)','Tipe Bahan','Tipe')||'Produk').trim().toLowerCase();
    const namaBahan = String(xrow(r,'Nama Bahan/Sub-Resep','Nama Bahan','Bahan')||'').trim();
    const qty = Number(xrow(r,'Qty per Porsi','Qty'))||0;
    const satuan = String(xrow(r,'Satuan')||'').trim();
    if(!namaBahan || qty<=0) return;
    if(tipeBahan.includes('sub') || tipeBahan.includes('resep')){
      const sub = DB.resep.find(x=>x.id!==resep.id && x.namaMenu.trim().toLowerCase()===namaBahan.toLowerCase());
      if(!sub){ warnings.push('Sub-resep "'+namaBahan+'" untuk menu "'+nm+'" tidak ditemukan'); return; }
      resep.bahan.push({id:uid(), tipe:'resep', refId:sub.id, qty}); bahanAdded++;
    } else {
      let prod = DB.produk.find(x=>x.nama.trim().toLowerCase()===namaBahan.toLowerCase());
      if(!prod){
        const kategori = DB.kategoriProdukCustom[0]||'Bahan Mentah';
        prod = { id:uid(), kode:nextKode(prefixKategoriProduk(kategori)), nama:namaBahan, kategori, satuan: satuan||DB.satuanCustom[0]||'pcs', kepemilikan:'Pribadi', jenisBahan:'', gambar:null, runQty:0, runTotal:0, hargaBeliPerSatuan:0, hargaJual:0, stok:0, hampirHabis:false, lokasi:'' };
        DB.produk.push(prod);
      }
      if(satuan) ensureInList('satuanCustom', satuan);
      resep.bahan.push({id:uid(), tipe:'produk', refId:prod.id, qty, satuan: satuan||prod.satuan}); bahanAdded++;
    }
  });
  save(); renderContent();
  toast('Impor resep: '+created+' resep baru, '+bahanAdded+' baris bahan'+(warnings.length?(', '+warnings.length+' dilewati'):''));
}
function resepExportRows(){
  const rows=[];
  DB.resep.forEach(r=>{
    const porsi=getResepPorsi(r);
    if((r.bahan||[]).length===0){ rows.push([r.namaMenu, r.jenisResep||'', porsi, '', '', '', '']); return; }
    (r.bahan||[]).forEach(b=>{
      if(b.tipe==='resep'){
        const sub=DB.resep.find(x=>x.id===b.refId);
        rows.push([r.namaMenu, r.jenisResep||'', porsi, 'Sub-Resep', sub?sub.namaMenu:'', b.qty, '']);
      } else {
        const prod=DB.produk.find(x=>x.id===b.refId);
        rows.push([r.namaMenu, r.jenisResep||'', porsi, 'Produk', prod?prod.nama:'', b.qty, b.satuan||(prod?prod.satuan:'')]);
      }
    });
  });
  return rows;
}
function renderResepList(c){
  const filtered = DB.resep.filter(r=> matchSearch(r.namaMenu+' '+(r.jenisResep||''), resepSearch));
  let html = `<div class="section-title"><h3>Resep Menu (${DB.resep.length})</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${searchBoxHtml('resepSearchInput','Cari nama menu/jenis')}<button class="btn primary" id="btnAddResep">+ Tambah Resep</button>${ioToolbarHtml('resep', resepIoCfg())}</div></div>`;
  if(filtered.length===0){ html += `<div class="empty"><div class="big">🍲</div>Belum ada resep. Resep bisa berjenjang — satu resep bisa memakai resep lain sebagai "bahan" (misal Nasi Goreng memakai resep Bumbu Nasi Goreng). Klik nama resep untuk melihat & mengedit detailnya.</div>`; }
  else {
    html += `<div class="resep-grid">`;
    filtered.forEach(r=>{
      const totalWaktu = getTotalWaktuResep(r.id);
      const totalHarga = computeResepTotalHarga(r.id);
      const porsi = getResepPorsi(r);
      html += `<div class="resep-card">
        <div class="resep-card-img">${r.gambar?`<img src="${r.gambar}" alt="${r.namaMenu}">`:'🍽'}</div>
        <div class="resep-card-body">
          <a href="#" class="resepLink" data-id="${r.id}">${r.namaMenu}</a>
          <div class="resep-card-row"><span class="mini">Jenis</span><span class="tag c">${r.jenisResep||'Umum'}</span></div>
          <div class="resep-card-row"><span class="mini">Porsi</span><span>${porsi} porsi</span></div>
          <div class="resep-card-row"><span class="mini">Total Waktu</span><span>${totalWaktu} menit</span></div>
          <div class="resep-card-row"><span class="mini">Harga/Porsi</span><span>${fmtRp(totalHarga/porsi)}</span></div>
          <div class="resep-card-row"><span class="mini">Total Harga</span><span style="font-weight:700">${fmtRp(totalHarga)}</span></div>
          <button class="btn small danger btnDelResepRow" data-id="${r.id}" style="width:100%;margin-top:6px">Hapus</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  c.innerHTML = html;
  bindIoToolbar('resep', resepIoCfg());
  bindSearchInput('resepSearchInput', v=>{ resepSearch=v; });
  document.getElementById('btnAddResep').addEventListener('click', ()=>{
    const nama = prompt('Nama menu:'); if(!nama) return;
    const r = { id:uid(), namaMenu:nama, jenisResep:'', gambar:null, jumlahPorsi:1, bahan:[], steps:[] };
    DB.resep.push(r); save();
    resepViewStack = [r.id]; renderContent();
  });
  c.querySelectorAll('.resepLink').forEach(a=> a.addEventListener('click', e=>{ e.preventDefault(); resepViewStack=[a.dataset.id]; renderContent(); }));
  c.querySelectorAll('.btnDelResepRow').forEach(btn=> btn.addEventListener('click', ()=>{
    if(!confirm('Hapus resep ini?')) return;
    DB.resep = DB.resep.filter(x=>x.id!==btn.dataset.id); save(); renderContent();
  }));
}

        <div>

      <div class="field"><label>Nama Menu</label><input id="ed-rnama" value="${r.namaMenu.replace(/"/g,'&quot;')}"></div>
      <div class="field"><label>Jenis Resep</label>${manageableSelectHtml('ed-rjenis', DB.jenisResepCustom, r.jenisResep||'', 'jenisResepCustom')}</div>
      <div class="field"><label>Jumlah Porsi Dihasilkan</label><input id="ed-rporsi" type="number" min="1" value="${porsi}"></div>

      <div class="card kpi" style="padding:12px"><div class="label">Harga per Porsi</div><div class="value" style="font-size:17px">${fmtRp(totalHarga/porsi)}</div></div>
      <div class="card kpi" style="padding:12px"><div class="label">Total Waktu</div><div class="value" style="font-size:17px">${totalWaktu} mnt</div></div>
    </div>

    <div style="font-weight:700;font-size:12.5px;color:var(--terracotta-dark);margin-bottom:6px">Bahan (produk atau resep lain)</div>
    <div class="tablewrap" style="margin-bottom:10px"><table class="sheet"><thead><tr><th class="wrap-cell">Bahan</th><th>Tipe</th><th>Qty/porsi</th><th>Satuan</th><th>Sub-total Harga</th><th></th></tr></thead><tbody>
    ${(r.bahan||[]).map((b,i)=>{
      if(b.tipe==='resep'){

      <div class="formgrid">
        <div class="field">${manageableSelectHtml('newStepKategori', DB.stepKategoriCustom, DB.stepKategoriCustom[0]||'', 'stepKategoriCustom')}</div>
        <div class="field"><input id="newStepKet" placeholder="Keterangan (opsional)"></div>
        <div class="field"><input id="newStepGramasi" type="number" placeholder="Gramasi gr (opsional)"></div>
        <div class="field"><input id="newStepWaktu" type="number" placeholder="Waktu (menit)" value="5"></div>

    const i = Number(a.dataset.i);

    renderContent();

  document.querySelectorAll('.subResepLink').forEach(a=> a.addEventListener('click', e=>{
    e.preventDefault();
    resepViewStack.push(a.dataset.id);
    renderContent();
  }));

  bindMasterListButtons(c);

  document.getElementById('ed-rnama').addEventListener('change', e=>{ r.namaMenu=e.target.value; save(); renderContent(); });
  const rjenis = document.getElementById('ed-rjenis'); if(rjenis) rjenis.addEventListener('change', e=>{ r.jenisResep=e.target.value; save(); renderContent(); });
  document.getElementById('ed-rporsi').addEventListener('change', e=>{ r.jumlahPorsi=Math.max(1,Number(e.target.value)||1); save(); renderContent(); });

  const imgInput = document.getElementById('ed-rimg')?.closest('label')?.querySelector('input') || c.querySelector('.ed-rimg');
  if(imgInput) imgInput.addEventListener('change', e=>{
    const f=e.target.files[0]; if(!f) return;
    fileToBase64(f, b64=>{ r.gambar=b64; save(); renderContent(); });
  });
  const thumb = c.querySelector('.thumb');
  if(thumb) thumb.addEventListener('click', ()=> openImageModal(r.gambar, r.namaMenu));

  document.getElementById('btnDelResepDetail').addEventListener('click', ()=>{
    if(!confirm('Hapus resep ini?')) return;
    DB.resep = DB.resep.filter(x=>x.id!==r.id); save();
    resepViewStack.pop(); renderContent();
  });

  document.querySelector('.btnAddBahanProduk').addEventListener('click', ()=>{
    if(DB.produk.length===0) return toast('Tambah produk dulu di Master Produk');
    const list = DB.produk.map((p,i)=>`${i+1}. ${p.nama}`).join('\n');
    const idx = prompt('Pilih nomor bahan (produk):\n'+list); if(!idx) return;
    const prod = DB.produk[Number(idx)-1]; if(!prod) return toast('Nomor tidak valid');
    const qty = Number(prompt('Qty per porsi ('+prod.satuan+'):','1'))||0;
    r.bahan.push({ id:uid(), tipe:'produk', refId: prod.id, qty, satuan: prod.satuan }); save(); renderContent();

    const others = DB.resep.filter(x=>x.id!==r.id);

    const list = others.map((x,i)=>`${i+1}. ${x.namaMenu}`).join('\n');
    const idx = prompt('Pilih nomor sub-resep:\n'+list); if(!idx) return;
    const sub = others[Number(idx)-1]; if(!sub) return toast('Nomor tidak valid');
    const qty = Number(prompt('Qty porsi sub-resep dipakai:','1'))||0;
    r.bahan.push({ id:uid(), tipe:'resep', refId: sub.id, qty }); save(); renderContent();

    save(); renderContent();

  c.querySelectorAll('.btnDelStep').forEach(btn=> btn.addEventListener('click', ()=>{ r.steps.splice(Number(btn.dataset.i),1); save(); renderContent(); }));

/* ================= HELPERS: account pickers ================= */
function akunOptions(filterFn){
  return DB.coa.filter(filterFn||(()=>true))
    .map(a=>`<option value="${a.id}">${a.nama} — ${a.kepemilikan} (${KAT[a.kategori]})</option>`).join('');
}
function isKasBank(a){ return a.kategori==='AL'; }

/* Searchable account "combo box": type to filter, click a result to select — replaces long <select>
   dropdowns so the user never has to scroll through hundreds of accounts.
   The hidden <input id="${id}"> keeps holding the selected account id, so all existing code that
   reads e.g. jDebit.value / document.getElementById('jDebit').value keeps working unchanged. */
const AKUN_PICKER_FILTERS = {};
const AKUN_PICKER_ONSELECT = {};
function akunPickerHtml(id, filterFn, placeholder, initialValue){
  AKUN_PICKER_FILTERS[id] = filterFn || null;
  const initialAkun = initialValue ? akunById(initialValue) : null;
  return `<div class="akunPicker" style="position:relative">
    <input type="text" id="${id}_q" class="akunPickerInput" placeholder="${placeholder||'Ketik nama akun...'}" autocomplete="off" value="${initialAkun?initialAkun.nama.replace(/"/g,'&quot;'):''}">
    <input type="hidden" id="${id}" value="${initialValue||''}">
    <div class="akunPickerList" id="${id}_list"></div>
  </div>`;
}
function bindAkunPicker(id, onSelect){
  if(onSelect) AKUN_PICKER_ONSELECT[id] = onSelect;
  const q = document.getElementById(id+'_q');
  const hidden = document.getElementById(id);
  const list = document.getElementById(id+'_list');
  if(!q || !hidden || !list) return;
  const filterFn = AKUN_PICKER_FILTERS[id];
  function renderList(term){
    const opts = sortAkunList(DB.coa.filter(a=> !filterFn || filterFn(a)).filter(a=> matchSearch(a.nama+' '+a.kode+' '+a.kepemilikan+' '+(a.keterangan||''), term)));
    let itemsHtml = opts.slice(0,50).map(a=>`<div class="akunPickerItem" data-id="${a.id}"><b>${a.nama}</b><span class="mini"> — ${a.kepemilikan} · ${KAT[a.kategori]}${a.keterangan?' · '+a.keterangan:''}</span></div>`).join('');
    if(!itemsHtml) itemsHtml = '<div class="akunPickerItem mini">Tidak ditemukan, coba kata kunci lain</div>';
    const exactMatch = term && DB.coa.some(a=> a.nama.toLowerCase()===term.trim().toLowerCase());
    if(term && term.trim() && !exactMatch){
      itemsHtml += `<div class="akunPickerItem akunPickerAddNew" data-newname="${term.trim().replace(/"/g,'&quot;')}" style="color:var(--terracotta-dark);font-weight:700">+ Tambah akun baru: "${term.trim()}"</div>`;
    }
    list.innerHTML = itemsHtml;
    list.style.display = 'block';
  }
  q.addEventListener('focus', ()=> renderList(q.value));
  q.addEventListener('input', ()=>{ hidden.value=''; renderList(q.value); });
  q.addEventListener('blur', ()=> setTimeout(()=>{ list.style.display='none'; }, 180));
  list.addEventListener('mousedown', e=>{
    const addItem = e.target.closest('.akunPickerAddNew');
    if(addItem){
      const namaBaru = addItem.dataset.newname;
      const katList = KATEGORI_ORDER.map((k,i)=>`${i+1}. ${KAT[k]}`).join('\n');
      const katIdx = prompt('Kategori neraca untuk akun "'+namaBaru+'":\n'+katList); if(!katIdx) return;
      const kategori = KATEGORI_ORDER[Number(katIdx)-1]; if(!kategori) return toast('Nomor tidak valid');
      const kepList = getAllKepemilikan().map((k,i)=>`${i+1}. ${k}`).join('\n');
      const kepIdx = prompt('Kepemilikan:\n'+kepList, '1'); if(!kepIdx) return;
      const kepemilikan = getAllKepemilikan()[Number(kepIdx)-1]; if(!kepemilikan) return toast('Nomor tidak valid');
      if(DB.coa.some(a=> a.nama.toLowerCase()===namaBaru.toLowerCase())) return toast('Nama akun ini sudah ada, pilih dari daftar');
      const akun = addAkun(kategori, namaBaru, kepemilikan, '');
      save();
      hidden.value = akun.id; q.value = akun.nama; list.style.display='none';
      if(AKUN_PICKER_ONSELECT[id]) AKUN_PICKER_ONSELECT[id](akun.id);
      toast('Akun baru dibuat: '+akun.nama);
      return;
    }
    const item = e.target.closest('.akunPickerItem'); if(!item || !item.dataset.id) return;
    const akun = akunById(item.dataset.id);
    hidden.value = akun.id;
    q.value = akun.nama;
    list.style.display = 'none';
    if(AKUN_PICKER_ONSELECT[id]) AKUN_PICKER_ONSELECT[id](akun.id);
  });
}
/* Call once after rendering a form containing one or more akunPickerHtml() fields. */
function bindAllAkunPickers(container){
  container.querySelectorAll('.akunPicker').forEach(wrap=>{
    const hidden = wrap.querySelector('input[type=hidden]');
    if(hidden) bindAkunPicker(hidden.id);
  });
}
/* Programmatically set an akunPickerHtml() field's value (used by the "Duplikat" transaction feature). */
function setAkunPickerValue(id, akunId){
  const hidden = document.getElementById(id);
  const q = document.getElementById(id+'_q');
  if(!hidden) return;
  hidden.value = akunId || '';
  if(q) q.value = akunId ? (akunById(akunId)?.nama || '') : '';
}

/* ================= JURNAL UMUM ================= */
let jurnalSearch = '';
/* Jurnal Umum now supports unlimited debit/kredit rows (compound entries), not just one pair.
   jurnalRows holds the working set of rows for the "Tambah Jurnal" form; state lives outside the
   renderer so it survives adding/removing rows (which only re-render the rows block, not the whole tab). */
let jurnalRows = [
  {rid:uid(), tipe:'debit', akunId:'', nominal:''},
  {rid:uid(), tipe:'kredit', akunId:'', nominal:''}
];
function jurnalRowsTotals(){
  let totalDebit=0, totalKredit=0;
  jurnalRows.forEach(r=>{ const n=Number(r.nominal)||0; if(r.tipe==='debit') totalDebit+=n; else totalKredit+=n; });
  return {totalDebit, totalKredit};
}
function syncJurnalRowsFromDom(){
  jurnalRows.forEach(r=>{
    const tipeSel = document.getElementById('jRowTipe_'+r.rid);
    const akunHidden = document.getElementById('jRowAkun_'+r.rid);
    const nomInput = document.getElementById('jRowNom_'+r.rid);
    if(tipeSel) r.tipe = tipeSel.value;
    if(akunHidden) r.akunId = akunHidden.value;
    if(nomInput) r.nominal = nomInput.value;
  });
}
function renderJurnalRowsHtml(){
  const {totalDebit, totalKredit} = jurnalRowsTotals();
  const selisih = totalDebit - totalKredit;
  const rowsHtml = jurnalRows.map(r=>`
    <div class="jrow" data-rid="${r.rid}" style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
      <select id="jRowTipe_${r.rid}" class="jRowTipe" style="width:66px;flex:none;padding:9px 4px;font-size:12.5px">
        <option value="debit" ${r.tipe==='debit'?'selected':''}>Debit</option>
        <option value="kredit" ${r.tipe==='kredit'?'selected':''}>Kredit</option>
      </select>
      <div style="flex:1;min-width:0">${akunPickerHtml('jRowAkun_'+r.rid, null, 'Ketik nama akun...', r.akunId)}</div>
      <input type="number" id="jRowNom_${r.rid}" class="jRowNom" placeholder="Nominal" value="${r.nominal||''}" style="width:92px;flex:none;text-align:right">
      <button type="button" class="btn small danger btnDelJRow" data-rid="${r.rid}" style="flex:none">−</button>
    </div>`).join('');
  return `<div id="jurnalRowsWrap">
    ${rowsHtml}
    <button type="button" class="btn small" id="btnAddJRow">+ Tambah Baris</button>
    <div class="mini" id="jurnalTotalsMini" style="margin-top:8px">Total Debit: <b>${fmtRp(totalDebit)}</b> · Total Kredit: <b>${fmtRp(totalKredit)}</b> · Selisih: <b style="color:${selisih===0?'var(--debit)':'var(--kredit)'}">${fmtRp(selisih)}</b></div>
  </div>`;
}
function bindJurnalRows(){
  const wrap = document.getElementById('jurnalRowsWrap'); if(!wrap) return;
  bindAllAkunPickers(wrap);
  wrap.querySelectorAll('.jRowTipe, .jRowNom').forEach(el=> el.addEventListener('input', ()=>{
    syncJurnalRowsFromDom();
    const {totalDebit, totalKredit} = jurnalRowsTotals();
    const selisih = totalDebit-totalKredit;
    const mini = document.getElementById('jurnalTotalsMini');
    if(mini) mini.innerHTML = `Total Debit: <b>${fmtRp(totalDebit)}</b> · Total Kredit: <b>${fmtRp(totalKredit)}</b> · Selisih: <b style="color:${selisih===0?'var(--debit)':'var(--kredit)'}">${fmtRp(selisih)}</b>`;
  }));
  wrap.querySelectorAll('.btnDelJRow').forEach(btn=> btn.addEventListener('click', ()=>{
    syncJurnalRowsFromDom();
    if(jurnalRows.length<=2) return toast('Minimal 2 baris (1 debit, 1 kredit)');
    jurnalRows = jurnalRows.filter(r=>r.rid!==btn.dataset.rid);
    rerenderJurnalRows();
  }));
  const addBtn = document.getElementById('btnAddJRow');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    syncJurnalRowsFromDom();
    jurnalRows.push({rid:uid(), tipe:'debit', akunId:'', nominal:''});
    rerenderJurnalRows();
  });
}
function rerenderJurnalRows(){
  const wrap = document.getElementById('jurnalRowsWrap'); if(!wrap) return;
  wrap.outerHTML = renderJurnalRowsHtml();
  bindJurnalRows();
}
const JURNAL_HEADERS = ['Tanggal (YYYY-MM-DD)','Keterangan','Akun Debit','Akun Kredit','Nominal','Sumber','Tag (pisahkan koma)'];
function jurnalIoCfg(){
  return {
    template:{ filename:'template-jurnal.xlsx', sheetName:'Jurnal', headers:JURNAL_HEADERS,
      exampleRows:[[todayStr(),'Contoh: Bayar listrik','Beban Operasional','Kas',150000,'Jurnal Umum','operasional'] ]},
    onImport: importJurnalRows,
    exportExcel: ()=>({ filename:'jurnal.xlsx', sheetName:'Jurnal', headers:['Tanggal','Keterangan','Akun Debit','Akun Kredit','Nominal','Sumber','Tag'],
      rows: [...DB.jurnal].reverse().map(j=>[j.tanggal,j.keterangan||'',akunById(j.debitId)?.nama||'',akunById(j.kreditId)?.nama||'',j.nominal,j.sumber||'',(j.tags||[]).join(', ')]) }),
    exportPdf: ()=>({ filename:'jurnal.pdf', title:'Riwayat Jurnal', headers:['Tanggal','Keterangan','Debit','Kredit','Nominal','Sumber'],
      rows: [...DB.jurnal].reverse().map(j=>[j.tanggal,j.keterangan||'',akunById(j.debitId)?.nama||'',akunById(j.kreditId)?.nama||'',fmtRp(j.nominal),j.sumber||'']) })
  };
}
function importJurnalRows(rows){
  let ok=0; const warnings=[];
  rows.forEach((r,i)=>{
    const tanggal = String(xrow(r,'Tanggal (YYYY-MM-DD)','Tanggal')||'').trim() || todayStr();
    const keterangan = String(xrow(r,'Keterangan')||'').trim();
    const debitNama = String(xrow(r,'Akun Debit')||'').trim();
    const kreditNama = String(xrow(r,'Akun Kredit')||'').trim();
    const nominal = Number(xrow(r,'Nominal'))||0;
    const sumber = String(xrow(r,'Sumber')||'').trim()||'Jurnal Umum';
    const tagStr = String(xrow(r,'Tag (pisahkan koma)','Tag')||'').trim();
    if(!debitNama||!kreditNama||nominal<=0){ warnings.push('Baris '+(i+2)+': data tidak lengkap, dilewati'); return; }
    const debitAkun = DB.coa.find(a=>a.nama.trim().toLowerCase()===debitNama.toLowerCase());
    const kreditAkun = DB.coa.find(a=>a.nama.trim().toLowerCase()===kreditNama.toLowerCase());
    if(!debitAkun||!kreditAkun){ warnings.push('Baris '+(i+2)+': akun "'+(!debitAkun?debitNama:kreditNama)+'" tidak ditemukan'); return; }
    const tags = parseTagInput(tagStr); tags.forEach(ensureTag);
    postJurnal({ tanggal, keterangan, debitId:debitAkun.id, kreditId:kreditAkun.id, nominal, sumber, ref:'import-'+uid(), tags });
    ok++;
  });
  save(); renderContent();
  toast('Impor jurnal: '+ok+' baris berhasil'+(warnings.length?(', '+warnings.length+' dilewati'):''));
  if(warnings.length) console.warn(warnings.join('\n'));
}

/* Returns the referenced item (produk or barang) for a pembelian row, regardless of tipe.
   Older records (saved before this feature) don't have `tipe` — treat them as 'bahan'. */
function pembelianRefItem(p){
  const tipe = p.tipe || 'bahan';
  return tipe==='barang' ? DB.barang.find(x=>x.id===p.refId) : DB.produk.find(x=>x.id===(p.refId||p.produkId));
}
function pembelianSatuanLabel(p){ const it = pembelianRefItem(p); return it? it.satuan : ''; }

const PEMBELIAN_HEADERS = ['Tanggal (YYYY-MM-DD)','Jenis (Bahan/Barang)','Nama Bahan/Barang','Satuan (jika item baru)','Dikreditkan Melalui (Nama Akun)','Qty','Total Harga (Rp)','Keterangan','Tag (pisahkan koma)'];
function pembelianIoCfg(){
  return {
    template:{ filename:'template-pembelian.xlsx', sheetName:'Pembelian', headers:PEMBELIAN_HEADERS,
      exampleRows:[[todayStr(),'Bahan','Beras','kg','Kas',10,150000,'Beli di Pasar Sentral','dapur']] },
    onImport: importPembelianRows,
    exportExcel: ()=>({ filename:'pembelian.xlsx', sheetName:'Pembelian', headers:['Tanggal','Dibayar Melalui','Jenis','Barang/Bahan','Qty','Total Harga','Harga/satuan','Keterangan','Tag'],
      rows: [...DB.pembelian].reverse().map(p=>{ const item=pembelianRefItem(p); const tipe=p.tipe||'bahan'; return [p.tanggal, akunById(p.bayarId)?.nama||'', tipe==='barang'?'Barang':'Bahan', item?item.nama:'', p.qty, p.total, p.qty?Math.round(p.total/p.qty):0, p.keterangan||'', (p.tags||[]).join(', ')]; }) }),
    exportPdf: ()=>({ filename:'pembelian.pdf', title:'Riwayat Pembelian', headers:['Tanggal','Akun','Jenis','Item','Qty','Total'],
      rows: [...DB.pembelian].reverse().map(p=>{ const item=pembelianRefItem(p); const tipe=p.tipe||'bahan'; return [p.tanggal, akunById(p.bayarId)?.nama||'', tipe==='barang'?'Barang':'Bahan', item?item.nama:'', fmtNum(p.qty), fmtRp(p.total)]; }) })
  };
}
function importPembelianRows(rows){
  let ok=0; const warnings=[];
  rows.forEach((r,i)=>{
    const tanggal = String(xrow(r,'Tanggal (YYYY-MM-DD)','Tanggal')||'').trim()||todayStr();
    const jenisRaw = String(xrow(r,'Jenis (Bahan/Barang)','Jenis')||'Bahan').trim().toLowerCase();
    const isBarang = jenisRaw.includes('barang');
    const namaItem = String(xrow(r,'Nama Bahan/Barang','Nama')||'').trim();
    const satuanBaru = String(xrow(r,'Satuan (jika item baru)','Satuan')||'').trim();
    const akunNama = String(xrow(r,'Dikreditkan Melalui (Nama Akun)','Dikreditkan Melalui','Akun')||'').trim();
    const qty = Number(xrow(r,'Qty'))||0;
    const total = Number(xrow(r,'Total Harga (Rp)','Total Harga','Total'))||0;
    const keterangan = String(xrow(r,'Keterangan')||'').trim();
    const tagStr = String(xrow(r,'Tag (pisahkan koma)','Tag')||'').trim();
    if(!namaItem||!akunNama||qty<=0||total<=0){ warnings.push('Baris '+(i+2)+': data tidak lengkap, dilewati'); return; }
    const bayarAkun = DB.coa.find(a=>a.nama.trim().toLowerCase()===akunNama.toLowerCase());
    if(!bayarAkun){ warnings.push('Baris '+(i+2)+': akun "'+akunNama+'" tidak ditemukan'); return; }
    let item, itemNama, kepemilikan, refId;
    if(isBarang){
      item = DB.barang.find(x=>x.nama.trim().toLowerCase()===namaItem.toLowerCase());
      if(!item){ item = { id:uid(), nama:namaItem, satuan: satuanBaru||DB.satuanCustom[0]||'pcs', stok:0, lokasi:'', kepemilikan:'Pribadi', hampirHabis:false, tags:[], runQty:0, runTotal:0, hargaBeliPerSatuan:0 }; DB.barang.push(item); }
      item.runQty=(item.runQty||0)+qty; item.runTotal=(item.runTotal||0)+total; item.hargaBeliPerSatuan=item.runQty>0?(item.runTotal/item.runQty):0; item.stok=(item.stok||0)+qty;
      itemNama=item.nama; kepemilikan=item.kepemilikan||'Pribadi'; refId=item.id;
    } else {
      item = DB.produk.find(x=>x.nama.trim().toLowerCase()===namaItem.toLowerCase());
      if(!item){ const kategori=DB.kategoriProdukCustom[0]||'Bahan Mentah'; item = { id:uid(), kode:nextKode(prefixKategoriProduk(kategori)), nama:namaItem, kategori, satuan: satuanBaru||DB.satuanCustom[0]||'pcs', kepemilikan:'Pribadi', jenisBahan:'', gambar:null, runQty:0, runTotal:0, hargaBeliPerSatuan:0, hargaJual:0, stok:0, hampirHabis:false, lokasi:'' }; DB.produk.push(item); }
      item.runQty=(item.runQty||0)+qty; item.runTotal=(item.runTotal||0)+total; item.hargaBeliPerSatuan=item.runQty>0?(item.runTotal/item.runQty):0; item.stok=(item.stok||0)+qty;
      itemNama=item.nama; kepemilikan=item.kepemilikan; refId=item.id;
    }
    const tags = parseTagInput(tagStr); tags.forEach(ensureTag);
    const pObj = { id:uid(), tanggal, bayarId:bayarAkun.id, tipe: isBarang?'barang':'bahan', refId, produkId: isBarang?null:refId, qty, total, keterangan, tags, bukti:null };
    DB.pembelian.push(pObj);
    const persediaanAkun = akunPersediaanUntuk(kepemilikan, isBarang?'barang':'bahan');
    postJurnal({ tanggal, keterangan:'Pembelian '+itemNama+' x'+qty+(keterangan?' ('+keterangan+')':''), debitId:persediaanAkun.id, kreditId:bayarAkun.id, nominal:total, sumber:'Pembelian', ref:'pembelian-'+pObj.id, tags });
    if(!isBarang){
      const bulan = tanggal.slice(0,7);
      const bud = DB.budgeting.find(x=> x.produkId===refId && x.tanggal.slice(0,7)===bulan);
      if(bud){ bud.realisasi=(bud.realisasi||0)+total; }
    }
    ok++;
  });
  save(); renderContent();
  toast('Impor pembelian: '+ok+' baris berhasil'+(warnings.length?(', '+warnings.length+' dilewati'):''));
  if(warnings.length) console.warn(warnings.join('\n'));
}

/* Reverses a purchase's effect on an item's running-average cost, stock, and (for bahan) monthly budget realization.
   Used by both edit (reverse-old + apply-new) and delete (reverse-only). Works for both tipe 'bahan' and 'barang'. */
function reversePembelianEffect(p){
  const tipe = p.tipe || 'bahan';
  const refId = p.refId || p.produkId;
  const item = tipe==='barang' ? DB.barang.find(x=>x.id===refId) : DB.produk.find(x=>x.id===refId);
  if(item){
    item.runQty = Math.max(0, (item.runQty||0) - p.qty);
    item.runTotal = Math.max(0, (item.runTotal||0) - p.total);
    item.hargaBeliPerSatuan = item.runQty>0 ? (item.runTotal/item.runQty) : 0;
    item.stok = (item.stok||0) - p.qty;
  }
  if(tipe!=='barang'){
    const bulan = p.tanggal.slice(0,7);
    const bud = DB.budgeting.find(x=> x.produkId===refId && x.tanggal.slice(0,7)===bulan);
    if(bud) bud.realisasi = Math.max(0, (bud.realisasi||0) - p.total);
  }
}
function applyPembelianEffect(p){
  const tipe = p.tipe || 'bahan';
  const refId = p.refId || p.produkId;
  const item = tipe==='barang' ? DB.barang.find(x=>x.id===refId) : DB.produk.find(x=>x.id===refId);
  if(item){
    item.runQty = (item.runQty||0) + p.qty;
    item.runTotal = (item.runTotal||0) + p.total;
    item.hargaBeliPerSatuan = item.runQty>0 ? (item.runTotal/item.runQty) : 0;
    item.stok = (item.stok||0) + p.qty;
  }
  if(tipe!=='barang'){
    const bulan = p.tanggal.slice(0,7);
    const bud = DB.budgeting.find(x=> x.produkId===refId && x.tanggal.slice(0,7)===bulan);
    if(bud) bud.realisasi = (bud.realisasi||0) + p.total;
  }
}

    const ket = prompt('Keterangan:', p.keterangan||''); if(ket===null) return;
