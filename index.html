let persediaanSearch = '';
RENDERERS.persediaan = function(c){
  let html = `<div class="section-title"><h3 id="persediaanCountTitle">Kartu Stok Bahan (${DB.produk.length} item)</h3><div style="display:flex;gap:8px">${searchBoxHtml('persediaanSearchInput','Cari nama/lokasi')}<button class="btn small" id="btnAddLokasi">+ Tambah Lokasi</button></div></div>
  <div id="persediaanTableWrap"></div>`;
  c.innerHTML = html;
  renderPersediaanTable();

  document.getElementById('persediaanSearchInput').addEventListener('input', e=>{ persediaanSearch=e.target.value; renderPersediaanTable(); });
  document.getElementById('btnAddLokasi').addEventListener('click', ()=>{
    const nama = prompt('Nama lokasi baru (mis. Gudang A, Rak Bumbu):'); if(!nama) return;
    DB.lokasiCustom.push(nama); save(); renderPersediaanTable(); toast('Lokasi ditambahkan');
  });
};

function renderPersediaanTable(){
  const wrap = document.getElementById('persediaanTableWrap'); if(!wrap) return;
  const titleEl = document.getElementById('persediaanCountTitle'); if(titleEl) titleEl.textContent = 'Kartu Stok Bahan ('+DB.produk.length+' item)';
  DB.produk.forEach(p=>{ if(p.stokMinimum==null) p.stokMinimum=0; });
  const allLokasi = [...getEffectiveLokasiDefault(), ...DB.lokasiCustom];
  const filtered = DB.produk.filter(p=> matchSearch(p.nama+' '+p.kode+' '+(p.lokasi||''), persediaanSearch));
  let html = `<div class="tablewrap"><table class="sheet"><thead><tr>
    <th>Kode</th><th>Nama</th><th>Kategori</th><th>Kepemilikan</th><th>Lokasi</th><th>Stok</th><th>Satuan</th><th>Harga/satuan</th><th>Nilai Stok</th><th>Stok Minimum</th><th>⚠ Akan habis</th><th>Stok Habis (Auto Nol)</th>
  </tr></thead><tbody>`;
  filtered.forEach(p=>{
    const low = isLowStock(p);
    const auto = Number(p.stokMinimum||0)>0;
    html += `<tr data-id="${p.id}">
      <td class="mini">${p.kode}</td><td>${p.nama}</td><td><span class="mini">${p.kategori}</span></td>
      <td><span class="tag ${tagClassKep(p.kepemilikan)}">${p.kepemilikan}</span></td>
      <td><select class="ed-lokasi"><option value="">— pilih lokasi —</option>${allLokasi.map(l=>`<option ${p.lokasi===l?'selected':''}>${l}</option>`).join('')}</select></td>
      <td class="num" style="display:flex;align-items:center;gap:4px;justify-content:flex-end">
        <button class="btn small btnStokMinus" title="Kurangi stok manual">−</button>
        <span style="min-width:44px;text-align:right">${fmtNum(p.stok)}</span>
        <button class="btn small btnStokPlus" title="Tambah stok manual">+</button>
      </td>
      <td>${p.satuan}</td><td class="num">${fmtRp(p.hargaBeliPerSatuan||0)}</td>
      <td class="num">${fmtRp((p.stok||0)*(p.hargaBeliPerSatuan||0))}</td>
      <td><input type="number" min="0" step="any" class="ed-stokmin num" style="width:80px" value="${p.stokMinimum||0}" title="Isi manual — kalau diisi >0, tanda Akan Habis dicentang otomatis saat stok turun sampai angka ini"></td>
      <td class="center"><input type="checkbox" class="ed-habis" ${low?'checked':''} ${auto?'disabled title="Otomatis dari Stok Minimum"':''}></td>
      <td class="center"><input type="checkbox" class="ed-autonol" ${(p.stok||0)<=0?'checked disabled title="Stok sudah 0"':'title="Centang kalau stok sudah benar-benar habis — otomatis dinolkan & dijurnal"'}></td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  html += `<div class="mini" style="margin-top:6px">Centang <b>Stok Habis (Auto Nol)</b> untuk item yang sudah benar-benar habis — stok langsung dinolkan & jurnal penyesuaian dibuat otomatis tanpa perlu isi qty manual.</div>`;

  const byLokasi = {};
  DB.produk.forEach(p=>{ if(p.lokasi){ (byLokasi[p.lokasi] = byLokasi[p.lokasi]||[]).push(p); } });
  html += `<div class="grid cols-3" style="margin-top:16px">`;
  Object.keys(byLokasi).sort().forEach(loc=>{
    const items = byLokasi[loc];
    html += `<div class="card loc-block"><h4>${loc}</h4>${items.map(p=>`<span class="chip ${isLowStock(p)?'low':''}">${p.nama}: ${fmtNum(p.stok)} ${p.satuan}</span>`).join('')}</div>`;
  });
  if(Object.keys(byLokasi).length===0) html += `<div class="mini">Belum ada produk yang diberi lokasi.</div>`;
  html += `</div>`;
  const totalNilai = DB.produk.reduce((s,p)=>s+(p.stok||0)*(p.hargaBeliPerSatuan||0),0);
  html += `<div class="recap"><div>Total nilai persediaan: <b>${fmtRp(totalNilai)}</b></div><div>Item ditandai akan habis: <b>${DB.produk.filter(isLowStock).length}</b></div></div>`;

  const semuaLokasiCustom = Array.from(new Set([...getEffectiveLokasiDefault(), ...DB.lokasiCustom, ...DB.produk.filter(p=>p.lokasi).map(p=>p.lokasi)])).sort();
  html += `<div class="card" style="margin-top:16px"><h4>Kelola Lokasi Custom</h4>
  <div class="mini" style="margin-bottom:8px">Semua lokasi (termasuk Freezer/Kulkas bawaan) tampil di sini dan bisa diedit/dihapus.</div>
  ${semuaLokasiCustom.length? semuaLokasiCustom.map(l=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><span style="flex:1">${l}${LOKASI_ALL.includes(l)?' <span class="mini">(bawaan)</span>':''}</span><button class="btn small btnEditLokasi" data-nama="${l.replace(/"/g,'&quot;')}">Edit</button><button class="btn small danger btnDelLokasi" data-nama="${l.replace(/"/g,'&quot;')}">Hapus</button></div>`).join('') : '<div class="mini">Belum ada lokasi ditambahkan.</div>'}
  </div>`;

  wrap.innerHTML = html;

  wrap.querySelectorAll('tr[data-id]').forEach(row=>{
    const p = DB.produk.find(x=>x.id===row.dataset.id);
    row.querySelector('.ed-lokasi').addEventListener('change', e=>{ p.lokasi=e.target.value; save(); renderPersediaanTable(); });
    row.querySelector('.ed-stokmin').addEventListener('change', e=>{ p.stokMinimum=Number(e.target.value)||0; save(); renderPersediaanTable(); });
    row.querySelector('.ed-habis').addEventListener('change', e=>{ p.hampirHabis=e.target.checked; save(); renderPersediaanTable(); });
    row.querySelector('.ed-autonol').addEventListener('change', e=>{
      if(!e.target.checked) return;
      const ok = prosesAutoNolStok(p, 'bahan');
      renderPersediaanTable();
    });
    row.querySelector('.btnStokPlus').addEventListener('click', ()=> prosesPenyesuaianStok(p, 'bahan', 'plus'));
    row.querySelector('.btnStokMinus').addEventListener('click', ()=> prosesPenyesuaianStok(p, 'bahan', 'minus'));
  });
  wrap.querySelectorAll('.btnEditLokasi').forEach(btn=> btn.addEventListener('click', ()=>{
    const lama = btn.dataset.nama;
    const baru = (prompt('Nama lokasi baru:', lama)||'').trim(); if(!baru || baru===lama) return;
    if(DB.lokasiCustom.includes(lama)){
      const idx = DB.lokasiCustom.indexOf(lama);
      DB.lokasiCustom[idx] = baru;
    } else {
      // built-in default location (Freezer/Kulkas) — hide old name, register new name as custom
      if(!DB.lokasiHapus.includes(lama)) DB.lokasiHapus.push(lama);
      if(!DB.lokasiCustom.includes(baru)) DB.lokasiCustom.push(baru);
    }
    DB.produk.forEach(p=>{ if(p.lokasi===lama) p.lokasi=baru; });
    save(); renderPersediaanTable(); toast('Lokasi diperbarui');
  }));
  wrap.querySelectorAll('.btnDelLokasi').forEach(btn=> btn.addEventListener('click', ()=>{
    const nama = btn.dataset.nama;
    const used = DB.produk.filter(p=>p.lokasi===nama).length;
    if(used>0 && !confirm(`Lokasi "${nama}" masih dipakai ${used} item. Hapus lokasi ini? Item terkait akan jadi "belum ada lokasi".`)) return;
    if(used===0 && !confirm(`Hapus lokasi "${nama}"?`)) return;
    if(DB.lokasiCustom.includes(nama)) DB.lokasiCustom = DB.lokasiCustom.filter(x=>x!==nama);
    else if(!DB.lokasiHapus.includes(nama)) DB.lokasiHapus.push(nama);
    DB.produk.forEach(p=>{ if(p.lokasi===nama) p.lokasi=''; });
    save(); renderPersediaanTable(); toast('Lokasi dihapus');
  }));
}

/* ================= PERSEDIAAN BARANG (non-makanan) — dipecah jadi 2 bagian: Peralatan & Perlengkapan =================
   Peralatan = "bucket" default/tangkapan umum (kategori kosong, 'Peralatan', atau kategori custom lain).
   Perlengkapan = item berkategori persis 'Perlengkapan' — kalau Stok Habis (Auto Nol) dicentang, jurnal
   otomatis diposting ke akun Beban Perlengkapan Rumah (lihat prosesAutoNolStok), bukan Beban Lain-lain. */
const BARANG_SECTIONS = [
  { key:'peralatan', title:'Persediaan Peralatan', match: b=> (b.kategori||'')!=='Perlengkapan', newKategori:'' },
  { key:'perlengkapan', title:'Persediaan Perlengkapan', match: b=> (b.kategori||'')==='Perlengkapan', newKategori:'Perlengkapan' }
];
const barangSearchState = { peralatan:'', perlengkapan:'' };
const barangSortState = { peralatan:{col:null,dir:1}, perlengkapan:{col:null,dir:1} };
const BARANG_SORT_KEYS = {
  nama: b=> (b.nama||'').toLowerCase(),
  lokasi: b=> (b.lokasi||'').toLowerCase(),
  kategori: b=> (b.kategori||'').toLowerCase(),
  kepemilikan: b=> (b.kepemilikan||'').toLowerCase(),
  satuan: b=> (b.satuan||'').toLowerCase(),
  harga: b=> Number(b.hargaBeliPerSatuan||0),
  stok: b=> Number(b.stok||0),
  nilai: b=> Number(b.stok||0)*Number(b.hargaBeliPerSatuan||0),
  tag: b=> (b.tags||[]).join(', ').toLowerCase(),
  stokmin: b=> Number(b.stokMinimum||0),
  akanhabis: b=> isLowStock(b)?1:0,
  autonol: b=> Number(b.stok||0)<=0 ? 1:0,
  bebanop: b=> (akunById(b.akunBebanId)?.nama||'').toLowerCase()
};
function applyBarangSort(key, arr){
  const st = barangSortState[key];
  if(!st.col || !BARANG_SORT_KEYS[st.col]) return arr;
  const fn = BARANG_SORT_KEYS[st.col]; const dir = st.dir;
  return [...arr].sort((a,b)=>{
    const va=fn(a), vb=fn(b);
    if(typeof va==='string') return va.localeCompare(vb)*dir;
    return (va-vb)*dir;
  });
}
function barangSortTh(key, col, label){
  const st = barangSortState[key];
  const active = st.col===col;
  const arrow = active ? (st.dir===1?' ▲':' ▼') : '';
  return `<th class="barang-sort-th" data-sortcol="${col}" style="cursor:pointer;user-select:none" title="Klik untuk sortir">${label}${arrow}</th>`;
}
function barangIoCfg(sectionCfg){
  return {
    exportExcel: ()=>{
      const items = DB.barang.filter(sectionCfg.match);
      return { filename:'persediaan-'+sectionCfg.key+'.xlsx', sheetName:sectionCfg.title,
        headers:['Nama','Lokasi','Kategori','Kepemilikan','Satuan','Harga/Satuan (avg)','Stok','Nilai Stok','Tag','Beban Operasional'],
        rows: items.map(b=>[b.nama, b.lokasi||'', b.kategori||'', b.kepemilikan||'', b.satuan||'', b.hargaBeliPerSatuan||0, b.stok||0, (b.stok||0)*(b.hargaBeliPerSatuan||0), (b.tags||[]).join(', '), akunById(b.akunBebanId)?.nama||'']) };
    }
  };
}
RENDERERS.barang = function(c){
  let html = '';
  BARANG_SECTIONS.forEach(s=>{
    html += `<div class="section-title"><h3 id="barangCountTitle_${s.key}">${s.title} (0)</h3><div style="display:flex;gap:8px;flex-wrap:wrap">${searchBoxHtml('barangSearchInput_'+s.key,'Cari nama/lokasi/kategori')}<button class="btn small" id="btnAddLokasiBarang_${s.key}">+ Tambah Lokasi</button><button class="btn small" id="btnAddKategoriBarang_${s.key}">+ Tambah Kategori</button><button class="btn primary" id="btnAddBarang_${s.key}">+ Tambah Barang</button>${ioToolbarHtml('barang_'+s.key, barangIoCfg(s))}</div></div>
    <div id="barangTableWrap_${s.key}"></div>`;
  });
  c.innerHTML = html;
  BARANG_SECTIONS.forEach(s=>{
    bindIoToolbar('barang_'+s.key, barangIoCfg(s));
    document.getElementById('barangSearchInput_'+s.key).addEventListener('input', e=>{ barangSearchState[s.key]=e.target.value; renderBarangSectionTable(s); });
    document.getElementById('btnAddLokasiBarang_'+s.key).addEventListener('click', ()=>{
      const nama = prompt('Nama lokasi baru (mis. Gudang, Rak Kasir):'); if(!nama) return;
      DB.lokasiBarangCustom.push(nama.trim()); save(); renderBarangTable(); toast('Lokasi ditambahkan');
    });
    document.getElementById('btnAddKategoriBarang_'+s.key).addEventListener('click', ()=>{
      const nama = (prompt('Nama kategori baru (mis. Peralatan, Perlengkapan):')||'').trim(); if(!nama) return;
      if(DB.kategoriBarangCustom.some(k=>k.toLowerCase()===nama.toLowerCase())) return toast('Kategori ini sudah ada');
      DB.kategoriBarangCustom.push(nama); save(); renderBarangTable(); toast('Kategori ditambahkan');
    });
    document.getElementById('btnAddBarang_'+s.key).addEventListener('click', ()=>{
      const nama = prompt('Nama barang:'); if(!nama) return;
      DB.barang.push({ id:uid(), nama, satuan:'pcs', stok:0, lokasi:'', kategori:s.newKategori, kepemilikan:'Pribadi', hampirHabis:false, tags:[], runQty:0, runTotal:0, hargaBeliPerSatuan:0, akunBebanId:'' });
      save(); renderBarangTable();
    });
    renderBarangSectionTable(s);
  });
};

function renderBarangTable(){ BARANG_SECTIONS.forEach(s=> renderBarangSectionTable(s)); }

function renderBarangSectionTable(sectionCfg){
  const { key, title, match } = sectionCfg;
  const wrap = document.getElementById('barangTableWrap_'+key); if(!wrap) return;
  DB.barang.forEach(b=>{ if(!b.kepemilikan) b.kepemilikan='Pribadi'; if(b.stokMinimum==null) b.stokMinimum=0; if(b.kategori==null) b.kategori=''; if(b.akunBebanId==null) b.akunBebanId=''; });
  const allLokasiBarang = DB.lokasiBarangCustom;
  const allKategoriBarang = DB.kategoriBarangCustom;
  const sectionItems = DB.barang.filter(match);
  const titleEl = document.getElementById('barangCountTitle_'+key); if(titleEl) titleEl.textContent = title+' ('+sectionItems.length+')';
  const search = barangSearchState[key];
  const filteredRaw = sectionItems.filter(b=> matchSearch(b.nama+' '+(b.lokasi||'')+' '+(b.kategori||'')+' '+(b.kepemilikan||'')+' '+(b.tags||[]).join(' '), search));
  const filtered = applyBarangSort(key, filteredRaw);
  let html = `<div class="mini" style="margin-bottom:8px">Kepemilikan bisa ditambah/dihapus sendiri lewat tombol <b>+</b> / <b>−</b> di sebelah dropdown. Isi kolom <b>Beban Operasional</b> untuk menentukan akun beban tujuan tiap item (ketik untuk cari, atau tambah akun baru langsung dari situ) — kalau dikosongkan, item berkategori <b>Perlengkapan</b> otomatis ke <b>Beban Perlengkapan Rumah</b> dan kategori lain ke <b>Beban Lain-lain</b>. Klik judul kolom untuk sortir.</div>
  <div class="tablewrap"><table class="sheet"><thead><tr>${barangSortTh(key,'nama','Nama')}${barangSortTh(key,'lokasi','Lokasi')}${barangSortTh(key,'kategori','Kategori')}${barangSortTh(key,'kepemilikan','Kepemilikan')}${barangSortTh(key,'satuan','Satuan')}${barangSortTh(key,'harga','Harga/Satuan (avg)')}${barangSortTh(key,'stok','Stok')}${barangSortTh(key,'nilai','Nilai Stok')}${barangSortTh(key,'tag','Tag')}${barangSortTh(key,'stokmin','Stok Minimum')}${barangSortTh(key,'akanhabis','⚠ Akan habis')}${barangSortTh(key,'autonol','Stok Habis (Auto Nol)')}${barangSortTh(key,'bebanop','Beban Operasional')}<th></th></tr></thead><tbody>
  ${filtered.map(b=>{ const low = isLowStock(b); const auto = Number(b.stokMinimum||0)>0; return `<tr data-id="${b.id}">
    <td><input class="ed-bnama" value="${b.nama.replace(/"/g,'&quot;')}"></td>
    <td><select class="ed-blokasi"><option value="">— pilih lokasi —</option>${allLokasiBarang.map(l=>`<option ${b.lokasi===l?'selected':''}>${l}</option>`).join('')}</select></td>
    <td><select class="ed-bkategori"><option value="">— pilih kategori —</option>${allKategoriBarang.map(k=>`<option ${b.kategori===k?'selected':''}>${k}</option>`).join('')}</select></td>
    <td>${manageableSelectHtml('kp-'+key+'-'+b.id, getAllKepemilikan(), b.kepemilikan||'', 'kepemilikanCustom')}</td>
    <td><input class="ed-bsatuan" value="${b.satuan}" style="width:70px"></td>
    <td class="num">${fmtRp(b.hargaBeliPerSatuan||0)}</td>
    <td class="num" style="display:flex;align-items:center;gap:4px;justify-content:flex-end">
      <button class="btn small btnStokMinus" data-id="${b.id}" title="Kurangi stok manual">−</button>
      <span style="min-width:44px;text-align:right">${fmtNum(b.stok)}</span>
      <button class="btn small btnStokPlus" data-id="${b.id}" title="Tambah stok manual">+</button>
    </td>
    <td class="num">${fmtRp((b.stok||0)*(b.hargaBeliPerSatuan||0))}</td>
    <td style="min-width:170px">${tagInputHtml('bt_'+key+'_'+b.id, {compact:true, initialValue:(b.tags||[]).join(', '), hiddenClass:'ed-btag'})}</td>
    <td><input type="number" min="0" step="any" class="ed-bstokmin num" style="width:80px" value="${b.stokMinimum||0}" title="Isi manual — kalau diisi >0, tanda Akan Habis dicentang otomatis saat stok turun sampai angka ini"></td>
    <td class="center"><input type="checkbox" class="ed-bhabis" ${low?'checked':''} ${auto?'disabled title="Otomatis dari Stok Minimum"':''}></td>
    <td class="center"><input type="checkbox" class="ed-bautonol" ${(b.stok||0)<=0?'checked disabled title="Stok sudah 0"':'title="Centang kalau stok sudah benar-benar habis — otomatis dinolkan & dijurnal"'}></td>
    <td style="min-width:200px">${akunPickerHtml('bo_'+key+'_'+b.id, a=>['BO','BL','BPP'].includes(a.kategori), 'Ketik nama akun beban...', b.akunBebanId||'')}</td>
    <td><button class="btn small danger btnDelBarang">Hapus</button></td>
  </tr>`;}).join('') || `<tr><td colspan="14" class="empty">Belum ada barang${key==='perlengkapan'?' perlengkapan. Contoh: tisu, sabun, sumpit.':'. Contoh: rak, alat masak, kursi.'}</td></tr>`}
  </tbody></table></div>
  <div class="mini" style="margin-top:6px">Gunakan tombol <b>+</b> / <b>−</b> di kolom Stok untuk penyesuaian manual (mis. stok fisik ketemu lebih/kurang dari catatan), atau centang <b>Stok Habis (Auto Nol)</b> untuk item yang sudah benar-benar habis (langsung dinolkan, tanpa isi qty manual). Kedua cara ini otomatis membuat jurnal yang mengurangi nilai Persediaan di Neraca dan langsung membebankannya ke akun di kolom <b>Beban Operasional</b> milik item tsb — kalau kolom itu kosong, dipakai akun default (Beban Perlengkapan Rumah untuk kategori Perlengkapan, Beban Lain-lain untuk kategori lain). Akun Persediaan (aset) sendiri tetap cukup 1 akun (Persediaan Peralatan) untuk semua barang, walau beban tiap item beda-beda.</div>`;

  const byLokasi = {};
  sectionItems.forEach(b=>{ if(b.lokasi){ (byLokasi[b.lokasi] = byLokasi[b.lokasi]||[]).push(b); } });
  html += `<div class="grid cols-3" style="margin-top:16px">`;
  Object.keys(byLokasi).sort().forEach(loc=>{
    const items = byLokasi[loc];
    html += `<div class="card loc-block"><h4>${loc}</h4>${items.map(b=>`<span class="chip ${isLowStock(b)?'low':''}">${b.nama}: ${fmtNum(b.stok)} ${b.satuan}</span>`).join('')}</div>`;
  });
  if(Object.keys(byLokasi).length===0) html += `<div class="mini">Belum ada barang yang diberi lokasi.</div>`;
  html += `</div>`;
  html += `<div class="recap"><div>Item ditandai akan habis: <b>${sectionItems.filter(isLowStock).length}</b></div></div>`;

  const semuaLokasiBarang = Array.from(new Set([...DB.lokasiBarangCustom, ...DB.barang.filter(b=>b.lokasi).map(b=>b.lokasi)])).sort();
  html += `<div class="card" style="margin-top:16px"><h4>Kelola Lokasi Custom</h4>
  ${semuaLokasiBarang.length? semuaLokasiBarang.map(l=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><span style="flex:1">${l}</span><button class="btn small btnEditLokasiBarang" data-nama="${l.replace(/"/g,'&quot;')}">Edit</button><button class="btn small danger btnDelLokasiBarang" data-nama="${l.replace(/"/g,'&quot;')}">Hapus</button></div>`).join('') : '<div class="mini">Belum ada lokasi custom ditambahkan.</div>'}
  </div>`;

  const semuaKategoriBarang = Array.from(new Set([...DB.kategoriBarangCustom, ...DB.barang.filter(b=>b.kategori).map(b=>b.kategori)])).sort();
  html += `<div class="card" style="margin-top:16px"><h4>Kelola Kategori</h4>
  <div class="mini" style="margin-bottom:8px">Kategori <b>Perlengkapan</b> otomatis terhubung ke akun <b>Beban Perlengkapan Rumah</b> saat Stok Habis dicentang — ini hanya berlaku sebagai default kalau kolom <b>Beban Operasional</b> item tsb dikosongkan; isi kolom itu untuk memakai akun beban lain per item.</div>
  ${semuaKategoriBarang.length? semuaKategoriBarang.map(k=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><span style="flex:1">${k}</span><button class="btn small btnEditKategoriBarang" data-nama="${k.replace(/"/g,'&quot;')}">Edit</button><button class="btn small danger btnDelKategoriBarang" data-nama="${k.replace(/"/g,'&quot;')}">Hapus</button></div>`).join('') : '<div class="mini">Belum ada kategori ditambahkan.</div>'}
  </div>`;

  wrap.innerHTML = html;
  bindMasterListButtons(wrap);
  wrap.querySelectorAll('.barang-sort-th').forEach(th=>{
    th.addEventListener('click', ()=>{
      const col = th.dataset.sortcol; const st = barangSortState[key];
      if(st.col===col) st.dir *= -1; else { st.col = col; st.dir = 1; }
      renderBarangSectionTable(sectionCfg);
    });
  });
  wrap.querySelectorAll('tr[data-id]').forEach(row=>{
    const id = row.dataset.id; const b = DB.barang.find(x=>x.id===id);
    row.querySelector('.ed-bnama').addEventListener('change', e=>{ b.nama=e.target.value; save(); });
    row.querySelector('.ed-blokasi').addEventListener('change', e=>{ b.lokasi=e.target.value; save(); renderBarangTable(); });
    row.querySelector('.ed-bkategori').addEventListener('change', e=>{ b.kategori=e.target.value; save(); renderBarangTable(); });
    const kp = row.querySelector('#kp-'+key+'-'+id); if(kp) kp.addEventListener('change', e=>{ b.kepemilikan=e.target.value; save(); });
    row.querySelector('.ed-bsatuan').addEventListener('change', e=>{ b.satuan=e.target.value; save(); });
    row.querySelector('.btnStokPlus').addEventListener('click', ()=> prosesPenyesuaianStok(b, 'barang', 'plus'));
    row.querySelector('.btnStokMinus').addEventListener('click', ()=> prosesPenyesuaianStok(b, 'barang', 'minus'));
    row.querySelector('.ed-btag').addEventListener('change', e=>{ const tags=parseTagInput(e.target.value); tags.forEach(ensureTag); b.tags=tags; save(); });
    row.querySelector('.ed-bstokmin').addEventListener('change', e=>{ b.stokMinimum=Number(e.target.value)||0; save(); renderBarangTable(); });
    row.querySelector('.ed-bhabis').addEventListener('change', e=>{ b.hampirHabis=e.target.checked; save(); renderBarangTable(); });
    row.querySelector('.ed-bautonol').addEventListener('change', e=>{
      if(!e.target.checked) return;
      const ok = prosesAutoNolStok(b, 'barang');
      renderBarangTable();
    });
    bindAkunPicker('bo_'+key+'_'+id, akunId=>{ b.akunBebanId = akunId; save(); });
    row.querySelector('.btnDelBarang').addEventListener('click', ()=>{ if(!confirm('Hapus barang ini?'))return; DB.barang=DB.barang.filter(x=>x.id!==b.id); save(); renderBarangTable(); });
  });
  wrap.querySelectorAll('.btnEditLokasiBarang').forEach(btn=> btn.addEventListener('click', ()=>{
    const lama = btn.dataset.nama;
    const baru = (prompt('Nama lokasi baru:', lama)||'').trim(); if(!baru || baru===lama) return;
    const idx = DB.lokasiBarangCustom.indexOf(lama);
    if(idx>=0) DB.lokasiBarangCustom[idx] = baru; else DB.lokasiBarangCustom.push(baru);
    DB.barang.forEach(b=>{ if(b.lokasi===lama) b.lokasi=baru; });
    save(); renderBarangTable(); toast('Lokasi diperbarui');
  }));
  wrap.querySelectorAll('.btnDelLokasiBarang').forEach(btn=> btn.addEventListener('click', ()=>{
    const nama = btn.dataset.nama;
    const used = DB.barang.filter(b=>b.lokasi===nama).length;
    if(used>0 && !confirm(`Lokasi "${nama}" masih dipakai ${used} item. Hapus lokasi ini? Item terkait akan jadi "belum ada lokasi".`)) return;
    if(used===0 && !confirm(`Hapus lokasi "${nama}"?`)) return;
    DB.lokasiBarangCustom = DB.lokasiBarangCustom.filter(x=>x!==nama);
    DB.barang.forEach(b=>{ if(b.lokasi===nama) b.lokasi=''; });
    save(); renderBarangTable(); toast('Lokasi dihapus');
  }));
  wrap.querySelectorAll('.btnEditKategoriBarang').forEach(btn=> btn.addEventListener('click', ()=>{
    const lama = btn.dataset.nama;
    const baru = (prompt('Nama kategori baru:', lama)||'').trim(); if(!baru || baru===lama) return;
    const idx = DB.kategoriBarangCustom.indexOf(lama);
    if(idx>=0) DB.kategoriBarangCustom[idx] = baru; else DB.kategoriBarangCustom.push(baru);
    DB.barang.forEach(b=>{ if(b.kategori===lama) b.kategori=baru; });
    save(); renderBarangTable(); toast('Kategori diperbarui');
  }));
  wrap.querySelectorAll('.btnDelKategoriBarang').forEach(btn=> btn.addEventListener('click', ()=>{
    const nama = btn.dataset.nama;
    const used = DB.barang.filter(b=>b.kategori===nama).length;
    if(used>0 && !confirm(`Kategori "${nama}" masih dipakai ${used} item. Hapus kategori ini? Item terkait akan jadi "belum ada kategori".`)) return;
    if(used===0 && !confirm(`Hapus kategori "${nama}"?`)) return;
    DB.kategoriBarangCustom = DB.kategoriBarangCustom.filter(x=>x!==nama);
    DB.barang.forEach(b=>{ if(b.kategori===nama) b.kategori=''; });
    save(); renderBarangTable(); toast('Kategori dihapus');
  }));
}

/* ================= PROJECT (Persediaan) =================
   Konsepnya mirip Resep (bahan masuk -> hasil keluar), tapi untuk project apapun (bukan cuma menu):
   - Bahan/Barang (input): diambil dari master Produk (bahan) ATAU Persediaan Barang, dengan qty.
   - Output (hasil): baris bebas (nama, qty, satuan, harga satuan) — hasil/keluaran project itu sendiri.
   - Anggaran: nominal Rp yang dianggarkan, dibandingkan dengan realisasi (total biaya bahan/barang dipakai). */
let projectSearch = '';
let projectSelectedId = null; // null = daftar semua project, else = sedang buka detail project ini
let projectBahanTipe = 'produk'; // 'produk' | 'barang' — sumber item untuk form "+ Tambah Bahan/Barang"

function projectItemList(){ return projectBahanTipe==='barang' ? DB.barang : DB.produk; }
function projectHargaSatuan(tipe, refId){
  const item = (tipe==='barang' ? DB.barang : DB.produk).find(x=>x.id===refId);
  return item ? (item.hargaBeliPerSatuan||0) : 0;
}
function computeProjectRealisasi(p){
  return (p.bahan||[]).reduce((s,b)=> s + (Number(b.qty)||0) * projectHargaSatuan(b.tipe, b.refId), 0);
}
function computeProjectNilaiOutput(p){
  return (p.output||[]).reduce((s,o)=> s + (Number(o.qty)||0) * (Number(o.harga)||0), 0);
}

RENDERERS.project = function(c){
  if(projectSelectedId) renderProjectDetail(c); else renderProjectList(c);
};

function renderProjectList(c){
  const filtered = DB.project.filter(p=> matchSearch(p.nama+' '+(p.deskripsi||''), projectSearch));
  let html = `<div class="section-title"><h3>Project (${DB.project.length})</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${searchBoxHtml('projectSearchInput','Cari nama/deskripsi project')}<button class="btn primary" id="btnAddProject">+ Tambah Project</button></div></div>`;
  if(filtered.length===0){
    html += `<div class="empty"><div class="big">🗂</div>Belum ada project. Project bisa menggabungkan barang/bahan dari Produk & Persediaan Barang, hasil (output), dan anggaran — cocok untuk kebutuhan apa pun di luar menu resep.</div>`;
  } else {
    html += `<div class="resep-grid">`;
    filtered.forEach(p=>{
      const realisasi = computeProjectRealisasi(p);
      const anggaran = Number(p.anggaran)||0;
      const sisa = anggaran - realisasi;
      html += `<div class="resep-card">
        <div class="resep-card-img">${p.gambar?`<img src="${p.gambar}" alt="${p.nama}">`:'🗂'}</div>
        <div class="resep-card-body">
          <a href="#" class="projectLink" data-id="${p.id}">${p.nama}</a>
          <div class="resep-card-row"><span class="mini">Anggaran</span><span>${fmtRp(anggaran)}</span></div>
          <div class="resep-card-row"><span class="mini">Realisasi</span><span>${fmtRp(realisasi)}</span></div>
          <div class="resep-card-row"><span class="mini">Sisa Anggaran</span><span style="font-weight:700;color:${sisa>=0?'var(--debit)':'var(--kredit)'}">${fmtRp(sisa)}</span></div>
          <div class="resep-card-row"><span class="mini">Nilai Output</span><span style="font-weight:700">${fmtRp(computeProjectNilaiOutput(p))}</span></div>
          <button class="btn small danger btnDelProjectRow" data-id="${p.id}" style="width:100%;margin-top:6px">Hapus</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  c.innerHTML = html;
  bindSearchInput('projectSearchInput', v=>{ projectSearch=v; });
  document.getElementById('btnAddProject').addEventListener('click', ()=>{
    const nama = (prompt('Nama project:')||'').trim(); if(!nama) return;
    if(DB.project.some(x=>x.nama.trim().toLowerCase()===nama.toLowerCase())) return toast('Nama project ini sudah ada, gunakan nama lain agar tidak double');
    const p = { id:uid(), nama, deskripsi:'', gambar:null, tanggal:todayStr(), anggaran:0, bahan:[], output:[] };
    DB.project.push(p); save();
    projectSelectedId = p.id; renderContent();
  });
  c.querySelectorAll('.projectLink').forEach(a=> a.addEventListener('click', e=>{ e.preventDefault(); projectSelectedId=a.dataset.id; renderContent(); }));
  c.querySelectorAll('.btnDelProjectRow').forEach(btn=> btn.addEventListener('click', ()=>{
    if(!confirm('Hapus project ini?')) return;
    DB.project = DB.project.filter(x=>x.id!==btn.dataset.id); save(); renderContent();
  }));
}

/* ---- Smart daily menu recommendation, based on current stock (recalculated live every render) ---- */
const MENU_KATEGORI_PRIORITAS = ['Nasi Karbohidrat','Lauk Protein','Sayur Serat','Buah Vitamin','Air Putih Mineral','Snack'];
const MEAL_SLOTS = [
  {nama:'Pagi', kategori:['Nasi Karbohidrat','Lauk Protein','Air Putih Mineral']},
  {nama:'Siang', kategori:['Nasi Karbohidrat','Lauk Protein','Sayur Serat','Air Putih Mineral']},
  {nama:'Sore', kategori:['Snack','Buah Vitamin']},
  {nama:'Malam', kategori:['Nasi Karbohidrat','Lauk Protein','Sayur Serat','Air Putih Mineral']},
];
function matchResepKategoriBudget(r){
  const j = (r.jenisResep||'').toLowerCase();
  if(j.includes('protein')||j.includes('lauk')) return 'Lauk Protein';
  if(j.includes('karbohidrat')||j.includes('nasi')) return 'Nasi Karbohidrat';
  if(j.includes('sayur')) return 'Sayur Serat';
  if(j.includes('buah')) return 'Buah Vitamin';
  if(j.includes('air')||j.includes('minuman')||j.includes('minum')) return 'Air Putih Mineral';
  if(j.includes('snack')||j.includes('camilan')) return 'Snack';
  return null;
}
// Cari hari tersisa (bisa negatif kalau sudah lewat) sampai kadaluwarsa TERDEKAT dari semua batch
// Pembelian Bahan untuk produk ini. null kalau produk ini tidak pernah dicatat kadaluwarsanya.
function produkHariKadaluwarsaTerdekat(produkId){
  const list = DB.pembelian.filter(p=> (p.tipe||'bahan')==='bahan' && p.kadaluwarsa && (p.refId===produkId || p.produkId===produkId));
  if(list.length===0) return null;
  return Math.min(...list.map(p=> daysUntil(p.kadaluwarsa)));
}
// Skor urgensi kadaluwarsa: makin dekat/lewat tanggalnya, makin tinggi skornya.
function skorUrgensiKadaluwarsa(hari){
  if(hari===null) return 0;
  if(hari<=0) return 4;   // sudah kadaluwarsa/hari ini — paling mendesak
  if(hari<=3) return 3;
  if(hari<=7) return 2;
  if(hari<=14) return 1;
  return 0; // >14 hari lagi, belum mendesak
}
function resepStockScore(r){
  let stokTotal = 0, urgensiMax = 0;
  (r.bahan||[]).filter(b=>b.tipe==='produk').forEach(b=>{
    const p = DB.produk.find(x=>x.id===b.refId);
    if(!p) return;
    stokTotal += (p.stok||0);
    const hari = produkHariKadaluwarsaTerdekat(p.id);
    urgensiMax = Math.max(urgensiMax, skorUrgensiKadaluwarsa(hari));
  });
  // urgensi kadaluwarsa jadi prioritas utama (dikali angka besar supaya selalu menang di atas
  // skor stok biasa), stok banyak tetap jadi penentu kedua/tie-breaker seperti sebelumnya.
  return urgensiMax*1000000 + stokTotal;
}
// Untuk ditampilkan di UI: true kalau resep ini punya bahan yang mendekati/sudah kadaluwarsa (<=14 hari).
function resepPunyaBahanMendesak(r){
  return (r.bahan||[]).filter(b=>b.tipe==='produk').some(b=>{
    const hari = produkHariKadaluwarsaTerdekat(b.refId);
    return hari!==null && hari<=14;
  });
}
/* Deterministic-but-varied pick: ranks candidates by remaining stock (use up abundant stock first),
   then rotates among the top few based on the date so consecutive days don't repeat the same thing. */
/* Shared consumption logic (recipe -> ingredients -> stock/jurnal), reused by the manual Pemakaian form
   and by the Kalender Menu "tandai dikonsumsi" checkboxes below. */
function prosesPemakaianResep(resepId, tanggal, qty, tags, bukti){
  const resep = DB.resep.find(x=>x.id===resepId);
  if(!resep || (resep.bahan||[]).length===0) return { error:'Resep ini belum punya bahan' };
  const consumed = []; let nilaiBahan=0, kep='Pribadi';
  (function consumeBahan(list, mult){
    list.forEach(b=>{
      if(b.tipe==='produk'){ const prod=DB.produk.find(x=>x.id===b.refId); if(!prod) return; consumed.push({prod, pakai:b.qty*qty*mult}); }
      else if(b.tipe==='resep'){ const sub=DB.resep.find(x=>x.id===b.refId); if(!sub) return; consumeBahan(sub.bahan||[], b.qty*mult); }
    });
  })(resep.bahan, 1);
  consumed.forEach(({prod,pakai})=>{ prod.stok=(prod.stok||0)-pakai; nilaiBahan += pakai*(prod.hargaBeliPerSatuan||0); kep=prod.kepemilikan; });
  const pObj = { id:uid(), sumberTipe:'resep', tanggal, resepId, qty, nilaiBahan:Math.round(nilaiBahan), tags:tags||[], bukti:bukti||null };
  DB.pemakaian.push(pObj);
  if(nilaiBahan>0){
    const bppAkun = DB.coa.find(a=>a.kategori==='BPP' && a.kepemilikan===kep) || DB.coa.find(a=>a.kategori==='BPP');
    const psAkun = DB.coa.find(a=>a.kategori==='PS' && a.kepemilikan===kep) || DB.coa.find(a=>a.kategori==='PS');
    postJurnal({ tanggal, keterangan:'Pemakaian bahan: '+resep.namaMenu+' x'+fmtNum(qty), debitId:bppAkun.id, kreditId:psAkun.id, nominal:Math.round(nilaiBahan), sumber:'Pemakaian', ref:'pemakaian-'+pObj.id, tags:tags||[], bukti });
  }
  return { ok:true, pObj };
}
/* Reverses any Pemakaian entry (resep/produk/barang) — restores stock and removes its jurnal, used when
   un-checking a "sudah dikonsumsi" box or deleting a Pemakaian row. */
function batalkanPemakaian(pemakaianId){
  const p = DB.pemakaian.find(x=>x.id===pemakaianId); if(!p) return;
  const tipe = p.sumberTipe || 'resep';
  if(tipe==='resep'){
    const resep = DB.resep.find(x=>x.id===p.resepId);
    if(resep){
      (function restoreBahan(list, mult){
        list.forEach(b=>{
          if(b.tipe==='produk'){ const prod=DB.produk.find(x=>x.id===b.refId); if(prod) prod.stok=(prod.stok||0)+b.qty*p.qty*mult; }
          else if(b.tipe==='resep'){ const sub=DB.resep.find(x=>x.id===b.refId); if(sub) restoreBahan(sub.bahan||[], b.qty*mult); }
        });
      })(resep.bahan||[], 1);
    }
  } else if(tipe==='produk'){
    const prod = DB.produk.find(x=>x.id===p.refId); if(prod) prod.stok=(prod.stok||0)+p.qty;
  } else if(tipe==='barang'){
    const b = DB.barang.find(x=>x.id===p.refId); if(b) b.stok=(b.stok||0)+p.qty;
  }
  DB.pemakaian = DB.pemakaian.filter(x=>x.id!==pemakaianId);
  deleteJurnalByRef('pemakaian-'+pemakaianId);
}
/* Ingredient qty needed per day, at full (unscaled) portions, for a given date's recommendation. */
function hitungKebutuhanHarianBahan(dateStr){
  const rekom = getRekomendasiHarian(dateStr);
  const kebutuhan = {};
  (function tambah(list, qtyMenu){
    list.forEach(b=>{
      if(b.tipe==='produk') kebutuhan[b.refId] = (kebutuhan[b.refId]||0) + b.qty*qtyMenu;
      else if(b.tipe==='resep'){ const sub=DB.resep.find(x=>x.id===b.refId); if(sub) tambah(sub.bahan||[], b.qty*qtyMenu); }
    });
  });
  rekom.forEach(slot=> slot.menus.forEach(mn=> tambah(mn.resep.bahan||[], 1)));
  return kebutuhan;
}
/* Suggested portion-scale (0-1) so today's stock can be stretched to last `targetHari` days.
   1 = no reduction needed; e.g. 0.6 = shrink daily portions to 60% to make stock last that long. */
function hitungPorsiSkala(targetHari){
  if(!targetHari || targetHari<=0) return 1;
  const kebutuhan = hitungKebutuhanHarianBahan(todayStr());
  let minRasio = 1;
  Object.keys(kebutuhan).forEach(pid=>{
    const prod = DB.produk.find(p=>p.id===pid); if(!prod) return;
    const perHari = kebutuhan[pid]; if(perHari<=0) return;
    const tahanHari = (prod.stok||0)/perHari;
    const rasio = tahanHari/targetHari;
    if(rasio < minRasio) minRasio = rasio;
  });
  return Math.max(0, Math.min(1, minRasio));
}

function getRekomendasiHarian(dateStr){
  const dayNum = Number(dateStr.slice(8,10)) || 1;
  return MEAL_SLOTS.map((slot, slotIdx)=>{
    const menus = slot.kategori.map((kat, katIdx)=>{
      const kandidat = DB.resep.filter(r=> matchResepKategoriBudget(r)===kat);
      if(kandidat.length===0) return { kategori:kat, resep:null };
      const scored = kandidat.map(r=>({r, score:resepStockScore(r)})).sort((a,b)=> b.score-a.score);
      const top = scored.slice(0, Math.min(3, scored.length));
      const pick = top[(dayNum + slotIdx + katIdx) % top.length].r;
      return { kategori:kat, resep:pick };
    }).filter(m=>m.resep);
    return { slot: slot.nama, menus };
  });
}

let kalenderBulan = todayStr().slice(0,7);
function estimasiNilaiResep(resep, qty){
  let nilai = 0;
  (function hitung(list, mult){
    (list||[]).forEach(b=>{
      if(b.tipe==='produk'){ const prod=DB.produk.find(x=>x.id===b.refId); if(prod) nilai += b.qty*qty*mult*(prod.hargaBeliPerSatuan||0); }
      else if(b.tipe==='resep'){ const sub=DB.resep.find(x=>x.id===b.refId); if(sub) hitung(sub.bahan||[], b.qty*mult); }
    });
  })(resep.bahan, 1);
  return Math.round(nilai);
}
function renderKalenderMenu(c){
  const [y,m] = kalenderBulan.split('-').map(Number);

  const skala = hitungPorsiSkala(targetHari);
  const kebutuhanHarian = hitungKebutuhanHarianBahan(todayStr());
  const rekomHariIni = getRekomendasiHarian(todayStr());
  const estimasiBiayaHarian = rekomHariIni.reduce((s,slot)=> s + slot.menus.reduce((s2,mn)=> s2 + estimasiNilaiResep(mn.resep, skala), 0), 0);

  let html = `<div class="section-title">

  if(missingKategori.length){
    html += `<div class="mini" style="margin-bottom:10px;color:var(--warn)">⚠ Belum ada resep berjenis: ${missingKategori.join(', ')} — tambahkan resep dengan Jenis Resep yang sesuai (di Produk & Resep) supaya kategori itu ikut direkomendasikan. Set "Jenis Resep" memuat kata seperti "protein", "karbohidrat", "sayur", "buah", "air/minuman", atau "snack".</div>`;
  }

  html += `<div class="card" style="margin-bottom:14px">
    <div class="section-title"><h3>Perpanjang Jatah Makan</h3></div>
    <div class="mini" style="margin-bottom:8px">Isi target berapa hari stok bahan yang ada sekarang harus bertahan — porsi harian akan otomatis disarankan lebih kecil supaya cukup sampai hari itu.</div>
    <div class="formgrid">

      <div class="field"><label>Porsi harian disarankan</label><input value="${Math.round(skala*100)}% dari porsi normal" disabled></div>

    </div>

    ${Object.keys(kebutuhanHarian).length? `<div class="tablewrap" style="margin-top:10px"><table class="sheet"><thead><tr><th>Bahan</th><th>Stok</th><th>Kebutuhan/hari (normal)</th><th>Estimasi tahan (hari)</th></tr></thead><tbody>
      ${Object.keys(kebutuhanHarian).map(pid=>{
        const prod = DB.produk.find(p=>p.id===pid); if(!prod) return '';
        const perHari = kebutuhanHarian[pid];
        const tahan = perHari>0 ? (prod.stok||0)/perHari : Infinity;
        return `<tr><td>${prod.nama}</td><td class="num">${fmtNum(prod.stok||0)} ${prod.satuan}</td><td class="num">${fmtNum(perHari)} ${prod.satuan}</td><td class="num">${isFinite(tahan)?fmtNum(Math.round(tahan*10)/10):'∞'}</td></tr>`;
      }).join('')}
      </tbody></table></div>` : ''}
  </div>`;

  html += `<div style="display:flex;flex-direction:column;gap:8px">`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${kalenderBulan}-${String(d).padStart(2,'0')}`;
    const dowLabel = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'][new Date(y, m-1, d).getDay()];

    const totalMenu = rekom.reduce((s,slot)=>s+slot.menus.length,0);

function openRekomendasiDrawer(dateStr){
  if(DB.resep.length===0) return toast('Tambah resep dulu di menu Produk & Resep');
  const targetHari = DB.budgetSetting?.targetHariStok || null;
  const skala = hitungPorsiSkala(targetHari);
  const qtyScaled = Math.round(skala*100)/100;
  const rekom = getRekomendasiHarian(dateStr);
  let totalBiaya = 0;
  let rowsHtml = rekom.map(slot=>{
    if(slot.menus.length===0) return '';
    return `<div style="margin-bottom:12px">
      <div style="font-weight:700;font-size:12.8px;color:var(--terracotta-dark);margin-bottom:6px">${slot.slot}</div>
      <div class="tablewrap"><table class="sheet"><thead><tr><th>Kategori</th><th>Menu</th><th>Porsi</th><th>Estimasi Biaya</th><th>Konsumsi?</th></tr></thead><tbody>
      ${slot.menus.map(mn=>{
        const penjualanMatch = DB.penjualan.some(x=>x.resepId===mn.resep.id && x.tanggal===dateStr);
        const pemakaianMatch = DB.pemakaian.find(x=>(x.sumberTipe||'resep')==='resep' && x.resepId===mn.resep.id && x.tanggal===dateStr);
        const done = penjualanMatch || !!pemakaianMatch;
        const biaya = estimasiNilaiResep(mn.resep, qtyScaled);
        totalBiaya += biaya;
        return `<tr><td class="mini">${mn.kategori}</td><td>${mn.resep.namaMenu}${resepPunyaBahanMendesak(mn.resep)?' <span class="mini" style="color:var(--warn)" title="Ada bahan yang mendekati/sudah kadaluwarsa">⏰</span>':''}</td><td class="num">${qtyScaled} porsi</td><td class="num">${fmtRp(biaya)}</td>
          <td class="center"><input type="checkbox" class="ceklis-konsumsi" data-resep="${mn.resep.id}" data-date="${dateStr}" data-qty="${qtyScaled}" ${done?'checked':''} ${penjualanMatch?'disabled title="Sudah tercatat lewat Penjualan"':''}></td></tr>`;
      }).join('')}
      </tbody></table></div>
    </div>`;
  }).join('');
  rowsHtml += `<div class="recap">Estimasi total biaya konsumsi hari ini: <b>${fmtRp(totalBiaya)}</b>${skala<1?` (porsi sudah diperkecil jadi ${Math.round(skala*100)}% supaya stok tahan ${targetHari} hari)`:''}</div>`;
  const d = openDetailDrawer('Rekomendasi Menu — '+fmtTgl(dateStr)+' (2 orang)', rowsHtml || '<div class="empty">Belum ada resep yang cocok kategori prioritas.</div>');
  d.querySelectorAll('.ceklis-konsumsi').forEach(chk=> chk.addEventListener('change', ()=>{
    const resepId = chk.dataset.resep, tgl = chk.dataset.date, qty = Number(chk.dataset.qty)||1;
    if(chk.checked){
      const hasil = prosesPemakaianResep(resepId, tgl, qty, ['Kalender Menu'], null);
      if(hasil.error){ toast(hasil.error); chk.checked=false; return; }
      save(); toast('Dicatat ke Pemakaian — stok & Laba Rugi terupdate');
    } else {
      const p = DB.pemakaian.find(x=>(x.sumberTipe||'resep')==='resep' && x.resepId===resepId && x.tanggal===tgl);
      if(p){ batalkanPemakaian(p.id); save(); toast('Dibatalkan, stok dikembalikan'); }
    }
    const body = document.getElementById('budgetBody');
    if(body) renderKalenderMenu(body);
    openRekomendasiDrawer(dateStr);
  }));
}

function neracaExportRows(){
  const asetKat = ['AL','PS','ALL','AT','KAT','ALN'];
  const kewajibanKat = ['KW'];
  const rows=[]; let totalAset=0, totalKW=0, totalMD=0;
  asetKat.forEach(kat=>{
    DB.coa.filter(a=>a.kategori===kat).forEach(a=>{
      const sRaw=saldoAkun(a.id); if(sRaw===0) return;
      // KAT (Akumulasi Penyusutan) adalah kontra-akun aset tetap: ditampilkan & dijumlahkan sebagai
      // nilai negatif supaya benar-benar mengurangi Total Aset, bukan menambah.
      const s = kat==='KAT' ? -sRaw : sRaw;
      rows.push(['Aset', KAT[kat], a.kepemilikan, a.nama, s]); totalAset+=s;
    });
  });
  rows.push(['','','','Total Aset', totalAset]);
  kewajibanKat.forEach(kat=>{
    DB.coa.filter(a=>a.kategori===kat).forEach(a=>{ const s=saldoAkun(a.id); if(s===0) return; rows.push(['Kewajiban', KAT[kat], a.kepemilikan, a.nama, s]); totalKW+=s; });
  });
  rows.push(['','','','Total Kewajiban', totalKW]);
  KEPEMILIKAN.forEach(kep=>{
    const akunsMD = DB.coa.filter(a=>a.kategori==='MD' && a.kepemilikan===kep);
    akunsMD.forEach(a=>{ const s=saldoAkun(a.id); if(s===0) return; rows.push(['Modal','Modal', kep, a.nama, s]); });
    const labaDitahan = labaDitahanAkumulasi(kep);
    const labaBerjalan = labaBerjalanTahunIni(kep);
    rows.push(['Modal','Modal', kep, 'Laba Ditahan (akumulasi s.d. tahun lalu)', labaDitahan]);
    rows.push(['Modal','Modal', kep, 'Laba Berjalan (periode tahun ini)', labaBerjalan]);
    const saldoAwal = akunsMD.reduce((s,a)=>s+saldoAkun(a.id),0);
    const totalKep = saldoAwal + labaDitahan + labaBerjalan; totalMD+=totalKep;
  });
  rows.push(['','','','Total Kewajiban + Modal', totalKW+totalMD]);
  return rows;
}
/* Render sekelompok akun (list = akun daftar untuk satu Kategori+Kepemilikan, saldo!=0) dengan
   akun Header ditampilkan sebagai baris abu-abu (saldo = jumlah rekursif sub-akun di bawahnya),
   lalu sub-akunnya diindentasi tepat di bawahnya; akun yang tidak masuk Header manapun tetap
   tampil rata seperti sebelumnya. Dipakai di Neraca & Laba Rugi supaya keduanya konsisten. */
function renderAkunGroupHtml(list, getSaldo){
  getSaldo = getSaldo || (a=> saldoAkun(a.id));
  const headerIds = new Set();
  list.forEach(a=>{
    let cur=a, guard=0;
    while(cur && cur.parentHeaderId && guard++<50){ headerIds.add(cur.parentHeaderId); cur = akunById(cur.parentHeaderId); }
  });
  const headers = [...headerIds].map(id=>akunById(id)).filter(Boolean);
  const topHeaders = headers.filter(h=> !h.parentHeaderId || !headerIds.has(h.parentHeaderId));
  const loose = list.filter(a=> !a.parentHeaderId);
  // Total header dihitung rekursif memakai getSaldo yang sama (mis. saldo penuh atau saldo
  // periode terfilter untuk Laba Rugi), bukan hanya dari akun yang lolos filter saldo!=0 di `list`,
  // supaya header tetap menjumlah SELURUH sub-akunnya, termasuk yang kebetulan nol di periode ini.
  function headerTotal(h){
    let s = 0;
    DB.coa.filter(x=> x.parentHeaderId===h.id).forEach(x=>{ s += x.isHeader ? headerTotal(x) : getSaldo(x); });
    return s;
  }
  let html = '';
  function renderHeader(h, depth){
    const total = headerTotal(h);
    html += `<div style="background:var(--surface2);border-radius:6px;margin:3px 0 2px;padding:3px 6px 3px ${10+depth*14}px;display:flex;justify-content:space-between;font-size:12.8px;font-weight:700"><span>${h.nama}</span><span class="num">${fmtRp(total)}</span></div>`;
    headers.filter(x=>x.parentHeaderId===h.id).forEach(ch=> renderHeader(ch, depth+1));
    list.filter(a=>a.parentHeaderId===h.id).forEach(a=>{
      html += `<div class="akun-clickable" data-akun="${a.id}" style="display:flex;justify-content:space-between;padding:2px 0 2px ${10+(depth+1)*14}px;font-size:12.8px;cursor:pointer" title="Klik untuk lihat rincian"><span>${a.nama}</span><span class="num">${fmtRp(getSaldo(a))}</span></div>`;
    });
  }
  topHeaders.forEach(h=> renderHeader(h,0));
  loose.forEach(a=>{
    html += `<div class="akun-clickable" data-akun="${a.id}" style="display:flex;justify-content:space-between;padding:2px 0 2px 10px;font-size:12.8px;cursor:pointer" title="Klik untuk lihat rincian"><span>${a.nama}</span><span class="num">${fmtRp(getSaldo(a))}</span></div>`;
  });
  return html;
}
function neracaIoCfg(){

    exportPdf: ()=>({ filename:'neraca.pdf', title:'Laporan Neraca', headers, rows: neracaExportRows().map(r=> r.map((v,i)=> i===4? fmtRp(v): v)),

/* ================= LABA RUGI (dengan filter tanggal & tag) ================= */
let lrFilter = { mode:'bulan_ini', dari:'', sampai:'', tag:'' };
function dateRangeForMode(mode){
  const now = new Date();
  const pad = n=>String(n).padStart(2,'0');
  const fmt = d=> d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  if(mode==='hari_ini'){ return [fmt(now), fmt(now)]; }
  if(mode==='minggu_ini'){ const start=new Date(now); start.setDate(now.getDate()-now.getDay()); return [fmt(start), fmt(now)]; }
  if(mode==='bulan_ini'){ return [fmt(new Date(now.getFullYear(),now.getMonth(),1)), fmt(now)]; }
  if(mode==='bulan_lalu'){ const s=new Date(now.getFullYear(),now.getMonth()-1,1), e=new Date(now.getFullYear(),now.getMonth(),0); return [fmt(s), fmt(e)]; }
  if(mode==='tahun_ini'){ return [fmt(new Date(now.getFullYear(),0,1)), fmt(now)]; }
  if(mode==='tahun_lalu'){ return [fmt(new Date(now.getFullYear()-1,0,1)), fmt(new Date(now.getFullYear()-1,11,31))]; }
  return [lrFilter.dari, lrFilter.sampai];
}
function filteredJurnal(){
  let [dari, sampai] = lrFilter.mode==='custom' ? [lrFilter.dari, lrFilter.sampai] : dateRangeForMode(lrFilter.mode);
  return DB.jurnal.filter(j=>{
    if(dari && j.tanggal<dari) return false;
    if(sampai && j.tanggal>sampai) return false;
    if(lrFilter.tag && !(j.tags||[]).includes(lrFilter.tag)) return false;
    return true;
  });
}
function sumByKategoriKepemilikanFiltered(kategori, kepemilikan, jlist){
  const akunIds = new Set(DB.coa.filter(a=>a.kategori===kategori && (!kepemilikan||a.kepemilikan===kepemilikan)).map(a=>a.id));
  let debit=0, kredit=0;
  jlist.forEach(j=>{ if(akunIds.has(j.debitId)) debit+=j.nominal; if(akunIds.has(j.kreditId)) kredit+=j.nominal; });
  const isDebitNormal = DEBIT_NORMAL.has(kategori);
  return isDebitNormal ? debit-kredit : kredit-debit;
}

function labaRugiExportRows(jlist){

    const bpp = sumByKategoriKepemilikanFiltered('BPP', kep, jlist);
    const bo = sumByKategoriKepemilikanFiltered('BO', kep, jlist);
    const bl = sumByKategoriKepemilikanFiltered('BL', kep, jlist);
    rows.push([kep, pd, bpp, bo, bl, pd-bpp-bo-bl]);
  });
  const totalPD=sumByKategoriKepemilikanFiltered('PD',null,jlist), totalBPP=sumByKategoriKepemilikanFiltered('BPP',null,jlist), totalBO=sumByKategoriKepemilikanFiltered('BO',null,jlist), totalBL=sumByKategoriKepemilikanFiltered('BL',null,jlist);
  rows.push(['Total', totalPD, totalBPP, totalBO, totalBL, totalPD-totalBPP-totalBO-totalBL]);
  return rows;

/* ================= PERUBAHAN MODAL ================= */
RENDERERS.perubahanmodal = function(c){
  let html = `<div class="tablewrap"><table class="sheet"><thead><tr><th>Entitas</th><th>Modal Awal</th><th>Laba Ditahan (Akumulasi)</th><th>Laba Berjalan (Tahun Ini)</th><th>Prive</th><th>Modal Akhir</th></tr></thead><tbody>`;
  let tAwal=0,tDitahan=0,tBerjalan=0,tPrive=0,tAkhir=0;
  KEPEMILIKAN.forEach(kep=>{
    const modalAkun = DB.coa.filter(a=>a.kategori==='MD' && a.kepemilikan===kep && !a.nama.startsWith('Prive'));
    const priveAkun = DB.coa.filter(a=>a.kategori==='MD' && a.kepemilikan===kep && a.nama.startsWith('Prive'));
    const modalAwal = modalAkun.reduce((s,a)=>s+saldoAkun(a.id),0);
    const labaDitahan = labaDitahanAkumulasi(kep);
    const labaBerjalan = labaBerjalanTahunIni(kep);
    const prive = priveAkun.reduce((s,a)=>s+saldoAkun(a.id),0);
    const akhir = modalAwal + labaDitahan + labaBerjalan - prive;
    tAwal+=modalAwal; tDitahan+=labaDitahan; tBerjalan+=labaBerjalan; tPrive+=prive; tAkhir+=akhir;
    html += `<tr><td><span class="tag ${tagClassKep(kep)}">${kep}</span></td><td class="num">${fmtRp(modalAwal)}</td><td class="num">${fmtRp(labaDitahan)}</td><td class="num">${fmtRp(labaBerjalan)}</td><td class="num">${fmtRp(prive)}</td><td class="num" style="font-weight:700">${fmtRp(akhir)}</td></tr>`;
  });
  html += `<tr style="font-weight:700"><td>Total</td><td class="num">${fmtRp(tAwal)}</td><td class="num">${fmtRp(tDitahan)}</td><td class="num">${fmtRp(tBerjalan)}</td><td class="num">${fmtRp(tPrive)}</td><td class="num">${fmtRp(tAkhir)}</td></tr>`;
  html += `</tbody></table></div><div class="mini" style="margin-top:10px">"Modal Awal" = total seluruh akun modal berkategori Modal selain Prive (mis. Modal Disetor, Ekuitas Saldo Awal, dst — semua akun ini otomatis ikut terhitung, apapun namanya, selama kategorinya "Modal"). "Laba Ditahan (Akumulasi)" = akumulasi laba/rugi dari seluruh transaksi sebelum tanggal 1 Januari tahun ini. "Laba Berjalan (Tahun Ini)" = laba/rugi dari transaksi 1 Januari tahun ini sampai hari ini. Prive dicatat lewat Jurnal Umum/Kirim Uang dengan akun lawan "Prive [Entitas]".</div>`;
  c.innerHTML = html;
};

/* ================= ARUS KAS ================= */
RENDERERS.aruskas = function(c){
  const kasIds = new Set(DB.coa.filter(a=>a.kategori==='AL').map(a=>a.id));
  const groups = { Operasional:0, Investasi:0, Pendanaan:0 };
  const rows = [];
  DB.jurnal.forEach(j=>{
    const debitKas = kasIds.has(j.debitId), kreditKas = kasIds.has(j.kreditId);
    if(!debitKas && !kreditKas) return;
    if(debitKas && kreditKas) return;
    const lawanId = debitKas? j.kreditId : j.debitId;
    const lawan = akunById(lawanId);
    const arah = debitKas? 1 : -1;
    let kelompok = 'Operasional';
    if(lawan){
      if(['AT','ALN'].includes(lawan.kategori)) kelompok='Investasi';
      else if(['KW','MD'].includes(lawan.kategori)) kelompok='Pendanaan';
    }
    groups[kelompok] += arah*j.nominal;
    rows.push({...j, arah, kelompok, lawanNama: lawan?lawan.nama:'?'});
  });
  const totalKas = groups.Operasional+groups.Investasi+groups.Pendanaan;
  let html = `<div class="grid cols-3">
    <div class="card kpi"><div class="label">Aktivitas Operasional</div><div class="value ${groups.Operasional>=0?'pos':'neg'}">${fmtRp(groups.Operasional)}</div></div>
    <div class="card kpi"><div class="label">Aktivitas Investasi</div><div class="value ${groups.Investasi>=0?'pos':'neg'}">${fmtRp(groups.Investasi)}</div></div>
    <div class="card kpi"><div class="label">Aktivitas Pendanaan</div><div class="value ${groups.Pendanaan>=0?'pos':'neg'}">${fmtRp(groups.Pendanaan)}</div></div>
  </div>
  <div class="card kpi" style="margin-top:14px;max-width:320px"><div class="label">Kenaikan (Penurunan) Kas Bersih</div><div class="value ${totalKas>=0?'pos':'neg'}">${fmtRp(totalKas)}</div></div>
  <div class="card" style="margin-top:14px">
  <div class="section-title"><h3>Rincian Pergerakan Kas</h3></div>
  <div class="tablewrap"><table class="sheet"><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kelompok</th><th>Akun Lawan</th><th>Arah</th><th>Nominal</th></tr></thead><tbody>
  ${rows.length? [...rows].reverse().map(r=>`<tr><td>${fmtTgl(r.tanggal)}</td><td>${r.keterangan||'-'}</td><td>${r.kelompok}</td><td>${r.lawanNama}</td><td>${r.arah>0?'Masuk':'Keluar'}</td><td class="num" style="color:${r.arah>0?'var(--debit)':'var(--kredit)'}">${fmtRp(r.arah*r.nominal)}</td></tr>`).join('') : '<tr><td colspan="6" class="empty">Belum ada pergerakan kas</td></tr>'}
  </tbody></table></div></div>
  <div class="mini" style="margin-top:8px">Pengelompokan otomatis: Investasi = lawan akun Aset Tetap/Aset Lainnya, Pendanaan = lawan akun Kewajiban/Modal, sisanya Operasional.</div>`;
  c.innerHTML = html;
};

let bukuBesarAkun = '';
let bukuBesarSearch = '';
RENDERERS.bukubesar = function(c){
  let html = `<div class="card">
    <div class="formgrid">
      <div class="field" style="grid-column:span 2"><label>Pilih Akun</label>${akunPickerHtml('bbAkun', null, 'Ketik nama akun...', bukuBesarAkun)}</div>
      <div class="field" style="grid-column:span 2"><label>Cari keterangan</label>${searchBoxHtml('bbSearch','Cari transaksi...')}</div>
    </div>
  </div>
  <div id="bbResult" style="margin-top:14px"></div>`;
  c.innerHTML = html;
  bindAkunPicker('bbAkun', akunId=>{ bukuBesarAkun=akunId; renderBukuBesarResult(); });
  bindSearchInput('bbSearch', v=>{ bukuBesarSearch=v; renderBukuBesarResult(); });
  renderBukuBesarResult();
};
function importBukuBesarRows(rows){
  const akun = akunById(bukuBesarAkun); if(!akun) return toast('Pilih akun dulu');
  let ok=0; const warnings=[];
  rows.forEach((r,i)=>{
    const tanggal = parseTglInput(String(xrow(r,'Tanggal (DD/MM/YY)','Tanggal (YYYY-MM-DD)','Tanggal')||'').trim()) || todayStr();
    const keterangan = String(xrow(r,'Keterangan')||'').trim();
    const debit = Number(xrow(r,'Debit'))||0;
    const kredit = Number(xrow(r,'Kredit'))||0;
    const lawanNama = String(xrow(r,'Akun Lawan')||'').trim();
    const tagStr = String(xrow(r,'Tag (pisahkan koma)','Tag')||'').trim();
    const nominal = debit>0?debit:kredit;
    if(!lawanNama||nominal<=0){ warnings.push('Baris '+(i+2)+': data tidak lengkap, dilewati'); return; }
    const lawanAkun = DB.coa.find(a=>a.nama.trim().toLowerCase()===lawanNama.toLowerCase());
    if(!lawanAkun){ warnings.push('Baris '+(i+2)+': akun lawan "'+lawanNama+'" tidak ditemukan'); return; }
    const tags = parseTagInput(tagStr); tags.forEach(ensureTag);
    const debitId = debit>0 ? akun.id : lawanAkun.id;
    const kreditId = debit>0 ? lawanAkun.id : akun.id;
    postJurnal({ tanggal, keterangan, debitId, kreditId, nominal, sumber:'Buku Besar', ref:'import-'+uid(), tags });
    ok++;
  });
  save(); renderContent();
  toast('Impor buku besar: '+ok+' baris berhasil'+(warnings.length?(', '+warnings.length+' dilewati'):''));
  if(warnings.length) console.warn(warnings.join('\n'));
}
function renderBukuBesarResult(){
  const wrap = document.getElementById('bbResult'); if(!wrap) return;
  if(!bukuBesarAkun){ wrap.innerHTML = '<div class="empty">Pilih akun untuk melihat buku besarnya</div>'; return; }
  const akun = akunById(bukuBesarAkun);
  const isDebitNormal = normalIsDebit(akun.kategori);
  let running = 0;
  const rows = DB.jurnal.filter(j=> (j.debitId===akun.id||j.kreditId===akun.id) && matchSearch(j.keterangan, bukuBesarSearch));
  const exportRows = [];
  const headers = ['Tanggal','Keterangan','Debit','Kredit','Saldo Berjalan','Tag'];
  const ioCfg = {
    template:{ filename:'template-buku-besar.xlsx', sheetName:'Buku Besar', headers:['Tanggal (DD/MM/YY)','Keterangan','Debit','Kredit','Akun Lawan','Tag (pisahkan koma)'],
      exampleRows:[[fmtTgl(todayStr()),'Contoh: Bayar listrik','',150000,'Kas','operasional']] },
    onImport: importBukuBesarRows,
    exportExcel: ()=>({ filename:'buku-besar-'+akun.nama.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.xlsx', sheetName:'Buku Besar', headers, rows: exportRows }),
    exportPdf: ()=>({ filename:'buku-besar-'+akun.nama.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.pdf', title:'Buku Besar — '+akun.nama, headers, rows: exportRows })
  };
  const visibleIds = rows.map(j=>j.id);
  let html = `<div class="card">
    <div class="section-title"><h3>${akun.nama} <span class="mini">(${KAT[akun.kategori]} — ${akun.kepemilikan})</span></h3><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="hint">Saldo saat ini: <b>${fmtRp(saldoAkun(akun.id))}</b></span>${ioToolbarHtml('bukubesar', ioCfg)}</div></div>
    ${bulkBarHtml('bukubesar', visibleIds)}
    <div class="tablewrap"><table class="sheet"><thead><tr>${bulkCheckboxTh('bukubesar')}<th>Tanggal</th><th>Keterangan</th><th>Debit</th><th>Kredit</th><th>Saldo Berjalan</th><th>Tag</th><th></th></tr></thead><tbody>`;
  rows.forEach(j=>{
    const isDebit = j.debitId===akun.id;
    const delta = isDebit? (isDebitNormal?j.nominal:-j.nominal) : (isDebitNormal?-j.nominal:j.nominal);
    running += delta;
    exportRows.push([fmtTgl(j.tanggal), j.keterangan||'', isDebit?j.nominal:'', !isDebit?j.nominal:'', running, (j.tags||[]).join(', ')]);
    html += `<tr>${bulkCheckboxTd('bukubesar',j.id)}<td>${fmtTgl(j.tanggal)}</td><td>${j.keterangan||'-'}</td><td class="num">${isDebit?fmtRp(j.nominal):''}</td><td class="num">${!isDebit?fmtRp(j.nominal):''}</td><td class="num">${fmtRp(running)}</td><td>${tagChipsHtml(j.tags)}</td><td>${aksiBtnsHtml('jurnal','jid',j.id,{dupClass:null})}</td></tr>`;
  });
  if(rows.length===0) html += `<tr><td colspan="8" class="empty">Belum ada transaksi</td></tr>`;
  html += `</tbody></table></div></div>`;
  wrap.innerHTML = html;
  bindIoToolbar('bukubesar', ioCfg);
  bindJurnalRowActions(wrap);
  bindBulkUI(wrap, 'bukubesar', visibleIds, ids=> ids.forEach(id=>deleteJurnalEntry(id)), ()=> renderContent());
}

  });

  html += `</tbody></table></div></div>`;

  bindJurnalRowActions(wrap);

/* ================= ASET TETAP ================= */
let asetSearch = '';
function hitungDepresiasiBulanan(a){
  if(!a.masaManfaatBulan || a.masaManfaatBulan<=0) return 0;
  const dasar = (a.biayaAkuisisi||0) - (a.nilaiResidu||0);
  return Math.round(dasar / a.masaManfaatBulan);
}
function akumulasiPenyusutanAset(a){
  return DB.jurnal.filter(j=>j.ref==='aset-dep-'+a.id).reduce((s,j)=>s+j.nominal,0);
}
function sudahPostingPenyusutanBulanIni(a){
  const ym = todayStr().slice(0,7);
  return DB.jurnal.some(j=>j.ref==='aset-dep-'+a.id && j.tanggal && j.tanggal.slice(0,7)===ym);
}
/* Riwayat penyusutan per aset: ringkasan aset + tabel histori jurnal penyusutan (dengan akumulasi & nilai buku berjalan) */
function asetRiwayatHtml(a){
  const depBulanan = hitungDepresiasiBulanan(a);
  const totalAkum = akumulasiPenyusutanAset(a);
  const nilaiBukuNow = (a.biayaAkuisisi||0) - totalAkum;
  const riwayat = DB.jurnal.filter(j=>j.ref==='aset-dep-'+a.id).slice().sort((x,y)=> (x.tanggal||'').localeCompare(y.tanggal||''));
  let running = 0;
  const rowsHtml = riwayat.map(j=>{
    running += j.nominal;
    const nilaiBukuSaat = (a.biayaAkuisisi||0) - running;
    return `<tr data-jid="${j.id}"><td>${fmtTgl(j.tanggal)}</td><td>${j.keterangan||'-'}</td><td class="num">${fmtRp(j.nominal)}</td><td class="num">${fmtRp(running)}</td><td class="num">${fmtRp(nilaiBukuSaat)}</td><td>${aksiBtnsHtml('aset','jid',j.id,{dupClass:null})}</td></tr>`;
  }).join('');
  return `
    <div class="grid cols-2" style="margin-bottom:14px">
      <div class="card kpi"><div class="label">Biaya Akuisisi</div><div class="value">${fmtRp(a.biayaAkuisisi)}</div></div>
      <div class="card kpi"><div class="label">Nilai Residu</div><div class="value">${fmtRp(a.nilaiResidu||0)}</div></div>
      <div class="card kpi"><div class="label">Penyusutan / Bulan</div><div class="value">${fmtRp(depBulanan)}</div></div>
      <div class="card kpi"><div class="label">Nilai Buku Saat Ini</div><div class="value">${fmtRp(nilaiBukuNow)}</div></div>
    </div>
    <div class="mini" style="margin-bottom:8px">No Aset: ${a.noAset} · Jenis: ${a.jenis} · Tanggal Perolehan: ${fmtTgl(a.tanggalPerolehan)} · Masa Manfaat: ${a.masaManfaatBulan||0} bulan · Status: ${a.statusAktif===false?'Dilepas':'Aktif'}</div>
    <div class="section-title"><h3 style="font-size:14px">Riwayat Penyusutan (${riwayat.length})</h3></div>
    <div class="tablewrap"><table class="sheet"><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Nominal</th><th>Akum. Berjalan</th><th>Nilai Buku</th><th></th></tr></thead><tbody>
    ${rowsHtml || '<tr><td colspan="6" class="empty">Belum ada penyusutan yang diposting</td></tr>'}
    </tbody></table></div>`;
}
function openAsetRiwayat(a){
  const d = openDetailDrawer('Riwayat Penyusutan — '+a.nama, asetRiwayatHtml(a));
  bindJurnalRowActions(d);
}
const ASET_HEADERS = ['Nama Aset','Jenis Aset','Tanggal Perolehan (DD/MM/YY)','Biaya Akuisisi','Nilai Residu','Masa Manfaat (bulan)','Akun Kredit (Kas/Utang/Modal)','Akun Aset Tetap (COA)','Akun Akumulasi Penyusutan (opsional)','Akun Beban Penyusutan (opsional)'];
function importAsetRows(rows){
  let ok=0; const warnings=[];
  rows.forEach((r,i)=>{
    const nama = String(xrow(r,'Nama Aset','Nama')||'').trim();
    const jenis = String(xrow(r,'Jenis Aset','Jenis')||'').trim();
    const tgl = parseTglInput(String(xrow(r,'Tanggal Perolehan (DD/MM/YY)','Tanggal Perolehan (YYYY-MM-DD)','Tanggal Perolehan','Tanggal')||'').trim()) || todayStr();
    const biaya = Number(xrow(r,'Biaya Akuisisi'))||0;
    const residu = Number(xrow(r,'Nilai Residu'))||0;
    const masa = Number(xrow(r,'Masa Manfaat (bulan)','Masa Manfaat'))||0;
    const akunKreditNama = String(xrow(r,'Akun Kredit (Kas/Utang/Modal)','Akun Kredit')||'').trim();
    const akunAsetNama = String(xrow(r,'Akun Aset Tetap (COA)','Akun Aset Tetap','Akun Aset')||'').trim();
    const akunAkumNama = String(xrow(r,'Akun Akumulasi Penyusutan (opsional)','Akun Akumulasi Penyusutan')||'').trim();
    const akunBebanNama = String(xrow(r,'Akun Beban Penyusutan (opsional)','Akun Beban Penyusutan')||'').trim();
    if(!nama||!jenis||!biaya||!akunKreditNama||!akunAsetNama){ warnings.push('Baris '+(i+2)+': data wajib tidak lengkap, dilewati'); return; }
    const akunKredit = DB.coa.find(a=>a.nama.trim().toLowerCase()===akunKreditNama.toLowerCase());
    const akunAset = DB.coa.find(a=>a.nama.trim().toLowerCase()===akunAsetNama.toLowerCase());
    if(!akunKredit||!akunAset){ warnings.push('Baris '+(i+2)+': akun "'+(!akunKredit?akunKreditNama:akunAsetNama)+'" tidak ditemukan di COA'); return; }
    if(jenis && !DB.jenisAsetCustom.includes(jenis)) DB.jenisAsetCustom.push(jenis);
    const kepemilikan = akunAset.kepemilikan;
    let akunAkumId = null, akunBebanId = null;
    if(akunAkumNama){ const f = DB.coa.find(a=>a.nama.trim().toLowerCase()===akunAkumNama.toLowerCase()); if(f) akunAkumId=f.id; }
    if(akunBebanNama){ const f = DB.coa.find(a=>a.nama.trim().toLowerCase()===akunBebanNama.toLowerCase()); if(f) akunBebanId=f.id; }
    if(masa>0 && !akunAkumId){
      let akumAkun = DB.coa.find(x=>x.kategori==='KAT' && x.kepemilikan===kepemilikan && x.nama.toLowerCase().includes(jenis.toLowerCase()));
      if(!akumAkun) akumAkun = addAkun('KAT', 'Akumulasi Penyusutan - '+jenis, kepemilikan, 'Kontra akun aset tetap (otomatis, impor)');
      akunAkumId = akumAkun.id;
    }
    if(masa>0 && !akunBebanId){
      let bebanAkun = DB.coa.find(x=>x.kategori==='BO' && x.kepemilikan===kepemilikan && x.nama==='Beban Penyusutan Aset');
      if(!bebanAkun) bebanAkun = addAkun('BO', 'Beban Penyusutan Aset', kepemilikan, 'Otomatis dari fitur Aset Tetap (impor)');
      akunBebanId = bebanAkun.id;
    }
    const noAset = nextKode('AST');
    const asetObj = { id:uid(), noAset, nama, jenis, tanggalPerolehan:tgl, biayaAkuisisi:biaya, nilaiResidu:residu, masaManfaatBulan:masa, akunKreditId:akunKredit.id, akunAsetId:akunAset.id, akunAkumulasiId:akunAkumId||null, akunBebanId:akunBebanId||null, statusAktif:true };
    DB.aset.push(asetObj);
    postJurnal({ tanggal:tgl, keterangan:'Perolehan aset: '+nama+' ('+noAset+')', debitId:akunAset.id, kreditId:akunKredit.id, nominal:biaya, sumber:'Aset', ref:'aset-perolehan-'+asetObj.id });
    ok++;
  });
  save(); renderContent();
  toast('Impor aset: '+ok+' berhasil'+(warnings.length?(', '+warnings.length+' dilewati'):''));
  if(warnings.length) console.warn(warnings.join('\n'));
}
function asetIoCfg(){
  return {
    template:{ filename:'template-aset.xlsx', sheetName:'Aset Tetap', headers:ASET_HEADERS,
      exampleRows:[[ 'Contoh: Motor Beat 2023','Kendaraan',fmtTgl(todayStr()),25000000,2000000,48,'Kas Bisnis A','Aset Tetap - Kendaraan Motor','','' ]] },
    onImport: importAsetRows,
    exportExcel: ()=>({ filename:'aset-tetap-'+todayStr()+'.xlsx', sheetName:'Aset Tetap',
      headers:['No Aset','Nama','Jenis','Tanggal Perolehan','Biaya Akuisisi','Penyusutan/bln','Akum Penyusutan','Nilai Buku','Status'],
      rows: DB.aset.map(a=>{ const dep=hitungDepresiasiBulanan(a); const akum=akumulasiPenyusutanAset(a); const nilaiBuku=(a.biayaAkuisisi||0)-akum;
        return [a.noAset,a.nama,a.jenis,fmtTgl(a.tanggalPerolehan),a.biayaAkuisisi,dep,akum,nilaiBuku, a.statusAktif===false?'Dilepas':'Aktif']; }) }),
    exportPdf: ()=>({ filename:'aset-tetap-'+todayStr()+'.pdf', title:'Daftar Aset Tetap',
      headers:['No Aset','Nama','Jenis','Biaya Akuisisi','Akum Penyusutan','Nilai Buku','Status'],
      rows: DB.aset.map(a=>{ const akum=akumulasiPenyusutanAset(a); const nilaiBuku=(a.biayaAkuisisi||0)-akum;
        return [a.noAset,a.nama,a.jenis,fmtRp(a.biayaAkuisisi),fmtRp(akum),fmtRp(nilaiBuku), a.statusAktif===false?'Dilepas':'Aktif']; }) })
  };
}

          postJurnal({ tanggal:todayStr(), keterangan:'Rugi pelepasan aset: '+a.nama, debitId:blAkun.id, kreditId:a.akunAsetId, nominal:diff, sumber:'Aset', ref:'aset-lepas-rugi-'+a.id });
        } else if(diff<0){
          postJurnal({ tanggal:todayStr(), keterangan:'Laba pelepasan aset: '+a.nama, debitId:a.akunAsetId, kreditId:pdAkun.id, nominal:-diff, sumber:'Aset', ref:'aset-lepas-laba-'+a.id });
        }
      }
      a.statusAktif = false; a.tanggalLepas = todayStr(); a.hargaLepas = hargaLepas;
      save(); renderContent(); toast('Aset dilepas dan jurnal penyesuaian diposting');
    });
    const btnDelAset = row.querySelector('.btnDelAset');
    if(btnDelAset) btnDelAset.addEventListener('click', ()=>{
      if(!confirm('Hapus aset ini sepenuhnya? Jurnal terkait tidak ikut terhapus otomatis.')) return;
      DB.aset = DB.aset.filter(x=>x.id!==a.id); save(); renderContent();
    });
    const btnEditAset = row.querySelector('.btnEditAset');
    if(btnEditAset) btnEditAset.addEventListener('click', ()=>{
      const nama = prompt('Nama Aset:', a.nama); if(nama===null||!nama.trim()) return;
      const jenis = prompt('Jenis Aset:', a.jenis); if(jenis===null||!jenis.trim()) return;
      const tgl = prompt('Tanggal Perolehan (DD/MM/YY):', fmtTgl(a.tanggalPerolehan)); if(tgl===null||!tgl.trim()) return;
      const biaya = Number(prompt('Biaya Akuisisi (Rp):', a.biayaAkuisisi)); if(!biaya||biaya<=0) return toast('Biaya tidak valid');
      const residu = Number(prompt('Nilai Residu (Rp, 0 jika tidak ada):', a.nilaiResidu||0))||0;
      const masa = Number(prompt('Masa Manfaat (bulan, 0 jika tidak disusutkan):', a.masaManfaatBulan||0))||0;
      a.nama = nama.trim(); a.jenis = jenis.trim(); a.tanggalPerolehan = parseTglInput(tgl.trim()); a.biayaAkuisisi = biaya; a.nilaiResidu = residu; a.masaManfaatBulan = masa;
      if(a.jenis && !DB.jenisAsetCustom.includes(a.jenis)) DB.jenisAsetCustom.push(a.jenis);
      if(masa>0){
        const namaBebanLama = a.akunBebanId ? (akunById(a.akunBebanId)?.nama || 'Beban Penyusutan Aset') : 'Beban Penyusutan Aset';
        const bebanInput = prompt('Nama Akun Beban Penyusutan (masuk Laba Rugi):', namaBebanLama);
        if(bebanInput!==null && bebanInput.trim()){
          const kep = akunById(a.akunAsetId).kepemilikan;
          const namaBeban = bebanInput.trim();
          let bebanAkun = DB.coa.find(x=>x.kategori==='BO' && x.kepemilikan===kep && x.nama===namaBeban);
          if(!bebanAkun) bebanAkun = addAkun('BO', namaBeban, kep, 'Akun beban penyusutan (dari fitur Aset Tetap)');
          a.akunBebanId = bebanAkun.id;
        }
      }
      const jPerolehan = DB.jurnal.find(x=>x.ref==='aset-perolehan-'+a.id);
      if(jPerolehan){ jPerolehan.tanggal=a.tanggalPerolehan; jPerolehan.nominal=biaya; jPerolehan.keterangan='Perolehan aset: '+a.nama+' ('+a.noAset+')'; }
      save(); renderContent(); toast('Aset diperbarui');
    });
  });
};

// Toggle "mata" untuk lihat/sembunyikan password di form login — pakai event delegation
// supaya tetap jalan meski form login dirender ulang (renderLoginScreen / draw()).
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.pwToggleBtn');
  if(!btn) return;
  const inp = document.getElementById(btn.dataset.target);
  if(!inp) return;
  if(inp.type==='password'){ inp.type='text'; btn.textContent='🙈'; }
  else { inp.type='password'; btn.textContent='👁'; }
});
// Tekan Enter di kolom email/password pada layar login langsung submit (klik tombol utama),
// tanpa perlu klik tombol "Masuk" secara manual.
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Enter') return;
  if(e.target.tagName!=='INPUT') return;
  const scr = document.getElementById('loginScreen');
  if(!scr || !scr.contains(e.target)) return;
  const btn = scr.querySelector('.btn.primary');
  if(btn){ e.preventDefault(); btn.click(); }
});
function getCurrentUser(){ return DB.users.find(u=>u.id===DB.currentUserId) || null; }
function isAdmin(){ const u=getCurrentUser(); return !u || u.role==='Admin'; }
const STAFF_RESTRICTED_TABS = new Set(['aset','perubahanmodal']);

/* ---- Per-fitur akses ubah/hapus untuk role Staff (Akses Terbatas) ----
   Admin selalu punya akses penuh. Untuk Staff, akses ubah & hapus diatur
   per modul lewat checkbox di menu Tambah User (Pengaturan). Menambah
   transaksi baru (input) TIDAK dibatasi — hanya ubah & hapus. */
const MODUL_PERMISSION_LIST = [
  {key:'jurnal', label:'Jurnal Umum & Buku Besar'},
  {key:'kasbank', label:'Kas Masuk / Keluar & Transfer'},
  {key:'biaya', label:'Biaya'},
  {key:'pembelian', label:'Pembelian'},
  {key:'penjualan', label:'Penjualan'},
  {key:'pemakaian', label:'Pemakaian'},
  {key:'coa', label:'Chart of Accounts (Akun)'},
  {key:'aset', label:'Aset Tetap'}
];
function defaultPermissions(){
  const p = {};
  MODUL_PERMISSION_LIST.forEach(m=> p[m.key] = {view:false, edit:false, delete:false});
  return p;
}
// canDo('jurnal','edit') / canDo('jurnal','delete') — Admin selalu true.
// Kalau modul ditandai "Lihat Saja" (view), Staff otomatis tidak bisa edit/hapus meski dicentang sebelumnya.
function canDo(modul, aksi){
  const u = getCurrentUser();
  if(!u || u.role==='Admin') return true;
  if(u.permissions && u.permissions[modul] && u.permissions[modul].view) return false;
  return !!(u.permissions && u.permissions[modul] && u.permissions[modul][aksi]);
}
// true kalau Staff ini hanya boleh melihat modul tsb — tidak boleh menambah, mengubah, atau menghapus.
function isViewOnly(modul){
  const u = getCurrentUser();
  if(!u || u.role==='Admin') return false;
  return !!(u.permissions && u.permissions[modul] && u.permissions[modul].view);
}
function viewOnlyNoticeHtml(label){
  return `<div class="card" style="background:var(--surface2)"><div class="mini">👁 Anda hanya punya akses <b>Lihat Saja</b> untuk fitur <b>${label}</b> — tidak bisa menambah, mengubah, maupun menghapus data di sini. Hubungi Admin bila perlu akses lebih.</div></div>`;
}
function noAksesToast(){ toast('Akun Anda tidak punya akses untuk ini — hubungi Admin'); }

// Render tombol Duplikat/Edit/Hapus untuk satu baris transaksi, disembunyikan sesuai akses user.
// opts: {dup:true/false pakai class dupClass, editClass, delClass, editLabel, delLabel}
function aksiBtnsHtml(modul, idAttr, id, opts){
  opts = opts||{};
  const dupClass = isViewOnly(modul) ? null : opts.dupClass, editClass = opts.editClass!==undefined?opts.editClass:'editJ', delClass = opts.delClass!==undefined?opts.delClass:'delJ';
  const editLabel = opts.editLabel||'Edit', delLabel = opts.delLabel||'Hapus';
  let html = '';
  if(dupClass) html += `<button class="btn small ${dupClass}" data-${idAttr}="${id}">Duplikat</button> `;
  if(editClass && canDo(modul,'edit')) html += `<button class="btn small ${editClass}" data-${idAttr}="${id}">${editLabel}</button> `;
  if(delClass && canDo(modul,'delete')) html += `<button class="btn small danger ${delClass}" data-${idAttr}="${id}">${delLabel}</button>`;
  return html;
}

      return;

function logout(){
  if(cloudUnsub){ cloudUnsub(); cloudUnsub=null; }
  cloudDocRef = null;
  if(firebaseAuth){ firebaseAuth.signOut().then(()=> location.reload()); }
  else { DB.currentUserId=null; save(); location.reload(); }
}

/* ================= RIWAYAT TRANSAKSI (UI helpers) ================= */
let riwayatSearch = '';
let riwayatFilterAksi = 'semua';
function riwayatTableHtml(){
  const list = (DB.riwayatTransaksi||[]).slice().sort((a,b)=> (b.waktu||'').localeCompare(a.waktu||''));
  const filtered = list.filter(r=>{
    if(riwayatFilterAksi==='tambah' && r.aksi!=='tambah') return false;
    if(riwayatFilterAksi==='hapus' && r.aksi!=='hapus') return false;
    if(!riwayatSearch) return true;
    const hay = (r.snapshot.keterangan||'')+' '+(r.userEmail||'')+' '+(r.snapshot.sumber||'');
    return matchSearch(hay, riwayatSearch);
  }).slice(0,300);
  return `<div class="tablewrap"><table class="sheet"><thead><tr><th>Tanggal</th><th>Jam</th><th>Aksi</th><th>Transaksi</th><th>Oleh</th><th></th></tr></thead><tbody>
  ${filtered.map(r=>{
    const dt = new Date(r.waktu);
    const tglUbah = isNaN(dt) ? '-' : dt.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
    const jamUbah = isNaN(dt) ? '-' : dt.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const ket = r.snapshot.keterangan || '(tanpa keterangan)';
    if(r.aksi==='tambah'){
      return `<tr><td>${tglUbah}</td><td class="mini">${jamUbah}</td><td><span class="tag debit">Ditambahkan</span></td><td><a href="#" class="riwayatLihat" data-id="${r.id}" title="Klik untuk lihat detail transaksi">${ket}</a></td><td class="mini">${r.userEmail||'-'}</td><td></td></tr>`;
    }
    return `<tr><td>${tglUbah}</td><td class="mini">${jamUbah}</td><td><span class="tag kredit">Dihapus</span></td><td>${ket}</td><td class="mini">${r.userEmail||'-'}</td><td>${r.restored?'<span class="mini">✓ Sudah direstore</span>':`<button class="btn small btnRestoreRiwayat" data-id="${r.id}">Restore</button>`}</td></tr>`;
  }).join('') || '<tr><td colspan="6" class="empty">Belum ada riwayat transaksi</td></tr>'}
  </tbody></table></div>`;
}
function openRiwayatDetail(log){
  const jNow = DB.jurnal.find(x=>x.id===log.jurnalId);
  if(!jNow) return toast('Transaksi ini sudah tidak ada (kemungkinan sudah dihapus)');
  const akunD = akunById(jNow.debitId), akunK = akunById(jNow.kreditId);
  const html = `<div class="tablewrap"><table class="sheet"><tbody>
    <tr><td class="mini">Tanggal</td><td>${fmtTgl(jNow.tanggal)}</td></tr>
    <tr><td class="mini">Keterangan</td><td>${jNow.keterangan||'-'}</td></tr>
    <tr><td class="mini">Akun Debit</td><td>${akunD?.nama||'-'}</td></tr>
    <tr><td class="mini">Akun Kredit</td><td>${akunK?.nama||'-'}</td></tr>
    <tr><td class="mini">Nominal</td><td class="num">${fmtRp(jNow.nominal)}</td></tr>
    <tr><td class="mini">Sumber</td><td>${jNow.sumber||'-'}</td></tr>
  </tbody></table></div>
  <div style="display:flex;gap:8px;margin-top:12px">
    ${aksiBtnsHtml('jurnal','jid',jNow.id,{dupClass:null,editLabel:'Edit Transaksi',delLabel:'Hapus Transaksi'})}
  </div>`;
  const d = openDetailDrawer('Detail Transaksi', html);
  bindJurnalRowActions(d);
}
function bindRiwayatTableActions(container){
  container.querySelectorAll('.riwayatLihat').forEach(a=> a.addEventListener('click', e=>{
    e.preventDefault();
    const log = (DB.riwayatTransaksi||[]).find(r=>r.id===a.dataset.id); if(!log) return;
    openRiwayatDetail(log);
  }));
  container.querySelectorAll('.btnRestoreRiwayat').forEach(btn=> btn.addEventListener('click', ()=>{
    if(!confirm('Restore transaksi ini kembali ke jurnal?')) return;
    restoreRiwayat(btn.dataset.id);
  }));
}
